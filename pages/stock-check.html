<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Stock by warehouse · Business UI Gallery</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,300..500,0..1,0&display=block" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/select2/4.0.13/css/select2.min.css">
  <link rel="stylesheet" href="../assets/css/base.css">
  <style>
    tr.clickable { cursor: pointer; }
    tr.sel td { background: var(--bg-selected) !important; }
    .obs-log { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; max-height: 320px; overflow: auto; }
    .obs-log li { border: 1px solid var(--border-subtle); background: var(--surface-alt); border-radius: var(--r-sm); padding: 10px 12px; font-size: 13px; }
    .obs-log li header { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; color: var(--text-secondary); font-size: 12px; margin-bottom: 4px; }
    .obs-form { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin-top: 12px; }
    .obs-form .span2 { grid-column: 1 / -1; }
    .pres { font-size: 12px; color: var(--text-secondary); display: block; }
    @media (max-width: 760px) { .obs-form { grid-template-columns: minmax(0, 1fr); } }
  </style>
</head>
<body data-page="stock-check" data-root="../">
  <main id="content">
    <section class="mc-panel">
      <form class="mc-filters" id="filters">
        <div class="mc-field"><label for="fBranch" data-i18n="branch"></label><select id="fBranch"></select></div>
        <div class="mc-field"><label for="fWh" data-i18n="warehouse"></label><select id="fWh"></select></div>
        <div class="mc-field"><label for="fSup" data-i18n="supplier"></label><select id="fSup"></select></div>
        <div class="mc-field"><label for="fCat" data-i18n="category"></label><select id="fCat"></select></div>
        <div class="mc-field"><label for="fBuyer" data-i18n="buyer"></label><select id="fBuyer"></select></div>
        <div class="mc-field w-lg"><label for="fItem" data-i18n="item"></label><input type="text" id="fItem" data-i18n-ph="itemPh"></div>
        <div class="mc-field" style="max-width:170px"><label for="fObs" data-i18n="observation"></label><select id="fObs"></select></div>
        <label class="mc-check"><input type="checkbox" id="fStock"><span data-i18n="inWarehouse"></span></label>
        <button class="btn btn-teal" type="submit"><span class="material-icons" aria-hidden="true">search</span><span data-i18n="load"></span></button>
        <button class="btn" type="button" id="btnClear"><span class="material-icons" aria-hidden="true">filter_alt_off</span><span data-i18n="clear"></span></button>
      </form>
    </section>

    <section class="mc-kpis" id="kpis"></section>

    <div class="split">
      <section class="mc-panel">
        <div class="mc-panel-title"><h3><span class="material-icons" aria-hidden="true">inventory_2</span><span data-i18n="listTitle"></span></h3><span class="mc-hint" data-i18n="listHint"></span></div>
        <div class="table-wrap" style="max-height:560px"><table class="grid" id="tItems"><thead></thead><tbody></tbody><tfoot></tfoot></table></div>
      </section>
      <aside class="mc-panel" id="side" aria-live="polite">
        <div class="mc-panel-title"><h3><span class="material-icons" aria-hidden="true">rate_review</span><span data-i18n="obsTitle"></span></h3></div>
        <div id="sideBody"></div>
      </aside>
    </div>
    <div id="about"></div>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/select2/4.0.13/js/select2.min.js"></script>
  <script src="../assets/js/common.js"></script>
  <script>
  UI.strings({
    en: {
      warehouse: "Warehouse", buyer: "Buyer", item: "Item", itemPh: "Code, barcode or name", observation: "Observations", inWarehouse: "Only with stock",
      obsAll: "All", obsWith: "With observations", obsWithout: "Without observations",
      kItems: "Item × warehouse", kUnits: "Units (base)", kValue: "Stock value", kObs: "With observations", kZero: "Without stock",
      listTitle: "Items by warehouse", listHint: "Select a row to see or add observations",
      colCode: "Code", colItem: "Item", colWh: "Warehouse", colPres: "Presentation", colStock: "Stock", colBase: "Base units", colCost: "Avg. cost", colValue: "Value", colObs: "Obs.",
      obsTitle: "Observations", pickRow: "Select an item to see its observations. Observations are only added, never edited or deleted.",
      noObs: "No observations yet.", addObs: "Add observation", state: "Status", appliesTo: "Applies to", user: "Auditor", text: "Observation",
      st_ok: "Checked", st_diff: "Difference", st_pending: "To review", ap_this: "This warehouse", ap_all: "Every warehouse",
      eText: "Write the observation (at least 5 characters).", eUser: "Choose the auditor.", added: "Observation added to {i}.", units: "units", box: "box", boxes: "boxes", unit: "unit",
      aboutText: "Each row is an <b>item in a warehouse</b>, with its presentations (for example a box of 12) and the stock shown both <b>by presentation</b> and in <b>base units</b>, at average cost. Filters by branch, warehouse, supplier, category and buyer narrow the list, and the cards and totals follow the filters. Auditors leave <b>observations</b> per item and warehouse (or for every warehouse); they are <b>only added</b>, never edited or deleted, so the history stays complete. All data is generated."
    },
    es: {
      warehouse: "Bodega", buyer: "Comprador", item: "Artículo", itemPh: "Código, código de barras o nombre", observation: "Observaciones", inWarehouse: "Solo con existencia",
      obsAll: "Todas", obsWith: "Con observaciones", obsWithout: "Sin observaciones",
      kItems: "Artículo × bodega", kUnits: "Unidades (base)", kValue: "Valor de existencia", kObs: "Con observaciones", kZero: "Sin existencia",
      listTitle: "Artículos por bodega", listHint: "Elija una fila para ver o agregar observaciones",
      colCode: "Código", colItem: "Artículo", colWh: "Bodega", colPres: "Presentación", colStock: "Existencia", colBase: "Unidades base", colCost: "Costo prom.", colValue: "Valor", colObs: "Obs.",
      obsTitle: "Observaciones", pickRow: "Elija un artículo para ver sus observaciones. Las observaciones solo se agregan; nunca se editan ni se borran.",
      noObs: "Sin observaciones todavía.", addObs: "Agregar observación", state: "Estado", appliesTo: "Aplica a", user: "Auditor", text: "Observación",
      st_ok: "Revisado", st_diff: "Diferencia", st_pending: "Por revisar", ap_this: "Esta bodega", ap_all: "Todas las bodegas",
      eText: "Escriba la observación (mínimo 5 caracteres).", eUser: "Elija el auditor.", added: "Observación agregada a {i}.", units: "unidades", box: "caja", boxes: "cajas", unit: "unid.",
      aboutText: "Cada fila es un <b>artículo en una bodega</b>, con sus presentaciones (por ejemplo caja de 12) y la existencia mostrada <b>por presentación</b> y en <b>unidades base</b>, a costo promedio. Los filtros de sucursal, bodega, proveedor, categoría y comprador acotan la lista, y las tarjetas y totales siguen los filtros. Los auditores dejan <b>observaciones</b> por artículo y bodega (o para todas las bodegas); <b>solo se agregan</b>, nunca se editan ni se borran, así el historial queda completo. Todos los datos son generados."
    }
  });

  $(function () {
    const t = UI.t, M = UI.fmtMoney, mi = UI.mi, D = UI.DATA;
    const WH = [["Central warehouse", "Bodega central", 0], ["North Plaza store", "Tienda North Plaza", 0], ["Harbor store", "Tienda Harbor", 1], ["Riverside store", "Tienda Riverside", 3]];
    const BUYERS = ["R. Medina", "L. Castro", "P. Ortiz"];
    const AUDITORS = ["auditor1", "auditor2", "auditor3"];
    const r = UI.rng(777);
    const items = D.products.map((p, i) => ({ code: "ART-" + String(1001 + i), barcode: "7501" + String(100000 + i * 37).slice(0, 6), name: p[0], cat: p[1], sup: D.suppliers[p[1] % D.suppliers.length], buyer: BUYERS[i % 3], factor: [12, 24, 6][i % 3], cost: UI.between(r, .6, 9) }));
    const rows = [];
    items.forEach(it => WH.forEach((w, wi) => { const units = r() < .12 ? 0 : Math.round(UI.between(r, 4, wi === 0 ? 1800 : 420)); rows.push({ it, wi, units, cost: it.cost * UI.between(r, .97, 1.03) }); }));
    // Insert-only observation log
    const log = [];
    [[2, 0, "st_diff", { en: "Count found 3 boxes less than the system.", es: "El conteo encontró 3 cajas menos que el sistema." }], [5, 1, "st_ok", { en: "Counted and matches.", es: "Contado y coincide." }],
     [11, 2, "st_pending", { en: "Damaged packaging on the shelf, check with supplier.", es: "Empaque dañado en estante, revisar con proveedor." }], [17, 0, "st_ok", { en: "Matches after relocation.", es: "Coincide después de reubicar." }], [20, 3, "st_diff", { en: "Two units without barcode.", es: "Dos unidades sin código de barras." }]]
      .forEach((o, k) => log.push({ item: items[o[0]].code, wi: o[1], all: false, st: o[2], text: o[3], user: AUDITORS[k % 3], date: new Date(Date.UTC(2026, 10, 10 + k, 9 + k, 15)) }));
    const obsFor = (code, wi) => log.filter(o => o.item === code && (o.all || o.wi === wi));
    let sel = null;

    function sel2(id, opts, allTxt) {
      const $s = $("#" + id), v = $s.val();
      if ($s.data("select2")) $s.select2("destroy");
      $s.empty().append(new Option(allTxt || t("all"), "")); opts.forEach(o => $s.append(new Option(o[1], o[0])));
      $s.val(v || "").select2({ width: "100%" });
    }
    function fillFilters() {
      sel2("fBranch", D.branches.slice(0, 4).map((b, i) => [String(i), b]));
      sel2("fWh", WH.map((w, i) => [String(i), UI.lang === "es" ? w[1] : w[0]]));
      sel2("fSup", D.suppliers.map(s => [s, s]));
      sel2("fCat", D.categories.map((c, i) => [String(i), UI.L(c)]));
      sel2("fBuyer", BUYERS.map(b => [b, b]));
      sel2("fObs", [["with", t("obsWith")], ["without", t("obsWithout")]], t("obsAll"));
    }
    fillFilters();
    const branchOfWh = [0, 0, 1, 3];
    function stockTxt(units, f) {
      const b = Math.floor(units / f), u = units % f;
      return (b ? b + " " + (b === 1 ? t("box") : t("boxes")) : "") + (b && u ? " + " : "") + (u || !b ? u + " " + t("unit") : "");
    }
    function filtered() {
      const br = $("#fBranch").val(), wh = $("#fWh").val(), sup = $("#fSup").val(), cat = $("#fCat").val(), buy = $("#fBuyer").val(), ob = $("#fObs").val(), q = document.getElementById("fItem").value.trim().toLowerCase(), st = document.getElementById("fStock").checked;
      return rows.filter(x => (br === "" || String(branchOfWh[x.wi]) === br) && (wh === "" || String(x.wi) === wh) && (!sup || x.it.sup === sup) && (cat === "" || String(x.it.cat) === cat) && (!buy || x.it.buyer === buy) &&
        (!q || x.it.code.toLowerCase().includes(q) || x.it.barcode.includes(q) || x.it.name.toLowerCase().includes(q)) && (!st || x.units > 0) &&
        (!ob || (ob === "with") === (obsFor(x.it.code, x.wi).length > 0)));
    }
    function render() {
      const list = filtered();
      document.querySelector("#tItems thead").innerHTML = "<tr><th>" + t("colCode") + "</th><th>" + t("colItem") + "</th><th>" + t("category") + "</th><th>" + t("supplier") + "</th><th>" + t("colWh") + "</th><th>" + t("colPres") + "</th><th>" + t("colStock") + '</th><th class="r">' + t("colBase") + '</th><th class="r">' + t("colCost") + '</th><th class="r">' + t("colValue") + "</th><th>" + t("colObs") + "</th></tr>";
      document.querySelector("#tItems tbody").innerHTML = list.map(x => {
        const n = obsFor(x.it.code, x.wi).length, k = x.it.code + "|" + x.wi;
        return '<tr class="clickable' + (sel === k ? " sel" : "") + '" tabindex="0" data-k="' + k + '"><td>' + x.it.code + '<span class="pres">' + x.it.barcode + "</span></td><td>" + x.it.name + "</td><td>" + UI.L(D.categories[x.it.cat]) + "</td><td>" + x.it.sup + "</td><td>" + (UI.lang === "es" ? WH[x.wi][1] : WH[x.wi][0]) +
          "</td><td>" + (UI.lang === "es" ? "Caja x" : "Box x") + x.it.factor + "<span class=\"pres\">" + (UI.lang === "es" ? "Unidad" : "Unit") + "</span></td><td>" + (x.units ? stockTxt(x.units, x.it.factor) : '<span class="chip chip-warn">' + mi("remove_shopping_cart") + "0</span>") +
          '</td><td class="r">' + UI.fmtInt(x.units) + '</td><td class="r">' + M(x.cost) + '</td><td class="r">' + M(x.units * x.cost) + "</td><td>" + (n ? '<span class="chip chip-info">' + mi("chat") + n + "</span>" : "—") + "</td></tr>";
      }).join("");
      const units = list.reduce((a, x) => a + x.units, 0), val = list.reduce((a, x) => a + x.units * x.cost, 0), withObs = list.filter(x => obsFor(x.it.code, x.wi).length).length;
      document.querySelector("#tItems tfoot").innerHTML = '<tr><td colspan="7">' + t("total") + " · " + list.length + '</td><td class="r">' + UI.fmtInt(units) + '</td><td></td><td class="r">' + M(val) + "</td><td></td></tr>";
      document.getElementById("kpis").innerHTML =
        '<div class="mc-kpi"><div class="k-label">' + t("kItems") + '</div><div class="k-value">' + UI.fmtInt(list.length) + "</div></div>" +
        '<div class="mc-kpi"><div class="k-label">' + t("kUnits") + '</div><div class="k-value">' + UI.fmtInt(units) + "</div></div>" +
        '<div class="mc-kpi"><div class="k-label">' + t("kValue") + '</div><div class="k-value num">' + M(val) + "</div></div>" +
        '<div class="mc-kpi is-accent" style="--k-color:var(--chart-1)"><div class="k-label">' + t("kObs") + '</div><div class="k-value">' + withObs + "</div></div>" +
        '<div class="mc-kpi is-accent" style="--k-color:var(--chart-4)"><div class="k-label">' + t("kZero") + '</div><div class="k-value">' + list.filter(x => !x.units).length + "</div></div>";
      renderSide();
    }
    function renderSide() {
      const body = document.getElementById("sideBody");
      if (!sel) { body.innerHTML = '<p class="mc-hint">' + t("pickRow") + "</p>"; return; }
      const [code, wiS] = sel.split("|"), wi = Number(wiS), it = items.find(i => i.code === code);
      const list = obsFor(code, wi).slice().sort((a, b) => b.date - a.date);
      const stC = s => s === "st_ok" ? "chip-pos" : s === "st_diff" ? "chip-neg" : "chip-warn", stI = s => s === "st_ok" ? "check_circle" : s === "st_diff" ? "error" : "schedule";
      body.innerHTML = '<p style="font-weight:600;color:var(--text-heading);margin-bottom:2px">' + it.code + " · " + it.name + '</p><p class="mc-hint" style="margin-bottom:10px">' + (UI.lang === "es" ? WH[wi][1] : WH[wi][0]) + "</p>" +
        (list.length ? '<ul class="obs-log">' + list.map(o => "<li><header><span>" + UI.fmtDay(o.date) + " · " + o.user + '</span><span class="chip ' + stC(o.st) + '">' + mi(stI(o.st)) + t(o.st) + "</span></header>" + UI.L(o.text) + (o.all ? '<div class="mc-hint" style="margin-top:4px">' + t("ap_all") + "</div>" : "") + "</li>").join("") + "</ul>" : '<p class="mc-hint">' + t("noObs") + "</p>") +
        '<form class="obs-form" id="obsForm" novalidate>' +
          '<div class="mc-field"><label for="oState">' + t("state") + '</label><select id="oState"><option value="st_ok">' + t("st_ok") + '</option><option value="st_diff">' + t("st_diff") + '</option><option value="st_pending">' + t("st_pending") + "</option></select></div>" +
          '<div class="mc-field"><label for="oApplies">' + t("appliesTo") + '</label><select id="oApplies"><option value="this">' + t("ap_this") + '</option><option value="all">' + t("ap_all") + "</option></select></div>" +
          '<div class="mc-field span2"><label for="oUser">' + t("user") + '</label><select id="oUser"><option value="">—</option>' + AUDITORS.map(a => '<option value="' + a + '">' + a + "</option>").join("") + '</select><div class="mc-field-error" id="eUser"></div></div>' +
          '<div class="mc-field span2"><label for="oText">' + t("text") + '</label><textarea id="oText" maxlength="250"></textarea><div class="mc-field-error" id="eText"></div></div>' +
          '<div class="span2"><button type="submit" class="btn btn-teal">' + mi("add_comment") + t("addObs") + "</button></div></form>";
      document.getElementById("obsForm").addEventListener("submit", e => {
        e.preventDefault();
        const txt = document.getElementById("oText").value.trim(), user = document.getElementById("oUser").value;
        document.getElementById("eText").textContent = txt.length < 5 ? t("eText") : "";
        document.getElementById("eUser").textContent = user ? "" : t("eUser");
        document.getElementById("oText").setAttribute("aria-invalid", txt.length < 5 ? "true" : "false");
        if (txt.length < 5 || !user) { (user ? document.getElementById("oText") : document.getElementById("oUser")).focus(); return; }
        log.push({ item: code, wi, all: document.getElementById("oApplies").value === "all", st: document.getElementById("oState").value, text: { en: txt, es: txt }, user, date: new Date() });
        UI.toast(t("added", { i: code })); render();
      });
    }
    document.getElementById("tItems").addEventListener("click", e => { const tr = e.target.closest("tr[data-k]"); if (!tr) return; sel = tr.dataset.k; render(); const again = document.querySelector('tr[data-k="' + sel + '"]'); if (again) again.focus(); });
    document.getElementById("tItems").addEventListener("keydown", e => { if ((e.key === "Enter" || e.key === " ") && e.target.matches("tr[data-k]")) { e.preventDefault(); e.target.click(); } });
    document.getElementById("filters").addEventListener("submit", e => { e.preventDefault(); render(); });
    document.getElementById("btnClear").addEventListener("click", () => { ["fBranch", "fWh", "fSup", "fCat", "fBuyer", "fObs"].forEach(id => $("#" + id).val("").trigger("change.select2")); document.getElementById("fItem").value = ""; document.getElementById("fStock").checked = false; render(); });
    function about() { document.getElementById("about").innerHTML = UI.aboutBox("aboutText"); }
    document.addEventListener("langchange", () => { fillFilters(); render(); about(); });
    render(); about();
  });
  </script>
</body>
</html>
