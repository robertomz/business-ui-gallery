<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cost centers · Business UI Gallery</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,300..500,0..1,0&display=block" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/select2/4.0.13/css/select2.min.css">
  <link rel="stylesheet" href="../assets/css/base.css">
  <style>
    tr.drill { cursor: pointer; }
    tr.drill.is-sel td { background: var(--bg-selected); }
    .cc-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
    .cc-head h3 { font-size: 16px; font-weight: 600; }
    .pbar { display: flex; align-items: center; gap: 8px; min-width: 120px; }
    .pbar .bar-track { flex: 1; height: 6px; }
    .wiz-step[hidden] { display: none; }
    .tab-panel { margin-top: 10px; }
  </style>
</head>
<body data-page="cost-centers" data-root="../">
  <main id="content">
    <section class="mc-panel">
      <form class="mc-filters" id="filters">
        <div class="mc-field w-sm"><label data-i18n="fCompany"></label><div class="static">DEMO</div></div>
        <div class="mc-field" style="max-width:150px"><label for="fYear" data-i18n="fYear"></label><select id="fYear"></select></div>
        <div class="mc-field" style="max-width:170px"><label for="fMonth" data-i18n="fMonth"></label><select id="fMonth"></select></div>
        <div class="mc-field" style="max-width:200px"><label for="fType" data-i18n="fType"></label><select id="fType"></select></div>
        <button class="btn btn-teal" type="submit"><span class="material-icons" aria-hidden="true">search</span><span data-i18n="load"></span></button>
        <button class="btn btn-violet" type="button" id="btnNew"><span class="material-icons" aria-hidden="true">add_business</span><span data-i18n="newCenter"></span></button>
      </form>
    </section>

    <div class="mc-kpis" id="kpis"></div>

    <section class="mc-panel">
      <div class="mc-panel-title"><h3><span class="material-icons" aria-hidden="true">hub</span><span data-i18n="centers"></span></h3><span class="mc-hint" data-i18n="centersHint"></span></div>
      <div class="table-wrap"><table class="grid" id="tCenters"><thead></thead><tbody></tbody><tfoot></tfoot></table></div>
    </section>

    <section class="mc-panel" id="detail" hidden>
      <div class="cc-head">
        <div><h3 id="dTitle"></h3><p class="mc-hint" id="dSub"></p></div>
        <div style="display:flex;gap:8px;flex-wrap:wrap">
          <button class="btn btn-amber" type="button" id="btnAdj"><span class="material-icons" aria-hidden="true">tune</span><span data-i18n="adjust"></span></button>
        </div>
      </div>
      <div class="mc-tabs" role="tablist" id="tabs"></div>
      <div class="tab-panel" id="tabPanel"></div>
    </section>

    <div id="about"></div>
  </main>

  <!-- Adjustment request -->
  <div class="modal-backdrop" id="mAdj">
    <div class="modal modal-sm" role="dialog" aria-modal="true" aria-labelledby="mAdjT">
      <div class="modal-head"><h3 id="mAdjT"><span class="material-icons" aria-hidden="true">tune</span><span data-i18n="adjTitle"></span></h3></div>
      <div class="modal-body" style="display:flex;flex-direction:column;gap:10px">
        <div class="mc-field"><label for="aAcc" data-i18n="colAccount"></label><select id="aAcc"></select></div>
        <div class="mc-field"><label for="aMonth" data-i18n="fMonth"></label><select id="aMonth"></select></div>
        <div class="grid-2">
          <div class="mc-field"><label data-i18n="prevBudget"></label><input class="num" id="aPrev" readonly></div>
          <div class="mc-field"><label for="aNew" data-i18n="newBudget"></label><input class="num" id="aNew" inputmode="decimal"><span class="mc-field-error" id="aNewErr"></span></div>
        </div>
        <div class="mc-field"><label for="aObs" data-i18n="observation"></label><textarea id="aObs"></textarea><span class="mc-field-error" id="aObsErr"></span></div>
      </div>
      <div class="modal-foot"><button class="btn btn-teal" type="button" id="aSave"><span class="material-icons" aria-hidden="true">send</span><span data-i18n="request"></span></button><button class="btn" type="button" data-close="mAdj" data-i18n="close"></button></div>
    </div>
  </div>

  <!-- Reject reason -->
  <div class="modal-backdrop" id="mRej">
    <div class="modal modal-sm" role="dialog" aria-modal="true" aria-labelledby="mRejT">
      <div class="modal-head"><h3 id="mRejT"><span class="material-icons" aria-hidden="true">block</span><span data-i18n="rejectTitle"></span></h3></div>
      <div class="modal-body"><div class="mc-field"><label for="rReason" data-i18n="reason"></label><textarea id="rReason"></textarea><span class="mc-field-error" id="rErr"></span></div></div>
      <div class="modal-foot"><button class="btn btn-danger" type="button" id="rSave" data-i18n="reject"></button><button class="btn" type="button" data-close="mRej" data-i18n="close"></button></div>
    </div>
  </div>

  <!-- New center wizard -->
  <div class="modal-backdrop" id="mNew">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="mNewT">
      <div class="modal-head"><h3 id="mNewT"><span class="material-icons" aria-hidden="true">add_business</span><span data-i18n="newCenter"></span></h3><div class="mc-steps" id="wSteps"></div></div>
      <div class="modal-body">
        <div class="wiz-step" data-step="1">
          <div class="grid-2">
            <div class="mc-field"><label for="wName" data-i18n="name"></label><input id="wName"><span class="mc-field-error" id="wNameErr"></span></div>
            <div class="mc-field"><label for="wType" data-i18n="fType"></label><select id="wType"></select></div>
            <div class="mc-field"><label for="wBranch" data-i18n="branch"></label><select id="wBranch"></select></div>
            <div class="mc-field"><label for="wDept" data-i18n="department"></label><select id="wDept"></select></div>
          </div>
        </div>
        <div class="wiz-step" data-step="2" hidden>
          <div class="mc-filters">
            <div class="mc-field"><label for="wFrom" data-i18n="copyFrom"></label><select id="wFrom"></select></div>
            <div class="mc-field" style="max-width:160px"><label for="wScale" data-i18n="scale"></label><input class="num" id="wScale" value="100" inputmode="numeric"></div>
          </div>
          <p class="mc-hint" style="margin:8px 0" data-i18n="copyHint"></p>
          <div class="table-wrap" style="max-height:320px"><table class="grid" id="wPrev"><thead></thead><tbody></tbody><tfoot></tfoot></table></div>
        </div>
        <div class="wiz-step" data-step="3" hidden><div class="ladder" id="wSum"></div></div>
      </div>
      <div class="modal-foot">
        <button class="btn btn-teal" type="button" id="wNext"></button>
        <button class="btn" type="button" id="wBack" data-i18n="back"></button>
        <button class="btn" type="button" data-close="mNew" data-i18n="close"></button>
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/select2/4.0.13/js/select2.min.js"></script>
  <script src="../assets/js/common.js"></script>
  <script>
  UI.strings({
    en: {
      fCompany: "Company", fYear: "Budget year", fMonth: "Budget month", fType: "Center type", newCenter: "New center", centers: "Management centers",
      centersHint: "Select a center to open its budget and expenses", adjust: "Balance adjustment", allTypes: "All types",
      tSales: "Sales", tService: "Service", tAdmin: "Administrative",
      kAuth: "Authorized budget", kProj: "Projected", kAch: "Achieved net", kPct: "% achieved", kDiff: "Difference (net)", kExp: "Expenses entered",
      colCenter: "Center", colType: "Type", colBranch: "Branch", colAuth: "Authorized budget", colProj: "Projected", colAch: "Achieved net", colPct: "% achieved", colDiff: "Difference (net)", colExp: "Expenses entered", colResp: "Responsible",
      dTitle: "{t} center – {n}", dSub: "Expense month: {m} · Responsible: {r}",
      tabBudget: "Budget and expenses", tabProj: "Projected vs achieved", tabAdj: "Adjustment requests", tabMonths: "Months",
      colAccNo: "Account no.", colAccount: "Account", colState: "Status", colAuthorized: "Authorized", colSpent: "Total spent", colAvail: "Available", colPctSpent: "% spent", colVerified: "Verified value", colKind: "Expense type",
      kDirect: "Direct", kIndirect: "Indirect", kShared: "Shared", stOk: "Within budget", stNear: "Near the limit", stOver: "Over budget",
      colSeller: "Seller", colSaleP: "Projected sales", colCostP: "Projected cost", colProfitP: "Projected profit", colMarginP: "Projected margin", colSaleA: "Net sales achieved", colProfitA: "Net profit achieved", colMarginA: "Net margin achieved", colSaleD: "Sales difference", colSalePct: "Sales %",
      colReqCenter: "Requesting center", colReqBy: "Requested by", colReqVal: "Requested value", colAuthVal: "Authorized value", colActions: "Actions", colDate: "Date",
      colMonth: "Month", colBudgetM: "Budget", colSpentM: "Spent", colAvailM: "Available",
      adjTitle: "Balance adjustment request", prevBudget: "Previous budget", newBudget: "New budget requested", observation: "Observation", request: "Send request",
      errAmount: "Enter an amount greater than zero.", errSame: "The new budget is equal to the previous one.", errObs: "Write why the adjustment is needed.",
      reqSent: "Request {n} sent for approval.", approvedMsg: "Request {n} approved: the budget was updated.", rejectedMsg: "Request {n} rejected.",
      rejectTitle: "Reject request", errReason: "The reason is required to reject.",
      name: "Center name", department: "Department", copyFrom: "Replicate expense accounts from", scale: "Scale (%)", copyHint: "The accounts and monthly budget of the selected center are copied and scaled. Only the months still open (Nov and Dec) receive budget.",
      next: "Next", create: "Create center", back: "Back", step1: "Data", step2: "Accounts", step3: "Confirm", errName: "Write a name.",
      sumName: "Center", sumAccounts: "Expense accounts copied", sumBudget: "Budget for Nov–Dec", created: "Center «{n}» created with {a} accounts.",
      d1: "Sales", d2: "Operations", d3: "Administration",
      aboutText: "This screen mirrors the management control module: each <b>management center</b> (sales, service or administrative) has an authorized annual budget split by month and by expense account. <b>Achieved net</b> comes from the month's sales and expenses; <b>% achieved</b> = achieved ÷ projected. Expenses are classified as <b>direct, indirect or shared</b>. A center can request a <b>balance adjustment</b> for one account and month; it stays pending until it is approved (and then the budget changes) or rejected with a reason. A new center can be created by <b>replicating</b> another center's expense accounts with a scale. All data is generated."
    },
    es: {
      fCompany: "Empresa", fYear: "Año presupuesto", fMonth: "Mes presupuesto", fType: "Tipo centro", newCenter: "Nuevo centro", centers: "Centros",
      centersHint: "Elija un centro para abrir su presupuesto y gastos", adjust: "Ajuste de saldo", allTypes: "Todos los tipos",
      tSales: "Ventas", tService: "Servicio", tAdmin: "Administrativo",
      kAuth: "Presupuesto autorizado", kProj: "Proyectado", kAch: "Logrado neto", kPct: "% logrado", kDiff: "Diferencia (neta)", kExp: "Gastos ingresados",
      colCenter: "Centro", colType: "Tipo", colBranch: "Sucursal", colAuth: "Presupuesto autorizado", colProj: "Proyectado", colAch: "Logrado neto", colPct: "% logrado", colDiff: "Diferencia (neta)", colExp: "Gastos ingresados", colResp: "Responsable",
      dTitle: "Centro de {t} – {n}", dSub: "Mes gasto: {m} · Responsable: {r}",
      tabBudget: "Presupuesto y gastos", tabProj: "Proyectado vs logrado", tabAdj: "Solicitudes de ajuste", tabMonths: "Meses",
      colAccNo: "Número cuenta", colAccount: "Cuenta contable", colState: "Estado", colAuthorized: "Autorizado", colSpent: "Gasto total", colAvail: "Disponible", colPctSpent: "% gastado", colVerified: "Valor verificado", colKind: "Tipo de gasto",
      kDirect: "Directo", kIndirect: "Indirecto", kShared: "Compartido", stOk: "Dentro del presupuesto", stNear: "Cerca del límite", stOver: "Sobregirado",
      colSeller: "Vendedor", colSaleP: "Venta proy.", colCostP: "Costo proy.", colProfitP: "Utilidad proy.", colMarginP: "Margen proy.", colSaleA: "Venta neta log.", colProfitA: "Utilidad neta log.", colMarginA: "Margen neto log.", colSaleD: "Venta neta dif.", colSalePct: "Venta neta %",
      colReqCenter: "Centro solicita", colReqBy: "Solicitado por", colReqVal: "Valor solicitado", colAuthVal: "Valor autorizado", colActions: "Acciones", colDate: "Fecha",
      colMonth: "Mes", colBudgetM: "Presupuesto", colSpentM: "Gastado", colAvailM: "Disponible",
      adjTitle: "Solicitud de ajuste de saldo", prevBudget: "Presupuesto anterior", newBudget: "Presupuesto nuevo solicitado", observation: "Observación", request: "Enviar solicitud",
      errAmount: "Escriba un monto mayor que cero.", errSame: "El presupuesto nuevo es igual al anterior.", errObs: "Explique por qué se necesita el ajuste.",
      reqSent: "Solicitud {n} enviada a aprobación.", approvedMsg: "Solicitud {n} aprobada: se actualizó el presupuesto.", rejectedMsg: "Solicitud {n} rechazada.",
      rejectTitle: "Rechazar solicitud", errReason: "El motivo es obligatorio para rechazar.",
      name: "Nombre del centro", department: "Departamento", copyFrom: "Replicar cuentas de gasto de", scale: "Escala (%)", copyHint: "Se copian las cuentas y el presupuesto mensual del centro elegido, escalados. Solo los meses abiertos (nov y dic) reciben presupuesto.",
      next: "Siguiente", create: "Crear centro", back: "Atrás", step1: "Datos", step2: "Cuentas", step3: "Confirmar", errName: "Escriba un nombre.",
      sumName: "Centro", sumAccounts: "Cuentas de gasto copiadas", sumBudget: "Presupuesto de nov–dic", created: "Centro «{n}» creado con {a} cuentas.",
      d1: "Ventas", d2: "Operaciones", d3: "Administración",
      aboutText: "Esta pantalla replica el módulo de control de gestión: cada <b>centro de gestión</b> (ventas, servicio o administrativo) tiene un presupuesto anual autorizado repartido por mes y por cuenta de gasto. El <b>logrado neto</b> sale de las ventas y gastos del mes; <b>% logrado</b> = logrado ÷ proyectado. Los gastos se clasifican en <b>directos, indirectos y compartidos</b>. Un centro puede pedir un <b>ajuste de saldo</b> para una cuenta y un mes; queda pendiente hasta que se aprueba (y entonces cambia el presupuesto) o se rechaza con motivo. Un centro nuevo se puede crear <b>replicando</b> las cuentas de gasto de otro con una escala. Todos los datos son generados."
    }
  });

  $(function () {
    const D = UI.DATA, t = UI.t, M = UI.fmtMoney, mi = UI.mi;
    const TYPES = ["tSales", "tSales", "tSales", "tService", "tService", "tAdmin", "tAdmin"];
    const ACCOUNTS = [
      ["6-01-01-001", { en: "Salaries", es: "Sueldos y salarios" }, "kDirect"], ["6-01-01-004", { en: "Overtime", es: "Horas extra" }, "kDirect"],
      ["6-02-03-001", { en: "Fuel", es: "Combustible" }, "kDirect"], ["6-02-03-005", { en: "Vehicle maintenance", es: "Mantenimiento de vehículos" }, "kDirect"],
      ["6-03-01-002", { en: "Rent", es: "Alquileres" }, "kIndirect"], ["6-03-02-001", { en: "Electricity", es: "Energía eléctrica" }, "kIndirect"],
      ["6-03-02-003", { en: "Telephone and internet", es: "Teléfono e internet" }, "kIndirect"], ["6-04-01-001", { en: "Office supplies", es: "Papelería y útiles" }, "kIndirect"],
      ["6-05-01-002", { en: "IT services (shared)", es: "Servicios de TI (compartido)" }, "kShared"], ["6-05-01-004", { en: "Security (shared)", es: "Vigilancia (compartido)" }, "kShared"]
    ];
    let centers = D.costCenters.map((c, i) => {
      const r = UI.rng(500 + i);
      const accs = ACCOUNTS.map(a => ({ no: a[0], name: a[1], kind: a[2], months: Array.from({ length: 12 }, () => Math.round(UI.between(r, 3000, 26000) * (a[2] === "kDirect" ? 2 : 1))), spent: [] }));
      accs.forEach(a => { a.spent = a.months.map((b, m) => m < 10 ? Math.round(b * UI.between(r, .6, 1.18)) : m === 10 ? Math.round(b * UI.between(r, .35, .7)) : 0); a.ver = a.spent.map(s => Math.round(s * UI.between(r, .55, 1))); });
      const sales = TYPES[i] === "tSales";
      const proj = sales ? Math.round(UI.between(r, 1200000, 2300000)) : 0;
      return { id: i, name: UI.L(c), names: c, type: TYPES[i], branch: D.branches[i % D.branches.length], resp: D.firstNames[i * 2] + " " + D.lastNames[i], accs, proj, ach: sales ? proj * UI.between(r, .8, 1.08) : 0 };
    });
    let reqs = [
      { n: "SA-0141", c: 0, acc: 2, m: 10, prev: 0, val: 0, by: "A. Torres", st: "pending", date: "2026-11-12" },
      { n: "SA-0142", c: 3, acc: 5, m: 10, prev: 0, val: 0, by: "C. Ramos", st: "pending", date: "2026-11-13" },
      { n: "SA-0139", c: 1, acc: 0, m: 9, prev: 0, val: 0, by: "B. Lopez", st: "approved", date: "2026-10-28" }
    ];
    reqs.forEach(q => { q.prev = centers[q.c].accs[q.acc].months[q.m]; q.val = Math.round(q.prev * 1.25); });
    let sel = null, tab = "budget", rejecting = null, reqSeq = 143;

    const fillSel = (el, items, val) => { const $e = $(el); $e.empty(); items.forEach(x => $e.append(new Option(x[1], x[0]))); if (val != null) $e.val(String(val)); };
    function fillFilters() {
      const y = $("#fYear").val() || "2026", m = $("#fMonth").val() || "10", ty = $("#fType").val() || "all";
      fillSel("#fYear", [["2025", "2025"], ["2026", "2026"]], y);
      fillSel("#fMonth", Array.from({ length: 12 }, (_, i) => [i, UI.monthName(i)]), m);
      fillSel("#fType", [["all", t("allTypes")], ["tSales", t("tSales")], ["tService", t("tService")], ["tAdmin", t("tAdmin")]], ty);
      ["#fYear", "#fMonth", "#fType"].forEach(s => $(s).select2({ width: "100%", minimumResultsForSearch: Infinity }));
    }
    const month = () => Number($("#fMonth").val());
    const sumTo = (arr, m) => arr.slice(0, m + 1).reduce((a, b) => a + b, 0);
    function figures(c) {
      const m = month();
      const auth = c.accs.reduce((a, x) => a + sumTo(x.months, 11), 0);
      const exp = c.accs.reduce((a, x) => a + x.spent[m], 0);
      const budM = c.accs.reduce((a, x) => a + x.months[m], 0);
      // Sales centers: projected net = projected sales margin − budgeted expenses; achieved net = real margin − real expenses.
      // Service/administrative centers: projected = month budget, achieved = what was spent (execution), difference = what is left.
      if (c.type === "tSales") {
        const proj = c.proj * .22 - budM, ach = c.ach * .22 - exp;
        return { auth, exp, proj, ach, pct: proj ? ach / proj : 0, diff: ach - proj };
      }
      return { auth, exp, proj: budM, ach: exp, pct: budM ? exp / budM : 0, diff: budM - exp };
    }
    function status(pct) {
      if (pct > 1) return '<span class="chip chip-neg">' + mi("error") + t("stOver") + "</span>";
      if (pct > .9) return '<span class="chip chip-warn">' + mi("warning") + t("stNear") + "</span>";
      return '<span class="chip chip-pos">' + mi("check_circle") + t("stOk") + "</span>";
    }
    function bar(p, spend) { const c = spend ? (p > 1 ? "var(--danger-solid)" : p > .9 ? "var(--warning-solid)" : "var(--success-solid)") : (p >= 1 ? "var(--success-solid)" : p >= .85 ? "var(--warning-solid)" : "var(--danger-solid)"); return '<div class="pbar"><div class="bar-track"><span style="width:' + Math.max(0, Math.min(100, p * 100)) + "%;background:" + c + '"></span></div><span class="num">' + UI.fmtPct(p) + "</span></div>"; }

    function renderList() {
      const ty = $("#fType").val();
      const list = centers.filter(c => ty === "all" || c.type === ty);
      const rows = list.map(c => ({ c, f: figures(c) }));
      const S = k => rows.reduce((a, r) => a + r.f[k], 0);
      document.getElementById("kpis").innerHTML = [["kAuth", M(S("auth"))], ["kProj", M(S("proj"))], ["kAch", M(S("ach"))], ["kExp", M(S("exp"))], ["kDiff", M(S("diff"))]]
        .map(k => '<div class="mc-kpi"><div class="k-label">' + t(k[0]) + '</div><div class="k-value' + (k[0] === "kDiff" && S("diff") < 0 ? " neg" : "") + '">' + k[1] + "</div></div>").join("");
      document.querySelector("#tCenters thead").innerHTML = "<tr><th>" + t("colCenter") + "</th><th>" + t("colType") + "</th><th>" + t("colBranch") + '</th><th class="r">' + t("colAuth") + '</th><th class="r">' + t("colProj") + '</th><th class="r">' + t("colAch") + "</th><th>" + t("colPct") + '</th><th class="r">' + t("colDiff") + '</th><th class="r">' + t("colExp") + "</th><th>" + t("colResp") + "</th></tr>";
      document.querySelector("#tCenters tbody").innerHTML = rows.map(r => '<tr class="drill' + (sel === r.c.id ? " is-sel" : "") + '" tabindex="0" data-id="' + r.c.id + '"><td><b>' + UI.L(r.c.names || r.c.name) + "</b></td><td>" + t(r.c.type) + "</td><td>" + r.c.branch + '</td><td class="r">' + M(r.f.auth) + '</td><td class="r">' + M(r.f.proj) + '</td><td class="r">' + M(r.f.ach) + "</td><td>" + bar(r.f.pct, r.c.type !== "tSales") + '</td><td class="r ' + (r.f.diff < 0 ? "neg" : "pos") + '">' + M(r.f.diff) + '</td><td class="r">' + M(r.f.exp) + "</td><td>" + r.c.resp + "</td></tr>").join("");
      document.querySelector("#tCenters tfoot").innerHTML = "<tr><td colspan=\"3\">" + t("total") + '</td><td class="r">' + M(S("auth")) + '</td><td class="r">' + M(S("proj")) + '</td><td class="r">' + M(S("ach")) + "</td><td></td><td class=\"r\">" + M(S("diff")) + '</td><td class="r">' + M(S("exp")) + "</td><td></td></tr>";
      if (sel != null) renderDetail();
    }

    function renderDetail() {
      const c = centers[sel], m = month();
      document.getElementById("detail").hidden = false;
      document.getElementById("dTitle").textContent = t("dTitle", { t: t(c.type), n: UI.L(c.names || c.name) });
      document.getElementById("dSub").textContent = t("dSub", { m: UI.monthName(m) + " " + $("#fYear").val(), r: c.resp });
      const tabs = [["budget", "tabBudget"], ["proj", "tabProj"], ["adj", "tabAdj"], ["months", "tabMonths"]].filter(x => x[0] !== "proj" || c.type === "tSales");
      if (!tabs.find(x => x[0] === tab)) tab = "budget";
      document.getElementById("tabs").innerHTML = tabs.map(x => '<button type="button" role="tab" class="mc-tab" aria-selected="' + (tab === x[0]) + '" data-tab="' + x[0] + '">' + t(x[1]) + (x[0] === "adj" ? " (" + reqs.filter(q => q.c === c.id && q.st === "pending").length + ")" : "") + "</button>").join("");
      const P = document.getElementById("tabPanel");
      if (tab === "budget") {
        let tot = [0, 0, 0, 0];
        const body = ["kDirect", "kIndirect", "kShared"].map(k => {
          const acc = c.accs.filter(a => a.kind === k);
          return '<tr class="group"><td colspan="8">' + t(k) + "</td></tr>" + acc.map(a => {
            const au = a.months[m], sp = a.spent[m], av = au - sp, p = au ? sp / au : 0;
            tot[0] += au; tot[1] += sp; tot[2] += av; tot[3] += a.ver[m];
            return "<tr><td>" + a.no + "</td><td>" + UI.L(a.name) + "</td><td>" + status(p) + '</td><td class="r">' + M(au) + '</td><td class="r">' + M(sp) + '</td><td class="r ' + (av < 0 ? "neg" : "") + '">' + M(av) + "</td><td>" + bar(p, true) + '</td><td class="r">' + M(a.ver[m]) + "</td></tr>";
          }).join("");
        }).join("");
        P.innerHTML = '<div class="table-wrap"><table class="grid"><thead><tr><th>' + t("colAccNo") + "</th><th>" + t("colAccount") + "</th><th>" + t("colState") + '</th><th class="r">' + t("colAuthorized") + '</th><th class="r">' + t("colSpent") + '</th><th class="r">' + t("colAvail") + "</th><th>" + t("colPctSpent") + '</th><th class="r">' + t("colVerified") + "</th></tr></thead><tbody>" + body +
          '</tbody><tfoot><tr><td colspan="3">' + t("total") + '</td><td class="r">' + M(tot[0]) + '</td><td class="r">' + M(tot[1]) + '</td><td class="r">' + M(tot[2]) + "</td><td>" + bar(tot[0] ? tot[1] / tot[0] : 0, true) + '</td><td class="r">' + M(tot[3]) + "</td></tr></tfoot></table></div>";
      } else if (tab === "proj") {
        const r = UI.rng(900 + c.id * 13 + m);
        const sellers = D.sellers.slice(c.id, c.id + 5);
        const rows = sellers.map(s => { const sp = c.proj / 5 * UI.between(r, .7, 1.3), cp = sp * .78, sa = sp * UI.between(r, .78, 1.12), ca = sa * UI.between(r, .76, .81); return { s, sp, cp, sa, ca }; });
        const sum = k => rows.reduce((a, x) => a + x[k], 0);
        P.innerHTML = '<div class="table-wrap"><table class="grid"><thead><tr><th>' + t("colSeller") + '</th><th class="r">' + t("colSaleP") + '</th><th class="r">' + t("colCostP") + '</th><th class="r">' + t("colProfitP") + '</th><th class="r">' + t("colMarginP") + '</th><th class="r">' + t("colSaleA") + '</th><th class="r">' + t("colProfitA") + '</th><th class="r">' + t("colMarginA") + '</th><th class="r">' + t("colSaleD") + '</th><th class="r">' + t("colSalePct") + "</th></tr></thead><tbody>" +
          rows.map(x => "<tr><td>" + x.s + '</td><td class="r">' + M(x.sp) + '</td><td class="r">' + M(x.cp) + '</td><td class="r">' + M(x.sp - x.cp) + '</td><td class="r">' + UI.fmtPct((x.sp - x.cp) / x.sp) + '</td><td class="r">' + M(x.sa) + '</td><td class="r">' + M(x.sa - x.ca) + '</td><td class="r">' + UI.fmtPct((x.sa - x.ca) / x.sa) + '</td><td class="r ' + (x.sa - x.sp < 0 ? "neg" : "pos") + '">' + M(x.sa - x.sp) + '</td><td class="r">' + UI.fmtPct(x.sa / x.sp) + "</td></tr>").join("") +
          '</tbody><tfoot><tr><td>' + t("total") + '</td><td class="r">' + M(sum("sp")) + '</td><td class="r">' + M(sum("cp")) + '</td><td class="r">' + M(sum("sp") - sum("cp")) + '</td><td class="r">' + UI.fmtPct((sum("sp") - sum("cp")) / sum("sp")) + '</td><td class="r">' + M(sum("sa")) + '</td><td class="r">' + M(sum("sa") - sum("ca")) + '</td><td class="r">' + UI.fmtPct((sum("sa") - sum("ca")) / sum("sa")) + '</td><td class="r">' + M(sum("sa") - sum("sp")) + '</td><td class="r">' + UI.fmtPct(sum("sa") / sum("sp")) + "</td></tr></tfoot></table></div>";
      } else if (tab === "adj") {
        const list = reqs.filter(q => q.c === c.id);
        const chip = st => st === "pending" ? '<span class="chip chip-warn">' + mi("schedule") + t("pending") + "</span>" : st === "approved" ? '<span class="chip chip-pos">' + mi("check_circle") + t("approved") + "</span>" : '<span class="chip chip-neg">' + mi("cancel") + t("rejected") + "</span>";
        P.innerHTML = '<div class="table-wrap"><table class="grid"><thead><tr><th>#</th><th>' + t("colDate") + "</th><th>" + t("colReqCenter") + "</th><th>" + t("colAccount") + "</th><th>" + t("colMonth") + "</th><th>" + t("colReqBy") + '</th><th class="r">' + t("prevBudget") + '</th><th class="r">' + t("colReqVal") + '</th><th class="r">' + t("colAuthVal") + "</th><th>" + t("colState") + "</th><th>" + t("colActions") + "</th></tr></thead><tbody>" +
          (list.length ? list.map(q => "<tr><td>" + q.n + "</td><td>" + UI.fmtDay(new Date(q.date + "T00:00:00Z")) + "</td><td>" + UI.L(centers[q.c].names || centers[q.c].name) + "</td><td>" + UI.L(c.accs[q.acc].name) + "</td><td>" + UI.monthName(q.m) + "</td><td>" + q.by + '</td><td class="r">' + M(q.prev) + '</td><td class="r">' + M(q.val) + '</td><td class="r">' + (q.st === "approved" ? M(q.val) : "—") + "</td><td>" + chip(q.st) + (q.reason ? '<small class="muted" style="display:block">' + q.reason + "</small>" : "") + "</td><td>" +
            (q.st === "pending" ? '<button class="btn btn-sm btn-teal" type="button" data-approve="' + q.n + '">' + mi("check") + t("approve") + '</button> <button class="btn btn-sm" type="button" data-reject="' + q.n + '">' + mi("close") + t("reject") + "</button>" : "") + "</td></tr>").join("")
            : '<tr><td colspan="11" class="muted">' + t("noData") + "</td></tr>") + "</tbody></table></div>";
      } else {
        P.innerHTML = '<div class="table-wrap"><table class="grid"><thead><tr><th>' + t("colMonth") + '</th><th class="r">' + t("colBudgetM") + '</th><th class="r">' + t("colSpentM") + '</th><th class="r">' + t("colAvailM") + "</th><th>" + t("colPctSpent") + "</th></tr></thead><tbody>" +
          Array.from({ length: 12 }, (_, i) => { const b = c.accs.reduce((a, x) => a + x.months[i], 0), s = c.accs.reduce((a, x) => a + x.spent[i], 0); return "<tr><td>" + UI.monthName(i) + '</td><td class="r">' + M(b) + '</td><td class="r">' + M(s) + '</td><td class="r ' + (b - s < 0 ? "neg" : "") + '">' + M(b - s) + "</td><td>" + bar(b ? s / b : 0, true) + "</td></tr>"; }).join("") + "</tbody></table></div>";
      }
    }

    // Adjustment modal
    function fillAdj() {
      const c = centers[sel];
      fillSel("#aAcc", c.accs.map((a, i) => [i, a.no + " · " + UI.L(a.name)]), 0);
      fillSel("#aMonth", [[10, UI.monthName(10)], [11, UI.monthName(11)]], 10);
      $("#aAcc").select2({ width: "100%", dropdownParent: $("#mAdj") });
      $("#aMonth").select2({ width: "100%", minimumResultsForSearch: Infinity, dropdownParent: $("#mAdj") });
      updPrev();
    }
    function updPrev() { const c = centers[sel]; document.getElementById("aPrev").value = M(c.accs[Number($("#aAcc").val())].months[Number($("#aMonth").val())]); }
    $("#aAcc, #aMonth").on("change", updPrev);
    UI.maskMoney(document.getElementById("aNew"));
    document.getElementById("btnAdj").addEventListener("click", () => {
      ["aNew", "aObs"].forEach(id => { document.getElementById(id).value = ""; document.getElementById(id).removeAttribute("aria-invalid"); });
      ["aNewErr", "aObsErr"].forEach(id => document.getElementById(id).textContent = "");
      fillAdj(); UI.openModal("mAdj");
    });
    document.getElementById("aSave").addEventListener("click", () => {
      const c = centers[sel], acc = Number($("#aAcc").val()), m = Number($("#aMonth").val());
      const v = UI.parseMoney(document.getElementById("aNew").value), obs = document.getElementById("aObs").value.trim();
      let ok = true;
      const err = (id, eid, msg) => { document.getElementById(eid).textContent = msg; document.getElementById(id).setAttribute("aria-invalid", msg ? "true" : "false"); if (msg) ok = false; };
      err("aNew", "aNewErr", v <= 0 ? t("errAmount") : v === c.accs[acc].months[m] ? t("errSame") : "");
      err("aObs", "aObsErr", obs ? "" : t("errObs"));
      if (!ok) return;
      const n = "SA-0" + (reqSeq++);
      reqs.unshift({ n, c: sel, acc, m, prev: c.accs[acc].months[m], val: v, by: "R. Demo", st: "pending", date: "2026-11-16" });
      UI.closeModal("mAdj"); tab = "adj"; renderDetail(); UI.toast(t("reqSent", { n }));
    });
    document.getElementById("tabPanel").addEventListener("click", e => {
      const a = e.target.closest("[data-approve]"), r = e.target.closest("[data-reject]");
      if (a) { const q = reqs.find(x => x.n === a.dataset.approve); q.st = "approved"; centers[q.c].accs[q.acc].months[q.m] = q.val; renderList(); UI.toast(t("approvedMsg", { n: q.n })); }
      if (r) { rejecting = r.dataset.reject; document.getElementById("rReason").value = ""; document.getElementById("rErr").textContent = ""; UI.openModal("mRej"); }
    });
    document.getElementById("rSave").addEventListener("click", () => {
      const v = document.getElementById("rReason").value.trim();
      if (!v) { document.getElementById("rErr").textContent = t("errReason"); document.getElementById("rReason").setAttribute("aria-invalid", "true"); return; }
      const q = reqs.find(x => x.n === rejecting); q.st = "rejected"; q.reason = v;
      UI.closeModal("mRej"); renderDetail(); UI.toast(t("rejectedMsg", { n: q.n }));
    });

    // Wizard
    let step = 1;
    function fillWizard() {
      fillSel("#wType", [["tSales", t("tSales")], ["tService", t("tService")], ["tAdmin", t("tAdmin")]], $("#wType").val() || "tSales");
      fillSel("#wBranch", D.branches.map((b, i) => [i, b]), $("#wBranch").val() || 0);
      fillSel("#wDept", [["d1", t("d1")], ["d2", t("d2")], ["d3", t("d3")]], $("#wDept").val() || "d1");
      fillSel("#wFrom", centers.map(c => [c.id, UI.L(c.names || c.name)]), $("#wFrom").val() || 0);
      ["#wType", "#wBranch", "#wDept", "#wFrom"].forEach(s => $(s).select2({ width: "100%", dropdownParent: $("#mNew") }));
    }
    function wizPreview() {
      const c = centers[Number($("#wFrom").val())], sc = Math.max(0, Number(document.getElementById("wScale").value) || 0) / 100;
      document.querySelector("#wPrev thead").innerHTML = "<tr><th>" + t("colAccNo") + "</th><th>" + t("colAccount") + "</th><th>" + t("colKind") + '</th><th class="r">' + UI.monthName(10, true) + '</th><th class="r">' + UI.monthName(11, true) + "</th></tr>";
      let s = 0;
      document.querySelector("#wPrev tbody").innerHTML = c.accs.map(a => { const n = Math.round(a.months[10] * sc), d = Math.round(a.months[11] * sc); s += n + d; return "<tr><td>" + a.no + "</td><td>" + UI.L(a.name) + "</td><td>" + t(a.kind) + '</td><td class="r">' + M(n) + '</td><td class="r">' + M(d) + "</td></tr>"; }).join("");
      document.querySelector("#wPrev tfoot").innerHTML = '<tr><td colspan="3">' + t("total") + '</td><td class="r" colspan="2">' + M(s) + "</td></tr>";
      return { c, sc, s };
    }
    function paintWizard() {
      document.querySelectorAll(".wiz-step").forEach(el => el.hidden = Number(el.dataset.step) !== step);
      document.getElementById("wSteps").innerHTML = ["step1", "step2", "step3"].map((k, i) => '<span class="mc-step ' + (i + 1 < step ? "done" : i + 1 === step ? "current" : "") + '"><i>' + (i + 1 < step ? "✓" : i + 1) + "</i>" + t(k) + "</span>").join("");
      document.getElementById("wNext").textContent = step === 3 ? t("create") : t("next");
      document.getElementById("wBack").hidden = step === 1;
      if (step === 2) wizPreview();
      if (step === 3) { const p = wizPreview(); document.getElementById("wSum").innerHTML = '<div class="ladder-row"><span>' + t("sumName") + "</span><b>" + document.getElementById("wName").value + " · " + t($("#wType").val()) + '</b></div><div class="ladder-row"><span>' + t("sumAccounts") + "</span><b>" + p.c.accs.length + '</b></div><div class="ladder-row result"><span>' + t("sumBudget") + '</span><b class="num">' + M(p.s) + "</b></div>"; }
    }
    document.getElementById("btnNew").addEventListener("click", () => { step = 1; document.getElementById("wName").value = ""; document.getElementById("wNameErr").textContent = ""; document.getElementById("wScale").value = "100"; fillWizard(); paintWizard(); UI.openModal("mNew"); });
    document.getElementById("wBack").addEventListener("click", () => { step--; paintWizard(); });
    document.getElementById("wNext").addEventListener("click", () => {
      if (step === 1) { if (!document.getElementById("wName").value.trim()) { document.getElementById("wNameErr").textContent = t("errName"); document.getElementById("wName").setAttribute("aria-invalid", "true"); return; } document.getElementById("wName").removeAttribute("aria-invalid"); document.getElementById("wNameErr").textContent = ""; }
      if (step < 3) { step++; paintWizard(); return; }
      const p = wizPreview(), name = document.getElementById("wName").value.trim();
      const accs = p.c.accs.map(a => ({ no: a.no, name: a.name, kind: a.kind, months: a.months.map((v, i) => i >= 10 ? Math.round(v * p.sc) : 0), spent: Array(12).fill(0), ver: Array(12).fill(0) }));
      centers.push({ id: centers.length, name, type: $("#wType").val(), branch: D.branches[Number($("#wBranch").val())], resp: "R. Demo", accs, proj: 0, ach: 0 });
      UI.closeModal("mNew"); renderList(); UI.toast(t("created", { n: name, a: accs.length }));
    });
    $("#wFrom").on("change", wizPreview);
    document.getElementById("wScale").addEventListener("input", wizPreview);

    document.querySelectorAll("[data-close]").forEach(b => b.addEventListener("click", () => UI.closeModal(b.dataset.close)));
    document.getElementById("tabs").addEventListener("click", e => { const b = e.target.closest("[data-tab]"); if (b) { tab = b.dataset.tab; renderDetail(); } });
    document.getElementById("tabs").addEventListener("keydown", e => {
      if (e.key !== "ArrowRight" && e.key !== "ArrowLeft") return;
      const bs = [...document.querySelectorAll("#tabs .mc-tab")], i = bs.findIndex(b => b.dataset.tab === tab);
      const n = bs[(i + (e.key === "ArrowRight" ? 1 : bs.length - 1)) % bs.length]; tab = n.dataset.tab; renderDetail(); document.querySelector('#tabs [data-tab="' + tab + '"]').focus();
    });
    const tc = document.getElementById("tCenters");
    tc.addEventListener("click", e => { const tr = e.target.closest("tr.drill"); if (tr) { sel = Number(tr.dataset.id); renderList(); document.getElementById("detail").scrollIntoView({ behavior: "smooth", block: "start" }); } });
    tc.addEventListener("keydown", e => { if ((e.key === "Enter" || e.key === " ") && e.target.closest("tr.drill")) { e.preventDefault(); e.target.closest("tr.drill").click(); } });
    document.getElementById("filters").addEventListener("submit", e => { e.preventDefault(); renderList(); });
    $("#fType").on("change", renderList);
    function about() { document.getElementById("about").innerHTML = UI.aboutBox("aboutText"); }
    document.addEventListener("langchange", () => { centers.forEach(c => { if (c.names) c.name = UI.L(c.names); }); fillFilters(); renderList(); about(); if (document.getElementById("mNew").classList.contains("open")) { fillWizard(); paintWizard(); } });
    fillFilters(); about(); sel = 0; renderList();
  });
  </script>
</body>
</html>
