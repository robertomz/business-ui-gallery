<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Route planning · Business UI Gallery</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/select2/4.0.13/css/select2.min.css">
  <link rel="stylesheet" href="../assets/css/base.css">
  <style>
    .cx-cuadros { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
    .st-chip { display: inline-flex; align-items: center; gap: 4px; font-size: 10.5px; font-weight: 800; padding: 2px 8px; border-radius: 6px; white-space: nowrap; }
    .st-chip .material-icons { font-size: 14px; }
    .st-none { color: var(--mc-bad); background: rgba(251, 113, 133, .1); } .st-part { color: var(--mc-warn); background: rgba(245, 158, 11, .1); } .st-full { color: var(--mc-good); background: rgba(45, 212, 191, .1); }
    .week { display: inline-grid; grid-template-columns: repeat(6, 26px); gap: 3px; }
    .week button { height: 26px; border-radius: 5px; border: 1px solid var(--mc-line); background: transparent; color: var(--mc-muted); font-size: 10px; font-weight: 800; cursor: pointer; padding: 0; }
    .week button.p { background: rgba(6, 182, 212, .18); color: var(--mc-cyan); border-color: transparent; }
    .week button.v { background: rgba(20, 184, 166, .22); color: var(--mc-good); border-color: transparent; }
    .week button.e { background: rgba(167, 139, 250, .2); color: #c4b5fd; border-color: transparent; }
    :root[data-theme="light"] .week button.e { color: #6d28d9; }
    .week button.pe { background: linear-gradient(135deg, rgba(6, 182, 212, .25) 50%, rgba(167, 139, 250, .25) 50%); color: var(--mc-text); border-color: transparent; }
    .legend-w { display: flex; flex-wrap: wrap; gap: 12px; font-size: 11px; color: var(--mc-muted); align-items: center; }
    .legend-w b { display: inline-grid; place-items: center; width: 22px; height: 18px; border-radius: 4px; font-size: 10px; margin-right: 4px; }
    .ed-top { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: flex-end; margin-bottom: 10px; }
    #tEdit td { white-space: nowrap; }
    #tEdit tfoot td { font-size: 11px; }
    .modal.modal-full { max-width: 1400px; }
    .btn-icon-sm { min-height: 28px; width: 30px; padding: 0; }
  </style>
</head>
<body data-page="route-planning" data-root="../">
  <main id="content">
    <div class="mc-tabs" role="tablist" id="mainTabs">
      <button type="button" class="mc-tab" role="tab" data-tab="plan" aria-selected="true"><span class="material-icons" aria-hidden="true">event_note</span> <span data-i18n="tabPlan"></span></button>
      <button type="button" class="mc-tab" role="tab" data-tab="comp" aria-selected="false"><span class="material-icons" aria-hidden="true">fact_check</span> <span data-i18n="tabComp"></span></button>
      <button type="button" class="mc-tab" role="tab" data-tab="unpl" aria-selected="false"><span class="material-icons" aria-hidden="true">report</span> <span data-i18n="tabUnpl"></span></button>
    </div>

    <!-- Programming list -->
    <div id="pPlan">
      <section class="mc-panel">
        <form class="mc-filters" id="fPlan">
          <div class="mc-field" style="max-width:150px"><label for="fMonth" data-i18n="fMonth"></label><select id="fMonth"></select></div>
          <div class="mc-field" style="max-width:110px"><label for="fYear" data-i18n="fYear"></label><select id="fYear"><option>2026</option><option>2025</option></select></div>
          <div class="mc-field"><label for="fSup" data-i18n="fSup"></label><select id="fSup"></select></div>
          <div class="mc-field"><label for="fSeller" data-i18n="seller"></label><select id="fSeller"></select></div>
          <div class="mc-field"><label for="fState" data-i18n="status"></label><select id="fState"></select></div>
          <button class="btn btn-teal" type="submit"><span class="material-icons" aria-hidden="true">search</span><span data-i18n="load"></span></button>
        </form>
      </section>
      <div class="cx-cuadros" id="kPlan"></div>
      <section class="mc-panel">
        <div class="mc-panel-title"><h3><span class="material-icons" aria-hidden="true">route</span><span data-i18n="routes"></span></h3><span class="mc-hint" data-i18n="routesHint"></span></div>
        <div class="table-wrap"><table class="grid" id="tRoutes"><thead></thead><tbody></tbody><tfoot></tfoot></table></div>
      </section>
    </div>

    <!-- Compliance -->
    <div id="pComp" hidden>
      <section class="mc-panel">
        <form class="mc-filters" id="fComp">
          <div class="mc-field" style="max-width:160px"><label for="cFrom" data-i18n="from"></label><input type="date" id="cFrom"></div>
          <div class="mc-field" style="max-width:160px"><label for="cTo" data-i18n="to"></label><input type="date" id="cTo"></div>
          <div class="mc-field"><label for="cType" data-i18n="cType"></label><select id="cType"></select></div>
          <div class="mc-field"><label for="cSup" data-i18n="fSup"></label><select id="cSup"></select></div>
          <button class="btn btn-teal" type="submit"><span class="material-icons" aria-hidden="true">search</span><span data-i18n="load"></span></button>
        </form>
      </section>
      <div class="cx-cuadros" id="kComp"></div>
      <section class="mc-panel"><div class="table-wrap"><table class="grid" id="tComp"><thead></thead><tbody></tbody><tfoot></tfoot></table></div></section>
    </div>

    <!-- Unplanned sales -->
    <div id="pUnpl" hidden>
      <section class="mc-panel">
        <form class="mc-filters" id="fUnpl">
          <div class="mc-field" style="max-width:160px"><label for="uFrom" data-i18n="from"></label><input type="date" id="uFrom"></div>
          <div class="mc-field" style="max-width:160px"><label for="uTo" data-i18n="to"></label><input type="date" id="uTo"></div>
          <div class="mc-field"><label for="uState" data-i18n="status"></label><select id="uState"></select></div>
          <div class="mc-field"><label for="uSup" data-i18n="fSup"></label><select id="uSup"></select></div>
          <div class="mc-field"><label for="uRoute" data-i18n="route"></label><select id="uRoute"></select></div>
          <button class="btn btn-teal" type="submit"><span class="material-icons" aria-hidden="true">search</span><span data-i18n="load"></span></button>
        </form>
      </section>
      <div class="cx-cuadros" id="kUnpl"></div>
      <section class="mc-panel"><div class="table-wrap"><table class="grid" id="tUnpl"><thead></thead><tbody></tbody><tfoot></tfoot></table></div></section>
    </div>
    <div id="about"></div>
  </main>

  <!-- Editor -->
  <div class="modal-backdrop" id="mEdit">
    <div class="modal modal-full" role="dialog" aria-modal="true" aria-labelledby="mEditT">
      <div class="modal-head"><h3 id="mEditT"><span class="material-icons" aria-hidden="true">edit_calendar</span><span></span></h3><span class="mc-hint" id="edInfo"></span></div>
      <div class="modal-body">
        <div class="ed-top">
          <div class="mc-tabs" role="group" id="edMode">
            <button type="button" class="mc-tab" data-mode="week" data-i18n="mWeek"></button>
            <button type="button" class="mc-tab" data-mode="detail" data-i18n="mDetail"></button>
            <button type="button" class="mc-tab" data-mode="copy" data-i18n="mCopy"></button>
          </div>
          <div class="mc-field" style="max-width:200px"><label for="edState" data-i18n="status"></label><select id="edState"></select></div>
          <div class="mc-field" style="max-width:220px"><label for="edSearch" data-i18n="search"></label><input type="search" id="edSearch" data-i18n-ph="phCust"></div>
          <div class="legend-w" id="legend"></div>
        </div>
        <div id="edWeek">
          <div class="ed-top" style="padding:10px;border:1px dashed var(--mc-line);border-radius:8px">
            <span class="mc-label" data-i18n="bulk"></span>
            <div class="mc-field w-sm"><label for="bVisits" data-i18n="visitsWeek"></label><select id="bVisits"><option>1</option><option>2</option></select></div>
            <div class="mc-field w-sm"><label for="bPre" data-i18n="preStart"></label><select id="bPre" class="wd"></select></div>
            <div class="mc-field w-sm"><label for="bSale" data-i18n="saleDay"></label><select id="bSale" class="wd"></select></div>
            <div class="mc-field w-sm"><label for="bDel" data-i18n="delivery"></label><select id="bDel" class="wd"></select></div>
            <button type="button" class="btn btn-cyan" id="bApply"><span class="material-icons" aria-hidden="true">done_all</span><span data-i18n="applyMarked"></span></button>
          </div>
          <div class="table-wrap"><table class="grid" id="tEdit"><thead></thead><tbody></tbody><tfoot></tfoot></table></div>
        </div>
        <div id="edDetail" hidden><div class="table-wrap"><table class="grid" id="tDetail"><thead></thead><tbody></tbody></table></div></div>
        <div id="edCopy" hidden>
          <p class="mc-hint" data-i18n="copyHint" style="margin-bottom:10px"></p>
          <div class="mc-filters">
            <div class="mc-field" style="max-width:180px"><label for="cpMonth" data-i18n="originMonth"></label><select id="cpMonth"></select></div>
            <div class="mc-field w-lg"><label for="cpRoutes" data-i18n="alsoRoutes"></label><select id="cpRoutes" multiple></select></div>
            <button type="button" class="btn btn-violet" id="cpGo"><span class="material-icons" aria-hidden="true">content_copy</span><span data-i18n="replicate"></span></button>
          </div>
          <p class="mc-hint" id="cpPreview" style="margin-top:10px"></p>
        </div>
      </div>
      <div class="modal-foot">
        <button type="button" class="btn btn-teal" id="edSave"><span class="material-icons" aria-hidden="true">save</span><span data-i18n="save"></span></button>
        <button type="button" class="btn" data-close="mEdit"><span class="material-icons" aria-hidden="true">close</span><span data-i18n="close"></span></button>
      </div>
    </div>
  </div>

  <div class="modal-backdrop" id="mAuth">
    <div class="modal modal-sm" role="dialog" aria-modal="true" aria-labelledby="mAuthT">
      <div class="modal-head"><h3 id="mAuthT"><span class="material-icons" aria-hidden="true">verified</span><span data-i18n="authTitle"></span></h3></div>
      <div class="modal-body"><p id="authTxt" style="margin-bottom:10px"></p>
        <div class="mc-field"><label for="authReason" data-i18n="reason"></label><textarea id="authReason"></textarea><span class="mc-field-error" id="authErr"></span></div></div>
      <div class="modal-foot">
        <button type="button" class="btn btn-teal" id="authOk"><span class="material-icons" aria-hidden="true">check</span><span data-i18n="approve"></span></button>
        <button type="button" class="btn" data-close="mAuth"><span class="material-icons" aria-hidden="true">close</span><span data-i18n="close"></span></button>
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/select2/4.0.13/js/select2.min.js"></script>
  <script src="../assets/js/common.js"></script>
  <script>
  UI.strings({
    en: {
      tabPlan: "Programming", tabComp: "Complete visits", tabUnpl: "Unplanned sales", fMonth: "Month", fYear: "Year", fSup: "Supervisor", route: "Route", routes: "Routes of the month", routesHint: "Edit a route to plan its customers",
      sNone: "Not programmed", sPart: "Partial", sFull: "Complete", kRoutes: "Routes", kCust: "Customers", kProg: "Programmed", kPct: "% programmed", kVisits: "Visits in the month", kGoal: "Volume goal",
      colRoute: "Route", colSeller: "Seller", colSup: "Supervisor", colCust: "Customers", colProg: "Programmed", colState: "Status", colActions: "Actions", colVisits: "Visits / month", edit: "Edit", del: "Delete",
      edTitle: "Programming of route {r} · {m}", edInfo: "{s} · {n} customers", mWeek: "Weekly", mDetail: "Detailed", mCopy: "Replicate month", phCust: "Code or customer…",
      bulk: "For the marked customers", visitsWeek: "Visits per week", preStart: "Pre-sale", saleDay: "Sale", delivery: "Delivery", applyMarked: "Apply to marked",
      colMark: "Mark", colCode: "Code", colGoal: "Volume goal", colWeek: "Week (Mon–Sat)", colForm: "Form", fWeekly: "Weekly", fDetail: "Detailed", fNone: "—",
      lP: "Pre-sale", lV: "Sale", lE: "Delivery", lPE: "Pre-sale and delivery", cycleHint: "Click a day to cycle: none → pre-sale → sale → delivery → pre-sale and delivery",
      colVisit: "Visit", colDate: "Sale date", colPct: "Percentage", colDateGoal: "Goal of the date", copyHint: "Copies the programming of another month to this one, keeping each customer's weekdays. Customers already programmed are replaced.",
      originMonth: "Origin month", alsoRoutes: "Also apply to routes", replicate: "Replicate", cpPreview: "{n} customers will be programmed in {r} route(s); {x} already programmed will be replaced.",
      saved: "Programming of route {r} saved: {p} of {n} customers.", replicated: "Programming replicated from {m}.", confirmDel: "Programming of route {r} deleted.",
      cType: "Programming type", tPre: "Pre-sale", tSale: "Sale", tDel: "Delivery", colDay: "Date", colPlanned: "Planned", colVisited: "Visited", colWithSale: "With sale", colEff: "Effectiveness", kPlanned: "Planned visits", kVisited: "Visited", kSold: "With sale", kEff: "Effectiveness",
      uPend: "Pending", uAuth: "Authorized", colInv: "Invoice", colCode2: "Code", colCost: "Cost", colSale: "Sale", colProfit: "Profit", colMargin: "Margin %", colBy: "Authorized by", colAuth: "Authorize",
      kUnpl: "Unplanned sales", kUnplSale: "Sale", kUnplPend: "Pending", authTitle: "Authorize unplanned sale", authTxt: "Invoice {i} to {c} was not planned for {d} on route {r}.", authNeed: "Write the reason.", authDone: "Sale {i} authorized.",
      aboutText: "Each route is planned per month: for every customer you choose the days of <b>pre-sale</b>, <b>sale</b> and <b>delivery</b>, in the weekly mode (same days every week) or the detailed mode (a date and a percentage of the monthly goal per visit). A route is <b>complete</b> when every customer has a plan, <b>partial</b> when only some do. <b>Replicate month</b> copies another month's plan to this one and optionally to other routes, showing first how many customers will be replaced. <b>Complete visits</b> compares planned, visited and with-sale per day. <b>Unplanned sales</b> are invoices to customers that were not planned that day; a supervisor authorizes them with a reason. All the data on this page is generated."
    },
    es: {
      tabPlan: "Programación", tabComp: "Visitas completas", tabUnpl: "Ventas no programadas", fMonth: "Mes", fYear: "Año", fSup: "Supervisor", route: "Ruta", routes: "Rutas del mes", routesHint: "Edite una ruta para programar sus clientes",
      sNone: "Sin programar", sPart: "Parcial", sFull: "Completa", kRoutes: "Rutas", kCust: "Clientes", kProg: "Programados", kPct: "% programado", kVisits: "Visitas del mes", kGoal: "Meta de volumen",
      colRoute: "Ruta", colSeller: "Vendedor", colSup: "Supervisor", colCust: "Clientes", colProg: "Programados", colState: "Estado", colActions: "Acciones", colVisits: "Visitas / mes", edit: "Editar", del: "Eliminar",
      edTitle: "Programación de la ruta {r} · {m}", edInfo: "{s} · {n} clientes", mWeek: "Semanal", mDetail: "Detallada", mCopy: "Replicar mes", phCust: "Código o cliente…",
      bulk: "Para los clientes marcados", visitsWeek: "Visitas por semana", preStart: "Preventa", saleDay: "Venta", delivery: "Entrega", applyMarked: "Aplicar a marcados",
      colMark: "Marcar", colCode: "Código", colGoal: "Meta volumen", colWeek: "Semana (lun–sáb)", colForm: "Forma", fWeekly: "Semanal", fDetail: "Detallada", fNone: "—",
      lP: "Preventa", lV: "Venta", lE: "Entrega", lPE: "Preventa y entrega", cycleHint: "Pulse un día para cambiar: nada → preventa → venta → entrega → preventa y entrega",
      colVisit: "Visita", colDate: "Fecha de venta", colPct: "Porcentaje", colDateGoal: "Meta de la fecha", copyHint: "Copia la programación de otro mes a este, respetando los días de cada cliente. Los clientes ya programados se reemplazan.",
      originMonth: "Mes de origen", alsoRoutes: "Aplicar también a rutas", replicate: "Replicar", cpPreview: "Se programarán {n} clientes en {r} ruta(s); se reemplazan {x} que ya estaban programados.",
      saved: "Programación de la ruta {r} guardada: {p} de {n} clientes.", replicated: "Programación replicada desde {m}.", confirmDel: "Se eliminó la programación de la ruta {r}.",
      cType: "Tipo de programación", tPre: "Preventa", tSale: "Venta", tDel: "Entrega", colDay: "Fecha", colPlanned: "Programadas", colVisited: "Visitadas", colWithSale: "Con venta", colEff: "Efectividad", kPlanned: "Visitas programadas", kVisited: "Visitadas", kSold: "Con venta", kEff: "Efectividad",
      uPend: "Pendientes", uAuth: "Autorizadas", colInv: "Factura", colCode2: "Código", colCost: "Costo", colSale: "Venta", colProfit: "Utilidad", colMargin: "Margen %", colBy: "Autorizó", colAuth: "Autorizar",
      kUnpl: "Ventas no programadas", kUnplSale: "Venta", kUnplPend: "Pendientes", authTitle: "Autorizar venta no programada", authTxt: "La factura {i} a {c} no estaba programada para el {d} en la ruta {r}.", authNeed: "Escriba el motivo.", authDone: "Venta {i} autorizada.",
      aboutText: "Cada ruta se programa por mes: para cada cliente se eligen los días de <b>preventa</b>, <b>venta</b> y <b>entrega</b>, en modo semanal (los mismos días cada semana) o detallado (una fecha y un porcentaje de la meta del mes por visita). Una ruta queda <b>completa</b> cuando todos sus clientes tienen programación y <b>parcial</b> cuando solo algunos. <b>Replicar mes</b> copia la programación de otro mes a este y, si se quiere, a otras rutas, mostrando antes cuántos clientes se reemplazan. <b>Visitas completas</b> compara programadas, visitadas y con venta por día. Las <b>ventas no programadas</b> son facturas a clientes que no tocaban ese día; un supervisor las autoriza con un motivo. Todos los datos de esta página son generados."
    }
  });

  $(function () {
    const D = UI.DATA, t = UI.t, M = UI.fmtMoney, mi = UI.mi;
    const SUPS = ["R. Castillo", "M. Paredes", "L. Fuentes", "S. Navarro"];
    const WD = { en: ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat"], es: ["Lun", "Mar", "Mié", "Jue", "Vie", "Sáb"] };
    const CYCLE = ["", "p", "v", "e", "pe"];
    const STREETS = ["Corner", "Market", "Store", "Mini Mart", "Pantry", "Deli", "Shop", "Grocery"];
    const PRE = ["Blue", "Green", "Sunny", "Golden", "River", "Hill", "Lake", "Oak", "Maple", "Pine", "Cedar", "Union", "Village", "Harbor", "North", "South"];
    const r0 = UI.rng(77);
    const ROUTES = Array.from({ length: 8 }, (_, k) => {
      const n = Math.round(UI.between(r0, 16, 28));
      const cust = Array.from({ length: n }, (_, j) => ({ code: "C" + String(1000 + k * 40 + j), name: UI.pick(r0, PRE) + " " + UI.pick(r0, STREETS), goal: Math.round(UI.between(r0, 2000, 18000) / 100) * 100, week: null, form: "" }));
      return { id: "R-0" + (k + 1), seller: k % D.sellers.length, sup: [0, 0, 1, 1, 2, 2, 3, 3][k], cust };
    });
    // Seed: some routes complete, some partial, some empty
    ROUTES.forEach((rt, k) => {
      const share = [1, 1, .6, 0, 1, .3, 0, .8][k];
      rt.cust.forEach((c, j) => { if (j < rt.cust.length * share) { const d = (j + k) % 5; c.week = ["", "", "", "", "", ""]; c.week[d] = "p"; c.week[d + 1] = j % 3 === 0 ? "pe" : "v"; if (j % 3 !== 0) c.week[Math.min(5, d + 1)] = "v"; c.form = "w"; } });
    });

    let curRoute = null, edMode = "week", tab = "plan";
    const stateOf = rt => { const p = rt.cust.filter(c => c.form).length; return p === 0 ? "none" : p === rt.cust.length ? "full" : "part"; };
    const stChip = s => '<span class="st-chip st-' + s + '">' + mi(s === "full" ? "check_circle" : s === "part" ? "timelapse" : "radio_button_unchecked") + t({ none: "sNone", part: "sPart", full: "sFull" }[s]) + "</span>";
    const visits = c => c.week ? c.week.filter(x => x).length * 4 : 0;

    function selects() {
      const keep = id => $("#" + id).val();
      const set = (id, items, v) => { const $x = $("#" + id); if ($x.hasClass("select2-hidden-accessible")) $x.select2("destroy"); $x.empty(); items.forEach(o => $x.append(new Option(o[1], o[0]))); $x.val(v != null ? v : items[0][0]); };
      const m = keep("fMonth");
      set("fMonth", Array.from({ length: 12 }, (_, i) => [String(i), UI.monthName(i)]), m || "10");
      set("cpMonth", Array.from({ length: 12 }, (_, i) => [String(i), UI.monthName(i)]), keep("cpMonth") || "9");
      const sups = [["all", t("all")]].concat(SUPS.map((s, i) => [String(i), s]));
      ["fSup", "cSup", "uSup"].forEach(id => set(id, sups, keep(id)));
      set("fSeller", [["all", t("all")]].concat(D.sellers.map((s, i) => [String(i), s])), keep("fSeller"));
      set("fState", [["all", t("all")], ["none", t("sNone")], ["part", t("sPart")], ["full", t("sFull")]], keep("fState"));
      set("cType", [["p", t("tPre")], ["v", t("tSale")], ["e", t("tDel")]], keep("cType"));
      set("uState", [["pend", t("uPend")], ["auth", t("uAuth")], ["all", t("all")]], keep("uState"));
      set("uRoute", [["all", t("all")]].concat(ROUTES.map(r => [r.id, r.id])), keep("uRoute"));
      set("edState", [["all", t("all")], ["prog", t("kProg")], ["none", t("sNone")]], keep("edState"));
      document.querySelectorAll("select.wd").forEach(s => { const v = s.value; s.innerHTML = WD[UI.lang].map((d, i) => '<option value="' + i + '">' + d + "</option>").join(""); s.value = v || "0"; });
      ["fSup", "fSeller", "cSup", "uSup", "uRoute"].forEach(id => $("#" + id).select2({ width: "100%" }));
      const $cp = $("#cpRoutes"); const cv = $cp.val(); if ($cp.hasClass("select2-hidden-accessible")) $cp.select2("destroy"); $cp.empty(); ROUTES.forEach(r => $cp.append(new Option(r.id, r.id))); $cp.val(cv || []).select2({ width: "100%", placeholder: "—" });
    }

    function kbox(label, value) { return '<div class="mc-kpi is-accent"><div class="k-label">' + label + '</div><div class="k-value">' + value + "</div></div>"; }

    function renderPlan() {
      const sup = $("#fSup").val(), sel = $("#fSeller").val(), st = $("#fState").val();
      const list = ROUTES.filter(r => (sup === "all" || String(r.sup) === sup) && (sel === "all" || String(r.seller) === sel) && (st === "all" || stateOf(r) === st));
      const nC = list.reduce((a, r) => a + r.cust.length, 0), nP = list.reduce((a, r) => a + r.cust.filter(c => c.form).length, 0);
      document.getElementById("kPlan").innerHTML = kbox(t("kRoutes"), list.length) + kbox(t("sFull"), list.filter(r => stateOf(r) === "full").length) + kbox(t("sPart"), list.filter(r => stateOf(r) === "part").length) +
        kbox(t("sNone"), list.filter(r => stateOf(r) === "none").length) + kbox(t("kCust"), nC) + kbox(t("kProg"), nP) + kbox(t("kPct"), UI.fmtPct(nC ? nP / nC : 0)) +
        kbox(t("kVisits"), UI.fmtInt(list.reduce((a, r) => a + r.cust.reduce((z, c) => z + visits(c), 0), 0)));
      document.querySelector("#tRoutes thead").innerHTML = "<tr><th>" + t("colRoute") + "</th><th>" + t("colSeller") + "</th><th>" + t("colSup") + '</th><th class="r">' + t("colCust") + '</th><th class="r">' + t("colProg") + '</th><th class="r">' + t("colVisits") + "</th><th>" + t("colState") + "</th><th>" + t("colActions") + "</th></tr>";
      document.querySelector("#tRoutes tbody").innerHTML = list.map(r => "<tr><td><b>" + r.id + "</b></td><td>" + D.sellers[r.seller] + "</td><td>" + SUPS[r.sup] + '</td><td class="r">' + r.cust.length + '</td><td class="r">' + r.cust.filter(c => c.form).length + '</td><td class="r">' + r.cust.reduce((z, c) => z + visits(c), 0) +
        "</td><td>" + stChip(stateOf(r)) + '</td><td><button type="button" class="btn btn-sm btn-cyan" data-edit="' + r.id + '">' + mi("edit") + t("edit") + '</button> <button type="button" class="btn btn-sm btn-icon-sm" data-del="' + r.id + '" aria-label="' + t("del") + " " + r.id + '"' + (stateOf(r) === "none" ? " disabled" : "") + ">" + mi("delete") + "</button></td></tr>").join("");
      document.querySelector("#tRoutes tfoot").innerHTML = '<tr><td colspan="3">' + t("totals") + '</td><td class="r">' + nC + '</td><td class="r">' + nP + '</td><td class="r">' + UI.fmtInt(list.reduce((a, r) => a + r.cust.reduce((z, c) => z + visits(c), 0), 0)) + '</td><td colspan="2"></td></tr>';
    }

    // ----- Editor -----
    let draft = null;
    function openEditor(id) {
      curRoute = ROUTES.find(r => r.id === id);
      draft = curRoute.cust.map(c => ({ code: c.code, name: c.name, goal: c.goal, week: c.week ? c.week.slice() : ["", "", "", "", "", ""], form: c.form, mark: false }));
      edMode = "week";
      document.getElementById("edSearch").value = "";
      renderEditor();
      UI.openModal("mEdit");
    }
    function renderEditor() {
      const m = Number($("#fMonth").val());
      document.querySelector("#mEditT span:last-child").textContent = t("edTitle", { r: curRoute.id, m: UI.monthName(m) + " " + $("#fYear").val() });
      document.getElementById("edInfo").textContent = t("edInfo", { s: D.sellers[curRoute.seller], n: draft.length });
      document.querySelectorAll("#edMode [data-mode]").forEach(b => b.setAttribute("aria-selected", String(b.dataset.mode === edMode)));
      document.getElementById("edWeek").hidden = edMode !== "week"; document.getElementById("edDetail").hidden = edMode !== "detail"; document.getElementById("edCopy").hidden = edMode !== "copy";
      document.getElementById("legend").innerHTML = '<span><b class="week-l" style="background:rgba(6,182,212,.18);color:var(--mc-cyan)">P</b>' + t("lP") + '</span><span><b style="background:rgba(20,184,166,.22);color:var(--mc-good)">V</b>' + t("lV") + '</span><span><b style="background:rgba(167,139,250,.2)">E</b>' + t("lE") + '</span><span title="' + t("cycleHint") + '">' + mi("help_outline") + "</span>";
      const q = document.getElementById("edSearch").value.trim().toLowerCase(), fs = $("#edState").val();
      const vis = draft.map((c, i) => [c, i]).filter(([c]) => (!q || (c.code + " " + c.name).toLowerCase().includes(q)) && (fs === "all" || (fs === "prog" ? c.form : !c.form)));
      if (edMode === "week") {
        document.querySelector("#tEdit thead").innerHTML = '<tr><th><input type="checkbox" id="markAll" aria-label="' + t("colMark") + '"></th><th>' + t("colCode") + "</th><th>" + t("customer") + '</th><th class="r">' + t("colGoal") + "</th><th>" + t("colWeek") + "<br><small style=\"font-weight:500\">" + WD[UI.lang].join(" · ") + '</small></th><th class="r">' + t("colVisits") + "</th><th>" + t("colForm") + "</th></tr>";
        document.querySelector("#tEdit tbody").innerHTML = vis.map(([c, i]) => '<tr><td><input type="checkbox" data-mark="' + i + '"' + (c.mark ? " checked" : "") + ' aria-label="' + t("colMark") + " " + c.name + '"></td><td>' + c.code + "</td><td>" + c.name + '</td><td class="r">' + M(c.goal) + '</td><td><div class="week">' +
          c.week.map((w, d) => '<button type="button" class="' + w + '" data-c="' + i + '" data-d="' + d + '" aria-label="' + c.name + " " + WD[UI.lang][d] + ": " + (w ? t({ p: "lP", v: "lV", e: "lE", pe: "lPE" }[w]) : "—") + '" title="' + t("cycleHint") + '">' + (w ? w.toUpperCase().replace("V", "V") : "") + "</button>").join("") +
          '</div></td><td class="r">' + c.week.filter(x => x).length * 4 + "</td><td>" + (c.form ? stChip("full").replace(t("sFull"), c.form === "d" ? t("fDetail") : t("fWeekly")) : stChip("none")) + "</td></tr>").join("");
        const p = draft.filter(c => c.form).length;
        document.querySelector("#tEdit tfoot").innerHTML = '<tr><td colspan="3">' + t("kProg") + ": " + p + " / " + draft.length + '</td><td class="r">' + M(draft.reduce((a, c) => a + c.goal, 0)) + "</td><td>" + WD[UI.lang].map((d, k) => d + " " + draft.filter(c => c.week[k]).length).join(" · ") + '</td><td class="r">' + draft.reduce((a, c) => a + c.week.filter(x => x).length * 4, 0) + "</td><td></td></tr>";
      } else if (edMode === "detail") {
        const y = Number($("#fYear").val()), m = Number($("#fMonth").val());
        const rows = [];
        vis.filter(([c]) => c.form).slice(0, 40).forEach(([c]) => {
          let n = 0; const dates = [];
          for (let d = 1; d <= new Date(Date.UTC(y, m + 1, 0)).getUTCDate(); d++) { const dt = new Date(Date.UTC(y, m, d)); const wd = dt.getUTCDay() - 1; if (wd >= 0 && wd < 6 && /v|pe/.test(c.week[wd])) dates.push(dt); }
          dates.forEach(dt => { n++; rows.push("<tr><td>" + c.code + "</td><td>" + c.name + '</td><td class="r">' + n + "</td><td>" + UI.fmtDay(dt) + "</td><td>" + WD[UI.lang][dt.getUTCDay() - 1] + '</td><td class="r">' + UI.fmtPct(1 / dates.length) + '</td><td class="r">' + M(c.goal / dates.length) + "</td></tr>"); });
        });
        document.querySelector("#tDetail thead").innerHTML = "<tr><th>" + t("colCode") + "</th><th>" + t("customer") + '</th><th class="r">' + t("colVisit") + "</th><th>" + t("colDate") + "</th><th>" + t("colDay") + '</th><th class="r">' + t("colPct") + '</th><th class="r">' + t("colDateGoal") + "</th></tr>";
        document.querySelector("#tDetail tbody").innerHTML = rows.join("") || '<tr><td colspan="7" class="muted">' + t("noData") + "</td></tr>";
      } else cpPreview();
    }
    function cpPreview() {
      const extra = ($("#cpRoutes").val() || []).filter(id => id !== curRoute.id);
      const targets = [curRoute].concat(ROUTES.filter(r => extra.includes(r.id)));
      const n = targets.reduce((a, r) => a + r.cust.length, 0), x = targets.reduce((a, r) => a + (r === curRoute ? draft.filter(c => c.form).length : r.cust.filter(c => c.form).length), 0);
      document.getElementById("cpPreview").textContent = t("cpPreview", { n, r: targets.length, x });
    }

    $("#mEdit").on("click", "[data-c]", function () {
      const c = draft[Number(this.dataset.c)], d = Number(this.dataset.d);
      c.week[d] = CYCLE[(CYCLE.indexOf(c.week[d]) + 1) % CYCLE.length];
      c.form = c.week.some(x => x) ? "w" : "";
      renderEditor();
      const b = document.querySelector('#tEdit [data-c="' + this.dataset.c + '"][data-d="' + d + '"]'); if (b) b.focus();
    });
    $("#mEdit").on("change", "[data-mark]", function () { draft[Number(this.dataset.mark)].mark = this.checked; });
    $("#mEdit").on("change", "#markAll", function () { document.querySelectorAll("#tEdit [data-mark]").forEach(cb => { cb.checked = this.checked; draft[Number(cb.dataset.mark)].mark = this.checked; }); });
    document.getElementById("bApply").addEventListener("click", () => {
      const v = Number(document.getElementById("bVisits").value), p = Number(document.getElementById("bPre").value), s = Number(document.getElementById("bSale").value), e = Number(document.getElementById("bDel").value);
      draft.filter(c => c.mark).forEach(c => {
        c.week = ["", "", "", "", "", ""];
        const set = (d, k) => { c.week[d] = c.week[d] && c.week[d] !== k ? (c.week[d] === "p" && k === "e" ? "pe" : c.week[d]) : k; };
        set(p, "p"); set(s, "v"); set(e, "e");
        if (v === 2) { set((p + 3) % 6, "p"); set((s + 3) % 6, "v"); set((e + 3) % 6, "e"); }
        c.form = "w";
      });
      renderEditor();
    });
    document.getElementById("edMode").addEventListener("click", e => { const b = e.target.closest("[data-mode]"); if (b) { edMode = b.dataset.mode; renderEditor(); } });
    document.getElementById("edSearch").addEventListener("input", renderEditor);
    $("#edState").on("change", renderEditor);
    $("#cpRoutes").on("change", cpPreview);
    document.getElementById("cpGo").addEventListener("click", () => {
      const extra = ($("#cpRoutes").val() || []).filter(id => id !== curRoute.id);
      const r = UI.rng(Number($("#cpMonth").val()) * 9 + 1);
      const fillR = list => list.forEach(c => { const d = Math.floor(r() * 5); c.week = ["", "", "", "", "", ""]; c.week[d] = "p"; c.week[d + 1] = "v"; c.form = "w"; });
      fillR(draft);
      ROUTES.filter(x => extra.includes(x.id)).forEach(x => fillR(x.cust));
      edMode = "week"; renderEditor(); renderPlan();
      UI.toast(t("replicated", { m: UI.monthName(Number($("#cpMonth").val())) }));
    });
    document.getElementById("edSave").addEventListener("click", () => {
      draft.forEach((d, i) => { const c = curRoute.cust[i]; c.week = d.form ? d.week.slice() : null; c.form = d.form; });
      UI.closeModal("mEdit"); renderPlan();
      UI.toast(t("saved", { r: curRoute.id, p: curRoute.cust.filter(c => c.form).length, n: curRoute.cust.length }));
    });
    document.getElementById("tRoutes").addEventListener("click", e => {
      const ed = e.target.closest("[data-edit]"); if (ed) { openEditor(ed.dataset.edit); return; }
      const dl = e.target.closest("[data-del]"); if (dl) { const rt = ROUTES.find(r => r.id === dl.dataset.del); rt.cust.forEach(c => { c.week = null; c.form = ""; }); renderPlan(); UI.toast(t("confirmDel", { r: rt.id })); }
    });
    document.querySelectorAll("[data-close]").forEach(b => b.addEventListener("click", () => UI.closeModal(b.dataset.close)));

    // ----- Compliance -----
    function renderComp() {
      const a = new Date(document.getElementById("cFrom").value + "T00:00:00Z"), b = new Date(document.getElementById("cTo").value + "T00:00:00Z");
      const ty = $("#cType").val(), sup = $("#cSup").val();
      const routes = ROUTES.filter(r => sup === "all" || String(r.sup) === sup);
      const rows = [];
      for (let d = a; d <= b; d = new Date(d.getTime() + 86400000)) {
        const wd = d.getUTCDay() - 1; if (wd < 0) continue;
        const rr = UI.rng(d.getTime() / 86400000 + ty.length);
        let planned = 0;
        routes.forEach(r => r.cust.forEach(c => { if (c.week && c.week[wd] && c.week[wd].includes(ty === "v" ? "v" : ty)) planned++; }));
        const visited = Math.round(planned * UI.between(rr, .82, .99)), sold = Math.round(visited * UI.between(rr, .6, .88));
        rows.push({ d, planned, visited, sold });
      }
      const s = k => rows.reduce((z, x) => z + x[k], 0);
      document.getElementById("kComp").innerHTML = kbox(t("kPlanned"), UI.fmtInt(s("planned"))) + kbox(t("kVisited"), UI.fmtInt(s("visited"))) + kbox(t("kSold"), UI.fmtInt(s("sold"))) + kbox(t("kEff"), UI.fmtPct(s("planned") ? s("sold") / s("planned") : 0));
      document.querySelector("#tComp thead").innerHTML = "<tr><th>" + t("colDay") + '</th><th class="r">' + t("colPlanned") + '</th><th class="r">' + t("colVisited") + '</th><th class="r">' + t("colWithSale") + '</th><th class="r">' + t("colEff") + "</th></tr>";
      document.querySelector("#tComp tbody").innerHTML = rows.map(x => { const ef = x.planned ? x.sold / x.planned : 0; return "<tr><td>" + UI.fmtDay(x.d) + " · " + WD[UI.lang][x.d.getUTCDay() - 1] + '</td><td class="r">' + x.planned + '</td><td class="r">' + x.visited + '</td><td class="r">' + x.sold + '</td><td class="r ' + (ef < .6 ? "neg" : "pos") + '">' + UI.fmtPct(ef) + "</td></tr>"; }).join("");
      document.querySelector("#tComp tfoot").innerHTML = "<tr><td>" + t("totals") + '</td><td class="r">' + s("planned") + '</td><td class="r">' + s("visited") + '</td><td class="r">' + s("sold") + '</td><td class="r">' + UI.fmtPct(s("planned") ? s("sold") / s("planned") : 0) + "</td></tr>";
    }

    // ----- Unplanned sales -----
    const ru = UI.rng(404);
    const UNPL = Array.from({ length: 46 }, (_, i) => { const rt = UI.pick(ru, ROUTES), c = UI.pick(ru, rt.cust); const sale = UI.between(ru, 800, 9000), cost = sale * UI.between(ru, .8, .93);
      return { d: new Date(Date.UTC(2026, 10, 1 + Math.floor(ru() * 16))), inv: "FA-" + (52000 + i * 7), rt, c, sale, cost, auth: ru() < .4 ? UI.pick(ru, SUPS) : "" }; }).filter(x => x.d.getUTCDay() !== 0);
    let authRow = null;
    function renderUnpl() {
      const a = new Date(document.getElementById("uFrom").value + "T00:00:00Z"), b = new Date(document.getElementById("uTo").value + "T00:00:00Z");
      const st = $("#uState").val(), sup = $("#uSup").val(), ro = $("#uRoute").val();
      const list = UNPL.filter(x => x.d >= a && x.d <= b && (st === "all" || (st === "pend" ? !x.auth : x.auth)) && (sup === "all" || String(x.rt.sup) === sup) && (ro === "all" || x.rt.id === ro)).sort((p, q) => q.d - p.d);
      const s = k => list.reduce((z, x) => z + x[k], 0);
      document.getElementById("kUnpl").innerHTML = kbox(t("kUnpl"), list.length) + kbox(t("kUnplSale"), M(s("sale"))) + kbox(t("colProfit"), M(s("sale") - s("cost"))) + kbox(t("kUnplPend"), list.filter(x => !x.auth).length);
      document.querySelector("#tUnpl thead").innerHTML = "<tr><th>" + t("date") + "</th><th>" + t("colInv") + "</th><th>" + t("colSup") + "</th><th>" + t("colSeller") + "</th><th>" + t("route") + "</th><th>" + t("colCode2") + "</th><th>" + t("customer") + '</th><th class="r">' + t("colCost") + '</th><th class="r">' + t("colSale") + '</th><th class="r">' + t("colProfit") + '</th><th class="r">' + t("colMargin") + "</th><th>" + t("status") + "</th><th>" + t("colBy") + "</th><th>" + t("colAuth") + "</th></tr>";
      document.querySelector("#tUnpl tbody").innerHTML = list.map(x => "<tr><td>" + UI.fmtDay(x.d) + "</td><td>" + x.inv + "</td><td>" + SUPS[x.rt.sup] + "</td><td>" + D.sellers[x.rt.seller] + "</td><td>" + x.rt.id + "</td><td>" + x.c.code + "</td><td>" + x.c.name + '</td><td class="r">' + M(x.cost) + '</td><td class="r">' + M(x.sale) + '</td><td class="r">' + M(x.sale - x.cost) + '</td><td class="r">' + UI.fmtPct((x.sale - x.cost) / x.sale, 2) + "</td><td>" +
        (x.auth ? '<span class="chip chip-pos">' + mi("verified") + t("uAuth").replace(/s$/, "") + "</span>" : '<span class="chip chip-warn">' + mi("schedule") + t("pending") + "</span>") + "</td><td>" + (x.auth || "—") + "</td><td>" + (x.auth ? "" : '<button type="button" class="btn btn-sm btn-teal" data-auth="' + x.inv + '">' + mi("check") + t("colAuth") + "</button>") + "</td></tr>").join("") ||
        '<tr><td colspan="14" class="muted">' + t("noData") + "</td></tr>";
      document.querySelector("#tUnpl tfoot").innerHTML = '<tr><td colspan="7">' + t("totals") + '</td><td class="r">' + M(s("cost")) + '</td><td class="r">' + M(s("sale")) + '</td><td class="r">' + M(s("sale") - s("cost")) + '</td><td class="r">' + UI.fmtPct(s("sale") ? (s("sale") - s("cost")) / s("sale") : 0, 2) + '</td><td colspan="3"></td></tr>';
    }
    document.getElementById("tUnpl").addEventListener("click", e => {
      const b = e.target.closest("[data-auth]"); if (!b) return;
      authRow = UNPL.find(x => x.inv === b.dataset.auth);
      document.getElementById("authTxt").textContent = t("authTxt", { i: authRow.inv, c: authRow.c.name, d: UI.fmtDay(authRow.d), r: authRow.rt.id });
      document.getElementById("authReason").value = ""; document.getElementById("authErr").textContent = ""; document.getElementById("authReason").removeAttribute("aria-invalid");
      UI.openModal("mAuth");
    });
    document.getElementById("authOk").addEventListener("click", () => {
      const v = document.getElementById("authReason").value.trim();
      if (!v) { document.getElementById("authErr").textContent = t("authNeed"); document.getElementById("authReason").setAttribute("aria-invalid", "true"); document.getElementById("authReason").focus(); return; }
      authRow.auth = SUPS[authRow.rt.sup]; UI.closeModal("mAuth"); renderUnpl(); UI.toast(t("authDone", { i: authRow.inv }));
    });

    // Tabs
    function showTab(x) {
      tab = x;
      document.querySelectorAll("#mainTabs [data-tab]").forEach(b => b.setAttribute("aria-selected", String(b.dataset.tab === x)));
      document.getElementById("pPlan").hidden = x !== "plan"; document.getElementById("pComp").hidden = x !== "comp"; document.getElementById("pUnpl").hidden = x !== "unpl";
      if (x === "plan") renderPlan(); else if (x === "comp") renderComp(); else renderUnpl();
    }
    document.getElementById("mainTabs").addEventListener("click", e => { const b = e.target.closest("[data-tab]"); if (b) showTab(b.dataset.tab); });
    document.getElementById("fPlan").addEventListener("submit", e => { e.preventDefault(); renderPlan(); });
    document.getElementById("fComp").addEventListener("submit", e => { e.preventDefault(); renderComp(); });
    document.getElementById("fUnpl").addEventListener("submit", e => { e.preventDefault(); renderUnpl(); });
    ["cFrom", "uFrom"].forEach(id => { document.getElementById(id).value = "2026-11-01"; });
    ["cTo", "uTo"].forEach(id => { document.getElementById(id).value = "2026-11-16"; });

    document.addEventListener("langchange", () => { selects(); showTab(tab); if (document.getElementById("mEdit").classList.contains("open")) renderEditor(); document.getElementById("about").innerHTML = UI.aboutBox("aboutText", "aboutScreen"); });
    selects();
    document.getElementById("about").innerHTML = UI.aboutBox("aboutText", "aboutScreen");
    showTab("plan");
  });
  </script>
</body>
</html>
