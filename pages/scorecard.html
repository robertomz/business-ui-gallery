<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Balanced scorecard · Business UI Gallery</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,300..500,0..1,0&display=block" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/select2/4.0.13/css/select2.min.css">
  <link rel="stylesheet" href="../assets/css/base.css">
  <style>
    tr.drill { cursor: pointer; } tr.drill.is-sel td { background: var(--bg-selected); }
    .w-in { width: 80px; min-height: 34px; padding: 4px 10px; border: 1px solid var(--border); border-radius: 10px; background: var(--bg-input); color: var(--text); text-align: right; font-size: 12.5px; }
    .w-in:focus { outline: none; border-color: var(--focus); box-shadow: 0 0 0 3px color-mix(in srgb, var(--brand) 20%, transparent); }
    .w-in:disabled { opacity: .6; }
    .mid { color: var(--warning); }
    .bsc-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
    .bsc-head h3 { font-size: 16px; font-weight: 600; }
    .persp { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
    .chart-box { position: relative; height: 300px; }
    .months { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px; }
    @media (max-width: 900px) { .persp { grid-template-columns: repeat(2, minmax(0, 1fr)); } .months { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
  </style>
</head>
<body data-page="scorecard" data-root="../">
  <main id="content">
    <section class="mc-panel">
      <div class="mc-panel-title"><h3><span class="material-icons" aria-hidden="true">speed</span><span data-i18n="listTitle"></span></h3></div>
      <div class="table-wrap"><table class="grid" id="tBsc"><thead></thead><tbody></tbody></table></div>
    </section>

    <section class="mc-panel">
      <div class="bsc-head">
        <div><h3 id="bName"></h3><p class="mc-hint" id="bSub"></p></div>
        <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center" id="bActions"></div>
      </div>
      <div class="mc-tabs" role="tablist" id="tabs"></div>
      <div id="panel" style="margin-top:10px"></div>
    </section>

    <div id="about"></div>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/select2/4.0.13/js/select2.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="../assets/js/common.js"></script>
  <script>
  UI.strings({
    en: {
      listTitle: "Balanced scorecards", colName: "Name", colPeriod: "Period", colOwner: "Main responsible", colKpis: "KPIs", colStatus: "Status", colScore: "Score",
      sDraft: "Draft", sApproved: "Approved", sClosed: "Closed", approveBtn: "Approve", closeBtn: "Close period", reopen: "Back to draft",
      tabKpis: "KPIs and weights", tabGoal: "Cumulative goal distribution", tabDash: "Dashboard",
      pFin: "Financial", pCus: "Customer", pPro: "Internal process", pPeo: "People and learning",
      colKpi: "KPI / Name", colType: "Type", colWeight: "Weight %", colTarget: "Annual goal", colGoalTd: "Goal to date", colActual: "Actual to date", colResult: "Result", colWeighted: "Weighted score",
      tUp: "Higher is better", tDown: "Lower is better",
      wOk: "Weights add up to 100%.", wMissing: "Weights add up to {s}%: add {d} points.", wExtra: "Weights add up to {s}%: remove {d} points.",
      lockedNote: "The scorecard is approved: weights and goals are locked.", closedNote: "The period is closed: results are final.",
      cantApprove: "Fix the weights before approving.", approvedMsg: "Scorecard approved.", closedMsg: "Period closed.", draftMsg: "Scorecard back to draft.",
      goalKpi: "KPI", goalHint: "Cumulative % of the annual goal that must be reached by the end of each month. December must be 100%.", goalOk: "The distribution ends at 100%.", goalErr: "December must be 100% and each month at least the previous one.",
      saveGoals: "Save distribution", savedGoals: "Distribution saved.", byPersp: "Score by perspective", radar: "Result by perspective",
      sub: "Period {p} · Responsible {r}",
      aboutText: "Mirrors the balanced scorecard module: each scorecard groups <b>objectives</b> in four <b>perspectives</b> and measures them with <b>KPIs</b>. Every KPI has a type (higher or lower is better), a <b>weight</b> (weights must add up to 100% before approving) and an annual goal split by month as a <b>cumulative distribution</b> (December = 100%). The result compares the actual to date with the goal to date (capped at 120%, inverted for lower-is-better KPIs), and the weighted score adds up to the scorecard score. States go <b>Draft → Approved → Closed</b>: approving locks weights and goals, closing makes results final. All data is generated."
    },
    es: {
      listTitle: "Gestión de BSC", colName: "Nombre", colPeriod: "Período", colOwner: "Responsable principal", colKpis: "KPIs", colStatus: "Estado", colScore: "Puntaje",
      sDraft: "Borrador", sApproved: "Aprobado", sClosed: "Cerrado", approveBtn: "Aprobar", closeBtn: "Cerrar período", reopen: "Volver a borrador",
      tabKpis: "KPIs y pesos", tabGoal: "Distribución de meta acumulativa", tabDash: "Dashboard",
      pFin: "Financiera", pCus: "Cliente", pPro: "Procesos internos", pPeo: "Personas y aprendizaje",
      colKpi: "KPI / Nombre", colType: "Tipo", colWeight: "Peso %", colTarget: "Meta anual", colGoalTd: "Meta a la fecha", colActual: "Real a la fecha", colResult: "Resultado", colWeighted: "Puntaje ponderado",
      tUp: "Mayor es mejor", tDown: "Menor es mejor",
      wOk: "Los pesos suman 100%.", wMissing: "Los pesos suman {s}%: faltan {d} puntos.", wExtra: "Los pesos suman {s}%: sobran {d} puntos.",
      lockedNote: "El BSC está aprobado: pesos y metas quedan bloqueados.", closedNote: "El período está cerrado: los resultados son finales.",
      cantApprove: "Corrija los pesos antes de aprobar.", approvedMsg: "BSC aprobado.", closedMsg: "Período cerrado.", draftMsg: "El BSC volvió a borrador.",
      goalKpi: "KPI", goalHint: "% acumulado de la meta anual que se debe alcanzar al final de cada mes. Diciembre debe ser 100%.", goalOk: "La distribución termina en 100%.", goalErr: "Diciembre debe ser 100% y cada mes al menos igual al anterior.",
      saveGoals: "Guardar distribución", savedGoals: "Distribución guardada.", byPersp: "Puntaje por perspectiva", radar: "Resultado por perspectiva",
      sub: "Período {p} · Responsable {r}",
      aboutText: "Replica el módulo de Balanced Scorecard: cada BSC agrupa <b>objetivos</b> en cuatro <b>perspectivas</b> y los mide con <b>KPIs</b>. Cada KPI tiene un tipo (mayor o menor es mejor), un <b>peso</b> (los pesos deben sumar 100% para aprobar) y una meta anual repartida por mes como <b>distribución acumulativa</b> (diciembre = 100%). El resultado compara el real a la fecha con la meta a la fecha (con tope de 120%, invertido en los KPIs donde menor es mejor), y el puntaje ponderado suma el puntaje del BSC. Los estados van <b>Borrador → Aprobado → Cerrado</b>: aprobar bloquea pesos y metas, cerrar deja los resultados finales. Todos los datos son generados."
    }
  });

  $(function () {
    const t = UI.t, M = UI.fmtMoney, mi = UI.mi;
    const PERSP = ["pFin", "pCus", "pPro", "pPeo"];
    const KPIS = [
      ["pFin", { en: "Net sales", es: "Venta neta" }, "up", 48000000, "m"], ["pFin", { en: "Gross margin %", es: "Margen bruto %" }, "up", .24, "p"], ["pFin", { en: "Operating expenses", es: "Gastos de operación" }, "down", 7200000, "m"],
      ["pCus", { en: "Active customers", es: "Clientes activos" }, "up", 1450, "n"], ["pCus", { en: "Order fill rate", es: "Fill rate de pedidos" }, "up", .95, "p"], ["pCus", { en: "Overdue % of receivables", es: "% de cartera en mora" }, "down", .12, "p"],
      ["pPro", { en: "Days of inventory", es: "Días de inventario" }, "down", 32, "n"], ["pPro", { en: "On-time deliveries", es: "Entregas a tiempo" }, "up", .93, "p"], ["pPro", { en: "Route compliance", es: "Cumplimiento de rutas" }, "up", .9, "p"],
      ["pPeo", { en: "Training hours", es: "Horas de capacitación" }, "up", 1200, "n"], ["pPeo", { en: "Staff turnover", es: "Rotación de personal" }, "down", .08, "p"]
    ];
    const MONTH = 10; // November
    const defaultDist = Array.from({ length: 12 }, (_, i) => Math.round((i + 1) / 12 * 1000) / 10);
    function build(seed, name, owner, status) {
      const r = UI.rng(seed);
      const weights = [14, 8, 8, 10, 10, 8, 9, 9, 8, 8, 8];
      return { name, owner, status, period: "2026", kpis: KPIS.map((k, i) => {
        const goalTd = k[4] === "p" ? k[3] : k[3] * defaultDist[MONTH] / 100;
        const act = goalTd * (k[2] === "up" ? UI.between(r, .78, 1.12) : UI.between(r, .85, 1.25));
        return { p: k[0], name: k[1], type: k[2], target: k[3], fmt: k[4], weight: weights[i] + (seed % 3 === 0 && i === 0 ? 3 : 0), act, dist: defaultDist.slice() };
      }) };
    }
    const BSC = [build(11, { en: "Company scorecard 2026", es: "BSC empresa 2026" }, "D. Medina", "approved"), build(12, { en: "Sales area 2026", es: "Área de ventas 2026" }, "A. Torres", "draft"), build(13, { en: "Operations area 2025", es: "Área de operaciones 2025" }, "C. Ramos", "closed")];
    BSC[2].period = "2025";
    let sel = 0, tab = "kpis", goalIdx = 0, chart;

    const fmtV = (k, v) => k.fmt === "m" ? M(v) : k.fmt === "p" ? UI.fmtPct(v) : UI.fmtInt(v);
    const goalTd = k => k.fmt === "p" ? k.target : k.target * k.dist[MONTH] / 100;
    const result = k => { const g = goalTd(k); const res = k.type === "up" ? k.act / g : g / k.act; return Math.min(1.2, Math.max(0, res)); };
    const wsum = b => b.kpis.reduce((a, k) => a + Number(k.weight || 0), 0);
    const score = b => b.kpis.reduce((a, k) => a + result(k) * k.weight / 100, 0);
    const chipSt = s => s === "draft" ? '<span class="chip chip-warn">' + mi("edit") + t("sDraft") + "</span>" : s === "approved" ? '<span class="chip chip-pos">' + mi("verified") + t("sApproved") + "</span>" : '<span class="chip chip-info">' + mi("lock") + t("sClosed") + "</span>";
    const resChip = v => '<span class="' + (v >= 1 ? "pos" : v >= .9 ? "mid" : "neg") + '">' + (v >= 1 ? "▲ " : v >= .9 ? "■ " : "▼ ") + UI.fmtPct(v) + "</span>";

    function renderList() {
      document.querySelector("#tBsc thead").innerHTML = "<tr><th>" + t("colName") + "</th><th>" + t("colPeriod") + "</th><th>" + t("colOwner") + '</th><th class="r">' + t("colKpis") + "</th><th>" + t("colStatus") + '</th><th class="r">' + t("colScore") + "</th></tr>";
      document.querySelector("#tBsc tbody").innerHTML = BSC.map((b, i) => '<tr class="drill' + (i === sel ? " is-sel" : "") + '" tabindex="0" data-i="' + i + '"><td><b>' + UI.L(b.name) + "</b></td><td>" + b.period + "</td><td>" + b.owner + '</td><td class="r">' + b.kpis.length + "</td><td>" + chipSt(b.status) + '</td><td class="r">' + resChip(score(b)) + "</td></tr>").join("");
    }
    function renderDetail() {
      const b = BSC[sel];
      document.getElementById("bName").textContent = UI.L(b.name);
      document.getElementById("bSub").innerHTML = t("sub", { p: b.period, r: b.owner }) + " · " + chipSt(b.status);
      document.getElementById("bActions").innerHTML = b.status === "draft" ? '<button class="btn btn-teal" type="button" data-act="approve">' + mi("verified") + t("approveBtn") + "</button>"
        : b.status === "approved" ? '<button class="btn btn-violet" type="button" data-act="close">' + mi("lock") + t("closeBtn") + '</button><button class="btn" type="button" data-act="draft">' + mi("undo") + t("reopen") + "</button>" : "";
      document.getElementById("tabs").innerHTML = [["kpis", "tabKpis"], ["goal", "tabGoal"], ["dash", "tabDash"]].map(x => '<button type="button" role="tab" class="mc-tab" aria-selected="' + (tab === x[0]) + '" data-tab="' + x[0] + '">' + t(x[1]) + "</button>").join("");
      const P = document.getElementById("panel");
      const locked = b.status !== "draft";
      if (tab === "kpis") {
        const s = wsum(b), msg = s === 100 ? '<p class="chip chip-pos" style="margin-bottom:8px">' + mi("check_circle") + t("wOk") + "</p>" : '<p class="chip chip-neg" style="margin-bottom:8px" role="alert">' + mi("error") + t(s < 100 ? "wMissing" : "wExtra", { s, d: Math.abs(100 - s) }) + "</p>";
        P.innerHTML = (locked ? '<p class="ig-nota">' + t(b.status === "closed" ? "closedNote" : "lockedNote") + "</p>" : "") + '<div id="wMsg">' + msg + "</div>" +
          '<div class="table-wrap"><table class="grid"><thead><tr><th>' + t("colKpi") + "</th><th>" + t("colType") + '</th><th class="r">' + t("colWeight") + '</th><th class="r">' + t("colTarget") + '</th><th class="r">' + t("colGoalTd") + '</th><th class="r">' + t("colActual") + '</th><th class="r">' + t("colResult") + '</th><th class="r">' + t("colWeighted") + "</th></tr></thead><tbody>" +
          PERSP.map(p => '<tr class="group"><td colspan="8">' + t(p) + "</td></tr>" + b.kpis.map((k, i) => k.p !== p ? "" : "<tr><td>" + UI.L(k.name) + "</td><td>" + (k.type === "up" ? mi("north_east") + " " + t("tUp") : mi("south_east") + " " + t("tDown")) +
            '</td><td class="r"><input class="w-in" type="number" min="0" max="100" step="1" data-w="' + i + '" value="' + k.weight + '"' + (locked ? " disabled" : "") + ' aria-label="' + t("colWeight") + " " + UI.L(k.name) + '"></td><td class="r">' + fmtV(k, k.target) + '</td><td class="r">' + fmtV(k, goalTd(k)) + '</td><td class="r">' + fmtV(k, k.act) + '</td><td class="r">' + resChip(result(k)) + '</td><td class="r">' + UI.fmtPct(result(k) * k.weight / 100, 2) + "</td></tr>").join("")).join("") +
          '</tbody><tfoot><tr><td colspan="2">' + t("total") + '</td><td class="r" id="wTot">' + s + '%</td><td colspan="4"></td><td class="r">' + UI.fmtPct(score(b), 2) + "</td></tr></tfoot></table></div>";
      } else if (tab === "goal") {
        const k = b.kpis[goalIdx];
        P.innerHTML = '<div class="mc-filters" style="margin-bottom:8px"><div class="mc-field w-lg"><label for="gKpi">' + t("goalKpi") + '</label><select id="gKpi"></select></div></div><p class="mc-hint" style="margin-bottom:8px">' + t("goalHint") + "</p>" +
          '<div class="months">' + k.dist.map((v, m) => '<div class="mc-field"><label for="g' + m + '">' + UI.monthName(m, true) + '</label><input class="num" type="number" step="0.1" min="0" max="100" id="g' + m + '" data-g="' + m + '" value="' + v + '"' + (locked ? " disabled" : "") + "></div>").join("") + '</div><p id="gMsg" style="margin-top:8px"></p>' +
          (locked ? "" : '<div style="margin-top:8px"><button class="btn btn-teal" type="button" id="gSave">' + mi("save") + t("saveGoals") + "</button></div>");
        const $g = $("#gKpi"); b.kpis.forEach((x, i) => $g.append(new Option(t(x.p) + " · " + UI.L(x.name), String(i)))); $g.val(String(goalIdx)).select2({ width: "100%" });
        $g.on("change", () => { goalIdx = Number($g.val()); renderDetail(); });
        checkGoal();
      } else {
        const per = PERSP.map(p => { const ks = b.kpis.filter(k => k.p === p), w = ks.reduce((a, k) => a + k.weight, 0); return { p, w, s: ks.reduce((a, k) => a + result(k) * k.weight, 0) / (w || 1) }; });
        P.innerHTML = '<div class="persp">' + per.map(x => '<div class="mc-kpi is-accent" style="--k-color:' + (x.s >= 1 ? "var(--success-solid)" : x.s >= .9 ? "var(--warning-solid)" : "var(--danger-solid)") + '"><div class="k-label">' + t(x.p) + '</div><div class="k-value">' + resChip(x.s) + '</div><div class="k-sub">' + t("colWeight") + " " + x.w + '%</div><div class="bar-track" style="margin-top:6px"><span style="width:' + Math.min(100, x.s / 1.2 * 100) + "%;background:" + (x.s >= 1 ? "var(--success-solid)" : x.s >= .9 ? "var(--warning-solid)" : "var(--danger-solid)") + '"></span></div></div>').join("") +
          '</div><div class="chart-box" style="margin-top:12px"><canvas id="radar" role="img" aria-label="' + t("radar") + '"></canvas></div>';
        const tx = UI.cssVar("--chart-axis"), grid = UI.cssVar("--chart-grid"), pal = UI.palette(), c1 = pal[1], c2 = pal[3];
        if (chart) chart.destroy();
        chart = new Chart(document.getElementById("radar"), { type: "radar", data: { labels: per.map(x => t(x.p)), datasets: [{ label: t("radar"), data: per.map(x => Math.round(x.s * 1000) / 10), borderColor: c1, backgroundColor: c1 + "33", pointBackgroundColor: c1, pointRadius: 3 }, { label: "100%", data: per.map(() => 100), borderColor: c2, borderDash: [5, 4], pointRadius: 0, backgroundColor: "transparent" }] },
          options: { maintainAspectRatio: false, plugins: { legend: { labels: { color: tx } } }, scales: { r: { min: 0, max: 120, ticks: { color: tx, backdropColor: "transparent", stepSize: 20 }, grid: { color: grid }, angleLines: { color: grid }, pointLabels: { color: tx, font: { size: 11 } } } } } });
      }
    }
    function checkGoal() {
      const vals = Array.from({ length: 12 }, (_, m) => Number(document.getElementById("g" + m).value));
      const ok = Math.abs(vals[11] - 100) < .001 && vals.every((v, i) => i === 0 || v >= vals[i - 1]);
      document.getElementById("gMsg").innerHTML = ok ? '<span class="chip chip-pos">' + mi("check_circle") + t("goalOk") + "</span>" : '<span class="chip chip-neg" role="alert">' + mi("error") + t("goalErr") + "</span>";
      const s = document.getElementById("gSave"); if (s) s.disabled = !ok;
      return ok ? vals : null;
    }
    document.getElementById("panel").addEventListener("input", e => {
      const w = e.target.closest("[data-w]");
      if (w) { const b = BSC[sel]; b.kpis[Number(w.dataset.w)].weight = Math.max(0, Number(w.value) || 0); const s = wsum(b);
        document.getElementById("wTot").textContent = s + "%";
        document.getElementById("wMsg").innerHTML = s === 100 ? '<p class="chip chip-pos" style="margin-bottom:8px">' + mi("check_circle") + t("wOk") + "</p>" : '<p class="chip chip-neg" style="margin-bottom:8px" role="alert">' + mi("error") + t(s < 100 ? "wMissing" : "wExtra", { s, d: Math.abs(100 - s) }) + "</p>";
        renderList(); }
      if (e.target.closest("[data-g]")) checkGoal();
    });
    document.getElementById("panel").addEventListener("change", e => { if (e.target.closest("[data-w]")) renderDetail(); });
    document.getElementById("panel").addEventListener("click", e => {
      if (e.target.closest("#gSave")) { const v = checkGoal(); if (v) { BSC[sel].kpis[goalIdx].dist = v; renderList(); UI.toast(t("savedGoals")); } }
    });
    document.getElementById("bActions").addEventListener("click", e => {
      const a = e.target.closest("[data-act]"); if (!a) return; const b = BSC[sel];
      if (a.dataset.act === "approve") { if (wsum(b) !== 100) { UI.toast(t("cantApprove")); tab = "kpis"; renderDetail(); return; } b.status = "approved"; UI.toast(t("approvedMsg")); }
      if (a.dataset.act === "close") { b.status = "closed"; UI.toast(t("closedMsg")); }
      if (a.dataset.act === "draft") { b.status = "draft"; UI.toast(t("draftMsg")); }
      renderList(); renderDetail();
    });
    document.getElementById("tabs").addEventListener("click", e => { const b = e.target.closest("[data-tab]"); if (b) { tab = b.dataset.tab; renderDetail(); } });
    document.getElementById("tabs").addEventListener("keydown", e => { if (e.key !== "ArrowRight" && e.key !== "ArrowLeft") return; const order = ["kpis", "goal", "dash"]; tab = order[(order.indexOf(tab) + (e.key === "ArrowRight" ? 1 : 2)) % 3]; renderDetail(); document.querySelector('#tabs [data-tab="' + tab + '"]').focus(); });
    const tb = document.getElementById("tBsc");
    tb.addEventListener("click", e => { const tr = e.target.closest("tr.drill"); if (tr) { sel = Number(tr.dataset.i); goalIdx = 0; renderList(); renderDetail(); } });
    tb.addEventListener("keydown", e => { const tr = e.target.closest("tr.drill"); if (tr && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); tr.click(); } });
    const about = () => document.getElementById("about").innerHTML = UI.aboutBox("aboutText");
    document.addEventListener("langchange", () => { renderList(); renderDetail(); about(); });
    document.addEventListener("themechange", () => { if (tab === "dash") renderDetail(); });
    renderList(); renderDetail(); about();
  });
  </script>
</body>
</html>
