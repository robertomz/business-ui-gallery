<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Price check · Business UI Gallery</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,300..500,0..1,0&display=block" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/select2/4.0.13/css/select2.min.css">
  <link rel="stylesheet" href="../assets/css/base.css">
  <style>
    tr.click { cursor: pointer; }
    tr.click:focus-visible { outline: 2px solid var(--focus); outline-offset: -2px; }
    tr.is-checked td { opacity: .62; }
    .cost-up { color: var(--danger); font-weight: 600; } .cost-down { color: var(--success); font-weight: 600; }
    .progress-line { display: flex; align-items: center; gap: 10px; min-width: 220px; font-size: 12px; }
    .progress-line .progress { flex: 1; }
    .cfg-table input { width: 100%; min-height: 34px; padding: 4px 9px; border: 1px solid var(--border); border-radius: var(--r-xs); background: var(--bg-input); color: var(--text); font-size: 12.5px; text-align: right; }
    .cfg-table input:focus { outline: none; border-color: var(--focus); background: var(--surface); }
    .cfg-table input[aria-invalid="true"] { border-color: var(--danger-solid); background: var(--danger-soft); }
    .chk { width: 18px; height: 18px; accent-color: var(--brand); }
  </style>
</head>
<body data-page="price-check" data-root="../">
  <main id="content">
    <div class="mc-tabs" role="tablist" id="tabs"></div>

    <!-- 1. Check by purchase -->
    <div id="vCheck" style="display:flex;flex-direction:column;gap:12px">
      <section class="mc-panel">
        <form class="mc-filters" id="fCheck">
          <div class="mc-field" style="max-width:300px"><label for="fPo" data-i18n="purchase"></label><select id="fPo"></select></div>
          <label class="mc-check"><input type="checkbox" id="onlyReq"><span data-i18n="onlyReq"></span></label>
          <label class="mc-check"><input type="checkbox" id="onlyPend"><span data-i18n="onlyPend"></span></label>
          <span style="flex:1"></span>
          <div class="progress-line"><div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="100" id="chkBar"><span></span></div><b class="num" id="chkTxt"></b></div>
        </form>
      </section>
      <section class="mc-kpis" id="kCheck"></section>
      <section class="mc-panel">
        <div class="mc-panel-title"><h3><span class="material-icons" aria-hidden="true">fact_check</span><span data-i18n="checkTitle"></span></h3><span class="mc-hint" data-i18n="checkHint"></span></div>
        <div class="table-wrap"><table class="grid" id="tCheck"><thead></thead><tbody></tbody></table></div>
      </section>
    </div>

    <!-- 2. Catalog prices -->
    <div id="vCat" hidden style="display:flex;flex-direction:column;gap:12px">
      <section class="mc-panel">
        <form class="mc-filters" id="fCat">
          <div class="mc-field"><label for="cSup" data-i18n="supplier"></label><select id="cSup"></select></div>
          <div class="mc-field"><label for="cBuyer" data-i18n="buyer"></label><select id="cBuyer"></select></div>
          <div class="mc-field"><label for="cCat" data-i18n="category"></label><select id="cCat"></select></div>
          <div class="mc-field"><label for="cList" data-i18n="priceList"></label><select id="cList"></select></div>
          <div class="mc-field"><label for="cAlert" data-i18n="alert"></label><select id="cAlert"></select></div>
          <label class="mc-check"><input type="checkbox" id="cActive" checked><span data-i18n="onlyActive"></span></label>
          <button class="btn btn-teal" type="submit"><span class="material-icons" aria-hidden="true">search</span><span data-i18n="load"></span></button>
        </form>
      </section>
      <section class="mc-kpis" id="kCat"></section>
      <section class="mc-panel"><div class="table-wrap" style="max-height:560px"><table class="grid" id="tCat"><thead></thead><tbody></tbody><tfoot></tfoot></table></div></section>
    </div>

    <!-- 3. Cost increase simulation -->
    <div id="vSim" hidden style="display:flex;flex-direction:column;gap:12px">
      <section class="mc-panel">
        <form class="mc-filters" id="fSim">
          <div class="mc-field" style="max-width:180px"><label for="sBy" data-i18n="simBy"></label><select id="sBy"></select></div>
          <div class="mc-field" style="max-width:260px"><label for="sWho" data-i18n="simWho"></label><select id="sWho"></select></div>
          <div class="mc-field w-sm"><label for="sPct" data-i18n="simPct"></label><input id="sPct" class="num" inputmode="decimal" value="8"></div>
          <button class="btn btn-teal" type="submit"><span class="material-icons" aria-hidden="true">calculate</span><span data-i18n="simulate"></span></button>
        </form>
      </section>
      <section class="mc-kpis" id="kSim"></section>
      <section class="mc-panel"><div class="table-wrap" style="max-height:560px"><table class="grid" id="tSim"><thead></thead><tbody></tbody></table></div></section>
    </div>
    <div id="about"></div>
  </main>

  <div class="modal-backdrop" id="mCfg">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="mCfgT">
      <div class="modal-head"><h3 id="mCfgT"><span class="material-icons" aria-hidden="true">sell</span><span id="cfgTitle"></span></h3></div>
      <div class="modal-body">
        <div class="mc-kpis" id="cfgInfo" style="margin-bottom:10px"></div>
        <p class="mc-hint" style="margin-bottom:8px" data-i18n="cfgHint"></p>
        <div class="table-wrap"><table class="grid cfg-table" id="tCfg"><thead></thead><tbody></tbody></table></div>
        <div class="mc-field-error" id="cfgErr" role="alert" style="margin-top:8px"></div>
      </div>
      <div class="modal-foot"><button class="btn btn-teal" type="button" id="cfgSave"><span class="material-icons" aria-hidden="true">save</span><span data-i18n="saveCheck"></span></button><button class="btn" type="button" id="cfgClose" data-i18n="close"></button></div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/select2/4.0.13/js/select2.min.js"></script>
  <script src="../assets/js/common.js"></script>
  <script>
  UI.strings({
    en: {
      tabCheck: "Price check by purchase", tabCat: "Configure prices", tabSim: "Cost increase simulation", purchase: "Purchase received", onlyReq: "Only required", onlyPend: "Only pending",
      checked: "{a} / {b} checked", checkTitle: "Products of the purchase", checkHint: "Select a row to review its prices. Required = the cost went up.",
      code: "Code", desc: "Description", pres: "Presentation", qty: "Qty.", oldCost: "Prev. cost", newCost: "New cost", costState: "Cost state", type: "Type", check: "Check",
      up: "Cost went up", down: "Cost went down", same: "Same cost", required: "Required", optional: "Optional", done: "Checked", pend: "Pending",
      k_lines: "Lines", k_up: "Cost went up", k_req: "Required", k_done: "Checked", k_below: "Below minimum margin",
      buyer: "Buyer", priceList: "Price list", alert: "Alert", onlyActive: "Only active", cost: "Avg. cost", lastCost: "Last cost", price: "Price", margin: "Margin over sale", minMargin: "Min. margin",
      a_all: "All", a_any: "Any alert", a_belowCost: "Price below cost", a_belowMin: "Below minimum margin", a_costUp: "Cost up > 5%", a_ok: "OK",
      k_prices: "Prices", k_alerts: "With alerts", k_avg: "Avg. margin", configure: "Configure prices",
      cfgTitle: "Configure product prices: {p}", cfgHint: "Change the price or the margin; the other is calculated (price = cost ÷ (1 − margin)). The margin is over the sale price.",
      list: "List", curPrice: "Current price", curMargin: "Current margin", newPrice: "New price", newMargin: "New margin %", after: "Margin after", saveCheck: "Save and mark as checked",
      errBelowCost: "{l}: the price cannot be below the cost.", errMargin: "{l}: the margin must be less than 100%.", warnMin: "{l}: below the minimum margin ({m}).", savedOk: "Prices of {p} saved and checked.",
      simBy: "Increase by", simWho: "Supplier / category", simPct: "Increase %", simulate: "Simulate", bySup: "Supplier", byCat: "Category",
      newCostS: "New cost", newMarginS: "Margin with new cost", suggested: "Suggested price", k_affected: "Prices affected", k_fall: "Fall below minimum", k_already: "Already below",
      already: "Already below", falls: "Falls below", stays: "Stays OK",
      aboutText: "When a purchase is received, every product whose cost changed shows up here. <b>Required</b> lines are the ones where the cost went up: they must be reviewed before the purchase is closed. Each row opens <b>Configure product prices</b>, where every price list (retail, wholesale, supermarkets, route) shows its current price and its <b>margin over sale</b> = (price − cost) ÷ price; typing a new price calculates the margin and typing a margin calculates the price. A price below cost is not allowed, and a margin under the category minimum is flagged. <b>Configure prices</b> lists the whole catalog with its alerts, and the <b>simulation</b> shows which prices would fall below the minimum if a supplier or a category raised its costs, with the suggested price. All data is generated."
    },
    es: {
      tabCheck: "Verificación de precios por compra", tabCat: "Configurar precios", tabSim: "Simulación de alza de costo", purchase: "Compra recibida", onlyReq: "Solo obligatorios", onlyPend: "Solo pendientes",
      checked: "{a} / {b} chequeados", checkTitle: "Productos de la compra", checkHint: "Elija una fila para revisar sus precios. Obligatorio = el costo subió.",
      code: "Código", desc: "Descripción", pres: "Presentación", qty: "Cant.", oldCost: "Costo ant.", newCost: "Costo nuevo", costState: "Estado del costo", type: "Tipo", check: "Chequeo",
      up: "Costo subió", down: "Costo bajó", same: "Mismo costo", required: "Obligatorio", optional: "Opcional", done: "Chequeado", pend: "Pendiente",
      k_lines: "Líneas", k_up: "Costo subió", k_req: "Obligatorios", k_done: "Chequeados", k_below: "Bajo el margen mínimo",
      buyer: "Comprador", priceList: "Lista de precio", alert: "Alerta", onlyActive: "Solo activos", cost: "Costo prom.", lastCost: "Último costo", price: "Precio", margin: "Margen sobre venta", minMargin: "Margen mín.",
      a_all: "Todas", a_any: "Con alguna alerta", a_belowCost: "Precio bajo el costo", a_belowMin: "Bajo el margen mínimo", a_costUp: "Costo subió > 5%", a_ok: "OK",
      k_prices: "Precios", k_alerts: "Con alertas", k_avg: "Margen prom.", configure: "Configurar precios",
      cfgTitle: "Configurar precios del producto: {p}", cfgHint: "Cambie el precio o el margen; el otro se calcula (precio = costo ÷ (1 − margen)). El margen es sobre el precio de venta.",
      list: "Lista", curPrice: "Precio actual", curMargin: "Margen actual", newPrice: "Precio nuevo", newMargin: "Margen nuevo %", after: "Margen después", saveCheck: "Guardar y marcar chequeado",
      errBelowCost: "{l}: el precio no puede quedar bajo el costo.", errMargin: "{l}: el margen debe ser menor a 100%.", warnMin: "{l}: queda bajo el margen mínimo ({m}).", savedOk: "Precios de {p} guardados y chequeados.",
      simBy: "Alza por", simWho: "Proveedor / categoría", simPct: "% de alza", simulate: "Simular", bySup: "Proveedor", byCat: "Categoría",
      newCostS: "Costo nuevo", newMarginS: "Margen con costo nuevo", suggested: "Precio sugerido", k_affected: "Precios afectados", k_fall: "Caen bajo el mínimo", k_already: "Ya estaban bajo",
      already: "Ya estaba bajo", falls: "Cae bajo el mínimo", stays: "Sigue bien",
      aboutText: "Cuando se recibe una compra, aquí aparecen los productos cuyo costo cambió. Las líneas <b>obligatorias</b> son las que subieron de costo: hay que revisarlas antes de cerrar la compra. Cada fila abre <b>Configurar precios del producto</b>, donde cada lista de precio (detalle, mayoreo, supermercados, ruta) muestra su precio actual y su <b>margen sobre venta</b> = (precio − costo) ÷ precio; al escribir un precio nuevo se calcula el margen y al escribir un margen se calcula el precio. No se permite un precio bajo el costo y se marca cuando el margen queda bajo el mínimo de la categoría. <b>Configurar precios</b> muestra todo el catálogo con sus alertas, y la <b>simulación</b> dice qué precios quedarían bajo el mínimo si un proveedor o una categoría sube sus costos, con el precio sugerido. Todos los datos son generados."
    }
  });

  $(function () {
    const D = UI.DATA, t = UI.t, M = UI.fmtMoney, mi = UI.mi;
    const LISTS = [{ en: "Retail", es: "Detalle", k: 1.42 }, { en: "Wholesale", es: "Mayoreo", k: 1.24 }, { en: "Supermarkets", es: "Supermercados", k: 1.3 }, { en: "Route sales", es: "Ruta", k: 1.36 }];
    const MINM = [.22, .18, .25, .2, .24, .16, .12];
    const BUYERS = ["N. Cruz", "P. Aguilar", "S. Herrera"];
    const PRES = [{ en: "Unit", es: "Unidad" }, { en: "Box of 6", es: "Caja de 6" }, { en: "Case of 12", es: "Fardo de 12" }, { en: "Case of 24", es: "Fardo de 24" }];
    const supOf = cat => D.suppliers[[1, 3, 4, 2, 2, 0, 5][cat]];
    const r = UI.rng(3131);
    const PROD = D.products.map((p, i) => {
      const cost = UI.between(r, 18, 260), prevCost = cost / UI.between(r, .96, 1.08);
      const prices = LISTS.map(l => prevCost * l.k * UI.between(r, .95, 1.08));
      return { code: "A-" + (10000 + i * 37), name: p[0], cat: p[1], sup: supOf(p[1]), buyer: BUYERS[p[1] % 3], pres: (i % 3) + 1, cost, prevCost, priceCost: prevCost, prices, active: r() > .06, checked: false };
    });
    const margin = (price, cost) => price ? (price - cost) / price : 0;
    const PURCHASES = D.suppliers.map((s, i) => ({ no: "OC-" + (8700 + i * 3), sup: s, date: new Date(Date.UTC(2026, 10, 10 + i)) }));
    let tab = "check", editing = null, simRows = [];

    function fill(sel, items, keepAll, opts) {
      const $s = $(sel), v = $s.val();
      $s.empty(); if (keepAll) $s.append(new Option(t("a_all"), "all"));
      items.forEach((x, i) => $s.append(new Option(UI.L(x), String(i))));
      $s.val(v || (keepAll ? "all" : "0")).select2(Object.assign({ width: "100%" }, opts || {}));
    }
    function fillSelects() {
      fill("#fPo", PURCHASES.map(p => p.no + " · " + p.sup + " · " + UI.fmtDay(p.date)), false);
      fill("#cSup", D.suppliers, true); fill("#cBuyer", BUYERS, true); fill("#cCat", D.categories, true); fill("#cList", LISTS, true);
      fill("#cAlert", [{ en: "Any alert", es: "Con alguna alerta" }, { en: "Price below cost", es: "Precio bajo el costo" }, { en: "Below minimum margin", es: "Bajo el margen mínimo" }, { en: "Cost up > 5%", es: "Costo subió > 5%" }], true);
      fill("#sBy", [{ en: "Supplier", es: "Proveedor" }, { en: "Category", es: "Categoría" }], false, { minimumResultsForSearch: Infinity });
      fillWho();
    }
    function fillWho() { const by = $("#sBy").val() || "0"; $("#sWho").val(null); fill("#sWho", by === "0" ? D.suppliers : D.categories, false); }
    fillSelects();
    $("#sBy").on("change", fillWho);

    function alertsOf(p, li) {
      const m = margin(p.prices[li], p.cost), out = [];
      if (p.prices[li] < p.cost) out.push("belowCost"); else if (m < MINM[p.cat]) out.push("belowMin");
      if (p.cost / p.priceCost - 1 > .05) out.push("costUp");
      return out;
    }
    const ALERT = { belowCost: ["a_belowCost", "chip-neg", "money_off"], belowMin: ["a_belowMin", "chip-warn", "trending_down"], costUp: ["a_costUp", "chip-violet", "arrow_upward"] };
    const alertChips = list => list.length ? list.map(a => '<span class="chip ' + ALERT[a][1] + '">' + mi(ALERT[a][2]) + t(ALERT[a][0]) + "</span>").join(" ") : '<span class="chip chip-pos">' + mi("check_circle") + t("a_ok") + "</span>";
    const kpi = (l, v, color) => '<div class="mc-kpi is-accent" style="--k-color:' + color + '"><div class="k-label">' + t(l) + '</div><div class="k-value num">' + v + "</div></div>";

    function renderTabs() {
      document.getElementById("tabs").innerHTML = [["check", "tabCheck", "fact_check"], ["cat", "tabCat", "sell"], ["sim", "tabSim", "calculate"]].map(x => '<button type="button" class="mc-tab" role="tab" aria-selected="' + (tab === x[0]) + '" data-tab="' + x[0] + '">' + mi(x[2]) + " " + t(x[1]) + "</button>").join("");
      document.getElementById("vCheck").hidden = tab !== "check"; document.getElementById("vCat").hidden = tab !== "cat"; document.getElementById("vSim").hidden = tab !== "sim";
      if (tab === "check") renderCheck(); else if (tab === "cat") renderCat(); else renderSim();
    }

    // ---------- 1. Check by purchase ----------
    function poLines() {
      const po = PURCHASES[+$("#fPo").val() || 0];
      return PROD.filter(p => p.sup === po.sup).map(p => ({ p, qty: 5 + (p.code.charCodeAt(4) % 30), state: p.cost > p.prevCost * 1.001 ? "up" : p.cost < p.prevCost * .999 ? "down" : "same" }));
    }
    function renderCheck() {
      const all = poLines();
      let list = all;
      if (document.getElementById("onlyReq").checked) list = list.filter(x => x.state === "up");
      if (document.getElementById("onlyPend").checked) list = list.filter(x => !x.p.checked);
      const done = all.filter(x => x.p.checked).length;
      document.getElementById("chkTxt").textContent = t("checked", { a: done, b: all.length });
      document.querySelector("#chkBar span").style.width = (all.length ? done / all.length * 100 : 0) + "%";
      document.getElementById("chkBar").setAttribute("aria-valuenow", Math.round(all.length ? done / all.length * 100 : 0));
      const below = list.filter(x => LISTS.some((l, i) => margin(x.p.prices[i], x.p.cost) < MINM[x.p.cat])).length;
      document.getElementById("kCheck").innerHTML = kpi("k_lines", list.length, "var(--chart-6)") + kpi("k_up", list.filter(x => x.state === "up").length, "var(--chart-7)") + kpi("k_req", list.filter(x => x.state === "up").length, "var(--chart-4)") + kpi("k_done", list.filter(x => x.p.checked).length, "var(--chart-2)") + kpi("k_below", below, "var(--chart-1)");
      document.querySelector("#tCheck thead").innerHTML = "<tr><th>" + t("code") + "</th><th>" + t("desc") + "</th><th>" + t("pres") + '</th><th class="r">' + t("qty") + '</th><th class="r">' + t("oldCost") + '</th><th class="r">' + t("newCost") + "</th><th>" + t("costState") + "</th><th>" + t("type") + "</th><th>" + t("check") + "</th></tr>";
      const ST = { up: ["up", "cost-up", "arrow_upward"], down: ["down", "cost-down", "arrow_downward"], same: ["same", "muted", "remove"] };
      document.querySelector("#tCheck tbody").innerHTML = list.map(x => '<tr class="click' + (x.p.checked ? " is-checked" : "") + '" tabindex="0" data-code="' + x.p.code + '"><td>' + x.p.code + "</td><td>" + x.p.name + "</td><td>" + UI.L(PRES[x.p.pres]) + '</td><td class="r">' + x.qty + '</td><td class="r">' + M(x.p.prevCost) + '</td><td class="r ' + ST[x.state][1] + '">' + M(x.p.cost) + '</td><td><span class="' + ST[x.state][1] + '">' + mi(ST[x.state][2]) + " " + t(ST[x.state][0]) + " (" + (x.p.cost / x.p.prevCost - 1 >= 0 ? "+" : "") + UI.fmtPct(x.p.cost / x.p.prevCost - 1) + ")</span></td><td>" +
        (x.state === "up" ? '<span class="chip chip-warn">' + mi("priority_high") + t("required") + "</span>" : '<span class="chip">' + t("optional") + "</span>") + "</td><td>" + (x.p.checked ? '<span class="chip chip-pos">' + mi("check_circle") + t("done") + "</span>" : '<span class="chip">' + mi("schedule") + t("pend") + "</span>") + "</td></tr>").join("") || '<tr><td colspan="9" class="muted" style="text-align:center;padding:20px">' + t("noData") + "</td></tr>";
    }
    $("#fPo").on("change", renderCheck);
    ["onlyReq", "onlyPend"].forEach(id => document.getElementById(id).addEventListener("change", renderCheck));
    function rowOpen(e) { const tr = e.target.closest("tr.click"); if (tr) openCfg(tr.dataset.code); }
    document.getElementById("tCheck").addEventListener("click", rowOpen);
    document.getElementById("tCat").addEventListener("click", rowOpen);
    ["tCheck", "tCat"].forEach(id => document.getElementById(id).addEventListener("keydown", e => { if ((e.key === "Enter" || e.key === " ") && e.target.matches("tr.click")) { e.preventDefault(); rowOpen(e); } }));

    // ---------- Configure modal ----------
    function openCfg(code) {
      const p = PROD.find(x => x.code === code);
      editing = { p, prices: p.prices.slice() };
      document.getElementById("cfgTitle").textContent = t("cfgTitle", { p: p.name });
      document.getElementById("cfgInfo").innerHTML = kpi("oldCost", M(p.prevCost), "var(--text-tertiary)") + kpi("newCost", M(p.cost), p.cost > p.prevCost ? "var(--danger-solid)" : "var(--success-solid)") + kpi("minMargin", UI.fmtPct(MINM[p.cat], 0), "var(--chart-4)") + kpi("category", UI.L(D.categories[p.cat]), "var(--chart-6)");
      document.querySelector("#tCfg thead").innerHTML = "<tr><th>" + t("list") + '</th><th class="r">' + t("curPrice") + '</th><th class="r">' + t("curMargin") + '</th><th class="r" style="width:140px">' + t("newPrice") + '</th><th class="r" style="width:120px">' + t("newMargin") + "</th><th>" + t("after") + "</th></tr>";
      document.querySelector("#tCfg tbody").innerHTML = LISTS.map((l, i) => "<tr><td>" + UI.L(l) + '</td><td class="r">' + M(p.prices[i]) + '</td><td class="r">' + UI.fmtPct(margin(p.prices[i], p.cost)) + '</td><td><input data-i="' + i + '" data-k="price" inputmode="decimal" value="' + M(p.prices[i]) + '" aria-label="' + t("newPrice") + " " + UI.L(l) + '"></td><td><input data-i="' + i + '" data-k="margin" inputmode="decimal" value="' + (margin(p.prices[i], p.cost) * 100).toFixed(1) + '" aria-label="' + t("newMargin") + " " + UI.L(l) + '"></td><td id="aft' + i + '"></td></tr>').join("");
      validateCfg();
      UI.openModal("mCfg");
    }
    function validateCfg() {
      const p = editing.p, errs = [];
      LISTS.forEach((l, i) => {
        const pr = editing.prices[i], m = margin(pr, p.cost), cell = document.getElementById("aft" + i);
        const inP = document.querySelector('#tCfg input[data-i="' + i + '"][data-k="price"]'), inM = document.querySelector('#tCfg input[data-i="' + i + '"][data-k="margin"]');
        inP.removeAttribute("aria-invalid"); inM.removeAttribute("aria-invalid");
        if (!(pr >= p.cost)) { errs.push(t("errBelowCost", { l: UI.L(l) })); inP.setAttribute("aria-invalid", "true"); }
        if (m >= 1) { errs.push(t("errMargin", { l: UI.L(l) })); inM.setAttribute("aria-invalid", "true"); }
        cell.innerHTML = '<span class="num ' + (m < MINM[p.cat] ? "neg" : "pos") + '">' + UI.fmtPct(m) + "</span> " + (m < MINM[p.cat] && pr >= p.cost ? '<span class="chip chip-warn">' + mi("trending_down") + t("a_belowMin") + "</span>" : "");
      });
      const warns = LISTS.map((l, i) => editing.prices[i] >= p.cost && margin(editing.prices[i], p.cost) < MINM[p.cat] ? t("warnMin", { l: UI.L(l), m: UI.fmtPct(MINM[p.cat], 0) }) : null).filter(Boolean);
      document.getElementById("cfgErr").innerHTML = errs.concat(warns.map(w => '<span style="color:var(--warning)">' + w + "</span>")).join("<br>");
      document.getElementById("cfgSave").disabled = errs.length > 0;
    }
    document.getElementById("tCfg").addEventListener("input", e => {
      const i = +e.target.dataset.i, k = e.target.dataset.k; if (isNaN(i)) return;
      const v = UI.parseMoney(e.target.value), cost = editing.p.cost;
      if (k === "price") { editing.prices[i] = v; document.querySelector('#tCfg input[data-i="' + i + '"][data-k="margin"]').value = v ? (margin(v, cost) * 100).toFixed(1) : ""; }
      else { const m = v / 100; editing.prices[i] = m < 1 ? cost / (1 - m) : NaN; document.querySelector('#tCfg input[data-i="' + i + '"][data-k="price"]').value = m < 1 ? M(cost / (1 - m)) : ""; }
      validateCfg();
    });
    document.getElementById("tCfg").addEventListener("blur", e => { if (e.target.dataset.k === "price" && e.target.value) e.target.value = M(UI.parseMoney(e.target.value)); }, true);
    document.getElementById("cfgSave").addEventListener("click", () => {
      editing.p.prices = editing.prices.slice(); editing.p.priceCost = editing.p.cost; editing.p.checked = true;
      UI.closeModal("mCfg"); UI.toast(t("savedOk", { p: editing.p.name })); renderTabs();
    });
    document.getElementById("cfgClose").addEventListener("click", () => UI.closeModal("mCfg"));

    // ---------- 2. Catalog ----------
    let catApplied = null;
    function readCat() { return { sup: $("#cSup").val(), buyer: $("#cBuyer").val(), cat: $("#cCat").val(), list: $("#cList").val(), alert: $("#cAlert").val(), active: document.getElementById("cActive").checked }; }
    function renderCat() {
      const f = catApplied || readCat();
      const rows = [];
      PROD.forEach(p => {
        if ((f.sup !== "all" && p.sup !== D.suppliers[+f.sup]) || (f.buyer !== "all" && p.buyer !== BUYERS[+f.buyer]) || (f.cat !== "all" && p.cat !== +f.cat) || (f.active && !p.active)) return;
        LISTS.forEach((l, li) => {
          if (f.list !== "all" && li !== +f.list) return;
          const al = alertsOf(p, li);
          const want = ["any", "belowCost", "belowMin", "costUp"][+f.alert];
          if (f.alert !== "all" && (want === "any" ? !al.length : !al.includes(want))) return;
          rows.push({ p, li, al, m: margin(p.prices[li], p.cost) });
        });
      });
      document.getElementById("kCat").innerHTML = kpi("k_prices", rows.length, "var(--chart-6)") + kpi("k_alerts", rows.filter(x => x.al.length).length, "var(--chart-7)") +
        LISTS.map((l, li) => { const s = rows.filter(x => x.li === li); return kpi("k_avg", s.length ? UI.fmtPct(s.reduce((a, x) => a + x.m, 0) / s.length) : "—", "var(--chart-2)").replace(t("k_avg"), t("k_avg") + " · " + UI.L(l)); }).join("");
      document.querySelector("#tCat thead").innerHTML = "<tr><th>" + t("code") + "</th><th>" + t("desc") + "</th><th>" + t("category") + "</th><th>" + t("supplier") + "</th><th>" + t("priceList") + '</th><th class="r">' + t("cost") + '</th><th class="r">' + t("lastCost") + '</th><th class="r">' + t("price") + '</th><th class="r">' + t("margin") + '</th><th class="r">' + t("minMargin") + "</th><th>" + t("alert") + "</th></tr>";
      document.querySelector("#tCat tbody").innerHTML = rows.map(x => '<tr class="click" tabindex="0" data-code="' + x.p.code + '"><td>' + x.p.code + "</td><td>" + x.p.name + "</td><td>" + UI.L(D.categories[x.p.cat]) + "</td><td>" + x.p.sup + "</td><td>" + UI.L(LISTS[x.li]) + '</td><td class="r">' + M(x.p.cost) + '</td><td class="r">' + M(x.p.priceCost) + '</td><td class="r">' + M(x.p.prices[x.li]) + '</td><td class="r ' + (x.m < MINM[x.p.cat] ? "neg" : "") + '">' + UI.fmtPct(x.m) + '</td><td class="r">' + UI.fmtPct(MINM[x.p.cat], 0) + "</td><td>" + alertChips(x.al) + "</td></tr>").join("");
      document.querySelector("#tCat tfoot").innerHTML = '<tr><td colspan="8">' + t("total") + ": " + rows.length + '</td><td class="r">' + (rows.length ? UI.fmtPct(rows.reduce((a, x) => a + x.m, 0) / rows.length) : "—") + '</td><td colspan="2"></td></tr>';
    }
    document.getElementById("fCat").addEventListener("submit", e => { e.preventDefault(); catApplied = readCat(); renderCat(); });

    // ---------- 3. Simulation ----------
    function renderSim() {
      const by = $("#sBy").val() || "0", who = +($("#sWho").val() || 0), pct = UI.parseMoney(document.getElementById("sPct").value) / 100;
      simRows = [];
      PROD.forEach(p => {
        if (by === "0" ? p.sup !== D.suppliers[who] : p.cat !== who) return;
        const nc = p.cost * (1 + pct);
        LISTS.forEach((l, li) => {
          const m0 = margin(p.prices[li], p.cost), m1 = margin(p.prices[li], nc), min = MINM[p.cat];
          const st = m0 < min ? "already" : m1 < min ? "falls" : "stays";
          simRows.push({ p, li, nc, m0, m1, st, sug: st === "stays" ? null : nc / (1 - min) });
        });
      });
      document.getElementById("kSim").innerHTML = kpi("k_affected", simRows.length, "var(--chart-6)") + kpi("k_fall", simRows.filter(x => x.st === "falls").length, "var(--chart-7)") + kpi("k_already", simRows.filter(x => x.st === "already").length, "var(--chart-4)");
      const ST = { already: ["already", "chip-warn", "warning"], falls: ["falls", "chip-neg", "trending_down"], stays: ["stays", "chip-pos", "check_circle"] };
      document.querySelector("#tSim thead").innerHTML = "<tr><th>" + t("code") + "</th><th>" + t("desc") + "</th><th>" + t("priceList") + '</th><th class="r">' + t("cost") + '</th><th class="r">' + t("newCostS") + '</th><th class="r">' + t("price") + '</th><th class="r">' + t("curMargin") + '</th><th class="r">' + t("newMarginS") + '</th><th class="r">' + t("minMargin") + "</th><th>" + t("status") + '</th><th class="r">' + t("suggested") + "</th></tr>";
      document.querySelector("#tSim tbody").innerHTML = simRows.sort((a, b) => a.m1 - b.m1).map(x => "<tr><td>" + x.p.code + "</td><td>" + x.p.name + "</td><td>" + UI.L(LISTS[x.li]) + '</td><td class="r">' + M(x.p.cost) + '</td><td class="r">' + M(x.nc) + '</td><td class="r">' + M(x.p.prices[x.li]) + '</td><td class="r">' + UI.fmtPct(x.m0) + '</td><td class="r ' + (x.st !== "stays" ? "neg" : "") + '">' + UI.fmtPct(x.m1) + '</td><td class="r">' + UI.fmtPct(MINM[x.p.cat], 0) + '</td><td><span class="chip ' + ST[x.st][1] + '">' + mi(ST[x.st][2]) + t(ST[x.st][0]) + '</span></td><td class="r"><b>' + (x.sug ? M(x.sug) : "—") + "</b></td></tr>").join("");
    }
    document.getElementById("fSim").addEventListener("submit", e => { e.preventDefault(); renderSim(); });
    document.getElementById("sPct").addEventListener("input", e => { e.target.value = e.target.value.replace(/[^0-9.]/g, ""); });

    document.getElementById("tabs").addEventListener("click", e => { const b = e.target.closest("[data-tab]"); if (b) { tab = b.dataset.tab; renderTabs(); } });
    document.addEventListener("langchange", () => { fillSelects(); renderTabs(); if (editing && document.getElementById("mCfg").classList.contains("open")) openCfg(editing.p.code); document.getElementById("about").innerHTML = UI.aboutBox("aboutText", "aboutScreen"); });
    document.getElementById("about").innerHTML = UI.aboutBox("aboutText", "aboutScreen");
    catApplied = readCat();
    renderTabs();
  });
  </script>
</body>
</html>
