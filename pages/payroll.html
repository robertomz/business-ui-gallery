<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Payroll · Business UI Gallery</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,300..500,0..1,0&display=block" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/select2/4.0.13/css/select2.min.css">
  <link rel="stylesheet" href="../assets/css/base.css">
  <style>
    .info-cards { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
    .info-card { background: var(--surface); border: 1px solid var(--border-subtle); border-radius: var(--r-md); padding: 12px 14px; min-width: 0; box-shadow: var(--shadow-card); }
    .info-card .mc-label { display: flex; align-items: center; gap: 5px; }
    .info-card .mc-label .material-icons { font-size: 17px; color: var(--icon); }
    .info-card b { display: block; margin-top: 6px; font-family: var(--font-display); font-size: 15px; font-weight: 600; color: var(--text-heading); }
    .pay-tools { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; margin: 10px 0 8px; }
    .pay-tools h3 { display: flex; align-items: center; gap: 6px; font-size: 15px; font-weight: 600; }
    .wide { max-height: 520px; }
    .wide td, .wide th { white-space: nowrap; }
    .wide th:nth-child(4), .wide td:nth-child(4) { position: sticky; left: 0; z-index: 2; }
    .wide td:nth-child(4) { background: var(--surface); }
    .wide th:nth-child(4) { z-index: 3; }
    .wide tr.tot td { font-weight: 600; background: var(--surface-alt); position: sticky; top: 33px; z-index: 1; }
    .wide tr.tot td:nth-child(4) { z-index: 2; }
    .wide tr.adj td { color: var(--warning); }
    tr.grp td { background: var(--surface-alt); font-weight: 600; color: var(--text-heading); }
    .bankfile { font-family: ui-monospace, Consolas, monospace; font-size: 12px; background: var(--surface-alt); color: var(--text); border: 1px solid var(--border-subtle); border-radius: var(--r-sm); padding: 12px; max-height: 260px; overflow: auto; white-space: pre; }
    @media (max-width: 900px) { .info-cards { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  </style>
</head>
<body data-page="payroll" data-root="../">
  <main id="content">
    <section class="mc-panel">
      <div class="mc-filters">
        <div class="mc-field w-lg"><label for="fRun" data-i18n="fRun"></label><select id="fRun"></select></div>
        <div style="display:flex;gap:8px;flex-wrap:wrap;margin-left:auto">
          <button class="btn btn-cyan" type="button" id="btnUpload"><span class="material-icons" aria-hidden="true">cloud_upload</span><span data-i18n="upload"></span></button>
          <button class="btn btn-amber" type="button" id="btnAcc"><span class="material-icons" aria-hidden="true">receipt_long</span><span data-i18n="accDetail"></span></button>
          <button class="btn btn-violet" type="button" id="btnContrib"><span class="material-icons" aria-hidden="true">account_balance</span><span data-i18n="contribDetail"></span></button>
          <button class="btn btn-teal" type="button" id="btnApply"><span class="material-icons" aria-hidden="true">task_alt</span><span data-i18n="applyBtn"></span></button>
        </div>
      </div>
    </section>

    <div class="info-cards" id="info"></div>

    <section class="mc-panel">
      <div class="mc-tabs" role="tablist" id="tabs"></div>
      <div id="tabMain">
        <div class="pay-tools">
          <h3><span class="material-icons" aria-hidden="true">list</span><span data-i18n="detailTitle"></span></h3>
          <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end">
            <div class="mc-field" style="min-width:200px"><label for="fGroup" data-i18n="groupBy"></label><select id="fGroup"></select></div>
            <div class="mc-field" style="min-width:180px"><label for="fSearch" data-i18n="search"></label><input id="fSearch" data-i18n-ph="searchPh"></div>
            <button class="btn btn-teal" type="button" id="btnNew"><span class="material-icons" aria-hidden="true">add_circle</span><span data-i18n="newRecord"></span></button>
          </div>
        </div>
        <div class="table-wrap wide"><table class="grid" id="tPay"><thead></thead><tbody></tbody></table></div>
      </div>
      <div id="tabMissing" hidden style="margin-top:10px">
        <div class="table-wrap"><table class="grid" id="tMissing"><thead></thead><tbody></tbody></table></div>
      </div>
    </section>

    <div id="about"></div>
  </main>

  <!-- New record: manual deduction / bonus -->
  <div class="modal-backdrop" id="mNew">
    <div class="modal modal-sm" role="dialog" aria-modal="true" aria-labelledby="mNewT">
      <div class="modal-head"><h3 id="mNewT"><span class="material-icons" aria-hidden="true">add_circle</span><span data-i18n="newRecord"></span></h3></div>
      <div class="modal-body" style="display:flex;flex-direction:column;gap:10px">
        <div class="mc-field"><label for="nEmp" data-i18n="colName"></label><select id="nEmp"></select></div>
        <div class="mc-field"><label for="nType" data-i18n="adjType"></label><select id="nType"></select></div>
        <div class="mc-field"><label for="nAmt" data-i18n="amount"></label><input class="num" id="nAmt" inputmode="decimal"><span class="mc-field-error" id="nAmtErr"></span></div>
        <div class="mc-field"><label for="nDet" data-i18n="adjDetail"></label><input id="nDet"><span class="mc-field-error" id="nDetErr"></span></div>
      </div>
      <div class="modal-foot"><button class="btn btn-teal" type="button" id="nSave"><span class="material-icons" aria-hidden="true">save</span><span data-i18n="save"></span></button><button class="btn" type="button" data-close="mNew" data-i18n="close"></button></div>
    </div>
  </div>

  <!-- Apply payroll -->
  <div class="modal-backdrop" id="mApply">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="mApplyT">
      <div class="modal-head"><h3 id="mApplyT"><span class="material-icons" aria-hidden="true">task_alt</span><span data-i18n="applyTitle"></span></h3></div>
      <div class="modal-body">
        <div class="mc-kpis" id="aKpis"></div>
        <p class="mc-hint" style="margin:10px 0" id="aNote"></p>
        <div id="aRun" hidden><div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="100" id="aBar"><span></span></div><ul class="ig-filas" id="aSteps" style="border:0"></ul></div>
      </div>
      <div class="modal-foot"><button class="btn btn-teal" type="button" id="aGo"><span class="material-icons" aria-hidden="true">play_arrow</span><span data-i18n="applyNow"></span></button><button class="btn" type="button" data-close="mApply" id="aClose" data-i18n="close"></button></div>
    </div>
  </div>

  <!-- Accounting detail -->
  <div class="modal-backdrop" id="mAcc">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="mAccT">
      <div class="modal-head"><h3 id="mAccT"><span class="material-icons" aria-hidden="true">receipt_long</span><span data-i18n="accDetail"></span></h3><span id="accChip"></span></div>
      <div class="modal-body"><div class="table-wrap"><table class="grid" id="tAcc"><thead></thead><tbody></tbody><tfoot></tfoot></table></div></div>
      <div class="modal-foot"><button class="btn" type="button" data-close="mAcc" data-i18n="close"></button></div>
    </div>
  </div>

  <!-- Contributions detail -->
  <div class="modal-backdrop" id="mCon">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="mConT">
      <div class="modal-head"><h3 id="mConT"><span class="material-icons" aria-hidden="true">account_balance</span><span data-i18n="contribDetail"></span></h3></div>
      <div class="modal-body"><p class="mc-hint" style="margin-bottom:8px" data-i18n="contribHint"></p><div class="table-wrap" style="max-height:420px"><table class="grid" id="tCon"><thead></thead><tbody></tbody><tfoot></tfoot></table></div></div>
      <div class="modal-foot"><button class="btn" type="button" data-close="mCon" data-i18n="close"></button></div>
    </div>
  </div>

  <!-- Bank voucher (upload) -->
  <div class="modal-backdrop" id="mBank">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="mBankT">
      <div class="modal-head"><h3 id="mBankT"><span class="material-icons" aria-hidden="true">cloud_upload</span><span data-i18n="bankTitle"></span></h3></div>
      <div class="modal-body"><p class="mc-hint" style="margin-bottom:8px" id="bankNote"></p><div class="bankfile" id="bankFile"></div></div>
      <div class="modal-foot"><button class="btn btn-teal" type="button" id="bankCsv"><span class="material-icons" aria-hidden="true">download</span><span data-i18n="download"></span></button><button class="btn" type="button" data-close="mBank" data-i18n="close"></button></div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/select2/4.0.13/js/select2.min.js"></script>
  <script src="../assets/js/common.js"></script>
  <script>
  UI.strings({

      colDed: "Deductions", colNeg: "Previous negative balance", colGross: "Gross salary", colBonus: "Bonuses", colComm: "Commissions", colNet: "Net salary", colDaily: "Salary per day", colBank: "Bank", colAccount: "Bank account", colStatus: "Status",
      totals: "Totals:", adjType: "Adjustment type", tDed: "Manual deduction", tBonus: "Bonus", amount: "Amount", adjDetail: "Adjustment detail",
      errAmt: "Enter an amount greater than zero.", errDet: "The detail is required.", savedAdj: "Adjustment saved for {n}.",
      reasonMissing: "Reason", mVac: "On unpaid leave", mNew: "Hired after the cut-off", mTerm: "Contract ended", colHire: "Hire date",

      cEmpSS: "Social security (employee)", cErSS: "Social security (employer)", cEmpPen: "Pension fund (employee)", cErPen: "Pension fund (employer)", cTax: "Income tax",
      bankTitle: "Bank transfer voucher", bankNote: "{n} transfers, total {v}.", download: "Download CSV",
      aSalaries: "6-01-01-001 Salaries", aBonus: "6-01-01-006 Bonuses and commissions", aErSS: "6-01-02-001 Employer social security", aErPen: "6-01-02-002 Employer pension fund",
      lSS: "2-01-05-001 Social security payable", lPen: "2-01-05-002 Pension fund payable", lTax: "2-01-05-003 Income tax withheld", lLoan: "2-01-05-004 Loans and other deductions", lNet: "2-01-06-001 Net payroll payable",

      colDed: "Deducciones", colNeg: "Saldo neg. ant.", colGross: "Salario bruto", colBonus: "Bonificaciones", colComm: "Comisiones", colNet: "Salario neto", colDaily: "Salario por día", colBank: "Banco", colAccount: "Cuenta bancaria", colStatus: "Estado",
      totals: "Totales:", adjType: "Tipo de ajuste", tDed: "Deducción manual", tBonus: "Bonificación", amount: "Monto", adjDetail: "Detalle del ajuste",

      applyNote: "Al aplicar se bloquea la planilla y se generan el comprobante del banco y la partida contable. Después no se puede editar.", applyNow: "Aplicar", alreadyApplied: "Esta planilla ya está aplicada.",
      st1: "Calculando {n} empleados", st2: "Generando el comprobante del banco", st3: "Generando la partida contable", appliedMsg: "Planilla {c} aplicada.",
      accAccount: "Cuenta", accCenter: "Centro", debit: "Debe", credit: "Haber", balanced: "Cuadrada", contribHint: "Tasas de ejemplo: seguro social 3.5% empleado / 7% patronal hasta un techo de 11,000.00; fondo de pensiones 1.5% empleado / 1.5% patronal sobre un piso de 10,000.00.",
      cEmpSS: "Seguro social (empleado)", cErSS: "Seguro social (patronal)", cEmpPen: "Fondo de pensiones (empleado)", cErPen: "Fondo de pensiones (patronal)", cTax: "Impuesto sobre la renta",
      bankTitle: "Comprobante de transferencia al banco", bankNote: "{n} transferencias, total {v}.", download: "Descargar CSV",
      aSalaries: "6-01-01-001 Sueldos y salarios", aBonus: "6-01-01-006 Bonificaciones y comisiones", aErSS: "6-01-02-001 Seguro social patronal", aErPen: "6-01-02-002 Fondo de pensiones patronal",
      lSS: "2-01-05-001 Seguro social por pagar", lPen: "2-01-05-002 Fondo de pensiones por pagar", lTax: "2-01-05-003 Impuesto sobre la renta retenido", lLoan: "2-01-05-004 Préstamos y otras deducciones", lNet: "2-01-06-001 Planilla neta por pagar",
      aboutText: "Replica la gestión de planilla: el encabezado muestra <b>código, período, fecha de aplicación y tipo</b>; el detalle lista a cada empleado con salario base, días trabajados, salario, <b>deducciones</b>, saldo negativo anterior, bruto, <b>bonificaciones</b>, comisiones y neto, con los totales arriba. <b>Nuevo registro</b> agrega una deducción manual o una bonificación con detalle obligatorio. <b>Aplicar planilla</b> la bloquea y genera el comprobante del banco y el <b>detalle contable</b> (salarios y aportes patronales por centro de costo, retenciones y neto por pagar, una línea por cuenta y lado). Las tasas de aportes son ejemplos genéricos. Todos los datos son generados."
    }
  });

  $(function () {
    const D = UI.DATA, t = UI.t, M = UI.fmtMoney, mi = UI.mi;
    const SS_CEIL = 11000, PEN_FLOOR = 10000;
    const RUNS = [
      { code: "PL-2026-22", from: "2026-11-01", to: "2026-11-15", apply: "2026-11-15", applied: true, seed: 22 },
      { code: "PL-2026-23", from: "2026-11-16", to: "2026-11-30", apply: "2026-11-30", applied: false, seed: 23 },
      { code: "PL-2026-21", from: "2026-10-16", to: "2026-10-31", apply: "2026-10-31", applied: true, seed: 21 }
    ];
    const r0 = UI.rng(777);
    const EMP = Array.from({ length: 124 }, (_, i) => ({
      id: "0801-19" + String(80 + (i % 20)).padStart(2, "0") + "-" + String(10000 + i * 37).slice(0, 5),
      name: D.firstNames[i % D.firstNames.length] + " " + D.lastNames[(i * 7) % D.lastNames.length] + " " + D.lastNames[(i * 3 + 5) % D.lastNames.length],
      center: i % D.costCenters.length, base: Math.round(UI.between(r0, 9800, 32000) / 50) * 50, compl: r0() < .2,
      bank: UI.pick(r0, D.banks), acc: String(Math.floor(UI.between(r0, 1e9, 9.9e9))), hire: new Date(Date.UTC(2019 + Math.floor(r0() * 7), Math.floor(r0() * 12), 1 + Math.floor(r0() * 27)))
    }));
    const MISSING = [[EMP.length, "mVac"], [EMP.length + 1, "mNew"], [EMP.length + 2, "mTerm"], [EMP.length + 3, "mVac"]];
    let runIdx = 1, group = "none", adj = {}, tab = "assoc";
    const tax = g => { const ann = g * 24; const t1 = Math.max(0, Math.min(ann, 500000) - 200000) * .15, t2 = Math.max(0, Math.min(ann, 750000) - 500000) * .2, t3 = Math.max(0, ann - 750000) * .25; return (t1 + t2 + t3) / 24; };
    function calc(run) {
      const r = UI.rng(run.seed * 1000);
      return EMP.map((e, i) => {
        const days = r() < .9 ? 15 : 15 - Math.ceil(r() * 4);
        const salary = e.base / 30 * days * 2 / 2, sal = salary;
        const bonus = (r() < .25 ? Math.round(UI.between(r, 300, 1500)) : 0) + ((adj[run.code] || []).filter(a => a.i === i && a.type === "tBonus").reduce((a, x) => a + x.v, 0));
        const comm = e.center < 3 && r() < .6 ? Math.round(UI.between(r, 500, 4500)) : 0;
        const gross = sal + bonus + comm;
        const monthly = gross * 2;
        const ss = Math.min(monthly, SS_CEIL) * .035 / 2, pen = Math.max(0, monthly - PEN_FLOOR) * .015 / 2, it = tax(gross);
        const loan = (r() < .15 ? Math.round(UI.between(r, 400, 2500)) : 0) + ((adj[run.code] || []).filter(a => a.i === i && a.type === "tDed").reduce((a, x) => a + x.v, 0));
        const neg = r() < .03 ? Math.round(UI.between(r, 100, 800)) : 0;
        const ded = ss + pen + it + loan;
        const erSS = Math.min(monthly, SS_CEIL) * .07 / 2, erPen = Math.max(0, monthly - PEN_FLOOR) * .015 / 2;
        return { i, e, days, sal, bonus, comm, gross, ss, pen, it, loan, neg, ded, net: gross - ded - neg, erSS, erPen, adj: (adj[run.code] || []).some(a => a.i === i) };
      });
    }
    const run = () => RUNS[runIdx];

    function fillTop() {
      const $r = $("#fRun"); $r.empty(); RUNS.forEach((x, i) => $r.append(new Option(x.code + " · " + UI.fmtDay(new Date(x.from + "T00:00:00Z")) + " – " + UI.fmtDay(new Date(x.to + "T00:00:00Z")) + " · " + t(x.applied ? "stApplied" : "stDraft"), String(i)))); $r.val(String(runIdx)).select2({ width: "100%", minimumResultsForSearch: Infinity });
      const $g = $("#fGroup"); $g.empty(); [["none", "gNone"], ["emp", "gEmp"], ["center", "gCenter"]].forEach(x => $g.append(new Option(t(x[1]), x[0]))); $g.val(group).select2({ width: "100%", minimumResultsForSearch: Infinity });
    }
    function render() {
      const R = run(), rows = calc(R);
      document.getElementById("info").innerHTML = [["tag", "iCode", R.code], ["date_range", "iPeriod", UI.fmtDay(new Date(R.from + "T00:00:00Z")) + " – " + UI.fmtDay(new Date(R.to + "T00:00:00Z"))], ["event_available", "iApply", UI.fmtDay(new Date(R.apply + "T00:00:00Z"))], ["category", "iType", t("typeBi") + " · " + (R.applied ? '<span class="chip chip-pos">' + mi("lock") + t("stApplied") + "</span>" : '<span class="chip chip-warn">' + mi("pending") + t("stDraft") + "</span>")]]
        .map(x => '<div class="info-card"><span class="mc-label">' + mi(x[0]) + t(x[1]) + "</span><b>" + x[2] + "</b></div>").join("");
      document.getElementById("tabs").innerHTML = '<button type="button" role="tab" class="mc-tab" aria-selected="' + (tab === "assoc") + '" data-tab="assoc">' + mi("folder_shared") + " " + t("tabAssoc") + ' <span class="chip chip-info">' + rows.length + '</span></button><button type="button" role="tab" class="mc-tab" aria-selected="' + (tab === "missing") + '" data-tab="missing">' + mi("person_off") + " " + t("tabMissing") + ' <span class="chip chip-neg">' + MISSING.length + "</span></button>";
      document.getElementById("tabMain").hidden = tab !== "assoc";
      document.getElementById("tabMissing").hidden = tab !== "missing";
      document.getElementById("btnNew").disabled = R.applied;
      const q = document.getElementById("fSearch").value.trim().toLowerCase();
      const list = rows.filter(x => !q || (x.e.name + " " + x.e.id + " " + UI.L(D.costCenters[x.e.center])).toLowerCase().includes(q));
      const cols = ["#", "colPlan", "colDni", "colName", "colCenter", "colBase", "colCompl", "colDays", "colSalary", "colDed", "colNeg", "colGross", "colBonus", "colComm", "colNet", "colDaily", "colBank", "colAccount", "colStatus"];
      const num = new Set(["colBase", "colDays", "colSalary", "colDed", "colNeg", "colGross", "colBonus", "colComm", "colNet", "colDaily"]);
      document.querySelector("#tPay thead").innerHTML = "<tr>" + cols.map(c => "<th" + (num.has(c) ? ' class="r"' : "") + ">" + (c === "#" ? "#" : t(c)) + "</th>").join("") + "</tr>";
      const S = k => list.reduce((a, x) => a + x[k], 0);
      const totRow = '<tr class="tot"><td></td><td colspan="2">' + t("totals") + "</td><td>" + list.length + " " + t("kEmp").toLowerCase() + '</td><td></td><td class="r">' + M(list.reduce((a, x) => a + x.e.base, 0)) + '</td><td></td><td></td><td class="r">' + M(S("sal")) + '</td><td class="r">' + M(S("ded")) + '</td><td class="r">' + M(S("neg")) + '</td><td class="r">' + M(S("gross")) + '</td><td class="r">' + M(S("bonus")) + '</td><td class="r">' + M(S("comm")) + '</td><td class="r">' + M(S("net")) + '</td><td colspan="4"></td></tr>';
      const line = (x, n) => '<tr class="' + (x.adj ? "adj" : "") + '"><td>' + n + "</td><td>" + R.code + "</td><td>" + x.e.id + "</td><td>" + x.e.name + "</td><td>" + UI.L(D.costCenters[x.e.center]) + '</td><td class="r">' + M(x.e.base) + "</td><td>" + (x.e.compl ? t("yes") : t("no")) + '</td><td class="r">' + x.days + '</td><td class="r">' + M(x.sal) + '</td><td class="r">' + M(x.ded) + '</td><td class="r">' + M(x.neg) + '</td><td class="r">' + M(x.gross) + '</td><td class="r">' + M(x.bonus) + '</td><td class="r">' + M(x.comm) + '</td><td class="r"><b>' + M(x.net) + '</b></td><td class="r">' + M(x.e.base / 30) + "</td><td>" + x.e.bank + "</td><td>****" + x.e.acc.slice(-4) + "</td><td>" + (R.applied ? '<span class="chip chip-pos">' + mi("lock") + t("stApplied") + "</span>" : '<span class="chip chip-warn">' + mi("pending") + t("stDraft") + "</span>") + "</td></tr>";
      let body = "";
      if (group === "none" || group === "emp") body = list.map((x, k) => line(x, k + 1)).join("");
      else {
        D.costCenters.forEach((c, ci) => { const g = list.filter(x => x.e.center === ci); if (!g.length) return; const s = k => g.reduce((a, x) => a + x[k], 0);
          body += '<tr class="grp"><td></td><td colspan="4">' + UI.L(c) + " · " + g.length + '</td><td colspan="3"></td><td class="r">' + M(s("sal")) + '</td><td class="r">' + M(s("ded")) + '</td><td class="r">' + M(s("neg")) + '</td><td class="r">' + M(s("gross")) + '</td><td class="r">' + M(s("bonus")) + '</td><td class="r">' + M(s("comm")) + '</td><td class="r">' + M(s("net")) + '</td><td colspan="4"></td></tr>' + g.map((x, k) => line(x, k + 1)).join(""); });
      }
      document.querySelector("#tPay tbody").innerHTML = totRow + body;
      document.querySelector("#tMissing thead").innerHTML = "<tr><th>" + t("colDni") + "</th><th>" + t("colName") + "</th><th>" + t("colCenter") + "</th><th>" + t("colHire") + "</th><th>" + t("reasonMissing") + "</th></tr>";
      document.querySelector("#tMissing tbody").innerHTML = MISSING.map((m, k) => "<tr><td>0801-1999-" + (20000 + k) + "</td><td>" + D.firstNames[(k * 5 + 3) % 20] + " " + D.lastNames[(k * 4 + 1) % 15] + "</td><td>" + UI.L(D.costCenters[k % 7]) + "</td><td>" + UI.fmtDay(new Date(Date.UTC(2026, 10, 18 + k))) + '</td><td><span class="chip chip-warn">' + mi("info") + t(m[1]) + "</span></td></tr>").join("");
      return rows;
    }
    // Accounting entry: one line per account and side (salaries and employer contributions by center)
    function entry(rows) {
      const lines = [];
      D.costCenters.forEach((c, ci) => {
        const g = rows.filter(x => x.e.center === ci); if (!g.length) return; const s = k => g.reduce((a, x) => a + x[k], 0);
        lines.push([t("aSalaries"), UI.L(c), s("sal"), 0], [t("aBonus"), UI.L(c), s("bonus") + s("comm"), 0], [t("aErSS"), UI.L(c), s("erSS"), 0], [t("aErPen"), UI.L(c), s("erPen"), 0]);
      });
      const S = k => rows.reduce((a, x) => a + x[k], 0);
      lines.push([t("lSS"), "—", 0, S("ss") + S("erSS")], [t("lPen"), "—", 0, S("pen") + S("erPen")], [t("lTax"), "—", 0, S("it")], [t("lLoan"), "—", 0, S("loan") + S("neg")], [t("lNet"), "—", 0, S("net")]);
      return lines.filter(l => l[2] > 0.004 || l[3] > 0.004);
    }
    function showEntry() {
      const rows = calc(run()), L = entry(rows), d = L.reduce((a, l) => a + l[2], 0), c = L.reduce((a, l) => a + l[3], 0);
      document.querySelector("#tAcc thead").innerHTML = "<tr><th>" + t("accAccount") + "</th><th>" + t("accCenter") + '</th><th class="r">' + t("debit") + '</th><th class="r">' + t("credit") + "</th></tr>";
      document.querySelector("#tAcc tbody").innerHTML = L.map(l => "<tr><td>" + l[0] + "</td><td>" + l[1] + '</td><td class="r">' + (l[2] ? M(l[2]) : "") + '</td><td class="r">' + (l[3] ? M(l[3]) : "") + "</td></tr>").join("");
      document.querySelector("#tAcc tfoot").innerHTML = '<tr><td colspan="2">' + t("total") + '</td><td class="r">' + M(d) + '</td><td class="r">' + M(c) + "</td></tr>";
      document.getElementById("accChip").innerHTML = Math.abs(d - c) < .01 ? '<span class="chip chip-pos">' + mi("check_circle") + t("balanced") + "</span>" : '<span class="chip chip-neg">' + mi("error") + M(d - c) + "</span>";
      UI.openModal("mAcc");
    }
    function showContrib() {
      const rows = calc(run());
      document.querySelector("#tCon thead").innerHTML = "<tr><th>" + t("colName") + '</th><th class="r">' + t("colGross") + '</th><th class="r">' + t("cEmpSS") + '</th><th class="r">' + t("cErSS") + '</th><th class="r">' + t("cEmpPen") + '</th><th class="r">' + t("cErPen") + '</th><th class="r">' + t("cTax") + "</th></tr>";
      document.querySelector("#tCon tbody").innerHTML = rows.map(x => "<tr><td>" + x.e.name + '</td><td class="r">' + M(x.gross) + '</td><td class="r">' + M(x.ss) + '</td><td class="r">' + M(x.erSS) + '</td><td class="r">' + M(x.pen) + '</td><td class="r">' + M(x.erPen) + '</td><td class="r">' + M(x.it) + "</td></tr>").join("");
      const S = k => rows.reduce((a, x) => a + x[k], 0);
      document.querySelector("#tCon tfoot").innerHTML = "<tr><td>" + t("total") + '</td><td class="r">' + M(S("gross")) + '</td><td class="r">' + M(S("ss")) + '</td><td class="r">' + M(S("erSS")) + '</td><td class="r">' + M(S("pen")) + '</td><td class="r">' + M(S("erPen")) + '</td><td class="r">' + M(S("it")) + "</td></tr>";
      UI.openModal("mCon");
    }
    let bankRows = [];
    function showBank() {
      const rows = calc(run());
      bankRows = [["account", "name", "id", "amount", "reference"]].concat(rows.map(x => [x.e.acc, x.e.name, x.e.id, x.net.toFixed(2), run().code]));
      document.getElementById("bankNote").textContent = t("bankNote", { n: rows.length, v: M(rows.reduce((a, x) => a + x.net, 0)) });
      document.getElementById("bankFile").textContent = bankRows.slice(0, 40).map(r => r.join(",")).join("\n") + (rows.length > 39 ? "\n…" : "");
      UI.openModal("mBank");
    }
    document.getElementById("bankCsv").addEventListener("click", () => UI.csvDownload(run().code + "-bank.csv", bankRows));
    function openApply() {
      const R = run(), rows = calc(R), S = k => rows.reduce((a, x) => a + x[k], 0);
      document.getElementById("aKpis").innerHTML = [["kEmp", UI.fmtInt(rows.length)], ["kGross", M(S("gross"))], ["kDed", M(S("ded"))], ["kNet", M(S("net"))], ["kSS", M(S("erSS"))], ["kPen", M(S("erPen"))]]
        .map(k => '<div class="mc-kpi"><div class="k-label">' + t(k[0]) + '</div><div class="k-value">' + k[1] + "</div></div>").join("");
      document.getElementById("aNote").textContent = R.applied ? t("alreadyApplied") : t("applyNote");
      document.getElementById("aGo").disabled = R.applied;
      document.getElementById("aRun").hidden = true;
      UI.openModal("mApply");
    }
    document.getElementById("aGo").addEventListener("click", () => {
      const R = run(), steps = [t("st1", { n: EMP.length }), t("st2"), t("st3")];
      const bar = document.querySelector("#aBar span"), list = document.getElementById("aSteps");
      document.getElementById("aRun").hidden = false; document.getElementById("aGo").disabled = true; document.getElementById("aClose").disabled = true;
      let i = 0;
      const tick = () => {
        list.innerHTML = steps.map((s, k) => "<li><span>" + (k < i ? mi("check_circle", "pos") : k === i ? mi("autorenew") : mi("radio_button_unchecked")) + " " + s + "</span></li>").join("");
        bar.style.width = (i / steps.length * 100) + "%"; document.getElementById("aBar").setAttribute("aria-valuenow", String(Math.round(i / steps.length * 100)));
        if (i < steps.length) { i++; setTimeout(tick, 650); return; }
        R.applied = true; document.getElementById("aClose").disabled = false; UI.closeModal("mApply"); fillTop(); render(); UI.toast(t("appliedMsg", { c: R.code })); showEntry();
      };
      tick();
    });
    // New record
    UI.maskMoney(document.getElementById("nAmt"));
    document.getElementById("btnNew").addEventListener("click", () => {
      const $e = $("#nEmp"); $e.empty(); EMP.forEach((e, i) => $e.append(new Option(e.name + " · " + e.id, String(i)))); $e.select2({ width: "100%", dropdownParent: $("#mNew") });
      const $t = $("#nType"); $t.empty(); [["tDed", "tDed"], ["tBonus", "tBonus"]].forEach(x => $t.append(new Option(t(x[1]), x[0]))); $t.select2({ width: "100%", minimumResultsForSearch: Infinity, dropdownParent: $("#mNew") });
      ["nAmt", "nDet"].forEach(id => { document.getElementById(id).value = ""; document.getElementById(id).removeAttribute("aria-invalid"); });
      ["nAmtErr", "nDetErr"].forEach(id => document.getElementById(id).textContent = "");
      UI.openModal("mNew");
    });
    document.getElementById("nSave").addEventListener("click", () => {
      const v = UI.parseMoney(document.getElementById("nAmt").value), d = document.getElementById("nDet").value.trim(); let ok = true;
      const set = (id, eid, msg) => { document.getElementById(eid).textContent = msg; document.getElementById(id).setAttribute("aria-invalid", msg ? "true" : "false"); if (msg) ok = false; };
      set("nAmt", "nAmtErr", v > 0 ? "" : t("errAmt")); set("nDet", "nDetErr", d ? "" : t("errDet"));
      if (!ok) return;
      const i = Number($("#nEmp").val()), code = run().code;
      (adj[code] = adj[code] || []).push({ i, type: $("#nType").val(), v, d });
      UI.closeModal("mNew"); render(); UI.toast(t("savedAdj", { n: EMP[i].name }));
    });
    document.querySelectorAll("[data-close]").forEach(b => b.addEventListener("click", () => UI.closeModal(b.dataset.close)));
    document.getElementById("btnApply").addEventListener("click", openApply);
    document.getElementById("btnAcc").addEventListener("click", showEntry);
    document.getElementById("btnContrib").addEventListener("click", showContrib);
    document.getElementById("btnUpload").addEventListener("click", showBank);
    document.getElementById("tabs").addEventListener("click", e => { const b = e.target.closest("[data-tab]"); if (b) { tab = b.dataset.tab; render(); } });
    $("#fRun").on("change", () => { runIdx = Number($("#fRun").val()); render(); });
    $("#fGroup").on("change", () => { group = $("#fGroup").val(); render(); });
    document.getElementById("fSearch").addEventListener("input", render);
    const about = () => document.getElementById("about").innerHTML = UI.aboutBox("aboutText");
    document.addEventListener("langchange", () => { fillTop(); render(); about(); });
    fillTop(); render(); about();
  });
  </script>
</body>
</html>
