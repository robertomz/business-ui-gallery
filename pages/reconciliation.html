<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entry reconciliation · Business UI Gallery</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,300..500,0..1,0&display=block" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/select2/4.0.13/css/select2.min.css">
  <link rel="stylesheet" href="../assets/css/base.css">
  <style>
    tr.pick { cursor: pointer; }
    tr.pick.is-sel td { background: var(--bg-selected); }
    tr.pick:focus-visible { outline: 2px solid var(--focus); outline-offset: -2px; }
    .legend { display: grid; grid-template-columns: minmax(150px, 220px) 1fr; gap: 4px 14px; margin-top: 8px; }
    .legend b { font-weight: 600; color: var(--text-heading); }
    .legend span { color: var(--text-secondary); }
    @media (max-width: 600px) { .legend { grid-template-columns: 1fr; } .legend span { margin-bottom: 6px; } }
  </style>
</head>
<body data-page="reconciliation" data-root="../">
  <main id="content">
    <section class="mc-panel">
      <form class="mc-filters" id="filters">
        <div class="mc-field w-lg"><label for="fCode" data-i18n="fCode"></label><select id="fCode"></select></div>
        <div class="mc-field" style="max-width:170px"><label for="fFrom" data-i18n="from"></label><input type="date" id="fFrom"></div>
        <div class="mc-field" style="max-width:170px"><label for="fTo" data-i18n="to"></label><input type="date" id="fTo"></div>
        <button class="btn btn-teal" type="submit"><span class="material-icons" aria-hidden="true">search</span><span data-i18n="load"></span></button>
      </form>
    </section>
    <p class="mc-hint" id="hint" role="status"></p>

    <div id="result" hidden>
      <div class="mc-kpis" id="kpis"></div>

      <section class="mc-panel" style="margin-top:12px">
        <div class="mc-panel-title"><h3><span class="material-icons" aria-hidden="true">summarize</span><span data-i18n="summary"></span></h3><span class="mc-hint" data-i18n="summaryHint"></span></div>
        <div class="table-wrap"><table class="grid" id="tSum"><thead></thead><tbody></tbody><tfoot></tfoot></table></div>
      </section>

      <section class="mc-panel" style="margin-top:12px" id="dailyPanel">
        <div class="mc-panel-title">
          <h3><span class="material-icons" aria-hidden="true">calendar_month</span><span id="dailyTitle"></span></h3>
          <label class="mc-check"><input type="checkbox" id="onlyDiff" checked><span data-i18n="onlyDiff"></span></label>
        </div>
        <div class="table-wrap"><table class="grid" id="tDay"><thead></thead><tbody></tbody><tfoot></tfoot></table></div>
      </section>
    </div>
    <div id="about"></div>
  </main>

  <div class="modal-backdrop" id="mDetail">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="mDetailTitle">
      <div class="modal-head"><h3 id="mDetailTitle"><span class="material-icons" aria-hidden="true">manage_search</span><span></span></h3>
        <div class="mc-field" style="max-width:240px;min-width:180px"><label for="fType" data-i18n="diffType"></label><select id="fType"></select></div></div>
      <div class="modal-body"><div class="table-wrap"><table class="grid" id="tDetail"><thead></thead><tbody></tbody></table></div></div>
      <div class="modal-foot"><button type="button" class="btn" id="mDetailClose"><span class="material-icons" aria-hidden="true">close</span><span data-i18n="close"></span></button></div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/select2/4.0.13/js/select2.min.js"></script>
  <script src="../assets/js/common.js"></script>
  <script>
  UI.strings({
    en: {
      fCode: "Reconciliation", allCodes: "All enabled reconciliations", summary: "Summary by code", summaryHint: "Select a code to see it day by day",
      onlyDiff: "Only days with difference", daily: "Daily cross-check · {c}", diffType: "Difference type", allTypes: "All types",
      kCodes: "Codes reviewed", kDays: "Days with difference", kA: "Side A (documents)", kB: "Side B (entries)", kDiff: "Net difference",
      colCode: "Code", colName: "Reconciliation", colA: "Side A", colB: "Side B", colDiff: "Difference", colDays: "Days with diff.", colStatus: "Status",
      colDate: "Date", colDocs: "Documents", colEntries: "Entries", colValDocs: "Document value", colValEntries: "Entry value",
      colType: "Type", colKey: "Document / key", colExpDate: "Expected date", colEntryDate: "Entry date", colExp: "Expected value", colPosted: "Posted value", colEntryNo: "Entry no.", colDetail: "Detail",
      st_ok: "Matched", st_diff: "With difference", loaded: "{n} reconciliations loaded from {f} to {t}.", detailTitle: "Detail of {c} on {d}",
      t_missing: "No entry", t_nodoc: "Entry without document", t_dup: "Duplicated", t_amount: "Amount differs", t_date: "Different date", t_unbal: "Unbalanced", t_onlyA: "Cross: only on side A", t_onlyB: "Cross: only on side B", t_cross: "Cross: amount differs",
      d_missing: "The document exists in the source but no entry was generated. Generate the code for that date.",
      d_nodoc: "There is an entry for the document but it is no longer in the source: it was voided, its date changed or its reference changed. If the detail says it was replaced, the old entry is a duplicate and should be deleted.",
      d_dup: "The same document has more than one entry.", d_amount: "The entry does not have the document value (beyond the tolerance). The document was corrected after generating; generate that day again.",
      d_date: "The entry is on a different day than the document.", d_unbal: "The entry does not have debit equal to credit.",
      d_onlyAB: "The document, day or branch has entries on one side and not on the other.", d_cross: "Both sides have entries but they do not add up to the same (beyond the tolerance).",
      c1: "Cash sales vs cash account", c2: "Card sales vs cards receivable", c3: "Purchases vs suppliers", c4: "Returns vs sales", c5: "Payroll vs salaries expense", c6: "Deposits vs bank accounts",
      aboutText: "Each reconciliation checks a <b>side A</b> (one or several entry codes) against a <b>side B</b> (other codes that must add up the same), matching by document, by day or by day and branch. Each side's value is the total debit of its entries or, if the reconciliation has a cross account, the balance of that account (for example cash sales debit cash, and deposits in transit credit it). Codes with a <b>document source</b> are also checked document by document against the source system. Duplicated and unbalanced entries are always reviewed. Reconciliations are configured in a catalog. Difference types:"
    },
    es: {
      fCode: "Conciliación", allCodes: "Todas las conciliaciones habilitadas", summary: "Resumen por código", summaryHint: "Elija un código para verlo día por día",
      onlyDiff: "Solo días con diferencia", daily: "Cruce diario · {c}", diffType: "Tipo de diferencia", allTypes: "Todos los tipos",
      kCodes: "Códigos revisados", kDays: "Días con diferencia", kA: "Lado A (documentos)", kB: "Lado B (partidas)", kDiff: "Diferencia neta",
      colCode: "Código", colName: "Conciliación", colA: "Lado A", colB: "Lado B", colDiff: "Diferencia", colDays: "Días con dif.", colStatus: "Estado",
      colDate: "Fecha", colDocs: "Documentos", colEntries: "Partidas", colValDocs: "Valor documentos", colValEntries: "Valor partidas",
      colType: "Tipo", colKey: "Documento / llave", colExpDate: "Fecha esperada", colEntryDate: "Fecha partida", colExp: "Valor esperado", colPosted: "Valor registrado", colEntryNo: "No. partida", colDetail: "Detalle",
      st_ok: "Cuadra", st_diff: "Con diferencia", loaded: "Se cargaron {n} conciliaciones del {f} al {t}.", detailTitle: "Detalle de {c} del {d}",
      t_missing: "Sin partida", t_nodoc: "Partida sin documento", t_dup: "Duplicada", t_amount: "Monto distinto", t_date: "Fecha distinta", t_unbal: "Descuadrada", t_onlyA: "Cruce: solo en lado A", t_onlyB: "Cruce: solo en lado B", t_cross: "Cruce: monto distinto",
      d_missing: "El documento existe en el origen pero no se generó su partida. Genere el código para esa fecha.",
      d_nodoc: "Hay partida para el documento pero ya no sale en el origen: se anuló, cambió de fecha o cambió su referencia. Si el detalle dice que se reemplazó, la partida vieja está duplicada y hay que borrarla.",
      d_dup: "El mismo documento tiene más de una partida.", d_amount: "La partida no tiene el valor del documento (más que la tolerancia). Se corrigió el documento después de generar; vuelva a generar ese día.",
      d_date: "La partida está en otro día que el documento.", d_unbal: "La partida no tiene Debe igual a Haber.",
      d_onlyAB: "El documento, día o sucursal tiene partidas en un lado y no en el otro.", d_cross: "Los dos lados tienen partidas pero no suman lo mismo (más que la tolerancia).",
      c1: "Ventas de contado vs caja", c2: "Ventas con tarjeta vs tarjetas por cobrar", c3: "Compras vs proveedores", c4: "Devoluciones vs ventas", c5: "Planilla vs gasto de sueldos", c6: "Depósitos vs bancos",
      aboutText: "Cada conciliación cuadra un <b>lado A</b> (uno o varios códigos de partida) contra un <b>lado B</b> (otros códigos que deben sumar lo mismo), emparejando por documento, por día o por día y sucursal. El valor de cada lado es el total Debe de sus partidas o, si la conciliación tiene cuenta de cruce, el saldo de esa cuenta (por ejemplo, las ventas de contado cargan a caja y los depósitos en tránsito la abonan). Los códigos con <b>fuente de documentos</b> además se revisan documento por documento contra el sistema de origen. Siempre se revisan las partidas duplicadas y descuadradas. Las conciliaciones se configuran en un catálogo. Tipos de diferencia:"
    }
  });

  $(function () {
    const t = UI.t, M = UI.fmtMoney, mi = UI.mi;
    function s2($el, opts) { if ($el.hasClass("select2-hidden-accessible")) $el.select2("destroy"); $el.select2(Object.assign({ width: "100%" }, opts)); }
    const CODES = [["CNC-01", "c1", 42000], ["CNC-02", "c2", 26000], ["CNC-03", "c3", 61000], ["CNC-04", "c4", 1800], ["CNC-05", "c5", 38000], ["CNC-06", "c6", 52000]];
    const TYPES = { missing: "t_missing", nodoc: "t_nodoc", dup: "t_dup", amount: "t_amount", date: "t_date", unbal: "t_unbal", onlyA: "t_onlyA", onlyB: "t_onlyB", cross: "t_cross" };
    const TYPE_ICON = { missing: "remove_circle_outline", nodoc: "link_off", dup: "content_copy", amount: "difference", date: "event_busy", unbal: "balance", onlyA: "arrow_back", onlyB: "arrow_forward", cross: "compare_arrows" };
    const $code = $("#fCode");
    function fillCodes() {
      const v = $code.val();
      $code.empty().append(new Option(t("allCodes"), "all"));
      CODES.forEach(c => $code.append(new Option(c[0] + " · " + t(c[1]), c[0])));
      $code.val(v || "all"); s2($code, {});
    }
    fillCodes();
    const fFrom = document.getElementById("fFrom"), fTo = document.getElementById("fTo");
    fFrom.value = "2026-11-01"; fTo.value = "2026-11-16";

    let state = null, selCode = null, detail = null;

    // One deterministic day per code: side A (documents) vs side B (entries) and the issues behind any difference.
    function dayRow(code, d) {
      const seed = Math.floor(d.getTime() / 86400000) * 31 + CODES.findIndex(c => c[0] === code[0]) * 977;
      const r = UI.rng(seed);
      const wd = d.getUTCDay() === 0 ? 0.25 : 1;
      const docs = Math.max(1, Math.round(UI.between(r, 8, 40) * wd));
      const A = code[2] * wd * UI.between(r, .8, 1.2);
      const issues = [];
      if (r() < .2) {
        const kind = UI.pick(r, Object.keys(TYPES));
        const n = 1 + Math.floor(r() * 2);
        for (let i = 0; i < n; i++) {
          const exp = UI.between(r, 200, 4500);
          let posted = exp, diffDate = false;
          if (kind === "missing" || kind === "onlyA") posted = 0;
          else if (kind === "nodoc" || kind === "onlyB") posted = exp;
          else if (kind === "dup") posted = exp * 2;
          else if (kind === "amount" || kind === "cross") posted = exp + UI.between(r, -300, 300);
          else if (kind === "date") diffDate = true;
          issues.push({ kind, key: "DOC-" + (100000 + Math.floor(r() * 899999)), exp: kind === "nodoc" || kind === "onlyB" ? 0 : exp, posted: kind === "unbal" ? exp : posted,
            entry: posted ? "PT-" + (40000 + Math.floor(r() * 9999)) : "—", diffDate, branch: UI.pick(r, UI.DATA.branches) });
        }
      }
      const B = A + issues.reduce((a, x) => a + (x.kind === "date" ? -x.exp : x.posted - x.exp), 0);
      return { d, docs, entries: docs + issues.filter(x => x.kind === "dup").length - issues.filter(x => x.kind === "missing").length, A, B, diff: B - A, issues };
    }
    function days() { const out = []; for (let x = state.from.getTime(); x <= state.to.getTime(); x += 86400000) out.push(new Date(x)); return out; }

    function statusChip(diff) {
      return Math.abs(diff) < .005 ? '<span class="chip chip-pos">' + mi("check_circle") + t("st_ok") + "</span>" : '<span class="chip chip-neg">' + mi("error_outline") + t("st_diff") + "</span>";
    }

    function render() {
      if (!state) return;
      const codes = state.code === "all" ? CODES : CODES.filter(c => c[0] === state.code);
      const sums = codes.map(c => { const rows = days().map(d => dayRow(c, d)); return { c, rows, A: rows.reduce((a, x) => a + x.A, 0), B: rows.reduce((a, x) => a + x.B, 0), nd: rows.filter(x => Math.abs(x.diff) >= .005).length }; });
      if (!selCode || !codes.find(c => c[0] === selCode)) selCode = sums.find(s => s.nd)?.c[0] || codes[0][0];
      const A = sums.reduce((a, s) => a + s.A, 0), B = sums.reduce((a, s) => a + s.B, 0);
      document.getElementById("kpis").innerHTML = [["kCodes", UI.fmtInt(codes.length)], ["kDays", UI.fmtInt(sums.reduce((a, s) => a + s.nd, 0))], ["kA", M(A)], ["kB", M(B)], ["kDiff", '<span class="' + (Math.abs(B - A) >= .005 ? "neg" : "pos") + '">' + M(B - A) + "</span>"]]
        .map(k => '<div class="mc-kpi"><div class="k-label">' + t(k[0]) + '</div><div class="k-value">' + k[1] + "</div></div>").join("");
      document.querySelector("#tSum thead").innerHTML = "<tr><th>" + t("colCode") + "</th><th>" + t("colName") + '</th><th class="r">' + t("colA") + '</th><th class="r">' + t("colB") + '</th><th class="r">' + t("colDiff") + '</th><th class="r">' + t("colDays") + "</th><th>" + t("colStatus") + "</th></tr>";
      document.querySelector("#tSum tbody").innerHTML = sums.map(s => '<tr class="pick' + (s.c[0] === selCode ? " is-sel" : "") + '" tabindex="0" data-code="' + s.c[0] + '" aria-selected="' + (s.c[0] === selCode) + '"><td>' + s.c[0] + "</td><td>" + t(s.c[1]) +
        '</td><td class="r">' + M(s.A) + '</td><td class="r">' + M(s.B) + '</td><td class="r ' + (Math.abs(s.B - s.A) >= .005 ? "neg" : "") + '">' + M(s.B - s.A) + '</td><td class="r">' + s.nd + "</td><td>" + statusChip(s.B - s.A) + "</td></tr>").join("");
      document.querySelector("#tSum tfoot").innerHTML = '<tr><td colspan="2">' + t("total") + '</td><td class="r">' + M(A) + '</td><td class="r">' + M(B) + '</td><td class="r">' + M(B - A) + '</td><td class="r">' + sums.reduce((a, s) => a + s.nd, 0) + "</td><td></td></tr>";
      state.sums = sums;
      renderDaily();
    }

    function renderDaily() {
      const s = state.sums.find(x => x.c[0] === selCode);
      document.getElementById("dailyTitle").textContent = t("daily", { c: s.c[0] + " · " + t(s.c[1]) });
      const only = document.getElementById("onlyDiff").checked;
      const rows = s.rows.filter(x => !only || Math.abs(x.diff) >= .005);
      document.querySelector("#tDay thead").innerHTML = "<tr><th>" + t("colDate") + "</th><th>" + t("colCode") + '</th><th class="r">' + t("colDocs") + '</th><th class="r">' + t("colEntries") + '</th><th class="r">' + t("colValDocs") + '</th><th class="r">' + t("colValEntries") + '</th><th class="r">' + t("colDiff") + "</th><th>" + t("colStatus") + "</th></tr>";
      document.querySelector("#tDay tbody").innerHTML = rows.length ? rows.map(x => '<tr class="pick" tabindex="0" data-day="' + UI.fmtDate(x.d) + '"><td>' + UI.fmtDay(x.d) + "</td><td>" + s.c[0] + '</td><td class="r">' + x.docs + '</td><td class="r">' + x.entries + '</td><td class="r">' + M(x.A) + '</td><td class="r">' + M(x.B) +
        '</td><td class="r ' + (Math.abs(x.diff) >= .005 ? "neg" : "") + '">' + M(x.diff) + "</td><td>" + statusChip(x.diff) + "</td></tr>").join("") : '<tr><td colspan="8" class="muted">' + t("noData") + "</td></tr>";
      const sum = k => rows.reduce((a, x) => a + x[k], 0);
      document.querySelector("#tDay tfoot").innerHTML = '<tr><td colspan="2">' + t("total") + '</td><td class="r">' + sum("docs") + '</td><td class="r">' + sum("entries") + '</td><td class="r">' + M(sum("A")) + '</td><td class="r">' + M(sum("B")) + '</td><td class="r">' + M(sum("diff")) + "</td><td></td></tr>";
    }

    function openDetail(dayIso) {
      const s = state.sums.find(x => x.c[0] === selCode);
      const row = s.rows.find(x => UI.fmtDate(x.d) === dayIso);
      detail = { s, row };
      fillTypes();
      renderDetail();
      UI.openModal("mDetail");
    }
    function fillTypes() {
      const $t = $("#fType"); $t.empty().append(new Option(t("allTypes"), "all"));
      Object.keys(TYPES).forEach(k => $t.append(new Option(t(TYPES[k]), k)));
      $t.val("all"); s2($t, { dropdownParent: $("#mDetail") });
    }
    function renderDetail() {
      if (!detail) return;
      const { s, row } = detail;
      document.querySelector("#mDetailTitle span:last-child").textContent = t("detailTitle", { c: s.c[0], d: UI.fmtDay(row.d) });
      const f = $("#fType").val() || "all";
      const list = row.issues.filter(x => f === "all" || x.kind === f);
      document.querySelector("#tDetail thead").innerHTML = "<tr><th>" + t("colCode") + "</th><th>" + t("colType") + "</th><th>" + t("colKey") + "</th><th>" + t("colExpDate") + "</th><th>" + t("colEntryDate") + '</th><th class="r">' + t("colExp") + '</th><th class="r">' + t("colPosted") + '</th><th class="r">' + t("colDiff") + "</th><th>" + t("colEntryNo") + "</th><th>" + t("colDetail") + "</th></tr>";
      const desc = k => t({ missing: "d_missing", nodoc: "d_nodoc", dup: "d_dup", amount: "d_amount", date: "d_date", unbal: "d_unbal", onlyA: "d_onlyAB", onlyB: "d_onlyAB", cross: "d_cross" }[k]);
      document.querySelector("#tDetail tbody").innerHTML = list.length ? list.map(x => {
        const ed = x.diffDate ? new Date(row.d.getTime() + 86400000) : row.d;
        return "<tr><td>" + s.c[0] + '</td><td><span class="chip chip-neg">' + mi(TYPE_ICON[x.kind]) + t(TYPES[x.kind]) + "</span></td><td>" + x.key + " · " + x.branch + "</td><td>" + UI.fmtDay(row.d) + "</td><td>" + (x.entry === "—" ? "—" : UI.fmtDay(ed)) +
          '</td><td class="r">' + M(x.exp) + '</td><td class="r">' + M(x.posted) + '</td><td class="r neg">' + M(x.posted - x.exp) + "</td><td>" + x.entry + '</td><td style="min-width:240px;white-space:normal" class="muted">' + desc(x.kind) + "</td></tr>";
      }).join("") : '<tr><td colspan="10" class="muted">' + t("noData") + "</td></tr>";
    }

    function about() {
      const legend = [["t_missing", "d_missing"], ["t_nodoc", "d_nodoc"], ["t_dup", "d_dup"], ["t_amount", "d_amount"], ["t_date", "d_date"], ["t_unbal", "d_unbal"], ["t_onlyA", "d_onlyAB"], ["t_cross", "d_cross"]]
        .map(x => "<b>" + (x[0] === "t_onlyA" ? t("t_onlyA").replace(/A$/, "A / B") : t(x[0])) + "</b><span>" + t(x[1]) + "</span>").join("");
      document.getElementById("about").innerHTML = UI.aboutBox("aboutText");
      document.querySelector("#about .mc-about > div").insertAdjacentHTML("afterend", '<div class="legend">' + legend + "</div>");
    }

    function load() {
      state = { code: $code.val(), from: new Date(fFrom.value + "T00:00:00Z"), to: new Date(fTo.value + "T00:00:00Z") };
      if (state.to < state.from) { const x = state.from; state.from = state.to; state.to = x; }
      document.getElementById("result").hidden = false;
      document.getElementById("hint").textContent = t("loaded", { n: state.code === "all" ? CODES.length : 1, f: UI.fmtDay(state.from), t: UI.fmtDay(state.to) });
      render();
    }

    document.getElementById("filters").addEventListener("submit", e => { e.preventDefault(); load(); });
    document.getElementById("onlyDiff").addEventListener("change", renderDaily);
    const onPick = e => {
      const tr = e.target.closest("tr.pick");
      if (!tr) return;
      if (tr.dataset.code) { selCode = tr.dataset.code; render(); document.getElementById("dailyPanel").scrollIntoView({ behavior: "smooth", block: "start" }); }
      else if (tr.dataset.day) openDetail(tr.dataset.day);
    };
    ["tSum", "tDay"].forEach(id => {
      const el = document.getElementById(id);
      el.addEventListener("click", onPick);
      el.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); onPick(e); } });
    });
    $("#fType").on("change", renderDetail);
    document.getElementById("mDetailClose").addEventListener("click", () => UI.closeModal("mDetail"));
    document.addEventListener("langchange", () => { fillCodes(); about(); if (state) { load(); if (document.getElementById("mDetail").classList.contains("open")) { fillTypes(); renderDetail(); } } else document.getElementById("hint").textContent = t("loadHint"); });
    about();
    document.getElementById("hint").textContent = t("loadHint");
    load();
  });
  </script>
</body>
</html>
