<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bank payment · Business UI Gallery</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/select2/4.0.13/css/select2.min.css">
  <link rel="stylesheet" href="../assets/css/base.css">
  <style>
    .form-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px 12px; }
    .form-grid .span-2 { grid-column: span 2; }
    .form-grid .span-4 { grid-column: 1 / -1; }
    .form-grid .mc-field { min-width: 0; }
    .bal-box { display: flex; justify-content: space-between; gap: 8px; font-size: 11px; color: var(--mc-muted); margin-top: 3px; }
    .bal-box b { color: var(--mc-text); font-variant-numeric: tabular-nums; }
    .words { min-height: 34px; padding: 7px 9px; border: 1px dashed var(--mc-line); border-radius: 6px; font-size: 12px; font-weight: 600; background: rgba(148, 163, 184, .05); }
    .apply-in { width: 120px; min-height: 28px; padding: 3px 7px; border: 1px solid var(--mc-line); border-radius: 5px; background: var(--mc-panel-2); color: var(--mc-text); text-align: right; font-size: 11.5px; }
    .apply-in[aria-invalid="true"] { border-color: var(--mc-bad); }
    .seg { display: inline-flex; border: 1px solid var(--mc-line); border-radius: 8px; padding: 2px; flex-wrap: wrap; }
    .seg button { min-height: 30px; padding: 0 12px; border: 0; border-radius: 6px; background: transparent; color: var(--mc-muted); font-size: 12px; font-weight: 700; cursor: pointer; }
    .seg button[aria-pressed="true"] { background: rgba(20, 184, 166, .18); color: var(--mc-text); }
    .sum-line { display: flex; flex-wrap: wrap; gap: 8px 18px; justify-content: flex-end; font-size: 12px; margin-top: 8px; }
    .sum-line b { font-variant-numeric: tabular-nums; }
    .actions { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
    @media (max-width: 1000px) { .form-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
    @media (max-width: 560px) { .form-grid { grid-template-columns: minmax(0, 1fr); } .form-grid .span-2 { grid-column: auto; } }
  </style>
</head>
<body data-page="bank-payment" data-root="../">
  <main id="content">
    <div class="mc-tabs" role="tablist" id="payerTabs" aria-label="Payer"></div>

    <section class="mc-panel">
      <div class="mc-panel-title"><h3><span class="material-icons" aria-hidden="true">account_balance</span><span data-i18n="secHeader"></span></h3><span class="chip chip-info" id="docChip"></span></div>
      <div class="form-grid">
        <div class="mc-field"><label data-i18n="company"></label><div class="static">DEMO</div></div>
        <div class="mc-field"><label for="fBranch" data-i18n="branch"></label><select id="fBranch"></select></div>
        <div class="mc-field span-2"><label for="fAccount" data-i18n="fAccount"></label><select id="fAccount"></select>
          <div class="bal-box"><span data-i18n="available"></span><b id="balNow"></b></div><div class="bal-box"><span data-i18n="afterPay"></span><b id="balAfter"></b></div></div>
        <div class="mc-field"><label for="fDate" data-i18n="date"></label><input type="date" id="fDate"></div>
        <div class="mc-field"><label data-i18n="fMethod"></label><div class="seg" id="method"><button type="button" data-v="check" aria-pressed="true"></button><button type="button" data-v="transfer" aria-pressed="false"></button></div></div>
        <div class="mc-field"><label for="fNumber" data-i18n="fNumber"></label><input id="fNumber" inputmode="numeric" autocomplete="off"><span class="mc-field-error" id="eNumber"></span></div>
        <div class="mc-field"><label for="fAmount" data-i18n="fAmount"></label><input id="fAmount" class="num" inputmode="decimal" autocomplete="off"><span class="mc-field-error" id="eAmount"></span></div>
        <div class="mc-field"><label for="fRate" data-i18n="fRate"></label><input id="fRate" class="num" inputmode="decimal" readonly><span class="mc-hint" id="rateHint"></span></div>
        <div class="mc-field"><label for="fPayeeType" data-i18n="fPayeeType"></label><select id="fPayeeType"></select></div>
        <div class="mc-field span-2"><label for="fPayee" data-i18n="fPayee"></label><select id="fPayee"></select><span class="mc-field-error" id="ePayee"></span></div>
        <div class="mc-field span-4"><label for="fConcept" data-i18n="fConcept"></label><input id="fConcept" maxlength="200"><span class="mc-field-error" id="eConcept"></span></div>
        <div class="mc-field span-4"><label data-i18n="fWords"></label><div class="words" id="words" aria-live="polite"></div></div>
      </div>
    </section>

    <section class="mc-panel">
      <div class="mc-panel-title">
        <h3><span class="material-icons" aria-hidden="true">playlist_add_check</span><span data-i18n="secApply"></span></h3>
        <div class="seg" id="applyTo"></div>
      </div>
      <div class="table-wrap"><table class="grid" id="tApply"><thead></thead><tbody></tbody><tfoot></tfoot></table></div>
      <div class="sum-line" id="applySum"></div>
    </section>

    <section class="mc-panel">
      <div class="mc-panel-title"><h3><span class="material-icons" aria-hidden="true">receipt_long</span><span data-i18n="secEntry"></span></h3><span id="entryChip"></span></div>
      <div class="table-wrap"><table class="grid" id="tEntry"><thead></thead><tbody></tbody><tfoot></tfoot></table></div>
      <div class="actions" style="margin-top:12px">
        <button type="button" class="btn btn-teal" id="btnSave"><span class="material-icons" aria-hidden="true">save</span><span data-i18n="save"></span></button>
        <button type="button" class="btn" id="btnClear"><span class="material-icons" aria-hidden="true">close</span><span data-i18n="close"></span></button>
      </div>
    </section>

    <section class="mc-panel">
      <div class="mc-panel-title"><h3><span class="material-icons" aria-hidden="true">history</span><span data-i18n="secRecent"></span></h3></div>
      <div class="table-wrap"><table class="grid" id="tRecent"><thead></thead><tbody></tbody></table></div>
    </section>
    <div id="about"></div>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/select2/4.0.13/js/select2.min.js"></script>
  <script src="../assets/js/common.js"></script>
  <script>
  UI.strings({
    en: {
      tabOwn: "Own accounts", tabInter: "Intercompany", tabPartner: "Partners / third parties",
      secHeader: "Debit movement", secApply: "Apply to", secEntry: "Accounting entry", secRecent: "Recent movements",
      fAccount: "Bank account", available: "Available balance", afterPay: "Balance after this payment", fMethod: "Type", check: "Check", transfer: "Transfer",
      fNumber: "Number", fAmount: "Amount", fRate: "Exchange rate", rateLocal: "Local currency: rate 1", rateFx: "Rate of the day for USD",
      fPayeeType: "Payee type", supplier: "Supplier", creditor: "Creditor", fPayee: "Payee", fConcept: "Concept", fWords: "Amount in words",
      apSupplier: "Supplier invoices", apAdvance: "Advance", apRequest: "Payment requests", apCard: "Credit card",
      colAcc: "Account", colEntity: "Entity", colDoc: "Document", colDue: "Due", colBal: "Balance", colPay: "Payment", colPayLocal: "Payment (local)", colAdj: "Exch. diff.", colPayFx: "Payment (USD)",
      applied: "Applied", movement: "Movement", pendingApply: "Pending to apply", roundDiff: "Rounding / exchange difference",
      colDebit: "Debit", colCredit: "Credit", balanced: "Balanced", unbalanced: "Unbalanced",
      eNumberReq: "Enter the check number.", eNumberDup: "Check {n} was already used on this account.", eAmountReq: "Enter an amount greater than zero.", eAmountBal: "The amount is greater than the available balance.",
      ePayeeReq: "Choose the payee.", eConceptReq: "Enter the concept.", eApply: "The applied total must equal the amount (difference {d}).", eLine: "Cannot exceed the balance.",
      savedMsg: "Movement {n} saved and the entry generated.", fixErrors: "Check the fields marked in red.",
      colDate: "Date", colType: "Type", colNumber: "Number", colPayee: "Payee", colAmount: "Amount", colStatus: "Status", stPosted: "Posted",
      accBank: "Bank · {b}", accPayable: "Accounts payable · suppliers", accAdvance: "Advances to suppliers", accReqPay: "Payment requests payable", accCard: "Credit cards payable", accFx: "Exchange difference",
      advanceDoc: "Advance on future invoices",
      aboutText: "A <b>debit movement</b> takes money out of a bank account: a <b>check</b> (its number is suggested and cannot repeat on the same account) or a <b>transfer</b>. The payer can be one of the company's own accounts, another company of the group (<b>intercompany</b>) or a partner. The amount is applied to what is being paid: supplier invoices, an advance, approved payment requests or a credit card; the applied total must equal the amount before saving. With a USD account the payment is converted with the rate of the day and any <b>rounding or exchange difference</b> gets its own line. The <b>amount in words</b> is what prints on the check. The accounting entry is shown before saving, with one line per account and side. All the data on this page is generated."
    },
    es: {
      tabOwn: "Cuentas propias", tabInter: "Intercompany", tabPartner: "Socios / terceros",
      secHeader: "Movimiento débito", secApply: "Aplicar a", secEntry: "Partida contable", secRecent: "Movimientos recientes",
      fAccount: "Cuenta bancaria", available: "Saldo disponible", afterPay: "Saldo después de este pago", fMethod: "Tipo", check: "Cheque", transfer: "Transferencia",
      fNumber: "Número", fAmount: "Valor", fRate: "Tasa de cambio", rateLocal: "Moneda local: tasa 1", rateFx: "Tasa del día para USD",
      fPayeeType: "Tipo de beneficiario", supplier: "Proveedor", creditor: "Acreedor", fPayee: "Beneficiario", fConcept: "Concepto", fWords: "Monto en letras",
      apSupplier: "Facturas de proveedor", apAdvance: "Anticipo", apRequest: "Solicitudes de pago", apCard: "Tarjeta de crédito",
      colAcc: "Cta. contable", colEntity: "Entidad", colDoc: "Documento", colDue: "Vence", colBal: "Saldo", colPay: "Valor pago", colPayLocal: "Valor pago local", colAdj: "Ajuste dif.", colPayFx: "Valor pago M.E.",
      applied: "Aplicado", movement: "Movimiento", pendingApply: "Pendiente de aplicar", roundDiff: "Diferencia por redondeo / cambio",
      colDebit: "Debe", colCredit: "Haber", balanced: "Cuadrada", unbalanced: "Descuadrada",
      eNumberReq: "Escriba el número de cheque.", eNumberDup: "El cheque {n} ya se usó en esta cuenta.", eAmountReq: "Escriba un valor mayor a cero.", eAmountBal: "El valor es mayor que el saldo disponible.",
      ePayeeReq: "Elija el beneficiario.", eConceptReq: "Escriba el concepto.", eApply: "El total aplicado debe ser igual al valor (diferencia {d}).", eLine: "No puede pasar del saldo.",
      savedMsg: "Se guardó el movimiento {n} y se generó la partida.", fixErrors: "Revise los campos marcados en rojo.",
      colDate: "Fecha", colType: "Tipo", colNumber: "Número", colPayee: "Beneficiario", colAmount: "Valor", colStatus: "Estado", stPosted: "Contabilizado",
      accBank: "Banco · {b}", accPayable: "Cuentas por pagar · proveedores", accAdvance: "Anticipos a proveedores", accReqPay: "Solicitudes de pago por pagar", accCard: "Tarjetas de crédito por pagar", accFx: "Diferencial cambiario",
      advanceDoc: "Anticipo a facturas futuras",
      aboutText: "Un <b>movimiento débito</b> saca dinero de una cuenta bancaria: un <b>cheque</b> (el número se sugiere y no se puede repetir en la misma cuenta) o una <b>transferencia</b>. Quien paga puede ser una cuenta propia, otra empresa del grupo (<b>intercompany</b>) o un socio. El valor se aplica a lo que se está pagando: facturas de proveedor, un anticipo, solicitudes de pago aprobadas o una tarjeta de crédito; el total aplicado debe ser igual al valor antes de guardar. Con una cuenta en USD el pago se convierte con la tasa del día y la <b>diferencia por redondeo o cambio</b> lleva su propia línea. El <b>monto en letras</b> es el que se imprime en el cheque. La partida contable se muestra antes de guardar, con una línea por cuenta y lado. Todos los datos de esta página son generados."
    }
  });

  $(function () {
    const t = UI.t, M = UI.fmtMoney, mi = UI.mi, D = UI.DATA;
    const RATE = 24.7312;
    const accounts = D.banks.map((b, i) => ({ id: i, bank: b, number: "**** " + (3010 + i * 1173), cur: i === 3 ? "USD" : "LCY", bal: [1854220.5, 962410.25, 418300, 86240.9][i], used: new Set(["100231", "100232", "100240"].map(n => String(Number(n) + i * 1000))), next: 100241 + i * 1000 }));
    const r = UI.rng(4242);
    const payees = D.suppliers.map((s, i) => ({ id: "S" + i, name: s, type: "supplier" })).concat(["Office Supplies Co.", "City Utilities", "Fleet Services", "Legal Partners"].map((s, i) => ({ id: "C" + i, name: s, type: "creditor" })));
    const docs = {};
    payees.forEach((p, pi) => {
      const n = 2 + Math.floor(r() * 4);
      docs[p.id] = Array.from({ length: n }, (_, k) => ({ id: p.id + "-" + k, doc: (p.type === "supplier" ? "FAC-" : "DOC-") + (20000 + pi * 97 + k * 13), due: new Date(Date.UTC(2026, 10, 1 + Math.floor(r() * 40))), bal: Math.round(UI.between(r, 3500, 68000) * 100) / 100 }));
    });
    const requests = Array.from({ length: 4 }, (_, k) => ({ id: "R" + k, doc: "SP-" + (5100 + k), due: new Date(Date.UTC(2026, 10, 10 + k * 4)), bal: Math.round(UI.between(r, 2500, 22000) * 100) / 100 }));
    const card = { id: "K0", doc: "**** 4417", due: new Date(Date.UTC(2026, 10, 25)), bal: 214350.6 };
    const recent = [
      { d: new Date(Date.UTC(2026, 10, 14)), type: "transfer", n: "TR-88412", payee: D.suppliers[1], amt: 48210.55 },
      { d: new Date(Date.UTC(2026, 10, 13)), type: "check", n: "100240", payee: D.suppliers[3], amt: 12650 },
      { d: new Date(Date.UTC(2026, 10, 12)), type: "check", n: "100232", payee: "City Utilities", amt: 3810.4 }
    ];

    // (Re)initialize select2 safely after options or language change
    function s2($el, opts) { if ($el.hasClass("select2-hidden-accessible")) $el.select2("destroy"); $el.select2(Object.assign({ width: "100%" }, opts)); }
    const S = { payer: "own", method: "check", applyTo: "supplier", applied: {}, touched: false };
    const $acc = $("#fAccount"), $branch = $("#fBranch"), $ptype = $("#fPayeeType"), $payee = $("#fPayee");

    function fillStatic() {
      const tabs = [["own", "tabOwn"], ["inter", "tabInter"], ["partner", "tabPartner"]];
      document.getElementById("payerTabs").innerHTML = tabs.map(x => '<button type="button" class="mc-tab" role="tab" aria-selected="' + (S.payer === x[0]) + '" data-v="' + x[0] + '">' + t(x[1]) + "</button>").join("");
      document.querySelector('#method [data-v="check"]').textContent = t("check");
      document.querySelector('#method [data-v="transfer"]').textContent = t("transfer");
      const ap = [["supplier", "apSupplier"], ["advance", "apAdvance"], ["request", "apRequest"], ["card", "apCard"]];
      document.getElementById("applyTo").innerHTML = ap.map(x => '<button type="button" data-v="' + x[0] + '" aria-pressed="' + (S.applyTo === x[0]) + '">' + t(x[1]) + "</button>").join("");
      const a = $acc.val(), b = $branch.val(), pt = $ptype.val() || "supplier";
      $acc.empty(); accounts.forEach(x => $acc.append(new Option(x.bank + " · " + x.number + " · " + x.cur, String(x.id))));
      $branch.empty(); D.branches.forEach((x, i) => $branch.append(new Option(x, String(i))));
      $ptype.empty().append(new Option(t("supplier"), "supplier"), new Option(t("creditor"), "creditor"));
      $acc.val(a || "0"); $branch.val(b || "2"); $ptype.val(pt);
      s2($acc, {}); s2($branch, {}); s2($ptype, { minimumResultsForSearch: Infinity });
      fillPayees();
    }
    function fillPayees() {
      const v = $payee.val();
      $payee.empty().append(new Option("—", ""));
      payees.filter(p => p.type === $ptype.val()).forEach(p => $payee.append(new Option(p.name, p.id)));
      $payee.val(payees.find(p => p.id === v && p.type === $ptype.val()) ? v : "");
      s2($payee, {});
    }

    const acc = () => accounts[Number($acc.val())];
    const isFx = () => acc().cur === "USD";
    const amount = () => UI.parseMoney(document.getElementById("fAmount").value);

    // Amount in words (check), Spanish or English.
    function words(n) {
      const int = Math.floor(n), cents = Math.round((n - int) * 100);
      if (UI.lang === "es") {
        const U = ["", "un", "dos", "tres", "cuatro", "cinco", "seis", "siete", "ocho", "nueve", "diez", "once", "doce", "trece", "catorce", "quince", "dieciséis", "diecisiete", "dieciocho", "diecinueve", "veinte", "veintiún", "veintidós", "veintitrés", "veinticuatro", "veinticinco", "veintiséis", "veintisiete", "veintiocho", "veintinueve"];
        const T = ["", "", "", "treinta", "cuarenta", "cincuenta", "sesenta", "setenta", "ochenta", "noventa"];
        const H = ["", "ciento", "doscientos", "trescientos", "cuatrocientos", "quinientos", "seiscientos", "setecientos", "ochocientos", "novecientos"];
        const c99 = x => x < 30 ? U[x] : T[Math.floor(x / 10)] + (x % 10 ? " y " + U[x % 10] : "");
        const c999 = x => x === 100 ? "cien" : (x >= 100 ? H[Math.floor(x / 100)] + (x % 100 ? " " : "") : "") + (x % 100 ? c99(x % 100) : "");
        const conv = x => {
          if (x === 0) return "cero";
          let out = "";
          const mill = Math.floor(x / 1e6), th = Math.floor((x % 1e6) / 1000), rest = x % 1000;
          if (mill) out += (mill === 1 ? "un millón" : c999(mill) + " millones") + " ";
          if (th) out += (th === 1 ? "mil" : c999(th) + " mil") + " ";
          if (rest) out += c999(rest);
          return out.trim();
        };
        const s = conv(int);
        return s.charAt(0).toUpperCase() + s.slice(1) + " con " + String(cents).padStart(2, "0") + "/100" + (isFx() ? " dólares" : "");
      }
      const U = ["", "one", "two", "three", "four", "five", "six", "seven", "eight", "nine", "ten", "eleven", "twelve", "thirteen", "fourteen", "fifteen", "sixteen", "seventeen", "eighteen", "nineteen"];
      const T = ["", "", "twenty", "thirty", "forty", "fifty", "sixty", "seventy", "eighty", "ninety"];
      const c999 = x => (x >= 100 ? U[Math.floor(x / 100)] + " hundred" + (x % 100 ? " " : "") : "") + (x % 100 < 20 ? U[x % 100] : T[Math.floor((x % 100) / 10)] + (x % 10 ? "-" + U[x % 10] : ""));
      const conv = x => {
        if (x === 0) return "zero";
        let out = "";
        const mill = Math.floor(x / 1e6), th = Math.floor((x % 1e6) / 1000), rest = x % 1000;
        if (mill) out += c999(mill) + " million ";
        if (th) out += c999(th) + " thousand ";
        if (rest) out += c999(rest);
        return out.trim();
      };
      const s = conv(int);
      return s.charAt(0).toUpperCase() + s.slice(1) + " and " + String(cents).padStart(2, "0") + "/100" + (isFx() ? " dollars" : "");
    }

    function lines() {
      if (S.applyTo === "advance") return [{ id: "ADV", doc: t("advanceDoc"), due: null, bal: Infinity, acc: t("accAdvance") }];
      if (S.applyTo === "request") return requests.map(x => Object.assign({ acc: t("accReqPay") }, x));
      if (S.applyTo === "card") return [Object.assign({ acc: t("accCard") }, card)];
      const p = $payee.val();
      return p ? docs[p].map(x => Object.assign({ acc: t("accPayable") }, x)) : [];
    }

    function renderApply() {
      const fx = isFx();
      const ls = lines();
      const ent = ($payee.find("option:selected").text() || "—");
      document.querySelector("#tApply thead").innerHTML = '<tr><th style="width:34px"></th><th>' + t("colAcc") + "</th><th>" + t("colEntity") + "</th><th>" + t("colDoc") + "</th><th>" + t("colDue") + '</th><th class="r">' + t("colBal") + '</th><th class="r">' + t("colPay") + "</th>" +
        (fx ? '<th class="r">' + t("colPayFx") + '</th><th class="r">' + t("colAdj") + "</th>" : "") + '<th class="r">' + t("colPayLocal") + "</th></tr>";
      document.querySelector("#tApply tbody").innerHTML = ls.length ? ls.map(l => {
        const v = S.applied[l.id];
        const on = v != null;
        const local = on ? v * (fx ? RATE : 1) : 0;
        return '<tr><td><input type="checkbox" class="ap-on" data-id="' + l.id + '" aria-label="' + l.doc + '"' + (on ? " checked" : "") + "></td><td>" + l.acc + "</td><td>" + (S.applyTo === "request" || S.applyTo === "card" ? "—" : ent) + "</td><td>" + l.doc + "</td><td>" + (l.due ? UI.fmtDay(l.due) : "—") +
          '</td><td class="r">' + (l.bal === Infinity ? "—" : M(l.bal)) + '</td><td class="r"><input class="apply-in" data-id="' + l.id + '" aria-label="' + t("colPay") + " " + l.doc + '" value="' + (on ? M(v) : "") + '"' + (on ? "" : " disabled") + '><div class="mc-field-error" id="el-' + l.id + '"></div></td>' +
          (fx ? '<td class="r">' + (on ? M(v) : "—") + '</td><td class="r">' + (on ? M(local - Math.round(local)) : "—") + "</td>" : "") + '<td class="r">' + (on ? M(local) : "—") + "</td></tr>";
      }).join("") : '<tr><td colspan="' + (fx ? 10 : 8) + '" class="muted">' + t("ePayeeReq") + "</td></tr>";
      document.querySelectorAll("#tApply .apply-in").forEach(inp => {
        UI.maskMoney(inp);
        inp.addEventListener("change", () => { S.applied[inp.dataset.id] = UI.parseMoney(inp.value); updateAll(); });
      });
      updateSums();
    }

    function appliedTotal() { return Object.values(S.applied).reduce((a, v) => a + (v || 0), 0); }

    function updateSums() {
      const amt = amount(), ap = appliedTotal();
      const fx = isFx();
      const diff = Math.round((amt - ap) * 100) / 100;
      document.getElementById("applySum").innerHTML = "<span>" + t("movement") + ": <b>" + M(amt) + "</b></span><span>" + t("applied") + ": <b>" + M(ap) + "</b></span><span>" + t("pendingApply") + ': <b class="' + (Math.abs(diff) >= .005 ? "neg" : "pos") + '">' + M(diff) + "</b></span>" + (fx ? "<span>" + t("colPayLocal") + ": <b>" + M(ap * RATE) + "</b></span>" : "");
      // per-line errors
      lines().forEach(l => { const el = document.getElementById("el-" + l.id); if (!el) return; const v = S.applied[l.id]; const bad = v != null && l.bal !== Infinity && v > l.bal + .005; el.textContent = bad ? t("eLine") : ""; const inp = document.querySelector('.apply-in[data-id="' + l.id + '"]'); if (inp) inp.setAttribute("aria-invalid", String(bad)); });
    }

    function renderEntry() {
      const a = acc(), fx = isFx(), amt = amount();
      const local = amt * (fx ? RATE : 1);
      const byAcc = {};
      const add = (k, side, v) => { byAcc[k] = byAcc[k] || { d: 0, c: 0 }; byAcc[k][side] += v; };
      let appliedLocal = 0;
      lines().forEach(l => { const v = S.applied[l.id]; if (v != null) { const lv = Math.round(v * (fx ? RATE : 1) * 100) / 100; appliedLocal += lv; add(l.acc, "d", lv); } });
      add(t("accBank", { b: a.bank + " " + a.number }), "c", Math.round(local * 100) / 100);
      const dif = Math.round((Math.round(local * 100) / 100 - appliedLocal) * 100) / 100;
      if (Math.abs(dif) >= .005 && Math.abs(dif) < 5) add(t("accFx"), dif > 0 ? "d" : "c", Math.abs(dif));
      const rows = Object.keys(byAcc).map(k => [k, byAcc[k].d, byAcc[k].c]);
      const D1 = rows.reduce((s, x) => s + x[1], 0), C1 = rows.reduce((s, x) => s + x[2], 0);
      document.querySelector("#tEntry thead").innerHTML = "<tr><th>" + t("colAcc") + '</th><th class="r">' + t("colDebit") + '</th><th class="r">' + t("colCredit") + "</th></tr>";
      document.querySelector("#tEntry tbody").innerHTML = rows.map(x => "<tr><td>" + x[0] + (x[0] === t("accFx") ? ' <span class="chip chip-warn">' + mi("currency_exchange") + t("roundDiff") + "</span>" : "") + '</td><td class="r">' + (x[1] ? M(x[1]) : "") + '</td><td class="r">' + (x[2] ? M(x[2]) : "") + "</td></tr>").join("");
      document.querySelector("#tEntry tfoot").innerHTML = "<tr><td>" + t("totals") + '</td><td class="r">' + M(D1) + '</td><td class="r">' + M(C1) + "</td></tr>";
      const ok = Math.abs(D1 - C1) < .005 && D1 > 0;
      document.getElementById("entryChip").innerHTML = ok ? '<span class="chip chip-pos">' + mi("check_circle") + t("balanced") + "</span>" : '<span class="chip chip-neg">' + mi("error_outline") + t("unbalanced") + "</span>";
    }

    function updateHeader() {
      const a = acc(), amt = amount();
      document.getElementById("balNow").textContent = M(a.bal) + " " + a.cur;
      const after = a.bal - amt;
      const ba = document.getElementById("balAfter"); ba.textContent = M(after) + " " + a.cur; ba.className = after < 0 ? "neg" : "";
      const rate = document.getElementById("fRate");
      rate.value = isFx() ? RATE.toFixed(4) : "1.0000";
      document.getElementById("rateHint").textContent = isFx() ? t("rateFx") : t("rateLocal");
      document.getElementById("words").textContent = amt > 0 ? words(amt) : "—";
      const num = document.getElementById("fNumber");
      num.disabled = S.method !== "check";
      if (S.method !== "check") num.value = "TR-" + (88413 + recent.filter(x => x.type === "transfer").length);
      else if (!num.value || num.value.startsWith("TR-")) num.value = String(a.next);
      document.getElementById("docChip").innerHTML = mi(S.method === "check" ? "money" : "swap_horiz") + t(S.method);
    }

    function validate(show) {
      const errs = {};
      const a = acc(), amt = amount(), num = document.getElementById("fNumber").value.trim();
      if (S.method === "check") { if (!num) errs.Number = t("eNumberReq"); else if (a.used.has(num)) errs.Number = t("eNumberDup", { n: num }); }
      if (!(amt > 0)) errs.Amount = t("eAmountReq"); else if (amt > a.bal) errs.Amount = t("eAmountBal");
      if (!$payee.val() && (S.applyTo === "supplier" || S.applyTo === "advance")) errs.Payee = t("ePayeeReq");
      if (!document.getElementById("fConcept").value.trim()) errs.Concept = t("eConceptReq");
      const diff = Math.round((amt - appliedTotal()) * 100) / 100;
      const lineBad = lines().some(l => { const v = S.applied[l.id]; return v != null && l.bal !== Infinity && v > l.bal + .005; });
      ["Number", "Amount", "Payee", "Concept"].forEach(k => {
        const el = document.getElementById("e" + k); if (!el) return;
        el.textContent = show || S.touched ? (errs[k] || "") : "";
        const inp = document.getElementById("f" + k); if (inp) inp.setAttribute("aria-invalid", String(!!errs[k] && (show || S.touched)));
      });
      if (Math.abs(diff) >= .005 && amt > 0) errs.Apply = t("eApply", { d: M(diff) });
      if (lineBad) errs.Line = t("eLine");
      return errs;
    }

    function updateAll() { updateHeader(); renderApply(); renderEntry(); validate(false); }

    function renderRecent() {
      document.querySelector("#tRecent thead").innerHTML = "<tr><th>" + t("colDate") + "</th><th>" + t("colType") + "</th><th>" + t("colNumber") + "</th><th>" + t("colPayee") + '</th><th class="r">' + t("colAmount") + "</th><th>" + t("colStatus") + "</th></tr>";
      document.querySelector("#tRecent tbody").innerHTML = recent.map(x => "<tr><td>" + UI.fmtDay(x.d) + "</td><td>" + t(x.type) + "</td><td>" + x.n + "</td><td>" + x.payee + '</td><td class="r">' + M(x.amt) + '</td><td><span class="chip chip-pos">' + mi("task_alt") + t("stPosted") + "</span></td></tr>").join("");
    }

    function clearForm() {
      document.getElementById("fAmount").value = ""; document.getElementById("fConcept").value = ""; $payee.val("").trigger("change.select2");
      S.applied = {}; S.touched = false; document.getElementById("fNumber").value = "";
      updateAll();
    }

    // Events
    document.getElementById("fDate").value = "2026-11-16";
    UI.maskMoney(document.getElementById("fAmount"));
    document.getElementById("fAmount").addEventListener("input", () => { updateHeader(); updateSums(); renderEntry(); });
    document.getElementById("fAmount").addEventListener("change", updateAll);
    document.getElementById("fNumber").addEventListener("input", () => validate(false));
    document.getElementById("fConcept").addEventListener("input", () => validate(false));
    $acc.on("change", () => { document.getElementById("fNumber").value = ""; S.applied = {}; updateAll(); });
    $ptype.on("change", () => { fillPayees(); S.applied = {}; updateAll(); });
    $payee.on("change", () => { S.applied = {}; if (!document.getElementById("fConcept").value && $payee.val()) document.getElementById("fConcept").value = (UI.lang === "es" ? "Pago a " : "Payment to ") + $payee.find("option:selected").text(); updateAll(); });
    document.getElementById("method").addEventListener("click", e => { const b = e.target.closest("button"); if (!b) return; S.method = b.dataset.v; document.querySelectorAll("#method button").forEach(x => x.setAttribute("aria-pressed", String(x === b))); document.getElementById("fNumber").value = ""; updateAll(); });
    document.getElementById("applyTo").addEventListener("click", e => { const b = e.target.closest("button"); if (!b) return; S.applyTo = b.dataset.v; S.applied = {}; fillStatic(); updateAll(); });
    document.getElementById("payerTabs").addEventListener("click", e => { const b = e.target.closest("[data-v]"); if (!b) return; S.payer = b.dataset.v; fillStatic(); updateAll(); });
    document.getElementById("tApply").addEventListener("change", e => {
      const c = e.target.closest(".ap-on"); if (!c) return;
      const l = lines().find(x => x.id === c.dataset.id);
      if (c.checked) { const rest = Math.max(0, amount() - appliedTotal()); S.applied[l.id] = Math.round(Math.min(l.bal, rest || l.bal) * 100) / 100; } else delete S.applied[l.id];
      updateAll();
    });
    document.getElementById("btnSave").addEventListener("click", () => {
      S.touched = true;
      const errs = validate(true);
      if (Object.keys(errs).length) { UI.toast(errs.Apply || errs.Line || t("fixErrors")); return; }
      const a = acc(), amt = amount(), n = S.method === "check" ? document.getElementById("fNumber").value.trim() : document.getElementById("fNumber").value;
      a.bal -= amt; if (S.method === "check") { a.used.add(n); a.next = Number(n) + 1; }
      Object.keys(docs).forEach(k => docs[k].forEach(d => { if (S.applied[d.id] != null) d.bal = Math.round((d.bal - S.applied[d.id]) * 100) / 100; }));
      requests.forEach(d => { if (S.applied[d.id] != null) d.bal = Math.round((d.bal - S.applied[d.id]) * 100) / 100; });
      if (S.applied.K0 != null) card.bal = Math.round((card.bal - S.applied.K0) * 100) / 100;
      recent.unshift({ d: new Date(document.getElementById("fDate").value + "T00:00:00Z"), type: S.method, n, payee: $payee.find("option:selected").text() || t(S.applyTo === "card" ? "apCard" : "apRequest"), amt });
      renderRecent();
      UI.toast(t("savedMsg", { n }));
      clearForm();
    });
    document.getElementById("btnClear").addEventListener("click", clearForm);
    document.addEventListener("langchange", () => { fillStatic(); updateAll(); renderRecent(); document.getElementById("about").innerHTML = UI.aboutBox("aboutText"); });

    fillStatic();
    // A ready example so the screen shows something on first visit
    $payee.val("S1").trigger("change.select2");
    document.getElementById("fAmount").value = M(docs.S1[0].bal + docs.S1[1].bal);
    document.getElementById("fConcept").value = (UI.lang === "es" ? "Pago a " : "Payment to ") + D.suppliers[1];
    S.applied[docs.S1[0].id] = docs.S1[0].bal; S.applied[docs.S1[1].id] = docs.S1[1].bal;
    updateAll();
    renderRecent();
    document.getElementById("about").innerHTML = UI.aboutBox("aboutText");
  });
  </script>
</body>
</html>
