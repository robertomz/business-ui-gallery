<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Automatic purchasing · Business UI Gallery</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,300..500,0..1,0&display=block" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/select2/4.0.13/css/select2.min.css">
  <link rel="stylesheet" href="https://cdn.datatables.net/1.13.8/css/jquery.dataTables.min.css">
  <link rel="stylesheet" href="https://cdn.datatables.net/scroller/2.3.0/css/scroller.dataTables.min.css">
  <link rel="stylesheet" href="../assets/css/base.css">
  <style>
    .ca-grid { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 8px 10px; align-items: end; }
    .ca-grid .mc-field { min-width: 0; }
    .ca-grid .span2 { grid-column: span 2; }
    .ca-params { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 8px 10px; margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--border); }
    .ca-params .mc-field { flex: 0 0 auto; width: 76px; min-width: 0; }
    .ca-params .mc-field.days { width: 92px; }
    @media (max-width: 1200px) { .ca-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
    @media (max-width: 700px) { .ca-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } .ca-grid .span2 { grid-column: span 2; } }
    .mc-kpis.ca { grid-template-columns: repeat(8, minmax(0, 1fr)); }
    @media (max-width: 1200px) { .mc-kpis.ca { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
    @media (max-width: 560px) { .mc-kpis.ca { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
    .sem { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 500; padding: 3px 10px; border-radius: var(--r-pill); white-space: nowrap; }
    .sem .material-icons { font-size: 15px; }
    .sem-short { color: var(--danger); background: var(--danger-soft); }
    .sem-buy { color: var(--warning); background: var(--warning-soft); }
    .sem-ok { color: var(--success); background: var(--success-soft); }
    .sem-over { color: var(--brand-text); background: var(--bg-selected); }
    .sem-none { color: var(--text-secondary); background: var(--surface-alt); }
    td.sug { font-weight: 600; color: var(--success); }
    .legend { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: 12px; color: var(--text-secondary); }
    .tbl-tools { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
  </style>
</head>
<body data-page="purchasing" data-root="../">
  <main id="content">
    <section class="mc-panel">
      <form id="filters">
        <div class="ca-grid">
          <div class="mc-field span2"><label for="fDesc" data-i18n="desc"></label><input id="fDesc" data-i18n-ph="allF"></div>
          <div class="mc-field"><label for="fFrom" data-i18n="dateFrom"></label><input type="date" id="fFrom"></div>
          <div class="mc-field"><label for="fTo" data-i18n="dateTo"></label><input type="date" id="fTo"></div>
          <div class="mc-field"><label for="fSup" data-i18n="supplier"></label><select id="fSup"></select></div>
          <div class="mc-field"><label for="fBranch" data-i18n="branch"></label><select id="fBranch"></select></div>
          <div class="mc-field"><label for="fBuyer" data-i18n="buyer"></label><select id="fBuyer"></select></div>
          <div class="mc-field"><label for="fDiv" data-i18n="division"></label><select id="fDiv"></select></div>
          <div class="mc-field"><label for="fDept" data-i18n="dept"></label><select id="fDept"></select></div>
          <div class="mc-field"><label for="fCat" data-i18n="category"></label><select id="fCat"></select></div>
          <div class="mc-field"><label for="fSub" data-i18n="subcat"></label><select id="fSub"></select></div>
          <div class="mc-field"><label for="fWh" data-i18n="warehouse"></label><select id="fWh"></select></div>
          <div class="mc-field span2"><label for="fSeg" data-i18n="segment"></label><select id="fSeg"></select></div>
          <div class="mc-field" style="justify-content:flex-end"><label class="mc-check"><input type="checkbox" id="fNoBand" checked><span data-i18n="noBand"></span></label></div>
        </div>
        <div class="ca-params">
          <div class="mc-field days"><label for="pRev" data-i18n="revDays"></label><input id="pRev" class="num" type="number" min="1" value="30"></div>
          <div class="mc-field days"><label for="pUmb"><span data-i18n="threshold"></span></label><input id="pUmb" class="num" type="number" min="1" value="40"></div>
          <button class="btn btn-teal" type="submit"><span class="material-icons" aria-hidden="true">search</span><span data-i18n="load"></span></button>
          <button class="btn" type="button" id="btnClear"><span class="material-icons" aria-hidden="true">filter_alt_off</span><span data-i18n="clear"></span></button>
          <span style="flex:1"></span>
          <div class="mc-field"><label for="pDA">DA</label><input id="pDA" class="num" type="number" min="0" data-i18n-ph="opc"></div>
          <div class="mc-field"><label for="pDI">DI</label><input id="pDI" class="num" type="number" min="0" data-i18n-ph="opc"></div>
          <div class="mc-field"><label for="pSeg" data-i18n="pctSeg"></label><input id="pSeg" class="num" type="number" min="0" data-i18n-ph="opc"></div>
          <button class="btn btn-outline-teal" type="button" id="btnApply"><span class="material-icons" aria-hidden="true">done_all</span><span data-i18n="applyVisible"></span></button>
        </div>
      </form>
    </section>

    <section class="mc-kpis ca" id="kpis" aria-label="Summary"></section>

    <section class="mc-panel">
      <div class="col-filters" id="colFilters">
        <input data-col="code" data-i18n-ph="cf_code"><input data-col="desc" data-i18n-ph="cf_desc">
        <select data-col="status" id="cfStatus"></select>
        <input data-col="barcode" data-i18n-ph="cf_bar"><input data-col="sup" data-i18n-ph="cf_sup"><input data-col="cat" data-i18n-ph="cf_cat"><input data-col="buyer" data-i18n-ph="cf_buyer"><input data-col="branch" data-i18n-ph="cf_branch">
      </div>
      <div class="tbl-tools">
        <div class="legend" id="legend"></div>
        <button class="btn btn-sm" type="button" id="btnCsv"><span class="material-icons" aria-hidden="true">download</span><span data-i18n="export"></span></button>
      </div>
      <table id="tItems" class="display nowrap" style="width:100%"><thead><tr></tr></thead><tfoot><tr></tr></tfoot></table>
    </section>
    <div id="about"></div>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/select2/4.0.13/js/select2.min.js"></script>
  <script src="https://cdn.datatables.net/1.13.8/js/jquery.dataTables.min.js"></script>
  <script src="https://cdn.datatables.net/scroller/2.3.0/js/dataTables.scroller.min.js"></script>
  <script src="../assets/js/common.js"></script>
  <script>
  UI.strings({
    en: {
      desc: "Description", allF: "All", dateFrom: "Start date", dateTo: "End date", buyer: "Buyer", division: "Division", dept: "Department", subcat: "Subcategory", warehouse: "Warehouse",
      segment: "Segment (analysis type)", noBand: "No promo bundles", revDays: "Review days", threshold: "Threshold", pctSeg: "% Safety", opc: "Opt.", applyVisible: "Apply to visible",
      k_units: "Quantities in", k_unitsV: "Major unit", k_prod: "Products", k_inv: "Inventory value", k_sug: "Suggested purchase", k_buy: "To buy", k_over: "Products in excess", k_overV: "Excess value", k_days: "Selected days",
      cf_code: "Item code…", cf_desc: "Description…", cf_bar: "Barcode…", cf_sup: "Supplier…", cf_cat: "Category…", cf_buyer: "Buyer…", cf_branch: "Branch…", stAll: "Status (all)",
      c_code: "Item code", c_bar: "Barcode", c_desc: "Description", c_branch: "Branch", c_sup: "Supplier", c_sold: "Period sales (major)", c_daily: "Avg. daily sales (major)", c_month: "Avg. monthly sales (major)",
      c_inv: "Available stock (major)", c_transit: "Orders in transit (major)", c_safe: "Safety days", c_stockDi: "DI stock (major)", c_rop: "Reorder point", c_cover: "Days of coverage", c_sug: "Suggested order", c_cost: "Unit cost", c_status: "Status", c_overV: "Excess value",
      s_short: "Shortage", s_buy: "Buy", s_ok: "OK", s_over: "Excess", s_none: "No movement", applied: "DA/DI/% safety applied to {n} visible items.",
      h_da: "DA = days until the supplier delivers (lead time). DI = days of inventory to keep after it arrives.",
      aboutText: "For every item and branch the screen takes the sales of the review period and calculates the <b>average daily sale</b> in the major unit (case, box). <b>DA</b> is the supplier's lead time and <b>DI</b> the days of inventory to keep after it arrives; <b>safety days</b> = DA × % safety. <b>Reorder point</b> = daily sale × (DA + safety days). <b>Suggested order</b> = daily sale × (DA + DI + safety days) − available stock − orders in transit, rounded up to full cases. The <b>4-color status</b>: <b>Shortage</b> when the coverage does not reach the lead time, <b>Buy</b> when it is under the reorder point, <b>OK</b>, and <b>Excess</b> when the coverage passes the threshold (40 days by default); items without sales show <b>No movement</b>. DA, DI and % safety can be applied in bulk to the visible rows. Totals follow the filters and the column filters. All data is generated."
    },
    es: {
      desc: "Descripción", allF: "Todas", dateFrom: "Fecha inicio", dateTo: "Fecha fin", buyer: "Comprador", division: "División", dept: "Depto", subcat: "Subcategoría", warehouse: "Bodega",
      segment: "Segmento (tipo de análisis)", noBand: "Sin bandeos", revDays: "Días rev.", threshold: "Umbral", pctSeg: "% Seg.", opc: "Opc.", applyVisible: "Aplicar visibles",
      k_units: "Cantidades en", k_unitsV: "Unidad mayor", k_prod: "Productos", k_inv: "Valor inv.", k_sug: "Compra sug.", k_buy: "Comprar", k_over: "Prod. exceso", k_overV: "Valor exceso", k_days: "Días selec.",
      cf_code: "Cód. artículo…", cf_desc: "Descripción…", cf_bar: "Cód. barra…", cf_sup: "Proveedor…", cf_cat: "Categoría…", cf_buyer: "Comprador…", cf_branch: "Sucursal…", stAll: "Estado (todos)",
      c_code: "Cód. artículo", c_bar: "Cód. barra", c_desc: "Descripción", c_branch: "Sucursal", c_sup: "Proveedor", c_sold: "Venta periodo (mayor)", c_daily: "Venta diaria prom. (mayor)", c_month: "Venta prom. mensual (mayor)",
      c_inv: "Inventario disp. (mayor)", c_transit: "Pedidos en tránsito (mayor)", c_safe: "Días seg.", c_stockDi: "Stock DI (mayor)", c_rop: "Punto reorden", c_cover: "Días cobertura", c_sug: "Pedido sugerido", c_cost: "Costo unit.", c_status: "Estado", c_overV: "Valor exceso",
      s_short: "Faltante", s_buy: "Comprar", s_ok: "OK", s_over: "Exceso", s_none: "Sin movimiento", applied: "DA/DI/% seg. aplicado a {n} artículos visibles.",
      h_da: "DA = días que tarda el proveedor en entregar. DI = días de inventario que se quieren tener después de que llega.",
      aboutText: "Para cada artículo y sucursal la pantalla toma la venta del periodo de revisión y calcula la <b>venta diaria promedio</b> en la unidad mayor (caja, fardo). <b>DA</b> son los días de abastecimiento del proveedor y <b>DI</b> los días de inventario que se quieren tener cuando llega; los <b>días de seguridad</b> = DA × % seg. <b>Punto de reorden</b> = venta diaria × (DA + días seg.). <b>Pedido sugerido</b> = venta diaria × (DA + DI + días seg.) − inventario disponible − pedidos en tránsito, redondeado a cajas completas. El <b>semáforo de 4 colores</b>: <b>Faltante</b> cuando la cobertura no alcanza para el abastecimiento, <b>Comprar</b> cuando está bajo el punto de reorden, <b>OK</b>, y <b>Exceso</b> cuando la cobertura pasa el umbral (40 días por defecto); los artículos sin venta salen como <b>Sin movimiento</b>. DA, DI y % seg. se pueden aplicar en bloque a las filas visibles. Los totales siguen los filtros y los filtros por columna. Todos los datos son generados."
    }
  });

  $(function () {
    const D = UI.DATA, t = UI.t, M = UI.fmtMoney, mi = UI.mi;
    const TODAY = new Date(Date.UTC(2026, 10, 16));
    const BUYERS = ["N. Cruz", "P. Aguilar", "S. Herrera"];
    const DIVS = [{ en: "Grocery", es: "Abarrotes" }, { en: "Home", es: "Hogar" }];
    const DEPTS = [{ en: "Food", es: "Alimentos" }, { en: "Drinks", es: "Bebidas" }, { en: "Household", es: "Limpieza y hogar" }, { en: "Personal", es: "Cuidado personal" }];
    const SEGS = [{ en: "No promo bundles", es: "Sin bandeos" }, { en: "Top sellers (A)", es: "Más vendidos (A)" }, { en: "Seasonal", es: "Temporada" }];
    const SUBS = [{ en: "Regular", es: "Regular" }, { en: "Premium", es: "Premium" }, { en: "Value pack", es: "Paquete económico" }];
    const catDept = [1, 0, 0, 2, 3, 0, 0];
    const supOf = cat => D.suppliers[[1, 3, 4, 2, 2, 0, 5][cat]];
    const STATUS = { short: ["s_short", "sem-short", "error"], buy: ["s_buy", "sem-buy", "shopping_cart"], ok: ["s_ok", "sem-ok", "check_circle"], over: ["s_over", "sem-over", "inventory"], none: ["s_none", "sem-none", "remove_circle_outline"] };

    // Items × branches
    const r = UI.rng(9091);
    const ITEMS = [];
    D.products.forEach((p, pi) => D.branches.forEach((b, bi) => {
      const noMove = r() < .05;
      const daily = noMove ? 0 : UI.between(r, .3, 9) * (bi === 2 ? 1.5 : 1);
      const coverTarget = r() < .15 ? UI.between(r, 45, 80) : UI.between(r, 2, 30);
      ITEMS.push({
        code: "A-" + String(10000 + pi * 37), barcode: "750" + String(1000000 + pi * 7919).slice(0, 7), desc: p[0], cat: p[1], branch: b, bi,
        sup: supOf(p[1]), buyer: BUYERS[p[1] % 3], div: p[1] >= 3 ? 1 : 0, dept: catDept[p[1]], sub: pi % 3, segIdx: pi % 3,
        daily, inv: Math.round(daily * coverTarget), transit: r() < .25 ? Math.round(UI.between(r, 2, 20)) : 0,
        da: [3, 5, 7, 10][Math.floor(r() * 4)], di: [7, 10, 15][Math.floor(r() * 3)], seg: [.2, .3, .5][Math.floor(r() * 3)], caseQty: [6, 12, 24][pi % 3], cost: UI.between(r, 80, 900)
      });
    }));

    let params = { rev: 30, umb: 40, from: null, to: null };
    function calc(x) {
      const safe = Math.round(x.da * x.seg);
      const avail = x.inv + x.transit;
      const cover = x.daily ? avail / x.daily : Infinity;
      const rop = x.daily * (x.da + safe);
      const need = x.daily * (x.da + x.di + safe) - avail;
      const sug = need > 0 ? Math.ceil(need / 1) : 0;
      let st = "ok";
      if (!x.daily) st = "none"; else if (cover < x.da) st = "short"; else if (avail < rop) st = "buy"; else if (cover > params.umb) st = "over";
      const overUnits = st === "over" ? avail - x.daily * params.umb : 0;
      return { safe, cover, rop, sug, st, stockDi: x.daily * x.di, sold: x.daily * params.rev, month: x.daily * 30, overV: overUnits * x.cost };
    }

    // ---------- Filters ----------
    const selects = { fSup: () => D.suppliers, fBranch: () => D.branches, fBuyer: () => BUYERS, fDiv: () => DIVS, fDept: () => DEPTS, fCat: () => D.categories, fSub: () => SUBS, fWh: () => D.branches.map(b => b + " · " + (UI.lang === "es" ? "Bodega" : "Warehouse")), fSeg: () => SEGS };
    function fillSelects() {
      Object.keys(selects).forEach(id => {
        const $s = $("#" + id), v = $s.val() || "all";
        $s.empty().append(new Option(t("allF"), "all"));
        selects[id]().forEach((x, i) => $s.append(new Option(UI.L(x), String(i))));
        $s.val(v).select2({ width: "100%" });
      });
      const sv = $("#cfStatus").val() || "";
      $("#cfStatus").empty().append(new Option(t("stAll"), ""));
      Object.keys(STATUS).forEach(k => $("#cfStatus").append(new Option(t(STATUS[k][0]), k)));
      $("#cfStatus").val(sv);
      document.getElementById("legend").innerHTML = Object.keys(STATUS).map(k => '<span class="sem ' + STATUS[k][1] + '">' + mi(STATUS[k][2]) + t(STATUS[k][0]) + "</span>").join("");
    }
    fillSelects();
    document.getElementById("fFrom").value = UI.fmtDate(new Date(TODAY.getTime() - 29 * 86400000));
    document.getElementById("fTo").value = UI.fmtDate(TODAY);

    let applied = null;
    function readFilters() {
      const v = id => $("#" + id).val();
      return { desc: document.getElementById("fDesc").value.trim().toLowerCase(), sup: v("fSup"), branch: v("fBranch"), buyer: v("fBuyer"), div: v("fDiv"), dept: v("fDept"), cat: v("fCat"), sub: v("fSub"), wh: v("fWh"), seg: v("fSeg"), noBand: document.getElementById("fNoBand").checked };
    }
    function baseRows() {
      const f = applied;
      return ITEMS.filter(x => (!f.desc || x.desc.toLowerCase().includes(f.desc) || x.code.toLowerCase().includes(f.desc)) &&
        (f.sup === "all" || x.sup === D.suppliers[+f.sup]) && (f.branch === "all" || x.bi === +f.branch) && (f.wh === "all" || x.bi === +f.wh) &&
        (f.buyer === "all" || x.buyer === BUYERS[+f.buyer]) && (f.div === "all" || x.div === +f.div) && (f.dept === "all" || x.dept === +f.dept) &&
        (f.cat === "all" || x.cat === +f.cat) && (f.sub === "all" || x.sub === +f.sub) && (f.seg === "all" || x.segIdx === +f.seg));
    }

    // ---------- Table ----------
    const COLS = [
      ["c_code", x => x.code, 0], ["c_bar", x => x.barcode, 0], ["c_desc", x => x.desc, 0], ["c_branch", x => x.branch, 0], ["c_sup", x => x.sup, 0],
      ["c_sold", (x, c) => c.sold.toFixed(1), 1, (x, c) => c.sold], ["c_daily", (x, c) => x.daily.toFixed(2), 1], ["c_month", (x, c) => c.month.toFixed(1), 1],
      ["c_inv", x => UI.fmtInt(x.inv), 1, x => x.inv], ["c_transit", x => UI.fmtInt(x.transit), 1, x => x.transit], ["DA", x => x.da, 1], ["DI", x => x.di, 1], ["pctSeg", x => UI.fmtPct(x.seg, 0), 1], ["c_safe", (x, c) => c.safe, 1],
      ["c_stockDi", (x, c) => c.stockDi.toFixed(1), 1], ["c_rop", (x, c) => c.rop.toFixed(1), 1], ["c_cover", (x, c) => isFinite(c.cover) ? c.cover.toFixed(1) : "—", 1],
      ["c_sug", (x, c) => c.sug ? UI.fmtInt(c.sug) : "0", 2, (x, c) => c.sug], ["c_cost", x => M(x.cost), 1], ["c_status", (x, c) => '<span class="sem ' + STATUS[c.st][1] + '">' + mi(STATUS[c.st][2]) + t(STATUS[c.st][0]) + "</span>", 0],
      ["c_overV", (x, c) => c.overV ? M(c.overV) : "", 1, (x, c) => c.overV]
    ];
    const head = () => COLS.map(c => (c[0] === "DA" || c[0] === "DI") ? c[0] : t(c[0]));
    let dt = null;
    function rowsData() {
      const cf = {};
      document.querySelectorAll("#colFilters [data-col]").forEach(el => cf[el.dataset.col] = el.value.trim().toLowerCase());
      return baseRows().map(x => ({ x, c: calc(x) })).filter(({ x, c }) =>
        (!cf.code || x.code.toLowerCase().includes(cf.code)) && (!cf.desc || x.desc.toLowerCase().includes(cf.desc)) && (!cf.status || c.st === cf.status) &&
        (!cf.barcode || x.barcode.includes(cf.barcode)) && (!cf.sup || x.sup.toLowerCase().includes(cf.sup)) && (!cf.cat || UI.L(D.categories[x.cat]).toLowerCase().includes(cf.cat)) &&
        (!cf.buyer || x.buyer.toLowerCase().includes(cf.buyer)) && (!cf.branch || x.branch.toLowerCase().includes(cf.branch)));
    }
    let current = [];
    function draw() {
      current = rowsData();
      const data = current.map(({ x, c }) => COLS.map(col => col[1](x, c)));
      if (dt) { dt.clear(); dt.rows.add(data); dt.draw(false); }
      else {
        $("#tItems thead tr").html(head().map((h, i) => "<th" + (COLS[i][2] ? ' class="dt-right"' : "") + ">" + h + "</th>").join(""));
        $("#tItems tfoot tr").html(COLS.map(() => "<th></th>").join(""));
        dt = $("#tItems").DataTable({
          data, deferRender: true, scrollY: 460, scrollX: true, scroller: { rowHeight: 34, displayBuffer: 4 }, searching: false, ordering: true, info: true, order: [[17, "desc"]],
          columnDefs: [{ targets: COLS.map((c, i) => c[2] ? i : -1).filter(i => i >= 0), className: "dt-right num" }, { targets: [17], className: "dt-right num sug" }],
          language: dtLang()
        });
      }
      renderTotals();
    }
    function dtLang() { return UI.lang === "es" ? { info: "_TOTAL_ artículos", infoEmpty: "Sin artículos", emptyTable: "Sin datos", zeroRecords: "No hay artículos con estos filtros" } : { info: "_TOTAL_ items", infoEmpty: "No items", emptyTable: "No data", zeroRecords: "No items match these filters" }; }
    function renderTotals() {
      const sum = f => current.reduce((a, r) => a + f(r.x, r.c), 0);
      const inv = sum(x => x.inv * x.cost), sug = sum((x, c) => c.sug * x.cost), buy = current.filter(r => r.c.sug > 0).length;
      const over = current.filter(r => r.c.st === "over").length, overV = sum((x, c) => c.overV);
      const days = Math.round((new Date(document.getElementById("fTo").value) - new Date(document.getElementById("fFrom").value)) / 86400000) + 1;
      const k = (l, v, color) => '<div class="mc-kpi is-accent" style="--k-color:' + color + '"><div class="k-label">' + t(l) + '</div><div class="k-value num">' + v + "</div></div>";
      document.getElementById("kpis").innerHTML = k("k_units", t("k_unitsV"), "var(--chart-6)") + k("k_prod", UI.fmtInt(current.length), "var(--chart-2)") + k("k_inv", M(inv), "var(--chart-2)") + k("k_sug", M(sug), "var(--chart-4)") +
        k("k_buy", UI.fmtInt(buy), "var(--chart-4)") + k("k_over", UI.fmtInt(over), "var(--chart-1)") + k("k_overV", M(overV), "var(--chart-1)") + k("k_days", isNaN(days) ? "—" : days, "var(--text-tertiary)");
      const foot = dt.table().footer().querySelectorAll("th");
      const tot = (i, v) => { if (foot[i]) foot[i].innerHTML = v; };
      foot.forEach(th => th.innerHTML = "");
      tot(0, t("total")); tot(5, sum((x, c) => c.sold).toFixed(1)); tot(8, UI.fmtInt(sum(x => x.inv))); tot(9, UI.fmtInt(sum(x => x.transit))); tot(17, UI.fmtInt(sum((x, c) => c.sug))); tot(20, M(overV));
      [5, 8, 9, 17, 20].forEach(i => foot[i] && (foot[i].className = "dt-right num"));
    }

    // ---------- Events ----------
    document.getElementById("filters").addEventListener("submit", e => { e.preventDefault(); applied = readFilters(); params.umb = Number(document.getElementById("pUmb").value) || 40; params.rev = Number(document.getElementById("pRev").value) || 30; draw(); });
    document.getElementById("btnClear").addEventListener("click", () => {
      document.getElementById("fDesc").value = ""; Object.keys(selects).forEach(id => $("#" + id).val("all").trigger("change.select2"));
      document.querySelectorAll("#colFilters input").forEach(i => i.value = ""); $("#cfStatus").val("");
      applied = readFilters(); draw();
    });
    let tmr;
    document.getElementById("colFilters").addEventListener("input", () => { clearTimeout(tmr); tmr = setTimeout(draw, 200); });
    document.getElementById("colFilters").addEventListener("change", draw);
    document.getElementById("btnApply").addEventListener("click", () => {
      const da = document.getElementById("pDA").value, di = document.getElementById("pDI").value, sg = document.getElementById("pSeg").value;
      current.forEach(({ x }) => { if (da !== "") x.da = Number(da); if (di !== "") x.di = Number(di); if (sg !== "") x.seg = Number(sg) / 100; });
      UI.toast(t("applied", { n: current.length })); draw();
    });
    document.getElementById("btnCsv").addEventListener("click", () => {
      UI.csvDownload("automatic-purchasing.csv", [head()].concat(current.map(({ x, c }) => COLS.map(col => String(col[1](x, c)).replace(/<[^>]+>/g, "").replace(/^(error|shopping_cart|check_circle|inventory|remove_circle_outline)/, "")))));
    });
    document.addEventListener("langchange", () => {
      fillSelects();
      if (dt) { dt.destroy(); dt = null; $("#tItems").empty().html("<thead><tr></tr></thead><tfoot><tr></tr></tfoot>"); }
      draw();
      document.getElementById("about").innerHTML = UI.aboutBox("aboutText");
    });
    document.getElementById("about").innerHTML = UI.aboutBox("aboutText");
    applied = readFilters();
    draw();
    document.fonts && document.fonts.ready.then(() => dt && dt.columns.adjust());
  });
  </script>
</body>
</html>
