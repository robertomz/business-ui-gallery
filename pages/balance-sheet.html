<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Balance sheet · Business UI Gallery</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/select2/4.0.13/css/select2.min.css">
  <link rel="stylesheet" href="../assets/css/base.css">
  <style>
    .tree-btn { display: inline-flex; align-items: center; justify-content: center; width: 24px; height: 24px; border: 0; border-radius: 6px; background: transparent; color: var(--mc-muted); cursor: pointer; padding: 0; vertical-align: middle; }
    .tree-btn:hover { background: rgba(148, 163, 184, .14); color: var(--mc-text); }
    .tree-btn[aria-expanded="true"] .material-icons { transform: rotate(90deg); }
    .tree-btn .material-icons { transition: transform .15s; font-size: 18px; }
    .tree-pad { display: inline-block; width: 24px; }
    tr.lvl-1 td { font-weight: 800; background: rgba(20, 184, 166, .06); }
    tr.lvl-2 td { font-weight: 700; }
    .manual-in { width: 120px; min-height: 28px; padding: 3px 7px; border: 1px solid var(--mc-line); border-radius: 5px; background: var(--mc-panel-2); color: var(--mc-text); text-align: right; font-size: 11.5px; }
    .check-banner { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 8px; font-size: 12px; font-weight: 700; margin-bottom: 10px; }
    .check-banner.ok { background: rgba(45, 212, 191, .1); color: var(--mc-good); border: 1px solid rgba(45, 212, 191, .35); }
    .check-banner.bad { background: rgba(251, 113, 133, .1); color: var(--mc-bad); border: 1px solid rgba(251, 113, 133, .35); }
    .check-banner span.muted { font-weight: 500; }
  </style>
</head>
<body data-page="balance-sheet" data-root="../">
  <main id="content">
    <section class="mc-panel">
      <form class="mc-filters" id="filters">
        <div class="mc-field w-sm"><label data-i18n="company"></label><div class="static">DEMO</div></div>
        <div class="mc-field" style="max-width:170px"><label for="fMonth" data-i18n="fMonth"></label><select id="fMonth"></select></div>
        <div class="mc-field" style="max-width:120px"><label for="fYear" data-i18n="fYear"></label><select id="fYear"><option>2026</option><option>2025</option></select></div>
        <div class="mc-field" style="max-width:220px"><label for="fNic" data-i18n="fNic"></label><select id="fNic"></select></div>
        <label class="mc-check"><input type="checkbox" id="fResult" checked><span data-i18n="fResult"></span></label>
        <button class="btn btn-teal" type="submit"><span class="material-icons" aria-hidden="true">search</span><span data-i18n="load"></span></button>
      </form>
    </section>
    <p class="mc-hint" id="hint" role="status"></p>

    <div id="result" hidden>
      <section class="mc-panel">
        <div class="mc-panel-title">
          <h3><span class="material-icons" aria-hidden="true">fact_check</span><span data-i18n="checkTitle"></span></h3>
          <div class="mc-field" style="max-width:170px;flex:0 1 170px"><label for="fGrade" data-i18n="fGrade"></label><select id="fGrade"></select></div>
        </div>
        <div id="banner"></div>
        <div class="table-wrap"><table class="grid" id="tCheck"><thead></thead><tbody></tbody></table></div>
      </section>

      <section class="mc-panel" style="margin-top:12px">
        <div class="mc-panel-title"><h3><span class="material-icons" aria-hidden="true">account_tree</span><span data-i18n="treeTitle"></span></h3>
          <div style="display:flex;gap:6px;flex-wrap:wrap"><button type="button" class="btn btn-sm" id="expandAll"><span class="material-icons" aria-hidden="true">unfold_more</span><span data-i18n="expandAll"></span></button><button type="button" class="btn btn-sm" id="collapseAll"><span class="material-icons" aria-hidden="true">unfold_less</span><span data-i18n="collapseAll"></span></button></div></div>
        <div class="mc-filters" style="margin-bottom:10px">
          <div class="mc-field w-lg"><label for="fSearch" data-i18n="fSearch"></label><input id="fSearch" type="search" data-i18n-ph="searchPh"></div>
          <div class="mc-field" style="max-width:200px"><label for="fRubro" data-i18n="fRubro"></label><select id="fRubro"></select></div>
          <div class="mc-field" style="max-width:150px"><label for="fDepth" data-i18n="fDepth"></label><select id="fDepth"></select></div>
          <label class="mc-check"><input type="checkbox" id="fOnly" checked><span data-i18n="fOnly"></span></label>
        </div>
        <div class="table-wrap" style="max-height:620px"><table class="grid" id="tTree"><thead></thead><tbody></tbody><tfoot></tfoot></table></div>
      </section>
    </div>
    <div id="about"></div>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/select2/4.0.13/js/select2.min.js"></script>
  <script src="../assets/js/common.js"></script>
  <script>
  UI.strings({
    en: {
      fMonth: "Month", fYear: "Year", fNic: "IFRS types", nicAll: "All", nicCur: "Current", nicNon: "Non-current", fResult: "Include period result",
      checkTitle: "Balance check", fGrade: "Detail grade", grade: "Grade {n}", treeTitle: "Hierarchical detail by account", fSearch: "Search account", searchPh: "Code or name",
      fRubro: "Group", fDepth: "Break down to", fOnly: "Only with balance", expandAll: "Expand all", collapseAll: "Collapse all",
      colConcept: "Concept", colAuto: "Auto", colManual: "Manual", colDiff: "Difference", colAccount: "Account", colName: "Name", colGrade: "Grade", colNature: "Nature", colClass: "Classification", colDif: "Diff.",
      assets: "Assets", liabilities: "Liabilities", equity: "Equity", periodResult: "Period result", liabEq: "Liabilities + equity", difference: "Difference",
      debit: "Debit", credit: "Credit", current: "Current", noncurrent: "Non-current",
      okBanner: "Balanced: assets {a} = liabilities + equity {b}.", badBanner: "Difference of {d}: assets {a} vs liabilities + equity {b}.", badWhy: "It is the period result, which is not included right now.",
      loaded: "Balance of {m} {y} loaded.", manualHint: "Manual value",
      aboutText: "The balance sheet is calculated from the <b>account balances</b> of the chosen month and year. The <b>balance check</b> compares assets with liabilities plus equity; the period result (revenue − costs − expenses) closes the gap until the year-end entry moves it to equity, so the check only balances with <b>Include period result</b> on. Accountants can type a <b>manual value</b> next to the automatic one to reconcile with an external report; the difference column shows where they disagree. The tree opens from level 1 (group) to level 5 (posting account), can be searched by code or name and shows only accounts with balance by default. All the data on this page is generated."
    },
    es: {
      fMonth: "Mes", fYear: "Año", fNic: "Tipos NIC", nicAll: "Todos", nicCur: "Corriente", nicNon: "No corriente", fResult: "Incluir resultado del período",
      checkTitle: "Comprobación del balance", fGrade: "Grado del detalle", grade: "Grado {n}", treeTitle: "Detalle jerárquico por cuenta", fSearch: "Buscar cuenta", searchPh: "Código o nombre",
      fRubro: "Rubro", fDepth: "Desglosar hasta", fOnly: "Solo con saldo", expandAll: "Desplegar todo", collapseAll: "Contraer todo",
      colConcept: "Concepto", colAuto: "Auto", colManual: "Manual", colDiff: "Diferencia", colAccount: "Cuenta", colName: "Nombre", colGrade: "Grado", colNature: "Naturaleza", colClass: "Clasificación", colDif: "Dif.",
      assets: "Activo", liabilities: "Pasivo", equity: "Capital", periodResult: "Resultado del período", liabEq: "Pasivo + capital", difference: "Diferencia",
      debit: "Deudora", credit: "Acreedora", current: "Corriente", noncurrent: "No corriente",
      okBanner: "Cuadrado: activo {a} = pasivo + capital {b}.", badBanner: "Diferencia de {d}: activo {a} contra pasivo + capital {b}.", badWhy: "Es el resultado del período, que ahora no está incluido.",
      loaded: "Se cargó el balance de {m} {y}.", manualHint: "Valor manual",
      aboutText: "El balance general se calcula con los <b>saldos de las cuentas</b> del mes y año elegidos. La <b>comprobación del balance</b> compara el activo con el pasivo más el capital; el resultado del período (ingresos − costos − gastos) cierra la diferencia hasta que la partida de cierre del año lo pasa a capital, por eso la comprobación solo cuadra con <b>Incluir resultado del período</b> marcado. Contabilidad puede escribir un <b>valor manual</b> junto al automático para conciliar con un reporte externo; la columna de diferencia muestra dónde no coinciden. El árbol abre del grado 1 (rubro) al grado 5 (cuenta de movimiento), se busca por código o nombre y por defecto muestra solo cuentas con saldo. Todos los datos de esta página son generados."
    }
  });

  $(function () {
    const t = UI.t, M = UI.fmtMoney, mi = UI.mi;
    function s2($el, opts) { if ($el.hasClass("select2-hidden-accessible")) $el.select2("destroy"); $el.select2(Object.assign({ width: "100%" }, opts)); }
    // Chart of accounts (5 levels): 1 group, 2 class, 3 sub, 4 account, 5 posting account.
    const N = (code, en, es, nic) => ({ code, en, es, nic });
    const TREE = [
      N("1", "Assets", "Activo"), N("1-01", "Current assets", "Activo corriente", "cur"), N("1-01-01", "Cash and banks", "Efectivo y bancos", "cur"),
      N("1-01-01-01", "Cash", "Caja", "cur"), N("1-01-01-01-001", "General cash", "Caja general", "cur"), N("1-01-01-01-002", "Petty cash", "Caja chica", "cur"),
      N("1-01-01-02", "Banks", "Bancos", "cur"), N("1-01-01-02-001", "Bank account 1", "Cuenta bancaria 1", "cur"), N("1-01-01-02-002", "Bank account 2", "Cuenta bancaria 2", "cur"), N("1-01-01-02-003", "Deposits in transit", "Depósitos en tránsito", "cur"),
      N("1-01-02", "Receivables", "Cuentas por cobrar", "cur"), N("1-01-02-01", "Customers", "Clientes", "cur"), N("1-01-02-01-001", "Customers on credit", "Clientes crédito", "cur"), N("1-01-02-01-002", "Cards receivable", "Tarjetas por cobrar", "cur"),
      N("1-01-03", "Inventory", "Inventario", "cur"), N("1-01-03-01", "Merchandise", "Mercadería", "cur"), N("1-01-03-01-001", "Warehouse inventory", "Inventario en bodega", "cur"), N("1-01-03-01-002", "Goods in transit", "Mercadería en tránsito", "cur"),
      N("1-02", "Non-current assets", "Activo no corriente", "non"), N("1-02-01", "Property and equipment", "Propiedad y equipo", "non"), N("1-02-01-01", "Equipment", "Equipo", "non"),
      N("1-02-01-01-001", "Vehicles", "Vehículos", "non"), N("1-02-01-01-002", "Computer equipment", "Equipo de cómputo", "non"), N("1-02-01-01-003", "Accumulated depreciation", "Depreciación acumulada", "non"),
      N("2", "Liabilities", "Pasivo"), N("2-01", "Current liabilities", "Pasivo corriente", "cur"), N("2-01-01", "Payables", "Cuentas por pagar", "cur"), N("2-01-01-01", "Suppliers", "Proveedores", "cur"),
      N("2-01-01-01-001", "Local suppliers", "Proveedores locales", "cur"), N("2-01-01-01-002", "Foreign suppliers", "Proveedores del exterior", "cur"),
      N("2-01-02", "Withholdings and taxes", "Retenciones e impuestos", "cur"), N("2-01-02-01", "Taxes payable", "Impuestos por pagar", "cur"), N("2-01-02-01-001", "Sales tax payable", "Impuesto sobre ventas", "cur"), N("2-01-02-01-002", "Payroll withholdings", "Retenciones de planilla", "cur"),
      N("2-01-03", "Credit cards", "Tarjetas de crédito", "cur"), N("2-01-03-01", "Company cards", "Tarjetas corporativas", "cur"), N("2-01-03-01-001", "Card balances", "Saldos de tarjetas", "cur"),
      N("2-02", "Non-current liabilities", "Pasivo no corriente", "non"), N("2-02-01", "Long-term loans", "Préstamos a largo plazo", "non"), N("2-02-01-01", "Bank loans", "Préstamos bancarios", "non"), N("2-02-01-01-001", "Loan 1", "Préstamo 1", "non"),
      N("3", "Equity", "Capital"), N("3-01", "Paid-in capital", "Capital social"), N("3-01-01", "Shares", "Acciones"), N("3-01-01-01", "Common shares", "Acciones comunes"), N("3-01-01-01-001", "Subscribed capital", "Capital suscrito"),
      N("3-02", "Retained earnings", "Utilidades retenidas"), N("3-02-01", "Prior years", "Años anteriores"), N("3-02-01-01", "Accumulated results", "Resultados acumulados"), N("3-02-01-01-001", "Prior years results", "Resultados de años anteriores")
    ];
    const lvl = c => c.split("-").length;
    const parent = c => c.split("-").slice(0, -1).join("-");
    const kids = c => TREE.filter(n => parent(n.code) === c);
    const fMonth = $("#fMonth"), fNic = $("#fNic"), fGrade = $("#fGrade"), fRubro = $("#fRubro"), fDepth = $("#fDepth");
    function fillSelects() {
      const m = fMonth.val() || "10", n = fNic.val() || "all", g = fGrade.val() || "3", r = fRubro.val() || "all", dp = fDepth.val() || "5";
      fMonth.empty(); for (let i = 0; i < 12; i++) fMonth.append(new Option(UI.monthName(i), String(i)));
      fNic.empty().append(new Option(t("nicAll"), "all"), new Option(t("nicCur"), "cur"), new Option(t("nicNon"), "non"));
      fGrade.empty(); fDepth.empty(); for (let i = 1; i <= 5; i++) { fGrade.append(new Option(t("grade", { n: i }), String(i))); fDepth.append(new Option(t("grade", { n: i }), String(i))); }
      fRubro.empty().append(new Option(t("nicAll"), "all"), new Option(t("assets"), "1"), new Option(t("liabilities"), "2"), new Option(t("equity"), "3"));
      fMonth.val(m); fNic.val(n); fGrade.val(g); fRubro.val(r); fDepth.val(dp);
      [fMonth, fNic, fGrade, fRubro, fDepth, $("#fYear")].forEach(x => s2(x, { minimumResultsForSearch: Infinity }));
    }
    fillSelects();

    let state = null, open = new Set(["1", "2", "3", "1-01", "2-01"]), manual = {};

    function compute() {
      const seed = state.y * 13 + state.m * 7;
      const bal = {};
      TREE.filter(n => lvl(n.code) === 5).forEach((n, i) => {
        const r = UI.rng(seed * 101 + i);
        let v = 0;
        if (n.code.startsWith("1-02-01-01-003")) v = -UI.between(r, 180000, 260000);
        else if (n.code.startsWith("1")) v = UI.between(r, 40000, 2400000) * (r() < .12 ? 0 : 1);
        else if (n.code.startsWith("2")) v = UI.between(r, 60000, 1800000) * (r() < .1 ? 0 : 1);
        else v = n.code.startsWith("3-01") ? 2500000 : UI.between(r, 300000, 900000);
        bal[n.code] = Math.round(v * 100) / 100;
      });
      const leafSum = p => Object.keys(bal).filter(c => c === p || c.startsWith(p + "-")).reduce((a, c) => a + bal[c], 0);
      TREE.forEach(n => { if (lvl(n.code) < 5) bal[n.code] = leafSum(n.code); });
      const A = bal["1"], L = bal["2"], E = bal["3"];
      const result = Math.round((A - L - E) * 100) / 100;   // the gap is the period result
      return { bal, A, L, E, result };
    }

    function render() {
      if (!state) return;
      const c = compute(); state.c = c;
      const inc = document.getElementById("fResult").checked;
      const LE = c.L + c.E + (inc ? c.result : 0), diff = c.A - LE;
      const man = k => manual[k] != null ? manual[k] : null;
      document.getElementById("banner").innerHTML = Math.abs(diff) < .005
        ? '<div class="check-banner ok">' + mi("check_circle") + "<div>" + t("okBanner", { a: M(c.A), b: M(LE) }) + "</div></div>"
        : '<div class="check-banner bad">' + mi("error_outline") + "<div>" + t("badBanner", { d: M(diff), a: M(c.A), b: M(LE) }) + ' <span class="muted">' + (inc ? "" : t("badWhy")) + "</span></div></div>";
      const rowsC = [["assets", c.A], ["liabilities", c.L], ["equity", c.E]].concat(inc ? [["periodResult", c.result]] : []).concat([["liabEq", LE], ["difference", diff]]);
      document.querySelector("#tCheck thead").innerHTML = "<tr><th>" + t("colConcept") + '</th><th class="r">' + t("colAuto") + '</th><th class="r">' + t("colManual") + '</th><th class="r">' + t("colDiff") + "</th></tr>";
      document.querySelector("#tCheck tbody").innerHTML = rowsC.map(x => { const mv = man("chk-" + x[0]); return '<tr class="' + (x[0] === "liabEq" || x[0] === "difference" ? "lvl-2" : "") + '"><td>' + t(x[0]) + '</td><td class="r">' + M(x[1]) + '</td><td class="r">' + (x[0] === "difference" || x[0] === "liabEq" ? "—" : '<input class="manual-in" data-k="chk-' + x[0] + '" aria-label="' + t("manualHint") + " " + t(x[0]) + '" value="' + (mv != null ? M(mv) : "") + '">') +
        '</td><td class="r ' + (mv != null && Math.abs(mv - x[1]) >= .005 ? "neg" : "") + '">' + (mv != null ? M(mv - x[1]) : (x[0] === "difference" && Math.abs(diff) >= .005 ? '<span class="neg">' + M(diff) + "</span>" : "—")) + "</td></tr>"; }).join("");
      document.querySelectorAll("#tCheck .manual-in").forEach(inp => { UI.maskMoney(inp); inp.addEventListener("change", () => { manual[inp.dataset.k] = inp.value === "" ? null : UI.parseMoney(inp.value); render(); }); });
      renderTree();
    }

    function renderTree() {
      const c = state.c;
      const q = document.getElementById("fSearch").value.trim().toLowerCase();
      const only = document.getElementById("fOnly").checked;
      const depth = Number(fDepth.val()), rubro = fRubro.val(), nic = fNic.val(), grade = Number(fGrade.val());
      const name = n => UI.lang === "es" ? n.es : n.en;
      const visible = [];
      const match = n => (n.code.toLowerCase().includes(q) || name(n).toLowerCase().includes(q));
      const subtreeMatches = n => match(n) || TREE.some(x => x.code.startsWith(n.code + "-") && match(x));
      function walk(code) {
        kids(code).forEach(n => {
          if (lvl(n.code) > depth) return;
          if (rubro !== "all" && !n.code.startsWith(rubro)) return;
          if (nic !== "all" && n.nic && n.nic !== nic) return;
          if (only && Math.abs(c.bal[n.code]) < .005) return;
          if (q && !subtreeMatches(n)) return;
          visible.push(n);
          if (q || open.has(n.code)) walk(n.code);
        });
      }
      TREE.filter(n => lvl(n.code) === 1).forEach(n => {
        if (rubro !== "all" && n.code !== rubro) return;
        if (only && Math.abs(c.bal[n.code]) < .005) return;
        if (q && !subtreeMatches(n)) return;
        visible.push(n);
        if (q || open.has(n.code)) walk(n.code);
      });
      document.querySelector("#tTree thead").innerHTML = "<tr><th>" + t("colAccount") + "</th><th>" + t("colName") + '</th><th class="r">' + t("colGrade") + "</th><th>" + t("colNature") + "</th><th>" + t("colClass") + '</th><th class="r">' + t("colAuto") + '</th><th class="r">' + t("colManual") + '</th><th class="r">' + t("colDif") + "</th></tr>";
      document.querySelector("#tTree tbody").innerHTML = visible.map(n => {
        const l = lvl(n.code), hasKids = kids(n.code).length && l < depth, isOpen = q || open.has(n.code);
        const mv = manual["acc-" + n.code];
        const nat = n.code.startsWith("1") ? t("debit") : t("credit");
        const cls = n.nic ? t(n.nic === "cur" ? "current" : "noncurrent") : "—";
        return '<tr class="lvl-' + l + (l <= grade ? "" : " muted") + '"><td style="padding-left:' + (8 + (l - 1) * 16) + 'px;white-space:nowrap">' +
          (hasKids ? '<button type="button" class="tree-btn" data-code="' + n.code + '" aria-expanded="' + !!isOpen + '" aria-label="' + n.code + '">' + mi("chevron_right") + "</button>" : '<span class="tree-pad"></span>') + " " + n.code +
          "</td><td>" + name(n) + '</td><td class="r">' + l + "</td><td>" + nat + "</td><td>" + cls + '</td><td class="r' + (c.bal[n.code] < 0 ? " neg" : "") + '">' + M(c.bal[n.code]) +
          '</td><td class="r">' + (l === 5 ? '<input class="manual-in" data-k="acc-' + n.code + '" aria-label="' + t("manualHint") + " " + n.code + '" value="' + (mv != null ? M(mv) : "") + '">' : "—") +
          '</td><td class="r ' + (mv != null && Math.abs(mv - c.bal[n.code]) >= .005 ? "neg" : "") + '">' + (mv != null ? M(mv - c.bal[n.code]) : "—") + "</td></tr>";
      }).join("") || '<tr><td colspan="8" class="muted">' + t("noData") + "</td></tr>";
      document.querySelectorAll("#tTree .manual-in").forEach(inp => { UI.maskMoney(inp); inp.addEventListener("change", () => { manual[inp.dataset.k] = inp.value === "" ? null : UI.parseMoney(inp.value); renderTree(); }); });
      document.querySelector("#tTree tfoot").innerHTML = '<tr><td colspan="5">' + t("assets") + " − " + t("liabEq") + '</td><td class="r">' + M(c.A - c.L - c.E - (document.getElementById("fResult").checked ? c.result : 0)) + '</td><td></td><td></td></tr>';
    }

    document.getElementById("tTree").addEventListener("click", e => {
      const b = e.target.closest(".tree-btn"); if (!b) return;
      const code = b.dataset.code;
      if (open.has(code)) open.delete(code); else open.add(code);
      renderTree();
      const again = document.querySelector('#tTree .tree-btn[data-code="' + code + '"]'); if (again) again.focus();
    });
    document.getElementById("expandAll").addEventListener("click", () => { TREE.forEach(n => open.add(n.code)); renderTree(); });
    document.getElementById("collapseAll").addEventListener("click", () => { open = new Set(); renderTree(); });
    document.getElementById("fSearch").addEventListener("input", () => state && renderTree());
    document.getElementById("fOnly").addEventListener("change", () => state && renderTree());
    [fRubro, fDepth, fGrade].forEach(s => s.on("change", () => state && renderTree()));
    document.getElementById("fResult").addEventListener("change", () => state && render());

    function load() {
      state = { m: Number(fMonth.val()), y: Number($("#fYear").val()) };
      manual = {};
      document.getElementById("result").hidden = false;
      document.getElementById("hint").textContent = t("loaded", { m: UI.monthName(state.m), y: state.y });
      render();
    }
    document.getElementById("filters").addEventListener("submit", e => { e.preventDefault(); load(); });
    document.addEventListener("langchange", () => { fillSelects(); document.getElementById("about").innerHTML = UI.aboutBox("aboutText"); if (state) { document.getElementById("hint").textContent = t("loaded", { m: UI.monthName(state.m), y: state.y }); render(); } });
    document.getElementById("about").innerHTML = UI.aboutBox("aboutText");
    load();
  });
  </script>
</body>
</html>
