<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Service desk · Business UI Gallery</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/base.css">
  <style>
    .sd-board { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
    .sd-col { background: var(--mc-panel); border: 1px solid var(--mc-line); border-top: 3px solid var(--c); border-radius: 10px; padding: 10px; min-width: 0; display: flex; flex-direction: column; gap: 8px; min-height: 200px; }
    .sd-col.drop { outline: 2px dashed var(--c); outline-offset: -4px; }
    .sd-col-head { display: flex; justify-content: space-between; align-items: center; font-size: 11px; font-weight: 800; text-transform: uppercase; color: var(--mc-muted); }
    .sd-col-head span.count { border: 1px solid var(--mc-line); border-radius: 10px; padding: 1px 8px; color: var(--mc-text); }
    .sd-card { background: var(--mc-panel-2); border: 1px solid var(--mc-line); border-left: 3px solid var(--p); border-radius: 8px; padding: 9px; display: flex; flex-direction: column; gap: 6px; cursor: grab; }
    :root[data-theme="light"] .sd-card { background: #fff; }
    .sd-card.dragging { opacity: .5; }
    .sd-card h4 { font-size: 12.5px; font-weight: 700; line-height: 1.35; overflow-wrap: anywhere; }
    .sd-card .meta { display: flex; justify-content: space-between; align-items: center; gap: 6px; flex-wrap: wrap; font-size: 11px; color: var(--mc-muted); }
    .sd-av { width: 26px; height: 26px; border-radius: 50%; display: inline-grid; place-items: center; font-size: 10px; font-weight: 800; color: #fff; flex: none; }
    .sd-moves { display: flex; gap: 4px; }
    .sd-moves .btn { min-height: 26px; padding: 0 6px; }
    .sd-sla { font-variant-numeric: tabular-nums; }
    .sd-timeline { display: flex; flex-direction: column; gap: 10px; border-left: 2px solid var(--mc-line); margin-left: 12px; padding-left: 16px; }
    .sd-tl { position: relative; font-size: 12px; }
    .sd-tl::before { content: ""; position: absolute; left: -22px; top: 4px; width: 10px; height: 10px; border-radius: 50%; background: var(--mc-teal); border: 2px solid var(--mc-panel); }
    .sd-tl.sys::before { background: var(--mc-muted); }
    .sd-tl small { display: block; color: var(--mc-muted); font-size: 10.5px; margin-bottom: 2px; }
    @media (max-width: 1100px) { .sd-board { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
    @media (max-width: 640px) { .sd-board { grid-template-columns: minmax(0, 1fr); } }
  </style>
</head>
<body data-page="service-desk" data-root="../">
  <main id="content">
    <div class="mc-head"><div><h2 data-i18n="title"></h2><p data-i18n="subtitle"></p></div>
      <button class="btn btn-teal" type="button" id="btnNew"><span class="material-icons" aria-hidden="true">add</span><span data-i18n="newTicket"></span></button></div>

    <section class="mc-kpis" id="kpis"></section>

    <section class="mc-panel">
      <div class="mc-filters">
        <div class="mc-field"><label for="fAssignee" data-i18n="assignee"></label><select id="fAssignee"></select></div>
        <div class="mc-field"><label for="fPriority" data-i18n="priority"></label><select id="fPriority"></select></div>
        <div class="mc-field"><label for="fCat" data-i18n="category"></label><select id="fCat"></select></div>
        <div class="mc-field w-lg"><label for="fText" data-i18n="search"></label><input type="search" id="fText" data-i18n-ph="searchPh"></div>
        <div class="mc-tabs" role="tablist" id="viewTabs"></div>
      </div>
    </section>

    <section id="boardView"><div class="sd-board" id="board"></div><p class="mc-hint" style="margin-top:8px" data-i18n="dragHint"></p></section>
    <section class="mc-panel" id="listView" hidden>
      <div class="table-wrap"><table class="grid" id="tList"><thead></thead><tbody></tbody></table></div>
    </section>

    <div id="about"></div>
  </main>

  <!-- New ticket -->
  <div class="modal-backdrop" id="mNew">
    <div class="modal" style="width:min(720px,100%)" role="dialog" aria-modal="true" aria-labelledby="mNewT">
      <div class="modal-head"><h3 id="mNewT"><span class="material-icons" aria-hidden="true">confirmation_number</span><span data-i18n="newTicket"></span></h3></div>
      <div class="modal-body">
        <div class="mc-filters">
          <div class="mc-field"><label for="nCat" data-i18n="categoryReq"></label><select id="nCat"></select></div>
          <div class="mc-field"><label for="nPri" data-i18n="priorityReq"></label><select id="nPri"></select></div>
          <div class="mc-field"><label for="nBranch" data-i18n="branch"></label><select id="nBranch"></select></div>
          <div class="mc-field w-lg" style="flex-basis:100%"><label for="nSubject" data-i18n="subjectReq"></label><input id="nSubject" maxlength="90"><span class="mc-field-error" id="nSubjectErr"></span></div>
          <div class="mc-field w-lg" style="flex-basis:100%"><label for="nDesc" data-i18n="descReq"></label><textarea id="nDesc"></textarea><span class="mc-field-error" id="nDescErr"></span></div>
        </div>
        <p class="mc-hint" id="nSla"></p>
      </div>
      <div class="modal-foot"><button class="btn btn-teal" type="button" id="nSave"><span class="material-icons" aria-hidden="true">save</span><span data-i18n="save"></span></button><button class="btn" type="button" data-close="mNew" data-i18n="close"></button></div>
    </div>
  </div>

  <!-- Ticket detail -->
  <div class="modal-backdrop" id="mDet">
    <div class="modal" style="width:min(820px,100%)" role="dialog" aria-modal="true" aria-labelledby="mDetT">
      <div class="modal-head"><h3 id="mDetT"><span class="material-icons" aria-hidden="true">confirmation_number</span><span id="dTitle"></span></h3><span id="dChips"></span></div>
      <div class="modal-body">
        <p id="dDesc" style="font-size:13px;line-height:1.55;margin-bottom:12px"></p>
        <div class="mc-filters" style="margin-bottom:12px">
          <div class="mc-field"><label for="dStatus" data-i18n="status"></label><select id="dStatus"></select></div>
          <div class="mc-field"><label for="dAssignee" data-i18n="assignee"></label><select id="dAssignee"></select></div>
        </div>
        <div class="mc-label" style="margin-bottom:8px" data-i18n="history"></div>
        <div class="sd-timeline" id="dTimeline"></div>
        <div class="mc-field" style="margin-top:12px"><label for="dComment" data-i18n="addComment"></label><textarea id="dComment" data-i18n-ph="commentPh"></textarea><span class="mc-field-error" id="dErr"></span></div>
      </div>
      <div class="modal-foot"><button class="btn btn-teal" type="button" id="dSave"><span class="material-icons" aria-hidden="true">save</span><span data-i18n="save"></span></button><button class="btn" type="button" data-close="mDet" data-i18n="close"></button></div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
  <script src="../assets/js/common.js"></script>
  <script>
  UI.strings({
    en: {
      title: "IT service desk", subtitle: "Tickets of every branch with their priority, SLA and who is attending them.", newTicket: "New ticket",
      kOpen: "Open tickets", kBreached: "SLA breached", kAvg: "Average resolution", kOnTime: "Resolved within SLA", hours: "{n} h",
      assignee: "Assigned to", priority: "Priority", category: "Category", searchPh: "Number, subject or requester…", board: "Board", list: "List",
      dragHint: "Drag a card to another column, or use its arrow buttons.",
      s_new: "New", s_progress: "In progress", s_waiting: "Waiting", s_resolved: "Resolved", p_high: "High", p_medium: "Medium", p_low: "Low",
      c_hw: "Hardware", c_sw: "Software / ERP", c_net: "Network", c_print: "Printers", c_access: "Users and access",
      unassigned: "Unassigned", slaLeft: "{t} left", slaBreached: "Breached {t} ago", slaMet: "Within SLA", slaMissed: "Out of SLA", moveLeft: "Move left", moveRight: "Move right",
      colNo: "No.", colSubject: "Subject", colReq: "Requester", colCreated: "Created", colSla: "SLA",
      categoryReq: "Category *", priorityReq: "Priority *", subjectReq: "Subject *", descReq: "Description *", subjectErr: "Write the subject.", descErr: "Describe the problem (at least 10 characters).",
      slaInfo: "SLA for this priority: {h} hours to resolve.", created: "Ticket #{n} created.", history: "History", addComment: "Add comment", commentPh: "Write an update for the requester…",
      tlCreated: "Ticket created by {u}", tlStatus: "Status changed to {s}", tlAssign: "Assigned to {u}", saved: "Ticket #{n} updated.", moved: "Ticket #{n} moved to {s}.",
      aboutText: "The real module receives the IT requests of every branch. Each ticket has a <b>category</b>, a <b>priority</b> and an <b>SLA</b> (hours to resolve by priority: high 4 h, medium 8 h, low 24 h); the timer runs live and when it expires the card says <b>Breached</b> with an icon, not only with color. Cards move between columns by dragging or with their arrow buttons, and every change of status, assignment or comment stays in the <b>history</b> of the ticket. The indicators above follow the filters. All tickets and names are samples."
    },
    es: {
      title: "Mesa de ayuda de TI", subtitle: "Tickets de todas las sucursales con su prioridad, su SLA y quién los atiende.", newTicket: "Nuevo ticket",
      kOpen: "Tickets abiertos", kBreached: "SLA vencido", kAvg: "Tiempo promedio de resolución", kOnTime: "Resueltos dentro del SLA", hours: "{n} h",
      assignee: "Asignado a", priority: "Prioridad", category: "Categoría", searchPh: "Número, asunto o solicitante…", board: "Tablero", list: "Lista",
      dragHint: "Arrastre una tarjeta a otra columna o use sus botones de flecha.",
      s_new: "Nuevo", s_progress: "En proceso", s_waiting: "En espera", s_resolved: "Resuelto", p_high: "Alta", p_medium: "Media", p_low: "Baja",
      c_hw: "Hardware", c_sw: "Software / ERP", c_net: "Red", c_print: "Impresoras", c_access: "Usuarios y accesos",
      unassigned: "Sin asignar", slaLeft: "Quedan {t}", slaBreached: "Vencido hace {t}", slaMet: "Dentro del SLA", slaMissed: "Fuera del SLA", moveLeft: "Mover a la izquierda", moveRight: "Mover a la derecha",
      colNo: "N.º", colSubject: "Asunto", colReq: "Solicitante", colCreated: "Creado", colSla: "SLA",
      categoryReq: "Categoría *", priorityReq: "Prioridad *", subjectReq: "Asunto *", descReq: "Descripción *", subjectErr: "Escriba el asunto.", descErr: "Describa el problema (al menos 10 caracteres).",
      slaInfo: "SLA de esta prioridad: {h} horas para resolver.", created: "Se creó el ticket #{n}.", history: "Historial", addComment: "Agregar comentario", commentPh: "Escriba una actualización para el solicitante…",
      tlCreated: "Ticket creado por {u}", tlStatus: "Estado cambiado a {s}", tlAssign: "Asignado a {u}", saved: "Ticket #{n} actualizado.", moved: "Ticket #{n} movido a {s}.",
      aboutText: "El módulo real recibe las solicitudes de TI de todas las sucursales. Cada ticket tiene <b>categoría</b>, <b>prioridad</b> y un <b>SLA</b> (horas para resolver según prioridad: alta 4 h, media 8 h, baja 24 h); el tiempo corre en vivo y cuando se vence la tarjeta dice <b>Vencido</b> con ícono, no solo con color. Las tarjetas se mueven entre columnas arrastrándolas o con sus botones de flecha, y cada cambio de estado, asignación o comentario queda en el <b>historial</b> del ticket. Los indicadores de arriba siguen los filtros. Todos los tickets y nombres son de ejemplo."
    }
  });

  $(function () {
    const t = UI.t, mi = UI.mi, D = UI.DATA;
    const STATUSES = [["new", "s_new", "#38bdf8"], ["progress", "s_progress", "#14b8a6"], ["waiting", "s_waiting", "#f59e0b"], ["resolved", "s_resolved", "#22c55e"]];
    const PRI = { high: { k: "p_high", h: 4, c: "#fb7185", icon: "keyboard_double_arrow_up", cls: "chip-neg" }, medium: { k: "p_medium", h: 8, c: "#f59e0b", icon: "drag_handle", cls: "chip-warn" }, low: { k: "p_low", h: 24, c: "#38bdf8", icon: "keyboard_arrow_down", cls: "chip-info" } };
    const CATS = ["hw", "sw", "net", "print", "access"];
    const AGENTS = [["R. Molina", "#8b5cf6"], ["J. Cruz", "#06b6d4"], ["M. Herrera", "#14b8a6"]];
    const SUBJ = {
      hw: [["Laptop does not turn on", "La laptop no enciende"], ["Monitor flickers", "El monitor parpadea"], ["Keyboard keys not working", "Teclas del teclado no funcionan"]],
      sw: [["Error when saving an invoice", "Error al guardar una factura"], ["Report takes too long to load", "El reporte tarda mucho en cargar"], ["Cannot open the sales module", "No abre el módulo de ventas"]],
      net: [["No internet at the branch", "Sin internet en la sucursal"], ["Slow connection in the warehouse", "Conexión lenta en bodega"], ["VPN disconnects", "La VPN se desconecta"]],
      print: [["Printer jams paper", "La impresora atasca papel"], ["Cannot print delivery notes", "No imprime las notas de entrega"]],
      access: [["New user for cashier", "Usuario nuevo para cajera"], ["Reset password", "Restablecer contraseña"], ["Permission to approve payments", "Permiso para aprobar pagos"]]
    };
    const NOW = Date.now();
    const r = UI.rng(777);
    const tickets = [];
    for (let i = 0; i < 26; i++) {
      const cat = UI.pick(r, CATS), pri = r() < .25 ? "high" : r() < .6 ? "medium" : "low";
      const st = i < 6 ? "new" : i < 14 ? "progress" : i < 18 ? "waiting" : "resolved";
      const created = NOW - UI.between(r, .5, PRI[pri].h * (st === "resolved" ? 1.2 : 1.1)) * 3600000;
      const s = UI.pick(r, SUBJ[cat]);
      const tk = { no: 2400 + i, cat, pri, status: st, subj: { en: s[0], es: s[1] }, req: UI.pick(r, D.firstNames) + " " + UI.pick(r, D.lastNames), branch: Math.floor(r() * D.branches.length),
        assignee: st === "new" && r() < .6 ? -1 : Math.floor(r() * AGENTS.length), created, desc: { en: "The user reports the problem since this morning at the branch. Sample description.", es: "El usuario reporta el problema desde esta mañana en la sucursal. Descripción de ejemplo." } };
      if (st === "resolved") tk.resolved = created + UI.between(r, .3, PRI[pri].h * 1.3) * 3600000;
      tk.log = [{ at: created, sys: true, k: "tlCreated", v: { u: tk.req } }];
      if (tk.assignee >= 0) tk.log.push({ at: created + 600000, sys: true, k: "tlAssign", v: { u: AGENTS[tk.assignee][0] } });
      if (st !== "new") tk.log.push({ at: created + 1200000, sys: true, k: "tlStatus", v: { s: "s_" + st } });
      tickets.push(tk);
    }
    let view = "board";

    const dur = ms => { const m = Math.round(Math.abs(ms) / 60000); return m < 60 ? m + " min" : Math.floor(m / 60) + " h " + String(m % 60).padStart(2, "0") + " min"; };
    function sla(tk) {
      const due = tk.created + PRI[tk.pri].h * 3600000;
      if (tk.status === "resolved") return tk.resolved <= due ? '<span class="chip chip-pos">' + mi("verified") + t("slaMet") + "</span>" : '<span class="chip chip-neg">' + mi("timer_off") + t("slaMissed") + "</span>";
      const left = due - Date.now();
      return left >= 0 ? '<span class="chip ' + (left < 3600000 ? "chip-warn" : "chip-info") + ' sd-sla">' + mi("timer") + t("slaLeft", { t: dur(left) }) + "</span>"
        : '<span class="chip chip-neg sd-sla">' + mi("alarm_off") + t("slaBreached", { t: dur(left) }) + "</span>";
    }
    const priChip = p => '<span class="chip ' + PRI[p].cls + '">' + mi(PRI[p].icon) + t(PRI[p].k) + "</span>";
    const av = a => a < 0 ? '<span class="sd-av" style="background:#64748b" title="' + t("unassigned") + '">—</span>' : '<span class="sd-av" style="background:' + AGENTS[a][1] + '" title="' + AGENTS[a][0] + '">' + AGENTS[a][0].replace(/[^A-Z]/g, "") + "</span>";
    function pass(tk) {
      const a = $("#fAssignee").val(), p = $("#fPriority").val(), c = $("#fCat").val(), q = $("#fText").val().trim().toLowerCase();
      return (a === "all" || String(tk.assignee) === a) && (p === "all" || tk.pri === p) && (c === "all" || tk.cat === c) &&
        (!q || ("#" + tk.no + " " + UI.L(tk.subj) + " " + tk.req).toLowerCase().includes(q));
    }
    function fill(sel, opts, withAll) { const $s = $(sel), v = $s.val(); $s.empty(); if (withAll) $s.append(new Option(t("all"), "all")); opts.forEach(o => $s.append(new Option(o[1], o[0]))); if (v != null && $s.find('option[value="' + v + '"]').length) $s.val(v); }
    function filters() {
      fill("#fAssignee", [["-1", t("unassigned")]].concat(AGENTS.map((a, i) => [String(i), a[0]])), true);
      fill("#fPriority", Object.keys(PRI).map(p => [p, t(PRI[p].k)]), true);
      fill("#fCat", CATS.map(c => [c, t("c_" + c)]), true);
      document.getElementById("viewTabs").innerHTML = [["board", "view_kanban"], ["list", "list"]].map(v => '<button type="button" class="mc-tab" role="tab" aria-selected="' + (view === v[0]) + '" data-view="' + v[0] + '">' + mi(v[1]) + " " + t(v[0]) + "</button>").join("");
    }
    function kpis() {
      const list = tickets.filter(pass);
      const open = list.filter(x => x.status !== "resolved");
      const breached = open.filter(x => x.created + PRI[x.pri].h * 3600000 < Date.now()).length;
      const res = list.filter(x => x.status === "resolved");
      const avg = res.length ? res.reduce((a, x) => a + (x.resolved - x.created), 0) / res.length / 3600000 : 0;
      const onTime = res.length ? res.filter(x => x.resolved <= x.created + PRI[x.pri].h * 3600000).length / res.length : 0;
      const k = (l, v, col) => '<div class="mc-kpi is-accent" style="--k-color:' + col + '"><div class="k-label">' + t(l) + '</div><div class="k-value">' + v + "</div></div>";
      document.getElementById("kpis").innerHTML = k("kOpen", open.length, "#38bdf8") + k("kBreached", breached, "#fb7185") + k("kAvg", t("hours", { n: avg.toFixed(1) }), "#a78bfa") + k("kOnTime", UI.fmtPct(onTime, 0), "#2dd4bf");
    }
    function card(tk, si) {
      return '<article class="sd-card" draggable="true" data-no="' + tk.no + '" style="--p:' + PRI[tk.pri].c + '">' +
        '<div class="meta"><b style="color:var(--mc-text)">#' + tk.no + "</b>" + priChip(tk.pri) + "</div>" +
        '<h4><a href="#" data-open="' + tk.no + '" style="color:inherit;text-decoration:none">' + UI.L(tk.subj) + "</a></h4>" +
        '<div class="meta"><span>' + mi("label") + " " + t("c_" + tk.cat) + "</span><span>" + D.branches[tk.branch] + "</span></div>" +
        '<div class="meta">' + sla(tk) + av(tk.assignee) + "</div>" +
        '<div class="meta"><span class="muted" style="font-size:10.5px">' + tk.req + '</span><span class="sd-moves">' +
        (si > 0 ? '<button type="button" class="btn btn-sm" data-move="-1" data-no="' + tk.no + '" aria-label="' + t("moveLeft") + " #" + tk.no + '">' + mi("chevron_left") + "</button>" : "") +
        (si < STATUSES.length - 1 ? '<button type="button" class="btn btn-sm" data-move="1" data-no="' + tk.no + '" aria-label="' + t("moveRight") + " #" + tk.no + '">' + mi("chevron_right") + "</button>" : "") + "</span></div></article>";
    }
    function board() {
      document.getElementById("board").innerHTML = STATUSES.map((s, si) => {
        const list = tickets.filter(x => x.status === s[0] && pass(x)).sort((a, b) => (a.created + PRI[a.pri].h * 3600000) - (b.created + PRI[b.pri].h * 3600000));
        return '<div class="sd-col" style="--c:' + s[2] + '" data-status="' + s[0] + '" aria-label="' + t(s[1]) + '"><div class="sd-col-head"><span>' + t(s[1]) + '</span><span class="count">' + list.length + "</span></div>" + list.map(x => card(x, si)).join("") + "</div>";
      }).join("");
    }
    function listView() {
      document.querySelector("#tList thead").innerHTML = "<tr><th>" + t("colNo") + "</th><th>" + t("colSubject") + "</th><th>" + t("category") + "</th><th>" + t("priority") + "</th><th>" + t("status") + "</th><th>" + t("assignee") + "</th><th>" + t("colReq") + "</th><th>" + t("colCreated") + "</th><th>" + t("colSla") + "</th></tr>";
      document.querySelector("#tList tbody").innerHTML = tickets.filter(pass).sort((a, b) => b.no - a.no).map(x => '<tr><td class="num"><a href="#" data-open="' + x.no + '">#' + x.no + "</a></td><td>" + UI.L(x.subj) + "</td><td>" + t("c_" + x.cat) + "</td><td>" + priChip(x.pri) + "</td><td>" + t("s_" + x.status) + "</td><td>" + (x.assignee < 0 ? t("unassigned") : AGENTS[x.assignee][0]) +
        "</td><td>" + x.req + '</td><td class="num">' + dur(Date.now() - x.created) + "</td><td>" + sla(x) + "</td></tr>").join("");
    }
    function render() { kpis(); if (view === "board") board(); else listView(); document.getElementById("boardView").hidden = view !== "board"; document.getElementById("listView").hidden = view !== "list"; }
    function all() { filters(); render(); document.getElementById("about").innerHTML = UI.aboutBox("aboutText", "aboutScreen"); }

    function setStatus(tk, st) { if (tk.status === st) return; tk.status = st; tk.log.push({ at: Date.now(), sys: true, k: "tlStatus", v: { s: "s_" + st } }); if (st === "resolved") tk.resolved = Date.now(); else delete tk.resolved; }
    function move(no, dir) {
      const tk = tickets.find(x => x.no === no);
      const i = STATUSES.findIndex(s => s[0] === tk.status);
      const ni = Math.min(Math.max(i + dir, 0), STATUSES.length - 1);
      setStatus(tk, STATUSES[ni][0]); render();
      UI.toast(t("moved", { n: no, s: t(STATUSES[ni][1]) }));
      const btn = document.querySelector('.sd-card[data-no="' + no + '"] [data-move="' + dir + '"]') || document.querySelector('.sd-card[data-no="' + no + '"] [data-move]') || document.querySelector('.sd-card[data-no="' + no + '"] [data-open]');
      if (btn) btn.focus();
    }
    // Drag and drop
    let dragNo = null;
    const boardEl = document.getElementById("board");
    boardEl.addEventListener("dragstart", e => { const c = e.target.closest(".sd-card"); if (!c) return; dragNo = Number(c.dataset.no); c.classList.add("dragging"); e.dataTransfer.effectAllowed = "move"; e.dataTransfer.setData("text/plain", String(dragNo)); });
    boardEl.addEventListener("dragend", e => { const c = e.target.closest(".sd-card"); if (c) c.classList.remove("dragging"); document.querySelectorAll(".sd-col.drop").forEach(x => x.classList.remove("drop")); });
    boardEl.addEventListener("dragover", e => { const col = e.target.closest(".sd-col"); if (!col) return; e.preventDefault(); document.querySelectorAll(".sd-col.drop").forEach(x => x !== col && x.classList.remove("drop")); col.classList.add("drop"); });
    boardEl.addEventListener("drop", e => { const col = e.target.closest(".sd-col"); if (!col || dragNo == null) return; e.preventDefault(); const tk = tickets.find(x => x.no === dragNo); setStatus(tk, col.dataset.status); dragNo = null; render(); UI.toast(t("moved", { n: tk.no, s: t("s_" + tk.status) })); });

    // Detail
    let cur = null;
    function openTicket(no) {
      cur = tickets.find(x => x.no === no);
      document.getElementById("dTitle").textContent = "#" + cur.no + " · " + UI.L(cur.subj);
      document.getElementById("dChips").innerHTML = priChip(cur.pri) + " " + sla(cur);
      document.getElementById("dDesc").textContent = UI.L(cur.desc) + " — " + cur.req + ", " + D.branches[cur.branch] + ".";
      fill("#dStatus", STATUSES.map(s => [s[0], t(s[1])])); $("#dStatus").val(cur.status);
      fill("#dAssignee", [["-1", t("unassigned")]].concat(AGENTS.map((a, i) => [String(i), a[0]]))); $("#dAssignee").val(String(cur.assignee));
      timeline(); $("#dComment").val(""); $("#dErr").text("");
      UI.openModal("mDet");
    }
    function timeline() {
      document.getElementById("dTimeline").innerHTML = cur.log.slice().sort((a, b) => a.at - b.at).map(l => {
        const when = new Date(l.at).toLocaleString(UI.lang === "es" ? "es" : "en", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" });
        const txt = l.text ? l.text : t(l.k, l.v && l.v.s ? { s: t(l.v.s) } : l.v);
        return '<div class="sd-tl' + (l.sys ? " sys" : "") + '"><small>' + when + (l.by ? " · " + l.by : "") + "</small>" + $("<span>").text(txt).html() + "</div>";
      }).join("");
    }
    document.getElementById("dSave").addEventListener("click", () => {
      const c = $("#dComment").val().trim();
      const a = Number($("#dAssignee").val());
      if (a !== cur.assignee) { cur.assignee = a; if (a >= 0) cur.log.push({ at: Date.now(), sys: true, k: "tlAssign", v: { u: AGENTS[a][0] } }); }
      setStatus(cur, $("#dStatus").val());
      if (c) cur.log.push({ at: Date.now(), by: cur.assignee >= 0 ? AGENTS[cur.assignee][0] : "IT", text: c });
      UI.closeModal("mDet"); render(); UI.toast(t("saved", { n: cur.no }));
    });

    // New ticket
    function slaInfo() { document.getElementById("nSla").textContent = t("slaInfo", { h: PRI[$("#nPri").val()].h }); }
    document.getElementById("btnNew").addEventListener("click", () => {
      fill("#nCat", CATS.map(c => [c, t("c_" + c)])); fill("#nPri", Object.keys(PRI).map(p => [p, t(PRI[p].k)])); $("#nPri").val("medium");
      fill("#nBranch", D.branches.map((b, i) => [String(i), b]));
      $("#nSubject, #nDesc").val("").removeAttr("aria-invalid"); $("#nSubjectErr, #nDescErr").text(""); slaInfo(); UI.openModal("mNew");
    });
    $("#nPri").on("change", slaInfo);
    document.getElementById("nSave").addEventListener("click", () => {
      const s = $("#nSubject").val().trim(), d = $("#nDesc").val().trim();
      $("#nSubjectErr, #nDescErr").text(""); $("#nSubject, #nDesc").removeAttr("aria-invalid");
      if (!s) { $("#nSubjectErr").text(t("subjectErr")); $("#nSubject").attr("aria-invalid", "true").focus(); return; }
      if (d.length < 10) { $("#nDescErr").text(t("descErr")); $("#nDesc").attr("aria-invalid", "true").focus(); return; }
      const no = Math.max.apply(null, tickets.map(x => x.no)) + 1;
      const me = UI.lang === "es" ? "Usted" : "You";
      tickets.push({ no, cat: $("#nCat").val(), pri: $("#nPri").val(), status: "new", subj: { en: s, es: s }, desc: { en: d, es: d }, req: me, branch: Number($("#nBranch").val()), assignee: -1, created: Date.now(), log: [{ at: Date.now(), sys: true, k: "tlCreated", v: { u: me } }] });
      UI.closeModal("mNew"); render(); UI.toast(t("created", { n: no }));
    });

    document.addEventListener("click", e => {
      const o = e.target.closest("[data-open]"); if (o) { e.preventDefault(); openTicket(Number(o.dataset.open)); return; }
      const m = e.target.closest("[data-move]"); if (m) { move(Number(m.dataset.no), Number(m.dataset.move)); return; }
      const v = e.target.closest("[data-view]"); if (v) { view = v.dataset.view; filters(); render(); }
    });
    document.querySelectorAll("[data-close]").forEach(b => b.addEventListener("click", () => UI.closeModal(b.dataset.close)));
    $("#fAssignee, #fPriority, #fCat").on("change", render);
    $("#fText").on("input", render);
    setInterval(() => { if (!document.querySelector(".modal-backdrop.open")) { document.querySelectorAll(".sd-sla").length && render(); } }, 30000);
    document.addEventListener("langchange", all);
    all();
  });
  </script>
</body>
</html>
