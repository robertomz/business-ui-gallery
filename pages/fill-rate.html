  <script>
  UI.strings({

      stAll: "Todos", stFull: "Completo", stPart: "Incompleto", stNone: "Sin factura", crQty: "Por cantidad", crVal: "Por valor",
      chRetail: "Detalle", chWholesale: "Mayoreo", chSuper: "Supermercados", chRoute: "Ruta",
      kOrders: "Pedidos", kFull: "Completos", kPart: "Incompletos", kNone: "Sin factura", kFr: "Fill rate", kFrOrders: "Pedidos completos", kFrLines: "Líneas completas", kFrSale: "Venta atendida", kAdded: "Líneas agregadas",

      vOrder: "Por pedido", vLine: "Por línea", count: "{n} filas",
      cOrder: "Pedido", cDate: "Fecha pedido", cInvs: "Facturas", cCust: "Cliente", cSup: "Supervisor", cSeller: "Vendedor", cRoute: "Ruta", cChan: "Canal", cState: "Estado", cLines: "Líneas",
      cSaleO: "Venta pedido", cSaleI: "Venta facturada", cSaleM: "Venta faltante", cFr: "Fill rate venta", cMarO: "Margen pedido %", cMarI: "Margen facturado %",
      cItem: "Artículo", cQtyO: "Cant. pedida", cQtyI: "Cant. facturada", cQtyM: "Cant. faltante", cResult: "Resultado", rFull: "Completa", rPart: "Parcial", rNone: "Sin facturar", rAdded: "Agregada",
      vpList: "Detalle de ventas perdidas", top10: "Top 10 artículos por venta perdida", kLost: "Venta perdida", kAtSale: "A precio de venta", kAtMax: "A precio máximo", kAtMin: "A precio mínimo", kAtComp: "A precio de competencia",
      kCount: "Conteo", kLinesN: "Líneas", kCustN: "Clientes", kOrdersN: "Pedidos", kItemsN: "Artículos", kByOrigin: "Por origen (a precio de venta)", oOrder: "Pedido sin existencia", oManual: "Registro manual",
      reNoStock: "Sin existencia", reCancel: "Anulado", rePrice: "Precio", reComp: "Competencia", cOrigin: "Origen", cReason: "Motivo", cWh: "Bodega", cQtyL: "Cant. perdida", cStock: "Existencia", cPrice: "Precio venta", cTotal: "Total venta perdida",
      aboutText: "El <b>fill rate</b> cruza cada pedido del cliente con las facturas que salieron de él. Un pedido está <b>completo</b> cuando todas sus líneas se facturaron completas; el <b>criterio de la línea</b> decide si una línea cuenta por cantidad o por valor. <b>Venta atendida</b> = facturado ÷ pedido a precios del pedido; las <b>líneas agregadas</b> son artículos facturados que no estaban en el pedido. Las <b>ventas perdidas</b> son las líneas que no se facturaron por falta de existencia (desde los pedidos) o que el vendedor registró a mano, valoradas a precio de venta, máximo, mínimo y de competencia. Todos los cuadros, la tabla y el gráfico siguen los filtros y la búsqueda. Todos los datos de esta página son generados."
    }
  });

  $(function () {
    const D = UI.DATA, t = UI.t, M = UI.fmtMoney, mi = UI.mi;
    const SUPS = ["R. Castillo", "M. Paredes", "L. Fuentes", "S. Navarro"];
    const CHANNELS = ["chRetail", "chWholesale", "chSuper", "chRoute"];
    const WHS = ["Main", "North", "Coast"];
    const REASONS = ["reNoStock", "reCancel", "rePrice", "reComp"];
    const r = UI.rng(515);

    // Orders with lines, and the invoiced quantities
    const ORDERS = [], LINES = [];
    for (let k = 0; k < 520; k++) {
      const seller = Math.floor(r() * D.sellers.length);
      const o = { id: "PE-" + (30100 + k), date: new Date(Date.UTC(2026, 9, 15 + Math.floor(r() * 33))), cust: Math.floor(r() * D.customers.length), seller, sup: Math.floor(seller / 3) % 4, route: "R-0" + (1 + seller % 8), chan: Math.floor(r() * 4), lines: [] };
      const nl = 3 + Math.floor(r() * 7), mode = r();
      for (let j = 0; j < nl; j++) {
        const p = D.products[Math.floor(r() * D.products.length)];
        const qo = Math.ceil(UI.between(r, 2, 30)), price = Math.round(UI.between(r, 20, 220) * 100) / 100, cost = price * UI.between(r, .78, .93);
        let qi = qo;
        if (mode < .08) qi = 0; else if (mode < .5 && r() < .3) qi = Math.floor(qo * UI.between(r, 0, .9));
        const l = { o, item: p[0], cat: p[1], sup: D.suppliers[p[1] % D.suppliers.length], qo, qi, price, cost, wh: Math.floor(r() * 3), added: false, reason: qi < qo ? (r() < .7 ? 0 : 1 + Math.floor(r() * 3)) : null };
        o.lines.push(l); LINES.push(l);
      }
      if (mode > .9) { const p = D.products[Math.floor(r() * D.products.length)]; const l = { o, item: p[0], cat: p[1], sup: D.suppliers[p[1] % D.suppliers.length], qo: 0, qi: Math.ceil(UI.between(r, 1, 6)), price: UI.between(r, 20, 120), cost: 0, wh: 0, added: true, reason: null }; l.cost = l.price * .85; o.lines.push(l); LINES.push(l); }
      o.inv = mode < .08 ? [] : ["FA-" + (60000 + k * 2)].concat(r() < .2 ? ["FA-" + (60001 + k * 2)] : []);
      ORDERS.push(o);
    }
    const MANUAL = Array.from({ length: 70 }, (_, k) => { const p = D.products[Math.floor(r() * D.products.length)]; const seller = Math.floor(r() * D.sellers.length);
      return { manual: true, o: { id: "—", date: new Date(Date.UTC(2026, 9, 15 + Math.floor(r() * 33))), cust: Math.floor(r() * D.customers.length), seller, sup: Math.floor(seller / 3) % 4, route: "R-0" + (1 + seller % 8), chan: Math.floor(r() * 4) },
        item: p[0], cat: p[1], sup: D.suppliers[p[1] % D.suppliers.length], qo: Math.ceil(UI.between(r, 2, 20)), qi: 0, price: Math.round(UI.between(r, 20, 220) * 100) / 100, cost: 0, wh: Math.floor(r() * 3), reason: 2 + Math.floor(r() * 2) }; });

    let tab = "fr", view = "order";

    const SEL = {
      fState: () => [["all", t("stAll")], ["full", t("stFull")], ["part", t("stPart")], ["none", t("stNone")]], fCrit: () => [["qty", t("crQty")], ["val", t("crVal")]],
      fReason: () => REASONS.map((k, i) => [i, t(k)]), fWh: () => WHS.map((w, i) => [i, w]), fSup: () => SUPS.map((s, i) => [i, s]), fSeller: () => D.sellers.map((s, i) => [i, s]),
      fChannel: () => CHANNELS.map((c, i) => [i, t(c)]), fSupplier: () => D.suppliers.map(s => [s, s]), fCat: () => D.categories.map((c, i) => [i, UI.L(c)])
    };
    function fill() {
      Object.keys(SEL).forEach(id => {
        const $s = $("#" + id), v = $s.val(), multi = $s.prop("multiple");
        if ($s.hasClass("select2-hidden-accessible")) $s.select2("destroy");
        $s.empty(); SEL[id]().forEach(o => $s.append(new Option(o[1], String(o[0]))));
        $s.val(v != null && v.length !== 0 ? v : (multi ? [] : $s.find("option").first().val())).select2(multi ? { width: "100%", placeholder: t("all"), closeOnSelect: false } : { width: "100%", minimumResultsForSearch: Infinity });
      });
    }
    fill();
    const fFrom = document.getElementById("fFrom"), fTo = document.getElementById("fTo");
    fFrom.value = "2026-11-01"; fTo.value = "2026-11-16";

    const vals = id => ($("#" + id).val() || []);
    function baseOk(o) {
      const a = new Date(fFrom.value + "T00:00:00Z"), b = new Date(fTo.value + "T00:00:00Z");
      const sp = vals("fSup").map(Number), se = vals("fSeller").map(Number), ch = vals("fChannel").map(Number);
      return o.date >= a && o.date <= b && (!sp.length || sp.includes(o.sup)) && (!se.length || se.includes(o.seller)) && (!ch.length || ch.includes(o.chan));
    }
    const lineOk = l => { const su = vals("fSupplier"), ca = vals("fCat").map(Number); return (!su.length || su.includes(l.sup)) && (!ca.length || ca.includes(l.cat)); };
    const crit = () => $("#fCrit").val();
    const lineFull = l => l.added || (crit() === "val" ? l.qi * l.price >= l.qo * l.price * .98 : l.qi >= l.qo);
    function orderState(o, ls) { const inv = ls.reduce((a, l) => a + l.qi, 0); if (!o.inv.length || inv === 0) return "none"; return ls.every(lineFull) ? "full" : "part"; }
    const stChip = s => '<span class="st ' + ({ full: "st-ok", part: "st-mid", none: "st-bad" })[s] + '">' + mi({ full: "check_circle", part: "timelapse", none: "cancel" }[s]) + t({ full: "stFull", part: "stPart", none: "stNone" }[s]) + "</span>";

    const pctTd = (d, ty) => ty === "display" ? '<span class="' + (d < .9 ? "neg" : "pos") + '">' + UI.fmtPct(d) + "</span>" : d;
    const mon = (d, ty) => ty === "display" ? M(d) : d;
    let frCols = null;
    function frColumns() {
      return view === "order" ? [
        { data: "id", t: "cOrder" }, { data: "date", t: "cDate", render: (d, ty) => ty === "sort" ? d.getTime() : UI.fmtDay(d) }, { data: "invs", t: "cInvs" }, { data: "cust", t: "cCust" }, { data: "sup", t: "cSup" }, { data: "seller", t: "cSeller" },
        { data: "route", t: "cRoute" }, { data: "chan", t: "cChan" }, { data: "state", t: "cState", render: (d, ty) => ty === "display" ? stChip(d) : d }, { data: "nl", t: "cLines", className: "r" },
        { data: "so", t: "cSaleO", className: "r", render: mon }, { data: "si", t: "cSaleI", className: "r", render: mon }, { data: "sm", t: "cSaleM", className: "r", render: mon }, { data: "fr", t: "cFr", className: "r", render: pctTd },
        { data: "mo", t: "cMarO", className: "r", render: (d, ty) => ty === "display" ? UI.fmtPct(d, 2) : d }, { data: "mi", t: "cMarI", className: "r", render: (d, ty) => ty === "display" ? UI.fmtPct(d, 2) : d }
      ] : [
        { data: "id", t: "cOrder" }, { data: "date", t: "cDate", render: (d, ty) => ty === "sort" ? d.getTime() : UI.fmtDay(d) }, { data: "cust", t: "cCust" }, { data: "seller", t: "cSeller" }, { data: "item", t: "cItem" }, { data: "cat", t: "category" },
        { data: "supp", t: "supplier" }, { data: "qo", t: "cQtyO", className: "r" }, { data: "qi", t: "cQtyI", className: "r" }, { data: "qm", t: "cQtyM", className: "r" },
        { data: "so", t: "cSaleO", className: "r", render: mon }, { data: "si", t: "cSaleI", className: "r", render: mon }, { data: "res", t: "cResult", render: (d, ty) => ty === "display" ? '<span class="st ' + ({ rFull: "st-ok", rPart: "st-mid", rNone: "st-bad", rAdded: "st-mid" })[d] + '">' + mi({ rFull: "check_circle", rPart: "timelapse", rNone: "cancel", rAdded: "add_circle" }[d]) + t(d) + "</span>" : d }
      ];
    }
    function rebuildFr(data) {
      const cols = frColumns();
      const key = view + UI.lang;
      if (frCols !== key) {
        if (window._dtFr) { window._dtFr.destroy(); $("#tFr").empty(); }
        frCols = key;
        const inst = $("#tFr").DataTable({ data, columns: cols.map(c => Object.assign({ title: t(c.t) }, c)), deferRender: true, scrollY: "48vh", scrollX: true, scroller: { rowHeight: 30, displayBuffer: 4 }, dom: "rt", order: [[1, "desc"]] });
        inst.on("draw", frTotals);
        window._dtFr = inst;
      } else { window._dtFr.clear().rows.add(data).draw(); }
      window._dtFr.search(document.getElementById("frSearch").value).draw();
      setTimeout(() => window._dtFr.columns.adjust(), 30);
    }

    function frData() {
      const st = $("#fState").val();
      const out = [];
      ORDERS.filter(baseOk).forEach(o => {
        const ls = o.lines.filter(lineOk); if (!ls.length) return;
        const s = orderState(o, ls); if (st !== "all" && s !== st) return;
        if (view === "order") {
          const so = ls.reduce((a, l) => a + l.qo * l.price, 0), si = ls.reduce((a, l) => a + l.qi * l.price, 0), co = ls.reduce((a, l) => a + l.qo * l.cost, 0), ci = ls.reduce((a, l) => a + l.qi * l.cost, 0);
          out.push({ _o: o, _ls: ls, id: o.id, date: o.date, invs: o.inv.join(", ") || "—", cust: D.customers[o.cust], sup: SUPS[o.sup], seller: D.sellers[o.seller], route: o.route, chan: t(CHANNELS[o.chan]), state: s, nl: ls.length,
            so, si, sm: Math.max(0, so - ls.filter(l => !l.added).reduce((a, l) => a + l.qi * l.price, 0)), fr: so ? Math.min(1, ls.filter(l => !l.added).reduce((a, l) => a + l.qi * l.price, 0) / so) : 0, mo: so ? (so - co) / so : 0, mi: si ? (si - ci) / si : 0 });
        } else ls.forEach(l => out.push({ _o: o, _ls: [l], id: o.id, date: o.date, cust: D.customers[o.cust], seller: D.sellers[o.seller], item: l.item, cat: UI.L(D.categories[l.cat]), supp: l.sup, qo: l.qo, qi: l.qi, qm: Math.max(0, l.qo - l.qi), so: l.qo * l.price, si: l.qi * l.price,
          res: l.added ? "rAdded" : l.qi === 0 ? "rNone" : lineFull(l) ? "rFull" : "rPart" }));
      });
      return out;
    }
    function cuadro(title, items) { return '<div class="cx-cuadro"><h4>' + title + '</h4><div class="cx-kpis">' + items.map(x => '<div class="cx-kpi"><span>' + x[0] + "</span><strong>" + x[1] + "</strong></div>").join("") + "</div></div>"; }
    function frTotals() {
      const dt = window._dtFr; if (!dt) return;
      const rows = dt.rows({ search: "applied" }).data().toArray();
      const orders = new Map(); rows.forEach(x => { if (!orders.has(x._o.id)) orders.set(x._o.id, { o: x._o, ls: [] }); orders.get(x._o.id).ls.push(...x._ls); });
      const os = [...orders.values()], states = os.map(x => orderState(x.o, x.ls));
      const ls = os.flatMap(x => x.ls), base = ls.filter(l => !l.added);
      const so = base.reduce((a, l) => a + l.qo * l.price, 0), si = ls.reduce((a, l) => a + l.qi * l.price, 0), served = base.reduce((a, l) => a + l.qi * l.price, 0);
      const cnt = s => states.filter(x => x === s).length;
      document.getElementById("kFr").innerHTML =
        cuadro(t("kOrders"), [[t("kOrders"), UI.fmtInt(os.length)], [t("kFull"), UI.fmtInt(cnt("full"))], [t("kPart"), UI.fmtInt(cnt("part"))], [t("kNone"), UI.fmtInt(cnt("none"))]]) +
        cuadro(t("kFr"), [[t("kFrOrders"), UI.fmtPct(os.length ? cnt("full") / os.length : 0, 2)], [t("kFrLines"), UI.fmtPct(base.length ? base.filter(lineFull).length / base.length : 0, 2)], [t("kFrSale"), UI.fmtPct(so ? served / so : 0, 2)], [t("kAdded"), UI.fmtInt(ls.filter(l => l.added).length)]]) +
        cuadro(t("kSale"), [[t("kAsked"), M(so)], [t("kInv"), M(si)], [t("kMiss"), M(Math.max(0, so - served))], [t("kNet"), M(si * .975)]]);
      document.getElementById("frCount").textContent = t("count", { n: UI.fmtInt(rows.length) });
    }
    function loadFr() { rebuildFr(frData()); }

    // ----- Lost sales -----
    let dtVp = null, chart = null;
    function vpData() {
      const rs = vals("fReason").map(Number), wh = vals("fWh").map(Number);
      const fromOrders = LINES.filter(l => !l.added && l.qi < l.qo && l.reason != null && baseOk(l.o));
      return fromOrders.concat(MANUAL.filter(m => baseOk(m.o))).filter(l => lineOk(l) && (!rs.length || rs.includes(l.reason)) && (!wh.length || wh.includes(l.wh))).map(l => {
        const q = l.qo - l.qi, rr = UI.rng(l.qo * 31 + l.price * 7);
        return { _l: l, date: l.o.date, cust: D.customers[l.o.cust], origin: l.manual ? "oManual" : "oOrder", order: l.o.id, item: l.item, wh: WHS[l.wh], qty: q, stock: l.reason === 0 ? Math.floor(q * UI.between(rr, 0, .5)) : Math.ceil(q * UI.between(rr, 1, 3)), price: l.price, total: q * l.price,
          tmax: q * l.price * 1.08, tmin: q * l.price * .93, tcomp: q * l.price * UI.between(rr, .9, 1.05), reason: REASONS[l.reason], seller: D.sellers[l.o.seller] };
      });
    }
    function loadVp() {
      const data = vpData();
      const cols = [{ data: "date", t: "date", render: (d, ty) => ty === "sort" ? d.getTime() : UI.fmtDay(d) }, { data: "cust", t: "cCust" }, { data: "origin", t: "cOrigin", render: d => t(d) }, { data: "order", t: "cOrder" }, { data: "item", t: "cItem" }, { data: "wh", t: "cWh" },
        { data: "qty", t: "cQtyL", className: "r" }, { data: "stock", t: "cStock", className: "r" }, { data: "price", t: "cPrice", className: "r", render: mon }, { data: "total", t: "cTotal", className: "r", render: mon }, { data: "reason", t: "cReason", render: d => t(d) }, { data: "seller", t: "cSeller" }];
      if (dtVp) { dtVp.destroy(); $("#tVp").empty(); }
      dtVp = $("#tVp").DataTable({ data, columns: cols.map(c => Object.assign({ title: t(c.t) }, c)), deferRender: true, scrollY: "40vh", scrollX: true, scroller: { rowHeight: 30 }, dom: "rt", order: [[9, "desc"]] });
      dtVp.on("draw", vpTotals);
      dtVp.search(document.getElementById("vpSearch").value).draw();
      setTimeout(() => dtVp.columns.adjust(), 30);
    }
    function vpTotals() {
      const rows = dtVp.rows({ search: "applied" }).data().toArray();
      const s = (a, k) => a.reduce((z, x) => z + x[k], 0);
      document.getElementById("kVp").innerHTML =
        cuadro(t("kLost"), [[t("kAtSale"), M(s(rows, "total"))], [t("kAtMax"), M(s(rows, "tmax"))], [t("kAtMin"), M(s(rows, "tmin"))], [t("kAtComp"), M(s(rows, "tcomp"))]]) +
        cuadro(t("kCount"), [[t("kLinesN"), UI.fmtInt(rows.length)], [t("kCustN"), UI.fmtInt(new Set(rows.map(x => x.cust)).size)], [t("kOrdersN"), UI.fmtInt(new Set(rows.filter(x => x.order !== "—").map(x => x.order)).size)], [t("kItemsN"), UI.fmtInt(new Set(rows.map(x => x.item)).size)]]) +
        cuadro(t("kByOrigin"), [[t("oOrder"), M(s(rows.filter(x => x.origin === "oOrder"), "total"))], [t("oManual"), M(s(rows.filter(x => x.origin === "oManual"), "total"))]]);
      document.getElementById("vpCount").textContent = t("count", { n: UI.fmtInt(rows.length) });
      const by = {}; rows.forEach(x => { by[x.item] = (by[x.item] || 0) + x.total; });
      const top = Object.entries(by).sort((a, b) => b[1] - a[1]).slice(0, 10);
      const txt = UI.cssVar("--mc-muted"), grid = UI.cssVar("--mc-line");
      if (chart) chart.destroy();
      chart = new Chart(document.getElementById("cTop"), { type: "bar", data: { labels: top.map(x => x[0]), datasets: [{ label: t("cTotal"), data: top.map(x => x[1]), backgroundColor: "#fb7185", borderRadius: 4 }] },
        options: { indexAxis: "y", maintainAspectRatio: false, plugins: { legend: { display: false }, tooltip: { callbacks: { label: c => M(c.parsed.x) } } },
          scales: { x: { ticks: { color: txt, callback: v => (v / 1000) + "k" }, grid: { color: grid } }, y: { ticks: { color: txt, font: { size: 10 } }, grid: { display: false } } } } });
      document.getElementById("cTop").setAttribute("aria-label", t("top10"));
    }

    function showTab(x) {
      tab = x;
      document.querySelectorAll("#mainTabs [data-tab]").forEach(b => b.setAttribute("aria-selected", String(b.dataset.tab === x)));
      document.getElementById("pFr").hidden = x !== "fr"; document.getElementById("pVp").hidden = x !== "vp";
      document.querySelectorAll(".fr-only").forEach(e => { e.hidden = x !== "fr"; }); document.querySelectorAll(".vp-only").forEach(e => { e.hidden = x !== "vp"; });
      if (x === "fr") loadFr(); else loadVp();
    }
    function viewTabs() { document.querySelectorAll("#frView [data-view]").forEach(b => b.setAttribute("aria-selected", String(b.dataset.view === view))); }
    document.getElementById("mainTabs").addEventListener("click", e => { const b = e.target.closest("[data-tab]"); if (b) showTab(b.dataset.tab); });
    document.getElementById("frView").addEventListener("click", e => { const b = e.target.closest("[data-view]"); if (b) { view = b.dataset.view; viewTabs(); loadFr(); } });
    document.getElementById("filters").addEventListener("submit", e => { e.preventDefault(); showTab(tab); });
    document.getElementById("btnClear").addEventListener("click", () => { Object.keys(SEL).forEach(id => { const $s = $("#" + id); $s.val($s.prop("multiple") ? [] : $s.find("option").first().val()).trigger("change"); }); fFrom.value = "2026-11-01"; fTo.value = "2026-11-16"; showTab(tab); });
    let st1; document.getElementById("frSearch").addEventListener("input", e => { clearTimeout(st1); st1 = setTimeout(() => window._dtFr.search(e.target.value).draw(), 200); });
    let st2; document.getElementById("vpSearch").addEventListener("input", e => { clearTimeout(st2); st2 = setTimeout(() => dtVp.search(e.target.value).draw(), 200); });
    document.addEventListener("langchange", () => { fill(); frCols = null; showTab(tab); document.getElementById("about").innerHTML = UI.aboutBox("aboutText"); });
    document.addEventListener("themechange", () => { if (tab === "vp" && dtVp) vpTotals(); });
    let rT; window.addEventListener("resize", () => { clearTimeout(rT); rT = setTimeout(() => { if (window._dtFr) window._dtFr.columns.adjust(); if (dtVp) dtVp.columns.adjust(); }, 150); });
    if (document.fonts) document.fonts.ready.then(() => { if (window._dtFr) window._dtFr.columns.adjust(); });
    document.getElementById("about").innerHTML = UI.aboutBox("aboutText");
    viewTabs();
    showTab("fr");
  });
  </script>
</body>
</html>
