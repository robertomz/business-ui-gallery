<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Credit cards · Business UI Gallery</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,300..500,0..1,0&display=block" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/select2/4.0.13/css/select2.min.css">
  <link rel="stylesheet" href="../assets/css/base.css">
  <style>
    .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
    .ccard { text-align: left; font: inherit; color: var(--text); cursor: pointer; background: var(--surface); border: 1px solid var(--border-subtle); border-radius: var(--r-lg); padding: 16px 18px; box-shadow: var(--shadow-card); display: flex; flex-direction: column; gap: 6px; min-width: 0; }
    .ccard:hover { background: var(--bg-hover); }
    .ccard[aria-pressed="true"] { border-color: var(--brand); background: var(--bg-selected); box-shadow: 0 0 0 3px color-mix(in srgb, var(--brand) 20%, transparent); }
    .ccard .top { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 12px; font-weight: 500; color: var(--text-secondary); }
    .ccard .top span:first-child { display: inline-flex; align-items: center; gap: 8px; }
    .ccard .top span:first-child::before { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--cc, var(--brand)); flex: none; }
    .ccard .num { font-family: var(--font-display); font-size: 17px; font-weight: 600; letter-spacing: .04em; color: var(--text-heading); }
    .ccard .row { display: flex; justify-content: space-between; gap: 8px; font-size: 12px; color: var(--text-secondary); }
    .ccard .row b { color: var(--text-heading); font-weight: 600; font-variant-numeric: tabular-nums; }
    .ccard .ig-barra { height: 6px; }
    .ccard .ig-barra span { background: var(--cc, var(--brand)); }
    .cc-in { min-width: 170px; }
    .form-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px 12px; }
    .form-2 .span-2 { grid-column: 1 / -1; }
    .form-2 .mc-field { min-width: 0; }
    .seg { display: inline-flex; background: var(--bg-input); border-radius: 12px; padding: 3px; flex-wrap: wrap; }
    .seg button { min-height: 34px; padding: 0 14px; border: 0; border-radius: 9px; background: transparent; color: var(--text-secondary); font-size: 12.5px; font-weight: 500; cursor: pointer; }
    .seg button[aria-pressed="true"] { background: var(--surface); color: var(--brand-text); box-shadow: var(--shadow-card); }
    @media (max-width: 560px) { .form-2 { grid-template-columns: minmax(0, 1fr); } }
  </style>
</head>
<body data-page="credit-cards" data-root="../">
  <main id="content">
    <section class="mc-panel">
      <div class="mc-filters">
        <div class="mc-field w-sm"><label data-i18n="company"></label><div class="static">DEMO</div></div>
        <div class="mc-field" style="max-width:220px"><label for="fBank" data-i18n="fBank"></label><select id="fBank"></select></div>
        <button type="button" class="btn btn-teal" id="btnNew"><span class="material-icons" aria-hidden="true">add_card</span><span data-i18n="newCard"></span></button>
      </div>
    </section>

    <div class="mc-kpis" id="kpis"></div>
    <div class="cards" id="cards" role="group"></div>

    <section class="mc-panel" id="detail">
      <div class="mc-panel-title">
        <h3><span class="material-icons" aria-hidden="true">credit_card</span><span id="dTitle"></span></h3>
        <div class="mc-tabs" role="tablist" id="tabs"></div>
      </div>
      <div id="pBalance" role="tabpanel">
        <div class="mc-filters" style="margin-bottom:10px">
          <div class="mc-field" style="max-width:170px"><label for="bDate" data-i18n="bDate"></label><input type="date" id="bDate"></div>
          <div class="mc-field" style="max-width:200px"><label for="bAmount" data-i18n="bAmount"></label><input id="bAmount" class="num" inputmode="decimal"><span class="mc-field-error" id="eBal"></span></div>
          <button type="button" class="btn btn-teal" id="btnBal"><span class="material-icons" aria-hidden="true">save</span><span data-i18n="save"></span></button>
        </div>
        <div class="table-wrap"><table class="grid" id="tHist"><thead></thead><tbody></tbody></table></div>
      </div>
      <div id="pCharges" role="tabpanel" hidden>
        <p class="mc-hint" id="chargesHint" style="margin-bottom:8px"></p>
        <div class="table-wrap"><table class="grid" id="tCharges"><thead></thead><tbody></tbody><tfoot></tfoot></table></div>
      </div>
      <div id="pPay" role="tabpanel" hidden>
        <div class="form-2" style="max-width:760px">
          <div class="mc-field span-2"><label data-i18n="payOption"></label><div class="seg" id="payOpt"></div></div>
          <div class="mc-field"><label for="pAccount" data-i18n="pAccount"></label><select id="pAccount"></select></div>
          <div class="mc-field"><label for="pAmount" data-i18n="pAmount"></label><input id="pAmount" class="num" inputmode="decimal"><span class="mc-field-error" id="ePay"></span></div>
        </div>
        <div class="table-wrap" style="margin-top:10px;max-width:760px"><table class="grid" id="tEntry"><thead></thead><tbody></tbody><tfoot></tfoot></table></div>
        <div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap">
          <button type="button" class="btn btn-teal" id="btnPay"><span class="material-icons" aria-hidden="true">payments</span><span data-i18n="registerPay"></span></button>
        </div>
      </div>
    </section>
    <div id="about"></div>
  </main>

  <div class="modal-backdrop" id="mCard">
    <div class="modal modal-sm" role="dialog" aria-modal="true" aria-labelledby="mCardTitle">
      <div class="modal-head"><h3 id="mCardTitle"><span class="material-icons" aria-hidden="true">add_card</span><span data-i18n="formTitle"></span></h3></div>
      <div class="modal-body">
        <div class="form-2">
          <div class="mc-field span-2"><label for="cNumber" data-i18n="cNumber"></label><input id="cNumber" inputmode="numeric" autocomplete="off" placeholder="XXXX-XXXX-XXXX-XXXX" maxlength="19"><span class="mc-field-error" id="eNumber"></span></div>
          <div class="mc-field"><label for="cBank" data-i18n="fBank"></label><select id="cBank"></select></div>
          <div class="mc-field"><label for="cBrand" data-i18n="cBrand"></label><select id="cBrand"></select></div>
          <div class="mc-field"><label for="cHolder" data-i18n="cHolder"></label><input id="cHolder" maxlength="60"><span class="mc-field-error" id="eHolder"></span></div>
          <div class="mc-field"><label for="cLimit" data-i18n="cLimit"></label><input id="cLimit" class="num" inputmode="decimal"><span class="mc-field-error" id="eLimit"></span></div>
          <div class="mc-field"><label for="cCut" data-i18n="cCut"></label><input id="cCut" class="num" inputmode="numeric" maxlength="2"><span class="mc-field-error" id="eCut"></span></div>
          <div class="mc-field"><label for="cPayDay" data-i18n="cPayDay"></label><input id="cPayDay" class="num" inputmode="numeric" maxlength="2"><span class="mc-field-error" id="ePayDay"></span></div>
          <div class="mc-field span-2"><label for="cAccount" data-i18n="cAccount"></label><input id="cAccount" value="2-01-03-01-001" readonly></div>
        </div>
      </div>
      <div class="modal-foot">
        <button type="button" class="btn btn-teal" id="cSave"><span class="material-icons" aria-hidden="true">save</span><span data-i18n="save"></span></button>
        <button type="button" class="btn" id="cClose"><span data-i18n="close"></span></button>
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/select2/4.0.13/js/select2.min.js"></script>
  <script src="../assets/js/common.js"></script>
  <script>
  UI.strings({
    en: {
      fBank: "Bank", newCard: "New card", formTitle: "Card form", cNumber: "Card number", cBrand: "Issuer", cHolder: "Holder", cLimit: "Credit limit", cCut: "Cut-off day", cPayDay: "Payment day", cAccount: "Accounting account",
      kCards: "Active cards", kLimit: "Total limit", kBal: "Pending balance", kAvail: "Available", kUse: "Average use",
      limit: "Limit", balance: "Balance", available: "Available", cutPay: "Cut {c} · pays {p}", balDate: "Balance of {d}",
      tabBal: "Card balance", tabCharges: "Charges", tabPay: "Payment", bDate: "Balance date", bAmount: "Pending balance",
      colDate: "Date", colBal: "Balance", colUser: "Registered by", colDesc: "Description", colAmount: "Amount", colCenter: "Cost center", colStatus: "Status",
      assigned: "Assigned", toAssign: "To assign", chargesHint: "{n} charges still need a cost center.", chooseCenter: "Choose…",
      payOption: "Amount to pay", optMin: "Minimum", optTotal: "Total balance", optOther: "Other amount", pAccount: "Pay from bank account", pAmount: "Amount",
      registerPay: "Register payment", colAcc: "Account", colDebit: "Debit", colCredit: "Credit", accCard: "Credit cards payable · ****{l}", accBank: "Bank · {b}",
      eNumReq: "Enter the 16 digits of the card.", eNumDup: "That card already exists.", eReq: "Required.", eDay: "Day from 1 to 28.", eAmt: "Enter an amount greater than zero.", eOverBal: "It is more than the card balance.", eOverBank: "The bank account does not have that balance.",
      savedCard: "Card ****{l} added.", savedBal: "Balance of ****{l} registered.", paidMsg: "Payment of {a} registered for ****{l}.", fixErrors: "Check the fields marked in red.", detailTitle: "{b} · ****{l} · {h}",
      aboutText: "The catalog keeps every <b>company credit card</b> with its bank, issuer, limit, cut-off and payment days and its accounting account. The number is always typed and shown as <b>XXXX-XXXX-XXXX-XXXX</b>, must have exactly 16 digits and lists only show the last 4. Treasury registers the <b>pending balance</b> of each card by date; the history keeps who registered each balance, and the operations dashboard takes the last one. Each <b>charge</b> is assigned to a cost center so it reaches the budget, and the <b>payment</b> (minimum, total or another amount) cannot exceed the card balance or the bank account, and shows its entry with one line per account and side. All the data on this page is generated."
    },
    es: {
      fBank: "Banco", newCard: "Nueva tarjeta", formTitle: "Formulario de tarjeta", cNumber: "Número de tarjeta", cBrand: "Emisor", cHolder: "Titular", cLimit: "Límite de crédito", cCut: "Día de corte", cPayDay: "Día de pago", cAccount: "Cuenta contable",
      kCards: "Tarjetas activas", kLimit: "Límite total", kBal: "Saldo pendiente", kAvail: "Disponible", kUse: "Uso promedio",
      limit: "Límite", balance: "Saldo", available: "Disponible", cutPay: "Corte {c} · paga {p}", balDate: "Saldo del {d}",
      tabBal: "Saldo de la tarjeta", tabCharges: "Cargos", tabPay: "Pago", bDate: "Fecha del saldo", bAmount: "Saldo pendiente",
      colDate: "Fecha", colBal: "Saldo", colUser: "Registró", colDesc: "Descripción", colAmount: "Monto", colCenter: "Centro de costo", colStatus: "Estado",
      assigned: "Asignado", toAssign: "Por asignar", chargesHint: "Faltan {n} cargos por asignar a un centro de costo.", chooseCenter: "Elija…",
      payOption: "Monto a pagar", optMin: "Mínimo", optTotal: "Saldo total", optOther: "Otro monto", pAccount: "Pagar desde la cuenta bancaria", pAmount: "Monto",
      registerPay: "Registrar pago", colAcc: "Cuenta", colDebit: "Debe", colCredit: "Haber", accCard: "Tarjetas de crédito por pagar · ****{l}", accBank: "Banco · {b}",
      eNumReq: "Escriba los 16 dígitos de la tarjeta.", eNumDup: "Esa tarjeta ya existe.", eReq: "Obligatorio.", eDay: "Día del 1 al 28.", eAmt: "Escriba un monto mayor a cero.", eOverBal: "Es más que el saldo de la tarjeta.", eOverBank: "La cuenta bancaria no tiene ese saldo.",
      savedCard: "Se agregó la tarjeta ****{l}.", savedBal: "Se registró el saldo de ****{l}.", paidMsg: "Se registró el pago de {a} a ****{l}.", fixErrors: "Revise los campos marcados en rojo.", detailTitle: "{b} · ****{l} · {h}",
      aboutText: "El catálogo guarda cada <b>tarjeta de crédito de la empresa</b> con su banco, emisor, límite, días de corte y de pago y su cuenta contable. El número siempre se escribe y se muestra como <b>XXXX-XXXX-XXXX-XXXX</b>, debe tener exactamente 16 dígitos y en las listas solo se ven los últimos 4. Tesorería registra el <b>saldo pendiente</b> de cada tarjeta por fecha; el histórico guarda quién registró cada saldo y el dashboard operativo toma el último. Cada <b>cargo</b> se asigna a un centro de costo para que llegue al presupuesto, y el <b>pago</b> (mínimo, total u otro monto) no puede pasar del saldo de la tarjeta ni de la cuenta bancaria, y muestra su partida con una línea por cuenta y lado. Todos los datos de esta página son generados."
    }
  });

  $(function () {
    const t = UI.t, M = UI.fmtMoney, mi = UI.mi, D = UI.DATA;
    function s2($el, opts) { if ($el.hasClass("select2-hidden-accessible")) $el.select2("destroy"); $el.select2(Object.assign({ width: "100%" }, opts)); }
    const COLORS = ["var(--chart-6)", "var(--chart-1)", "var(--chart-2)", "var(--chart-4)", "var(--chart-3)"];   // tokens: resolve with the current theme
    const USERS = ["A. Torres", "M. Reyes", "L. Castro"];
    const r = UI.rng(9090);
    const CARDS = [
      ["4417561203984417", 0, "VISA", "Ana Torres", 2500000, 5, 25], ["5521330012002111", 1, "MASTERCARD", "Luis Medina", 1500000, 10, 30],
      ["5310998877667036", 0, "MASTERCARD", "Maria Ramos", 1200000, 15, 5], ["4532001122330172", 2, "VISA", "Carlos Ortiz", 900000, 20, 10]
    ].map((c, i) => ({ number: c[0], bank: c[1], brand: c[2], holder: c[3], limit: c[4], cut: c[5], pay: c[6], color: COLORS[i],
      hist: Array.from({ length: 4 }, (_, k) => ({ d: new Date(Date.UTC(2026, 10, 16 - k * 4)), bal: Math.round(c[4] * UI.between(r, .25, .8) * 100) / 100, user: USERS[k % 3] })) }));
    CARDS.forEach(c => { c.charges = Array.from({ length: 6 }, (_, k) => ({ d: new Date(Date.UTC(2026, 10, 2 + k * 2)), desc: UI.pick(r, ["Software subscription", "Fuel", "Hotel", "Flights", "Office supplies", "Online ads"]), amt: Math.round(UI.between(r, 800, 42000) * 100) / 100, center: k % 3 === 0 ? null : Math.floor(r() * 7) })); });
    const BANKACC = D.banks.map((b, i) => ({ name: b + " · **** " + (3010 + i * 1173), bal: [1854220.5, 962410.25, 418300, 86240.9][i] }));
    const last4 = c => c.number.slice(-4);
    const fmtCard = s => s.replace(/\D/g, "").slice(0, 16).replace(/(\d{4})(?=\d)/g, "$1-");
    const balOf = c => c.hist[0].bal;
    let selIdx = 0, tab = "bal", payOpt = "total";

    function fillSelects() {
      const fb = $("#fBank"), cb = $("#cBank"), br = $("#cBrand"), pa = $("#pAccount");
      const v1 = fb.val() || "all", v2 = cb.val() || "0", v3 = br.val() || "VISA", v4 = pa.val() || "0";
      fb.empty().append(new Option(t("all"), "all")); D.banks.forEach((b, i) => fb.append(new Option(b, String(i))));
      cb.empty(); D.banks.forEach((b, i) => cb.append(new Option(b, String(i))));
      br.empty(); ["VISA", "MASTERCARD", "AMEX"].forEach(b => br.append(new Option(b, b)));
      pa.empty(); BANKACC.slice(0, 3).forEach((b, i) => pa.append(new Option(b.name, String(i))));
      fb.val(v1); cb.val(v2); br.val(v3); pa.val(v4);
      s2(fb, { minimumResultsForSearch: Infinity }); s2(cb, { dropdownParent: $("#mCard") }); s2(br, { minimumResultsForSearch: Infinity, dropdownParent: $("#mCard") }); s2(pa, {});
    }

    function visible() { const b = $("#fBank").val(); return CARDS.map((c, i) => [c, i]).filter(x => b === "all" || String(x[0].bank) === b); }

    function renderCards() {
      const list = visible();
      if (!list.find(x => x[1] === selIdx) && list.length) selIdx = list[0][1];
      const lim = list.reduce((a, x) => a + x[0].limit, 0), bal = list.reduce((a, x) => a + balOf(x[0]), 0);
      document.getElementById("kpis").innerHTML = [["kCards", list.length], ["kLimit", M(lim)], ["kBal", M(bal)], ["kAvail", M(lim - bal)], ["kUse", lim ? UI.fmtPct(bal / lim) : "—"]]
        .map(k => '<div class="mc-kpi"><div class="k-label">' + t(k[0]) + '</div><div class="k-value">' + k[1] + "</div></div>").join("");
      document.getElementById("cards").innerHTML = list.map(([c, i]) => {
        const b = balOf(c), use = b / c.limit;
        return '<button type="button" class="ccard" style="--cc:' + c.color + '" data-i="' + i + '" aria-pressed="' + (i === selIdx) + '">' +
          '<div class="top"><span>' + D.banks[c.bank] + "</span><span>" + c.brand + '</span></div><div class="num">**** **** **** ' + last4(c) + "</div>" +
          '<div class="row"><span>' + c.holder + "</span><span>" + t("cutPay", { c: c.cut, p: c.pay }) + "</span></div>" +
          '<div class="row"><span>' + t("limit") + "</span><b>" + M(c.limit) + '</b></div><div class="row"><span>' + t("balance") + "</span><b>" + M(b) + '</b></div><div class="row"><span>' + t("available") + "</span><b>" + M(c.limit - b) + "</b></div>" +
          '<div class="ig-barra"><span style="width:' + Math.min(100, use * 100) + '%"></span></div><div class="row"><span>' + t("balDate", { d: UI.fmtDay(c.hist[0].d) }) + "</span><b>" + UI.fmtPct(use) + "</b></div></button>";
      }).join("");
      renderDetail();
    }

    function renderDetail() {
      const c = CARDS[selIdx];
      document.getElementById("dTitle").textContent = t("detailTitle", { b: D.banks[c.bank], l: last4(c), h: c.holder });
      const tabs = [["bal", "tabBal"], ["charges", "tabCharges"], ["pay", "tabPay"]];
      document.getElementById("tabs").innerHTML = tabs.map(x => '<button type="button" class="mc-tab" role="tab" aria-selected="' + (tab === x[0]) + '" data-tab="' + x[0] + '">' + t(x[1]) + "</button>").join("");
      document.getElementById("pBalance").hidden = tab !== "bal";
      document.getElementById("pCharges").hidden = tab !== "charges";
      document.getElementById("pPay").hidden = tab !== "pay";
      document.querySelector("#tHist thead").innerHTML = "<tr><th>" + t("colDate") + '</th><th class="r">' + t("colBal") + "</th><th>" + t("colUser") + "</th></tr>";
      document.querySelector("#tHist tbody").innerHTML = c.hist.map(h => "<tr><td>" + UI.fmtDay(h.d) + '</td><td class="r">' + M(h.bal) + "</td><td>" + h.user + "</td></tr>").join("");
      const pending = c.charges.filter(x => x.center == null).length;
      document.getElementById("chargesHint").textContent = pending ? t("chargesHint", { n: pending }) : "";
      document.querySelector("#tCharges thead").innerHTML = "<tr><th>" + t("colDate") + "</th><th>" + t("colDesc") + '</th><th class="r">' + t("colAmount") + "</th><th>" + t("colCenter") + "</th><th>" + t("colStatus") + "</th></tr>";
      document.querySelector("#tCharges tbody").innerHTML = c.charges.map((x, k) => "<tr><td>" + UI.fmtDay(x.d) + "</td><td>" + x.desc + '</td><td class="r">' + M(x.amt) + '</td><td class="cc-in"><select class="cc-center" data-k="' + k + '" aria-label="' + t("colCenter") + " " + x.desc + '"><option value="">' + t("chooseCenter") + "</option>" +
        D.costCenters.map((cc, j) => '<option value="' + j + '"' + (x.center === j ? " selected" : "") + ">" + UI.L(cc) + "</option>").join("") + "</select></td><td>" +
        (x.center == null ? '<span class="chip chip-warn">' + mi("pending") + t("toAssign") + "</span>" : '<span class="chip chip-pos">' + mi("check_circle") + t("assigned") + "</span>") + "</td></tr>").join("");
      document.querySelector("#tCharges tfoot").innerHTML = '<tr><td colspan="2">' + t("total") + '</td><td class="r">' + M(c.charges.reduce((a, x) => a + x.amt, 0)) + "</td><td></td><td></td></tr>";
      $("#tCharges .cc-center").each(function () { s2($(this), {}); }).on("change", function () { c.charges[Number(this.dataset.k)].center = this.value === "" ? null : Number(this.value); renderDetail(); });
      renderPay();
    }

    function payAmount() {
      const c = CARDS[selIdx], b = balOf(c);
      if (payOpt === "min") return Math.round(b * .05 * 100) / 100;
      if (payOpt === "total") return b;
      return UI.parseMoney(document.getElementById("pAmount").value);
    }
    function renderPay() {
      const c = CARDS[selIdx];
      document.getElementById("payOpt").innerHTML = [["min", "optMin"], ["total", "optTotal"], ["other", "optOther"]].map(x => '<button type="button" data-v="' + x[0] + '" aria-pressed="' + (payOpt === x[0]) + '">' + t(x[1]) + "</button>").join("");
      const inp = document.getElementById("pAmount");
      inp.readOnly = payOpt !== "other";
      if (payOpt !== "other") inp.value = M(payAmount());
      const amt = payAmount(), bank = BANKACC[Number($("#pAccount").val() || 0)];
      let err = "";
      if (!(amt > 0)) err = t("eAmt"); else if (amt > balOf(c) + .005) err = t("eOverBal"); else if (amt > bank.bal) err = t("eOverBank");
      document.getElementById("ePay").textContent = err;
      inp.setAttribute("aria-invalid", String(!!err));
      document.getElementById("btnPay").disabled = !!err;
      document.querySelector("#tEntry thead").innerHTML = "<tr><th>" + t("colAcc") + '</th><th class="r">' + t("colDebit") + '</th><th class="r">' + t("colCredit") + "</th></tr>";
      document.querySelector("#tEntry tbody").innerHTML = "<tr><td>" + t("accCard", { l: last4(c) }) + '</td><td class="r">' + M(amt > 0 ? amt : 0) + '</td><td></td></tr><tr><td>' + t("accBank", { b: bank.name }) + '</td><td></td><td class="r">' + M(amt > 0 ? amt : 0) + "</td></tr>";
      document.querySelector("#tEntry tfoot").innerHTML = "<tr><td>" + t("totals") + '</td><td class="r">' + M(amt > 0 ? amt : 0) + '</td><td class="r">' + M(amt > 0 ? amt : 0) + "</td></tr>";
    }

    // Card number input: digits only, formatted XXXX-XXXX-XXXX-XXXX while typing
    const cn = document.getElementById("cNumber");
    cn.addEventListener("input", () => { cn.value = fmtCard(cn.value); });
    ["cLimit", "bAmount", "pAmount"].forEach(id => UI.maskMoney(document.getElementById(id)));
    ["cCut", "cPayDay"].forEach(id => document.getElementById(id).addEventListener("input", e => { e.target.value = e.target.value.replace(/\D/g, "").slice(0, 2); }));

    function saveCard() {
      const errs = {};
      const digits = cn.value.replace(/\D/g, "");
      if (digits.length !== 16) errs.Number = t("eNumReq"); else if (CARDS.some(c => c.number === digits)) errs.Number = t("eNumDup");
      if (!document.getElementById("cHolder").value.trim()) errs.Holder = t("eReq");
      if (!(UI.parseMoney(document.getElementById("cLimit").value) > 0)) errs.Limit = t("eAmt");
      ["Cut", "PayDay"].forEach(k => { const v = Number(document.getElementById("c" + k).value); if (!(v >= 1 && v <= 28)) errs[k] = t("eDay"); });
      ["Number", "Holder", "Limit", "Cut", "PayDay"].forEach(k => { document.getElementById("e" + k).textContent = errs[k] || ""; const el = document.getElementById("c" + k); if (el) el.setAttribute("aria-invalid", String(!!errs[k])); });
      if (Object.keys(errs).length) { const first = ["Number", "Holder", "Limit", "Cut", "PayDay"].find(k => errs[k]); document.getElementById("c" + first).focus(); return; }
      CARDS.push({ number: digits, bank: Number($("#cBank").val()), brand: $("#cBrand").val(), holder: document.getElementById("cHolder").value.trim(), limit: UI.parseMoney(document.getElementById("cLimit").value),
        cut: Number(document.getElementById("cCut").value), pay: Number(document.getElementById("cPayDay").value), color: COLORS[CARDS.length % COLORS.length],
        hist: [{ d: new Date(Date.UTC(2026, 10, 16)), bal: 0, user: "Demo" }], charges: [] });
      selIdx = CARDS.length - 1;
      UI.closeModal("mCard");
      $("#fBank").val("all").trigger("change.select2");
      renderCards();
      UI.toast(t("savedCard", { l: digits.slice(-4) }));
    }

    document.getElementById("btnNew").addEventListener("click", () => {
      ["cNumber", "cHolder", "cLimit", "cCut", "cPayDay"].forEach(id => { const el = document.getElementById(id); el.value = ""; el.removeAttribute("aria-invalid"); });
      ["eNumber", "eHolder", "eLimit", "eCut", "ePayDay"].forEach(id => document.getElementById(id).textContent = "");
      UI.openModal("mCard");
    });
    document.getElementById("cSave").addEventListener("click", saveCard);
    document.getElementById("cClose").addEventListener("click", () => UI.closeModal("mCard"));
    document.getElementById("cards").addEventListener("click", e => { const b = e.target.closest(".ccard"); if (b) { selIdx = Number(b.dataset.i); renderCards(); } });
    document.getElementById("tabs").addEventListener("click", e => { const b = e.target.closest("[data-tab]"); if (b) { tab = b.dataset.tab; renderDetail(); } });
    document.getElementById("payOpt").addEventListener("click", e => { const b = e.target.closest("button"); if (b) { payOpt = b.dataset.v; if (payOpt === "other") document.getElementById("pAmount").value = ""; renderPay(); } });
    document.getElementById("pAmount").addEventListener("input", renderPay);
    $("#pAccount").on("change", renderPay);
    $("#fBank").on("change", renderCards);
    document.getElementById("btnBal").addEventListener("click", () => {
      const v = UI.parseMoney(document.getElementById("bAmount").value), d = document.getElementById("bDate").value;
      if (!d || !(v >= 0) || document.getElementById("bAmount").value === "") { document.getElementById("eBal").textContent = t("eReq"); return; }
      document.getElementById("eBal").textContent = "";
      const c = CARDS[selIdx];
      c.hist.unshift({ d: new Date(d + "T00:00:00Z"), bal: v, user: "Demo" });
      c.hist.sort((a, b) => b.d - a.d);
      document.getElementById("bAmount").value = "";
      renderCards();
      UI.toast(t("savedBal", { l: last4(c) }));
    });
    document.getElementById("btnPay").addEventListener("click", () => {
      const c = CARDS[selIdx], amt = payAmount(), bank = BANKACC[Number($("#pAccount").val() || 0)];
      bank.bal -= amt;
      c.hist.unshift({ d: new Date(Date.UTC(2026, 10, 16)), bal: Math.round((balOf(c) - amt) * 100) / 100, user: "Demo" });
      payOpt = "total";
      renderCards();
      UI.toast(t("paidMsg", { a: M(amt), l: last4(c) }));
    });
    document.addEventListener("langchange", () => { fillSelects(); renderCards(); document.getElementById("about").innerHTML = UI.aboutBox("aboutText"); });

    document.getElementById("bDate").value = "2026-11-16";
    fillSelects();
    renderCards();
    document.getElementById("about").innerHTML = UI.aboutBox("aboutText");
  });
  </script>
</body>
</html>
