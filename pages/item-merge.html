<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Legacy item matching · Business UI Gallery</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/select2/4.0.13/css/select2.min.css">
  <link rel="stylesheet" href="../assets/css/base.css">
  <style>
    .score { display: flex; flex-direction: column; gap: 3px; min-width: 110px; }
    .score b { font-variant-numeric: tabular-nums; }
    .score small { font-size: 10px; color: var(--mc-muted); white-space: nowrap; }
    .score .ig-barra { height: 6px; }
    .acts { display: flex; gap: 4px; flex-wrap: wrap; }
    .sub { display: block; font-size: 10.5px; color: var(--mc-muted); }
    .cmp { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin-top: 12px; }
    .cmp .mc-panel { padding: 10px 12px; }
    .cmp dl { display: grid; grid-template-columns: auto 1fr; gap: 4px 10px; margin: 6px 0 0; font-size: 12px; }
    .cmp dt { color: var(--mc-muted); }
    .cmp dd { margin: 0; font-weight: 600; }
    .ab { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); gap: 10px; align-items: stretch; }
    .ab .mc-panel { border-top: 3px solid var(--c); }
    .ab .swap { align-self: center; }
    .ab h4 { font-size: 10px; text-transform: uppercase; letter-spacing: .05em; color: var(--c); margin-bottom: 4px; }
    .ab p { font-weight: 800; }
    .lock { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 800; padding: 4px 10px; border-radius: 14px; color: var(--mc-warn); border: 1px solid rgba(245,158,11,.45); background: rgba(245,158,11,.1); }
    .log { list-style: none; margin: 8px 0 0; padding: 0; font-size: 12px; display: flex; flex-direction: column; gap: 4px; }
    .log li { display: flex; gap: 6px; align-items: center; }
    .confirm-code { font-weight: 900; letter-spacing: 2px; color: var(--mc-good); }
    .modes { display: flex; gap: 14px; flex-wrap: wrap; }
    @media (max-width: 760px) { .cmp, .ab { grid-template-columns: minmax(0, 1fr); } .ab .swap { justify-self: center; } }
  </style>
</head>
<body data-page="item-merge" data-root="../">
  <main id="content">
    <div class="mc-tabs" role="tablist" id="tabs">
      <button type="button" class="mc-tab" role="tab" id="tabMatch" aria-controls="pMatch" data-tab="match"><span class="material-icons" aria-hidden="true">link</span> <span data-i18n="tabMatch"></span></button>
      <button type="button" class="mc-tab" role="tab" id="tabMerge" aria-controls="pMerge" data-tab="merge"><span class="material-icons" aria-hidden="true">merge</span> <span data-i18n="tabMerge"></span></button>
    </div>

    <!-- ============ Matching ============ -->
    <div id="pMatch" role="tabpanel" aria-labelledby="tabMatch" style="display:flex;flex-direction:column;gap:12px">
      <section class="mc-panel">
        <form class="mc-filters" id="mFilters">
          <div class="mc-field w-lg"><label for="mSearch" data-i18n="search"></label><input type="text" id="mSearch" data-i18n-ph="searchPh"></div>
          <div class="mc-field" style="max-width:200px"><label for="mState" data-i18n="state"></label><select id="mState"></select></div>
          <div class="mc-field" style="max-width:200px"><label for="mCat" data-i18n="category"></label><select id="mCat"></select></div>
          <button class="btn btn-teal" type="submit"><span class="material-icons" aria-hidden="true">search</span><span data-i18n="load"></span></button>
          <button class="btn btn-outline-teal" type="button" id="btnBulk"><span class="material-icons" aria-hidden="true">done_all</span><span data-i18n="bulk"></span></button>
        </form>
      </section>
      <section class="mc-kpis" id="mKpis"></section>
      <section class="mc-panel">
        <div class="mc-panel-title"><h3><span class="material-icons" aria-hidden="true">compare_arrows</span><span data-i18n="matchTitle"></span></h3><span class="mc-hint" data-i18n="matchHint"></span></div>
        <div class="table-wrap" style="max-height:560px"><table class="grid" id="tMatch"><thead></thead><tbody></tbody></table></div>
      </section>
    </div>

    <!-- ============ Duplicate merge ============ -->
    <div id="pMerge" role="tabpanel" aria-labelledby="tabMerge" hidden style="display:flex;flex-direction:column;gap:12px">
      <section class="mc-panel">
        <div class="mc-panel-title"><h3><span class="material-icons" aria-hidden="true">content_copy</span><span data-i18n="pairsTitle"></span></h3><span class="mc-hint" data-i18n="pairsHint"></span></div>
        <div class="table-wrap"><table class="grid" id="tPairs"><thead></thead><tbody></tbody></table></div>
      </section>
      <section class="mc-panel" id="mergePanel" hidden>
        <div class="mc-panel-title"><h3><span class="material-icons" aria-hidden="true">merge</span><span data-i18n="mergeTitle"></span></h3><span id="lockBadge"></span></div>
        <div class="ab" id="ab"></div>
        <div class="grid-2" style="margin-top:12px">
          <div><div class="mc-label" style="margin-bottom:6px" data-i18n="presTitle"></div><div class="table-wrap"><table class="grid" id="tPres"></table></div></div>
          <div><div class="mc-label" style="margin-bottom:6px" data-i18n="rowsTitle"></div><div class="table-wrap"><table class="grid" id="tRows"></table></div></div>
        </div>
        <div style="margin-top:12px"><div class="mc-label" style="margin-bottom:6px" data-i18n="stockTitle"></div><div class="table-wrap"><table class="grid" id="tStock"></table></div></div>
        <div id="conflicts" style="margin-top:10px"></div>
        <div class="mc-filters" style="margin-top:12px">
          <div class="mc-field" style="flex:2 1 260px"><span class="mc-label" data-i18n="mode"></span>
            <div class="modes" role="radiogroup">
              <label class="mc-check"><input type="radio" name="mode" value="dry" checked><span data-i18n="modeDry"></span></label>
              <label class="mc-check"><input type="radio" name="mode" value="real"><span data-i18n="modeReal"></span></label>
            </div>
          </div>
          <div class="mc-field" style="max-width:240px"><label for="cCode" id="cCodeLbl"></label><input type="text" id="cCode" autocomplete="off"><div class="mc-field-error" id="eCode"></div></div>
          <button type="button" class="btn btn-violet" id="btnRun"><span class="material-icons" aria-hidden="true">play_arrow</span><span data-i18n="run"></span></button>
        </div>
        <div id="runBox" hidden style="margin-top:12px" aria-live="polite">
          <div class="progress"><span id="runBar"></span></div>
          <ul class="log" id="runLog"></ul>
        </div>
      </section>
    </div>
    <div id="about"></div>
  </main>

  <div class="modal-backdrop" id="mChange">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="chTitle">
      <div class="modal-head"><h3 id="chTitle"><span class="material-icons" aria-hidden="true">link</span><span data-i18n="changeTitle"></span></h3></div>
      <div class="modal-body">
        <div class="mc-field"><label for="chNew" data-i18n="newItem"></label><select id="chNew"></select><div class="mc-field-error" id="eNew"></div></div>
        <div class="cmp" id="cmp"></div>
      </div>
      <div class="modal-foot">
        <button type="button" class="btn btn-teal" id="btnChSave"><span class="material-icons" aria-hidden="true">save</span><span data-i18n="save"></span></button>
        <button type="button" class="btn btn-danger" id="btnChClose"><span class="material-icons" aria-hidden="true">close</span><span data-i18n="close"></span></button>
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/select2/4.0.13/js/select2.min.js"></script>
  <script src="../assets/js/common.js"></script>
  <script>
  UI.strings({
    en: {
      tabMatch: "Matching", tabMerge: "Duplicate merge", searchPh: "Old code, name or new code", state: "Status", bulk: "Confirm all ≥ 80%",
      matchTitle: "Old system items → new catalog", matchHint: "Score = code 30 + name 50 + presentation 20",
      kOld: "Old items", kResolved: "Resolved (items)", kResolvedVal: "Resolved (stock value)", kSug: "Suggested", kNo: "No match", kDup: "Duplicates",
      colOld: "Old code", colOldName: "Item (old system)", colPres: "Presentation", colStock: "Stock", colNew: "New catalog item", colScore: "Score", actions: "Actions",
      st_matched: "Matched", st_suggested: "Suggested", st_nomatch: "No match", st_duplicate: "Duplicate", st_new: "New item",
      confirm: "Confirm", change: "Change", createNew: "Create as new", undo: "Undo", code: "code", name: "name", pres: "pres.",
      changeTitle: "Change the match", newItem: "New catalog item", oldSide: "Old system", newSide: "New catalog", eNew: "Choose an item of the new catalog.",
      bulkDone: "{n} suggestions with 80% or more were confirmed.", saved: "Match saved.", dupHint: "Another old item already points to {c}. Both will add their stock to it.",
      pairsTitle: "Possible duplicates in the new catalog", pairsHint: "Pairs with very similar names: choose one to review",
      colA: "Item A", colB: "Item B", colSim: "Similarity", review: "Review", mergeTitle: "Merge A into B",
      aSide: "Item A (will be retired)", bSide: "Item B (keeps everything)", swap: "Swap A and B",
      presTitle: "Presentations", rowsTitle: "Rows that move from A to B", stockTitle: "Stock and cost by warehouse",
      colPresName: "Presentation", inB: "In B", willCreate: "Will be created in B", exists: "Already exists",
      rKardex: "Inventory movements (kardex)", rInvoices: "Invoice lines", rOrders: "Open orders", rPurch: "Purchase lines", rLegacy: "Old items pointing to A",
      colWh: "Warehouse", stockA: "Stock A", stockB: "Stock B", stockR: "Result", costA: "Cost A", costB: "Cost B", costR: "Average cost",
      conflicts: "Check before merging", cfOrders: "A has {n} open orders: they will be moved to B.", cfCost: "Costs differ by {p}: the result uses the weighted average.", noConflicts: "No conflicts found.",
      mode: "Mode", modeDry: "Dry run (ROLLBACK)", modeReal: "Run for real", typeCode: "Type CONFIRM {c}", run: "Merge", eCode: "Type exactly CONFIRM {c}.",
      locked: "Item locked while merging", s1: "Lock item A", s2: "Move stock by warehouse", s3: "Move inventory movements", s4: "Move documents", s5: "Create missing presentations", s6: "Retire A (voided, not available)",
      dryDone: "Dry run finished: nothing was saved (ROLLBACK). The result would be the one above.", realDone: "Merge finished: {a} was retired and everything moved to {b}.", retired: "Voided · Not available", noPairs: "No duplicate pairs left.",
      aboutText: "This is the <b>data migration</b> screen used to move a legacy ERP catalog without losing stock or history. Each item of the old system gets a <b>suggested match</b> in the new catalog with a score: <b>code 30 + name similarity 50 + presentation 20</b>. You confirm it, change it (searching the new catalog with a side-by-side comparison) or mark it <b>as a new item</b>; two old items pointing to the same new item show as <b>duplicate</b> and both add their stock. Progress is measured <b>by items and by stock value</b>. Duplicates inside the new catalog are merged in the second tab: the preview shows presentations, stock and cost per warehouse and the rows that move; it first runs as a <b>dry run (ROLLBACK)</b>, and the real run asks for a <b>confirmation code</b>, locks the item and shows each step. All data is generated."
    },
    es: {
      tabMatch: "Homologación", tabMerge: "Fusión de duplicados", searchPh: "Código anterior, nombre o código nuevo", state: "Estado", bulk: "Confirmar todos ≥ 80%",
      matchTitle: "Artículos del sistema anterior → catálogo nuevo", matchHint: "Puntaje = código 30 + nombre 50 + presentación 20",
      kOld: "Artículos anteriores", kResolved: "Resueltos (artículos)", kResolvedVal: "Resueltos (valor de existencia)", kSug: "Sugeridos", kNo: "Sin pareja", kDup: "Duplicados",
      colOld: "Código anterior", colOldName: "Artículo (sistema anterior)", colPres: "Presentación", colStock: "Existencia", colNew: "Artículo del catálogo nuevo", colScore: "Puntaje", actions: "Acciones",
      st_matched: "Homologado", st_suggested: "Sugerido", st_nomatch: "Sin pareja", st_duplicate: "Duplicado", st_new: "Artículo nuevo",
      confirm: "Confirmar", change: "Cambiar", createNew: "Crear como nuevo", undo: "Deshacer", code: "código", name: "nombre", pres: "pres.",
      changeTitle: "Cambiar la homologación", newItem: "Artículo del catálogo nuevo", oldSide: "Sistema anterior", newSide: "Catálogo nuevo", eNew: "Elija un artículo del catálogo nuevo.",
      bulkDone: "Se confirmaron {n} sugerencias de 80% o más.", saved: "Homologación guardada.", dupHint: "Otro artículo anterior ya apunta a {c}. Los dos suman su existencia.",
      pairsTitle: "Posibles duplicados en el catálogo nuevo", pairsHint: "Pares con nombres muy parecidos: elija uno para revisar",
      colA: "Artículo A", colB: "Artículo B", colSim: "Parecido", review: "Revisar", mergeTitle: "Fusionar A en B",
      aSide: "Artículo A (se retira)", bSide: "Artículo B (se queda con todo)", swap: "Intercambiar A y B",
      presTitle: "Presentaciones", rowsTitle: "Filas que pasan de A a B", stockTitle: "Existencia y costo por bodega",
      colPresName: "Presentación", inB: "En B", willCreate: "Se crea en B", exists: "Ya existe",
      rKardex: "Movimientos de inventario (kardex)", rInvoices: "Líneas de factura", rOrders: "Pedidos abiertos", rPurch: "Líneas de compra", rLegacy: "Artículos anteriores que apuntan a A",
      colWh: "Bodega", stockA: "Exist. A", stockB: "Exist. B", stockR: "Resultado", costA: "Costo A", costB: "Costo B", costR: "Costo promedio",
      conflicts: "Revisar antes de fusionar", cfOrders: "A tiene {n} pedidos abiertos: pasan a B.", cfCost: "Los costos difieren en {p}: el resultado usa el promedio ponderado.", noConflicts: "Sin conflictos.",
      mode: "Modo", modeDry: "Prueba (ROLLBACK)", modeReal: "Ejecutar de verdad", typeCode: "Escriba CONFIRMAR {c}", run: "Fusionar", eCode: "Escriba exactamente CONFIRMAR {c}.",
      locked: "Artículo bloqueado mientras se fusiona", s1: "Bloquear el artículo A", s2: "Mover existencias por bodega", s3: "Mover movimientos de inventario", s4: "Mover documentos", s5: "Crear presentaciones faltantes", s6: "Retirar A (anulado, no disponible)",
      dryDone: "Prueba terminada: no se guardó nada (ROLLBACK). El resultado sería el de arriba.", realDone: "Fusión terminada: {a} quedó retirado y todo pasó a {b}.", retired: "Anulado · No disponible", noPairs: "No quedan pares duplicados.",
      aboutText: "Esta es la pantalla de <b>migración de datos</b> que se usó para pasar el catálogo de un ERP anterior sin perder existencias ni historial. Cada artículo del sistema anterior recibe una <b>homologación sugerida</b> en el catálogo nuevo con un puntaje: <b>código 30 + parecido del nombre 50 + presentación 20</b>. Se confirma, se cambia (buscando en el catálogo nuevo con comparación lado a lado) o se marca <b>como artículo nuevo</b>; dos artículos anteriores que apuntan al mismo artículo nuevo salen como <b>duplicado</b> y los dos suman su existencia. El avance se mide <b>por artículos y por valor de existencia</b>. Los duplicados dentro del catálogo nuevo se fusionan en la segunda pestaña: la vista previa muestra presentaciones, existencia y costo por bodega y las filas que se mueven; primero corre como <b>prueba (ROLLBACK)</b>, y la ejecución real pide un <b>código de confirmación</b>, bloquea el artículo y muestra cada paso. Todos los datos son generados."
    }
  });

  $(function () {
    const t = UI.t, M = UI.fmtMoney, mi = UI.mi, D = UI.DATA;
    const r = UI.rng(9100);
    // New catalog (+ 3 near-duplicates created by mistake)
    const NEW = D.products.map((p, i) => ({ code: "ART-" + (1001 + i), name: p[0], cat: p[1], factor: [12, 24, 6][i % 3], barcode: "7501" + String(100000 + i * 37).slice(0, 6), active: true, cost: UI.between(r, .8, 9) }));
    [[2, "Cola 2L"], [4, "Whole milk 1L"], [13, "Dish soap 750ml"]].forEach((d, k) => NEW.push({ code: "ART-" + (1101 + k), name: d[1], cat: NEW[d[0]].cat, factor: k === 1 ? 6 : NEW[d[0]].factor, barcode: "7509" + String(200000 + k * 11), active: true, cost: NEW[d[0]].cost * (1 + (k - 1) * .08), dupOf: d[0] }));
    const nb = c => NEW.find(x => x.code === c);
    // Old system items: same products written the old way, PROMO variants and discontinued items
    const abbr = s => s.toUpperCase().replace("SPARKLING", "SPARK.").replace("DETERGENT", "DET.").replace("CHEESE", "CHS").replace(" ML", "ML").replace(" L", "LT").replace(" G", "GR").replace(" KG", "KG");
    const OLD = [];
    NEW.slice(0, 25).forEach((n, i) => {
      OLD.push({ code: "F-" + String(300 + i * 3).padStart(5, "0"), name: abbr(n.name), barcode: i % 4 === 3 ? "" : n.barcode, factor: i % 5 === 4 ? n.factor * 2 : n.factor, stock: Math.round(UI.between(r, 20, 2400)), cost: n.cost * UI.between(r, .95, 1.05), cat: n.cat });
      if (i % 3 === 0) OLD.push({ code: "F-" + String(900 + i).padStart(5, "0"), name: abbr(n.name) + " PROMO", barcode: "", factor: n.factor, stock: Math.round(UI.between(r, 0, 300)), cost: n.cost, cat: n.cat });
    });
    ["FLASHLIGHT BATTERY AA", "CANDLE PACK X4", "MATCHES BOX", "PLASTIC CUPS 50", "CHARCOAL 5LB", "ICE BAG 3KG", "PAPER PLATES 25", "LIGHTER BASIC", "STRAWS 100"].forEach((nm, k) =>
      OLD.push({ code: "F-" + String(1200 + k * 7).padStart(5, "0"), name: nm, barcode: "", factor: 12, stock: Math.round(UI.between(r, 0, 150)), cost: UI.between(r, .3, 3), cat: k % 7 }));

    const norm = s => s.toLowerCase().replace(/(\d)\s*(ml|l|lt|g|gr|kg)\b/g, "$1$2").replace(/lt\b/g, "l").replace(/gr\b/g, "g").replace(/[^a-z0-9 ]/g, " ").replace(/spark\b/, "sparkling").replace(/det\b/, "detergent").replace(/chs\b/, "cheese").split(/\s+/).filter(w => w && w !== "promo");
    function sim(a, b) { const A = new Set(norm(a)), B = new Set(norm(b)); let i = 0; A.forEach(x => { if (B.has(x)) i++; }); return A.size + B.size ? i / (A.size + B.size - i) : 0; }
    function score(o, n) { const c = o.barcode && o.barcode === n.barcode ? 30 : 0, nm = Math.round(sim(o.name, n.name) * 50), p = o.factor === n.factor ? 20 : 0; return { c, n: nm, p, total: c + nm + p }; }
    OLD.forEach(o => {
      let best = null;
      NEW.filter(n => !n.dupOf).forEach(n => { const s = score(o, n); if (!best || s.total > best.s.total) best = { n, s }; });
      o.sug = best && best.s.total >= 55 ? best : null;
      o.match = null; o.isNew = false;
      if (o.sug && o.sug.s.total >= 90 && r() < .5) o.match = o.sug.n.code;
    });
    // Two PROMO variants already confirmed: they show the "duplicate" state (both add stock to the same new item)
    OLD.filter(o => / PROMO$/.test(o.name) && o.sug).slice(0, 2).forEach(o => { o.match = o.sug.n.code; const base = OLD.find(x => x !== o && x.sug && x.sug.n.code === o.match); if (base) base.match = o.match; });
    const target = o => o.match || (o.sug ? o.sug.n.code : null);
    function stateOf(o) {
      if (o.isNew) return "st_new";
      if (!o.match) return o.sug ? "st_suggested" : "st_nomatch";
      return OLD.some(x => x !== o && x.match === o.match) ? "st_duplicate" : "st_matched";
    }
    const chip = s => ({ st_matched: '<span class="chip chip-pos">' + mi("check_circle") + t(s) + "</span>", st_suggested: '<span class="chip chip-info">' + mi("lightbulb") + t(s) + "</span>",
      st_nomatch: '<span class="chip chip-neg">' + mi("link_off") + t(s) + "</span>", st_duplicate: '<span class="chip chip-warn">' + mi("content_copy") + t(s) + "</span>", st_new: '<span class="chip chip-violet">' + mi("add_circle") + t(s) + "</span>" })[s];

    // ---------- Matching tab ----------
    function fillFilters() {
      [["mState", ["st_matched", "st_suggested", "st_nomatch", "st_duplicate", "st_new"].map(s => [s, t(s)])], ["mCat", D.categories.map((c, i) => [String(i), UI.L(c)])]].forEach(([id, opts]) => {
        const $s = $("#" + id), v = $s.val(); if ($s.data("select2")) $s.select2("destroy");
        $s.empty().append(new Option(t("all"), "")); opts.forEach(o => $s.append(new Option(o[1], o[0]))); $s.val(v || "").select2({ width: "100%", minimumResultsForSearch: Infinity });
      });
    }
    fillFilters();
    function renderMatch() {
      const q = document.getElementById("mSearch").value.trim().toLowerCase(), st = $("#mState").val(), cat = $("#mCat").val();
      const list = OLD.filter(o => (!st || stateOf(o) === st) && (cat === "" || String(o.cat) === cat) && (!q || o.code.toLowerCase().includes(q) || o.name.toLowerCase().includes(q) || (target(o) || "").toLowerCase().includes(q)));
      document.querySelector("#tMatch thead").innerHTML = "<tr><th>" + t("colOld") + "</th><th>" + t("colOldName") + "</th><th>" + t("colPres") + '</th><th class="r">' + t("colStock") + "</th><th>" + t("colNew") + "</th><th>" + t("colScore") + "</th><th>" + t("state") + "</th><th>" + t("actions") + "</th></tr>";
      document.querySelector("#tMatch tbody").innerHTML = list.map(o => {
        const s = stateOf(o), tg = o.isNew ? null : target(o), n = tg ? nb(tg) : null, sc = n ? score(o, n) : null, idx = OLD.indexOf(o);
        const pct = sc ? sc.total : 0, col = pct >= 80 ? "var(--mc-good)" : pct >= 60 ? "var(--mc-amber)" : "var(--mc-bad)";
        return "<tr><td>" + o.code + "</td><td>" + o.name + (o.barcode ? '<span class="sub">' + o.barcode + "</span>" : "") + "</td><td>" + (UI.lang === "es" ? "Caja x" : "Box x") + o.factor + '</td><td class="r">' + UI.fmtInt(o.stock) + '<span class="sub">' + M(o.stock * o.cost) + "</span></td><td>" +
          (o.isNew ? '<span class="sub">—</span>' : n ? n.code + " · " + n.name + '<span class="sub">' + (UI.lang === "es" ? "Caja x" : "Box x") + n.factor + "</span>" : "—") + "</td><td>" +
          (sc ? '<div class="score"><b>' + pct + '%</b><div class="ig-barra"><span style="width:' + pct + "%;background:" + col + '"></span></div><small>' + t("code") + " " + sc.c + " · " + t("name") + " " + sc.n + " · " + t("pres") + " " + sc.p + "</small></div>" : "—") +
          "</td><td>" + chip(s) + (s === "st_duplicate" ? '<span class="sub">' + t("dupHint", { c: tg }) + "</span>" : "") + '</td><td><div class="acts">' +
          (s === "st_suggested" ? '<button type="button" class="btn btn-sm btn-teal" data-act="confirm" data-i="' + idx + '">' + mi("check") + t("confirm") + "</button>" : "") +
          (!o.isNew ? '<button type="button" class="btn btn-sm" data-act="change" data-i="' + idx + '">' + mi("edit") + t("change") + "</button>" : "") +
          (o.isNew || o.match ? '<button type="button" class="btn btn-sm" data-act="undo" data-i="' + idx + '">' + mi("undo") + t("undo") + "</button>" : '<button type="button" class="btn btn-sm" data-act="new" data-i="' + idx + '">' + mi("add") + t("createNew") + "</button>") +
          "</div></td></tr>";
      }).join("");
      const resolved = OLD.filter(o => o.isNew || o.match), val = o => o.stock * o.cost, tv = OLD.reduce((a, o) => a + val(o), 0);
      const kpi = (l, v, sub, c) => '<div class="mc-kpi' + (c ? " is-accent" : "") + '"' + (c ? ' style="--k-color:' + c + '"' : "") + '><div class="k-label">' + l + '</div><div class="k-value">' + v + "</div>" + (sub ? '<div class="k-sub">' + sub + "</div>" : "") + "</div>";
      document.getElementById("mKpis").innerHTML = kpi(t("kOld"), OLD.length) +
        kpi(t("kResolved"), UI.fmtPct(resolved.length / OLD.length), resolved.length + " / " + OLD.length, "var(--mc-good)") +
        kpi(t("kResolvedVal"), UI.fmtPct(resolved.reduce((a, o) => a + val(o), 0) / tv), M(resolved.reduce((a, o) => a + val(o), 0)) + " / " + M(tv), "var(--mc-good)") +
        kpi(t("kSug"), OLD.filter(o => stateOf(o) === "st_suggested").length, "", "var(--mc-cyan)") +
        kpi(t("kNo"), OLD.filter(o => stateOf(o) === "st_nomatch").length, "", "var(--mc-bad)") +
        kpi(t("kDup"), OLD.filter(o => stateOf(o) === "st_duplicate").length, "", "var(--mc-amber)");
    }
    document.getElementById("mFilters").addEventListener("submit", e => { e.preventDefault(); renderMatch(); });
    document.getElementById("btnBulk").addEventListener("click", () => { let n = 0; OLD.forEach(o => { if (!o.match && !o.isNew && o.sug && o.sug.s.total >= 80) { o.match = o.sug.n.code; n++; } }); renderMatch(); UI.toast(t("bulkDone", { n })); });
    let chIdx = null;
    function fillNewSelect() {
      const $s = $("#chNew"); if ($s.data("select2")) $s.select2("destroy");
      $s.empty().append(new Option("", "")); NEW.filter(n => n.active).forEach(n => $s.append(new Option(n.code + " · " + n.name, n.code)));
      $s.select2({ width: "100%", dropdownParent: $("#mChange"), placeholder: t("newItem") });
    }
    function renderCmp() {
      const o = OLD[chIdx], n = nb($("#chNew").val());
      const dl = (title, x) => '<div class="mc-panel"><div class="mc-label">' + title + "</div><dl><dt>" + t("colOld").split(" ")[0] + "</dt><dd>" + x.code + "</dd><dt>" + t("colOldName").split(" ")[0] + "</dt><dd>" + x.name + "</dd><dt>" + t("colPres") + "</dt><dd>" + (UI.lang === "es" ? "Caja x" : "Box x") + x.factor + "</dd><dt>EAN</dt><dd>" + (x.barcode || "—") + "</dd></dl></div>";
      const sc = n ? score(o, n) : null;
      document.getElementById("cmp").innerHTML = dl(t("oldSide"), o) + (n ? dl(t("newSide"), n) : '<div class="mc-panel mc-hint">—</div>') + (sc ? '<div class="mc-hint" style="grid-column:1/-1">' + t("colScore") + ": <b>" + sc.total + "%</b> (" + t("code") + " " + sc.c + " · " + t("name") + " " + sc.n + " · " + t("pres") + " " + sc.p + ")</div>" : "");
    }
    $("#chNew").on("change", () => { document.getElementById("eNew").textContent = ""; renderCmp(); });
    document.getElementById("tMatch").addEventListener("click", e => {
      const b = e.target.closest("[data-act]"); if (!b) return;
      const o = OLD[Number(b.dataset.i)], a = b.dataset.act;
      if (a === "confirm") o.match = o.sug.n.code;
      if (a === "new") { o.isNew = true; o.match = null; }
      if (a === "undo") { o.isNew = false; o.match = null; }
      if (a === "change") { chIdx = Number(b.dataset.i); fillNewSelect(); $("#chNew").val("").trigger("change.select2"); document.getElementById("eNew").textContent = ""; renderCmp(); UI.openModal("mChange"); return; }
      renderMatch();
    });
    document.getElementById("btnChSave").addEventListener("click", () => { const v = $("#chNew").val(); if (!v) { document.getElementById("eNew").textContent = t("eNew"); return; } OLD[chIdx].match = v; OLD[chIdx].isNew = false; UI.closeModal("mChange"); renderMatch(); UI.toast(t("saved")); });
    document.getElementById("btnChClose").addEventListener("click", () => UI.closeModal("mChange"));

    // ---------- Merge tab ----------
    const WH = [["Central warehouse", "Bodega central"], ["North Plaza store", "Tienda North Plaza"], ["Harbor store", "Tienda Harbor"]];
    const pairs = NEW.filter(n => n.dupOf != null).map(n => ({ a: n.code, b: NEW[n.dupOf].code }));
    pairs.forEach((p, k) => { const rr = UI.rng(500 + k); p.stock = WH.map(() => [Math.round(UI.between(rr, 0, 120)), Math.round(UI.between(rr, 50, 900))]); p.rows = [Math.round(UI.between(rr, 40, 300)), Math.round(UI.between(rr, 20, 160)), Math.round(UI.between(rr, 0, 4)), Math.round(UI.between(rr, 2, 25))]; });
    let pair = null, running = false;
    const code4 = String(4821);
    function renderPairs() {
      document.querySelector("#tPairs thead").innerHTML = "<tr><th>" + t("colA") + "</th><th>" + t("colB") + '</th><th class="r">' + t("colSim") + "</th><th>" + t("actions") + "</th></tr>";
      document.querySelector("#tPairs tbody").innerHTML = pairs.length ? pairs.map((p, i) => "<tr><td>" + p.a + " · " + nb(p.a).name + "</td><td>" + p.b + " · " + nb(p.b).name + '</td><td class="r">' + UI.fmtPct(sim(nb(p.a).name, nb(p.b).name), 0) + '</td><td><button type="button" class="btn btn-sm" data-pair="' + i + '">' + mi("visibility") + t("review") + "</button></td></tr>").join("") : '<tr><td colspan="4" class="muted">' + t("noPairs") + "</td></tr>";
    }
    function renderMerge() {
      const panel = document.getElementById("mergePanel");
      if (!pair) { panel.hidden = true; return; }
      panel.hidden = false;
      const A = nb(pair.a), B = nb(pair.b);
      document.getElementById("ab").innerHTML =
        '<div class="mc-panel" style="--c:var(--mc-bad)"><h4>' + t("aSide") + "</h4><p>" + A.code + " · " + A.name + '</p><span class="sub">' + (A.active ? "EAN " + A.barcode : t("retired")) + "</span></div>" +
        '<button type="button" class="btn swap" id="btnSwap"' + (running ? " disabled" : "") + ' title="' + t("swap") + '" aria-label="' + t("swap") + '">' + mi("swap_horiz") + "</button>" +
        '<div class="mc-panel" style="--c:var(--mc-good)"><h4>' + t("bSide") + "</h4><p>" + B.code + " · " + B.name + '</p><span class="sub">EAN ' + B.barcode + "</span></div>";
      const presA = [[1, UI.lang === "es" ? "Unidad" : "Unit"], [A.factor, (UI.lang === "es" ? "Caja x" : "Box x") + A.factor]], presB = [1, B.factor];
      document.getElementById("tPres").innerHTML = "<thead><tr><th>" + t("colPresName") + "</th><th>" + t("inB") + "</th></tr></thead><tbody>" + presA.map(p => "<tr><td>" + p[1] + "</td><td>" + (presB.includes(p[0]) ? '<span class="chip chip-pos">' + mi("check") + t("exists") + "</span>" : '<span class="chip chip-info">' + mi("add") + t("willCreate") + "</span>") + "</td></tr>").join("") + "</tbody>";
      const rk = ["rKardex", "rInvoices", "rOrders", "rPurch"];
      const legacy = OLD.filter(o => o.match === A.code).length;
      document.getElementById("tRows").innerHTML = "<tbody>" + rk.map((k, i) => "<tr><td>" + t(k) + '</td><td class="r">' + UI.fmtInt(pair.rows[i]) + "</td></tr>").join("") + "<tr><td>" + t("rLegacy") + '</td><td class="r">' + legacy + "</td></tr></tbody>";
      let sa = 0, sb = 0;
      document.getElementById("tStock").innerHTML = "<thead><tr><th>" + t("colWh") + '</th><th class="r">' + t("stockA") + '</th><th class="r">' + t("stockB") + '</th><th class="r">' + t("stockR") + '</th><th class="r">' + t("costA") + '</th><th class="r">' + t("costB") + '</th><th class="r">' + t("costR") + "</th></tr></thead><tbody>" +
        pair.stock.map((s, i) => { sa += s[0]; sb += s[1]; const avg = (s[0] * A.cost + s[1] * B.cost) / Math.max(1, s[0] + s[1]); return "<tr><td>" + WH[i][UI.lang === "es" ? 1 : 0] + '</td><td class="r">' + s[0] + '</td><td class="r">' + s[1] + '</td><td class="r"><b>' + (s[0] + s[1]) + '</b></td><td class="r">' + M(A.cost) + '</td><td class="r">' + M(B.cost) + '</td><td class="r">' + M(avg) + "</td></tr>"; }).join("") +
        '</tbody><tfoot><tr><td>' + t("total") + '</td><td class="r">' + sa + '</td><td class="r">' + sb + '</td><td class="r">' + (sa + sb) + '</td><td colspan="3"></td></tr></tfoot>';
      const cf = [];
      if (pair.rows[2]) cf.push(t("cfOrders", { n: pair.rows[2] }));
      const diff = Math.abs(A.cost - B.cost) / B.cost; if (diff > .03) cf.push(t("cfCost", { p: UI.fmtPct(diff) }));
      document.getElementById("conflicts").innerHTML = '<div class="mc-label" style="margin-bottom:4px">' + t("conflicts") + "</div>" + (cf.length ? cf.map(c => '<p class="ig-nota">' + mi("warning") + " " + c + "</p>").join("") : '<p class="mc-hint">' + mi("check_circle") + " " + t("noConflicts") + "</p>");
      document.getElementById("cCodeLbl").textContent = t("typeCode", { c: code4 });
      document.getElementById("lockBadge").innerHTML = running ? '<span class="lock">' + mi("lock") + t("locked") + "</span>" : "";
      document.getElementById("btnRun").disabled = running || !A.active;
      const sw = document.getElementById("btnSwap"); if (sw) sw.addEventListener("click", () => { pair = { ...pair, a: pair.b, b: pair.a, stock: pair.stock.map(s => [s[1], s[0]]) }; pairs[pairs.findIndex(p => p.a === pair.b && p.b === pair.a)] = pair; renderMerge(); });
    }
    document.getElementById("tPairs").addEventListener("click", e => { const b = e.target.closest("[data-pair]"); if (!b || running) return; pair = pairs[Number(b.dataset.pair)]; document.getElementById("runBox").hidden = true; document.getElementById("cCode").value = ""; document.getElementById("eCode").textContent = ""; renderMerge(); document.getElementById("mergePanel").scrollIntoView({ behavior: "smooth", block: "start" }); });
    document.getElementById("btnRun").addEventListener("click", () => {
      const real = document.querySelector('input[name="mode"]:checked').value === "real";
      const want = (UI.lang === "es" ? "CONFIRMAR " : "CONFIRM ") + code4;
      const typed = document.getElementById("cCode").value.trim().toUpperCase();
      if (real && typed !== "CONFIRMAR " + code4 && typed !== "CONFIRM " + code4) { document.getElementById("eCode").textContent = t("eCode", { c: code4 }); document.getElementById("cCode").setAttribute("aria-invalid", "true"); document.getElementById("cCode").focus(); return; }
      document.getElementById("eCode").textContent = ""; document.getElementById("cCode").setAttribute("aria-invalid", "false");
      running = true; renderMerge();
      const steps = ["s1", "s2", "s3", "s4", "s5", "s6"];
      const box = document.getElementById("runBox"), bar = document.getElementById("runBar"), log = document.getElementById("runLog");
      box.hidden = false; bar.style.width = "0%"; log.innerHTML = "";
      let i = 0;
      const tick = () => {
        if (i < steps.length) {
          log.insertAdjacentHTML("beforeend", "<li>" + mi("check_circle", "pos") + t(steps[i]) + "</li>");
          i++; bar.style.width = Math.round(i / steps.length * 100) + "%"; setTimeout(tick, 380); return;
        }
        running = false;
        const A = nb(pair.a), B = nb(pair.b);
        if (real) {
          A.active = false;
          OLD.forEach(o => { if (o.match === A.code) o.match = B.code; if (o.sug && o.sug.n.code === A.code) o.sug = { n: B, s: score(o, B) }; });
          pairs.splice(pairs.indexOf(pair), 1);
          log.insertAdjacentHTML("beforeend", '<li><span class="chip chip-pos">' + mi("task_alt") + t("realDone", { a: A.code, b: B.code }) + "</span></li>");
          renderPairs(); renderMatch();
        } else log.insertAdjacentHTML("beforeend", '<li><span class="chip chip-info">' + mi("restore") + t("dryDone") + "</span></li>");
        document.getElementById("lockBadge").innerHTML = "";
        document.getElementById("btnRun").disabled = !nb(pair.a).active;
        if (real) UI.toast(t("realDone", { a: A.code, b: B.code }));
      };
      setTimeout(tick, 300);
    });

    // ---------- Tabs ----------
    let tab = "match";
    function paintTabs() {
      document.querySelectorAll("#tabs [data-tab]").forEach(b => { b.setAttribute("aria-selected", String(b.dataset.tab === tab)); b.tabIndex = b.dataset.tab === tab ? 0 : -1; });
      document.getElementById("pMatch").hidden = tab !== "match"; document.getElementById("pMerge").hidden = tab !== "merge";
    }
    document.getElementById("tabs").addEventListener("click", e => { const b = e.target.closest("[data-tab]"); if (!b) return; tab = b.dataset.tab; paintTabs(); });
    document.getElementById("tabs").addEventListener("keydown", e => { if (e.key === "ArrowRight" || e.key === "ArrowLeft") { tab = tab === "match" ? "merge" : "match"; paintTabs(); document.querySelector('#tabs [data-tab="' + tab + '"]').focus(); } });
    function about() { document.getElementById("about").innerHTML = UI.aboutBox("aboutText"); }
    document.addEventListener("langchange", () => { fillFilters(); renderMatch(); renderPairs(); renderMerge(); about(); });
    paintTabs(); renderMatch(); renderPairs(); about();
  });
  </script>
</body>
</html>
