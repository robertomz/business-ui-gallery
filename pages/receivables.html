<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Accounts receivable · Business UI Gallery</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,300..500,0..1,0&display=block" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/select2/4.0.13/css/select2.min.css">
  <link rel="stylesheet" href="../assets/css/base.css">
  <style>
    .kpi-groups { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
    .kpi-groups .mc-kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    @media (max-width: 1500px) { .kpi-groups { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
    @media (max-width: 560px) { .kpi-groups { grid-template-columns: minmax(0, 1fr); } }
    tr.cust { cursor: pointer; }
    #tMain td, #tState td { white-space: nowrap; }
    tr.cust:focus-visible { outline: 2px solid var(--focus); outline-offset: -2px; }
    tr.inv td { background: var(--surface-alt); font-size: 12.5px; color: var(--text-secondary); }
    tr.inv td:first-child { padding-left: 28px; }
    .limit { display: flex; align-items: center; gap: 6px; min-width: 120px; }
    .limit .bar-track { flex: 1; height: 6px; }
    .eff { display: flex; align-items: center; gap: 6px; min-width: 130px; }
    .eff .bar-track { flex: 1; height: 6px; }
    .bucket-bar { display: flex; gap: 2px; height: 12px; border-radius: var(--r-pill); overflow: hidden; background: var(--chart-track); }
    .bucket-bar span { display: block; height: 100%; }
    .legend { display: flex; flex-wrap: wrap; gap: 8px 14px; font-size: 12px; color: var(--text-secondary); margin-top: 10px; }
    .legend b { color: var(--text-heading); font-weight: 600; }
    .legend i { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 4px; vertical-align: -1px; }
  </style>
</head>
<body data-page="receivables" data-root="../">
  <main id="content">
    <section class="mc-panel">
      <form class="mc-filters" id="filters">
        <div class="mc-field"><label for="fChannel" data-i18n="channel"></label><select id="fChannel"></select></div>
        <div class="mc-field"><label for="fSup" data-i18n="supervisor"></label><select id="fSup"></select></div>
        <div class="mc-field"><label for="fRoute" data-i18n="route"></label><select id="fRoute"></select></div>
        <div class="mc-field"><label for="fSeller" data-i18n="seller"></label><select id="fSeller"></select></div>
        <div class="mc-field"><label for="fType" data-i18n="custType"></label><select id="fType"></select></div>
        <div class="mc-field w-sm"><label for="fBefore" data-i18n="daysBefore"></label><input id="fBefore" type="number" min="0" value="0" class="num"></div>
        <div class="mc-field w-sm"><label for="fOver" data-i18n="daysOver"></label><input id="fOver" type="number" min="0" value="0" class="num"></div>
        <button class="btn btn-teal" type="submit"><span class="material-icons" aria-hidden="true">search</span><span data-i18n="load"></span></button>
        <button class="btn" type="button" id="btnClear"><span class="material-icons" aria-hidden="true">filter_alt_off</span><span data-i18n="clear"></span></button>
      </form>
    </section>

    <section class="kpi-groups" id="kpis" aria-label="Summary"></section>

    <section class="mc-panel">
      <div class="mc-panel-title">
        <div class="mc-tabs" role="tablist" id="tabs"></div>
        <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
          <div class="mc-tabs" role="group" aria-label="Group" id="groupBy"></div>
          <input class="mc-input" id="q" style="width:220px;max-width:100%" data-i18n-ph="searchPh">
        </div>
      </div>
      <div id="agingBox" style="margin-bottom:10px"></div>
      <div class="table-wrap" style="max-height:560px"><table class="grid" id="tMain"><thead></thead><tbody></tbody><tfoot></tfoot></table></div>
    </section>
    <div id="about"></div>
  </main>

  <div class="modal-backdrop" id="mState">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="mStateT">
      <div class="modal-head"><h3 id="mStateT"><span class="material-icons" aria-hidden="true">receipt_long</span><span id="stTitle"></span></h3></div>
      <div class="modal-body">
        <div class="mc-filters" style="margin-bottom:10px">
          <div class="mc-field" style="max-width:170px"><label for="sFrom" data-i18n="from"></label><input type="date" id="sFrom"></div>
          <div class="mc-field" style="max-width:170px"><label for="sTo" data-i18n="to"></label><input type="date" id="sTo"></div>
          <div class="mc-field" style="max-width:220px"><label for="sMov" data-i18n="movType"></label><select id="sMov"></select></div>
        </div>
        <div class="mc-kpis" id="stKpis" style="margin-bottom:10px"></div>
        <div class="table-wrap" style="max-height:420px"><table class="grid" id="tState"><thead></thead><tbody></tbody><tfoot></tfoot></table></div>
      </div>
      <div class="modal-foot"><button class="btn btn-teal" type="button" id="stPrint"><span class="material-icons" aria-hidden="true">print</span><span data-i18n="print"></span></button><button class="btn" type="button" id="stClose" data-i18n="close"></button></div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/select2/4.0.13/js/select2.min.js"></script>
  <script src="../assets/js/common.js"></script>
  <script>
  UI.strings({
    en: {
      channel: "Channel", supervisor: "Supervisor", route: "Route", custType: "Customer type", daysBefore: "Days before overdue", daysOver: "Days overdue",
      g_inv: "Invoices", g_amt: "Amounts", g_over: "Overdue", g_cred: "Credit", k_invCount: "Open invoices", k_custs: "Customers", k_billed: "Invoice amount", k_bal: "Balance",
      k_over: "Overdue balance", k_overPct: "% overdue", k_limit: "Credit limit", k_avail: "Credit available",
      tabCust: "Customer / invoice", tabSpecial: "Special (over 40 days)", tabEff: "Collection effectiveness", byCust: "By customer", bySeller: "By seller", searchPh: "Search customer or invoice…",
      code: "Code", custName: "Customer", invoices: "Invoices", invAmount: "Invoice amount", pctTotal: "% of total", overdue: "Overdue", daysOv: "Days overdue",
      limit: "Credit limit", avail: "Available", usage: "Limit usage", invoice: "Invoice", invDate: "Invoice date", due: "Due date", daysBef: "Days to due", paid: "% paid",
      over: "Over limit", near: "Near limit", ok: "Within limit", b0: "Current", b1: "1–30", b2: "31–60", b3: "61–90", b4: "Over 90", aging: "Aging of the balance",
      statement: "Account statement", movType: "Movement type", movAll: "All movements", movInv: "Invoices", movPay: "Payments", movNc: "Credit notes", print: "Print",
      date: "Date", document: "Document", movement: "Movement", debit: "Debit", credit: "Credit", runBal: "Balance", openBal: "Opening balance", payment: "Payment", cnote: "Credit note", invMov: "Invoice",
      e_coll: "Collected in the period", e_valid: "Valid collection", e_validPct: "% valid of collected", e_canceled: "Invoices paid", e_overdue: "Invoices overdue", e_pending: "Pending (dispatched)",
      in20: "Paid within 20 days", in40: "Paid within 40 days", avgDays: "Avg. days to pay", effective: "Effective", regular: "Regular", low: "Low",
      aboutText: "The balance of each invoice is the invoice amount minus payments and credit notes. <b>Overdue</b> starts the day after the due date (invoice date + the customer's credit days): <b>1 to 40 days</b> is normal overdue and <b>41 or more</b> goes to the <b>Special</b> tab. The credit bar compares the balance with the customer's credit limit and warns when it is near or over it, with an icon and text. The <b>account statement</b> lists invoices, payments and credit notes with a running balance that ends in the same balance as the aging table. <b>Collection effectiveness</b> measures, per seller, how many invoices were paid within 20 and 40 days. Every total follows the filters and the search. All data is generated."
    },
    es: {
      channel: "Canal", supervisor: "Supervisor", route: "Ruta", custType: "Tipo de cliente", daysBefore: "Días antes de mora", daysOver: "Días en mora",
      g_inv: "Facturas", g_amt: "Montos", g_over: "Mora", g_cred: "Crédito", k_invCount: "Facturas abiertas", k_custs: "Clientes", k_billed: "Monto facturas", k_bal: "Saldo",
      k_over: "Saldo en mora", k_overPct: "% en mora", k_limit: "Máx. crédito", k_avail: "Crédito disponible",
      tabCust: "Cliente / Factura", tabSpecial: "Especiales (más de 40 días)", tabEff: "Recaudación efectiva", byCust: "Por cliente", bySeller: "Por vendedor", searchPh: "Buscar cliente o factura…",
      code: "Código", custName: "Cliente", invoices: "Facturas", invAmount: "Monto facturas", pctTotal: "% del total", overdue: "Mora", daysOv: "Días en mora",
      limit: "Máx. crédito", avail: "Disponible", usage: "Uso del límite", invoice: "# Factura", invDate: "Fecha factura", due: "Fecha vence", daysBef: "Días antes mora", paid: "% pagado",
      over: "Fuera de límite", near: "Cerca del límite", ok: "Dentro del límite", b0: "Al día", b1: "1–30", b2: "31–60", b3: "61–90", b4: "Más de 90", aging: "Antigüedad del saldo",
      statement: "Estado de cuenta del cliente", movType: "Tipo de movimiento", movAll: "Todos los movimientos", movInv: "Facturas", movPay: "Abonos", movNc: "Notas de crédito", print: "Imprimir",
      date: "Fecha", document: "Documento", movement: "Movimiento", debit: "Debe", credit: "Haber", runBal: "Saldo", openBal: "Saldo inicial", payment: "Abono", cnote: "Nota de crédito", invMov: "Factura",
      e_coll: "Recaudado en el periodo", e_valid: "Recaudación válida", e_validPct: "% válida del recaudado", e_canceled: "Facturas canceladas", e_overdue: "Facturas en mora", e_pending: "Pendientes (despachadas)",
      in20: "Canceladas en 20 días", in40: "Canceladas en 40 días", avgDays: "Prom. días cancelación", effective: "Efectiva", regular: "Regular", low: "Baja",
      aboutText: "El saldo de cada factura es su monto menos los abonos y las notas de crédito. La <b>mora</b> empieza el día después del vencimiento (fecha de la factura + días de crédito del cliente): de <b>1 a 40 días</b> es mora normal y desde <b>41 días</b> pasa a la pestaña de <b>Especiales</b>. La barra de crédito compara el saldo con el máximo de crédito del cliente y avisa con ícono y texto cuando está cerca o fuera del límite. El <b>estado de cuenta</b> muestra facturas, abonos y notas de crédito con saldo corrido, y termina en el mismo saldo que la tabla de antigüedad. La <b>recaudación efectiva</b> mide por vendedor cuántas facturas se cancelaron dentro de 20 y de 40 días. Todos los totales siguen los filtros y la búsqueda. Todos los datos son generados."
    }
  });

  $(function () {
    const D = UI.DATA, t = UI.t, M = UI.fmtMoney, mi = UI.mi;
    const TODAY = new Date(Date.UTC(2026, 10, 16));
    const CHANNELS = [{ en: "Retail", es: "Detalle" }, { en: "Wholesale", es: "Mayoreo" }, { en: "Supermarkets", es: "Supermercados" }];
    const SUPS = ["R. Paredes", "M. Solis", "L. Banegas"];
    const ROUTES = ["R-01", "R-02", "R-03", "R-04", "R-05", "R-06"];
    const TYPES = [{ en: "Cash on delivery", es: "Contra entrega" }, { en: "Credit", es: "Crédito" }, { en: "Key account", es: "Cuenta clave" }];
    const COLORS = ["var(--chart-2)", "var(--chart-6)", "var(--chart-4)", "var(--chart-3)", "var(--chart-7)"];   // tokens: follow the theme

    // Customers and invoices (deterministic)
    const r = UI.rng(4242);
    const CUST = [];
    for (let i = 0; i < 48; i++) {
      const name = D.customers[i % D.customers.length] + (i >= D.customers.length ? " " + (Math.floor(i / D.customers.length) + 1) : "");
      const seller = D.sellers[i % D.sellers.length];
      const days = [15, 21, 30, 30, 45][Math.floor(r() * 5)];
      const c = { code: "C-" + String(1040 + i * 7), name, seller, channel: Math.floor(r() * 3), sup: Math.floor(r() * 3), route: Math.floor(r() * 6), type: Math.floor(r() * 3), days, limit: Math.round(UI.between(r, 40, 260)) * 1000, inv: [] };
      const n = 1 + Math.floor(r() * 6);
      for (let k = 0; k < n; k++) {
        const age = 1 + Math.floor(Math.pow(r(), 3.2) * 110); // most invoices are recent, a few are old
        const date = new Date(TODAY.getTime() - age * 86400000);
        const due = new Date(date.getTime() + days * 86400000);
        const amount = UI.between(r, 4000, 52000);
        const paid = r() < .45 ? amount * UI.between(r, .1, .8) : 0;
        c.inv.push({ no: "F-" + (200300 + i * 31 + k * 7), date, due, amount, bal: amount - paid, over: Math.floor((TODAY - due) / 86400000) });
      }
      CUST.push(c);
    }

    let tab = "cust", group = "cust", open = null, applied = null;

    function fillSelects() {
      const keep = {};
      ["#fChannel", "#fSup", "#fRoute", "#fSeller", "#fType"].forEach(s => keep[s] = $(s).val() || "all");
      const fill = (sel, items) => { $(sel).empty().append(new Option(t("all"), "all")); items.forEach((x, i) => $(sel).append(new Option(UI.L(x), String(i)))); $(sel).val(keep[sel]).select2({ width: "100%" }); };
      fill("#fChannel", CHANNELS); fill("#fSup", SUPS); fill("#fRoute", ROUTES); fill("#fSeller", D.sellers); fill("#fType", TYPES);
    }
    fillSelects();

    function readFilters() {
      return { ch: $("#fChannel").val(), sup: $("#fSup").val(), route: $("#fRoute").val(), seller: $("#fSeller").val(), type: $("#fType").val(), before: Number(document.getElementById("fBefore").value) || 0, over: Number(document.getElementById("fOver").value) || 0 };
    }

    function rows() {
      const f = applied || readFilters();
      const q = document.getElementById("q").value.trim().toLowerCase();
      return CUST.filter(c =>
        (f.ch === "all" || c.channel === +f.ch) && (f.sup === "all" || c.sup === +f.sup) && (f.route === "all" || c.route === +f.route) &&
        (f.seller === "all" || D.sellers[+f.seller] === c.seller) && (f.type === "all" || c.type === +f.type))
        .map(c => {
          let inv = c.inv.filter(x => x.bal > 0.5);
          if (f.over > 0) inv = inv.filter(x => x.over >= f.over);
          if (f.before > 0) inv = inv.filter(x => x.over < 0 && -x.over <= f.before);
          if (tab === "special") inv = inv.filter(x => x.over > 40);
          if (q && !c.name.toLowerCase().includes(q) && !c.code.toLowerCase().includes(q)) inv = inv.filter(x => x.no.toLowerCase().includes(q));
          const bal = inv.reduce((a, x) => a + x.bal, 0), amount = inv.reduce((a, x) => a + x.amount, 0), over = inv.filter(x => x.over > 0).reduce((a, x) => a + x.bal, 0);
          return Object.assign({}, c, { inv, bal, amount, over, maxOver: inv.reduce((a, x) => Math.max(a, x.over), 0), totalBal: c.inv.reduce((a, x) => a + x.bal, 0) });
        }).filter(c => c.inv.length);
    }
    function bucket(o) { return o <= 0 ? 0 : o <= 30 ? 1 : o <= 60 ? 2 : o <= 90 ? 3 : 4; }

    function usageCell(bal, limit) {
      const u = bal / limit;
      const st = u > 1 ? ["over", "neg", "error"] : u > .85 ? ["near", "", "warning"] : ["ok", "pos", "check_circle"];
      return '<div class="limit"><div class="bar-track"><span style="width:' + Math.min(100, u * 100) + "%;background:" + (u > 1 ? "var(--danger-solid)" : u > .85 ? "var(--warning-solid)" : "var(--success-solid)") + '"></span></div><span class="chip ' + (u > 1 ? "chip-neg" : u > .85 ? "chip-warn" : "chip-pos") + '">' + mi(st[2]) + t(st[0]) + "</span></div>";
    }

    function renderKpis(list) {
      const inv = list.reduce((a, c) => a.concat(c.inv), []);
      const bal = list.reduce((a, c) => a + c.bal, 0), amount = list.reduce((a, c) => a + c.amount, 0), over = list.reduce((a, c) => a + c.over, 0);
      const limit = list.reduce((a, c) => a + c.limit, 0), used = list.reduce((a, c) => a + c.totalBal, 0);
      const k = (l, v, sub) => '<div class="mc-kpi"><div class="k-label">' + t(l) + '</div><div class="k-value num">' + v + "</div>" + (sub ? '<div class="k-sub">' + sub + "</div>" : "") + "</div>";
      const g = (l, html) => '<div class="mc-kpi-group"><span class="mc-label">' + t(l) + '</span><div class="mc-kpis">' + html + "</div></div>";
      document.getElementById("kpis").innerHTML =
        g("g_inv", k("k_invCount", UI.fmtInt(inv.length)) + k("k_custs", UI.fmtInt(list.length))) +
        g("g_amt", k("k_billed", M(amount)) + k("k_bal", M(bal))) +
        g("g_over", k("k_over", '<span class="neg">' + M(over) + "</span>") + k("k_overPct", UI.fmtPct(bal ? over / bal : 0))) +
        g("g_cred", k("k_limit", M(limit)) + k("k_avail", M(Math.max(0, limit - used))));
      // Aging bar
      const b = [0, 0, 0, 0, 0];
      inv.forEach(x => b[bucket(x.over)] += x.bal);
      const tot = b.reduce((a, x) => a + x, 0) || 1;
      document.getElementById("agingBox").innerHTML = tab === "eff" ? "" : '<div class="mc-label" style="margin-bottom:6px">' + t("aging") + '</div><div class="bucket-bar" role="img" aria-label="' + t("aging") + '">' +
        b.map((v, i) => '<span style="width:' + (v / tot * 100) + "%;background:" + COLORS[i] + '" title="' + t("b" + i) + ": " + M(v) + '"></span>').join("") + '</div><div class="legend">' +
        b.map((v, i) => '<span><i style="background:' + COLORS[i] + '"></i>' + t("b" + i) + " · <b class=\"num\">" + M(v) + "</b> (" + UI.fmtPct(v / tot, 0) + ")</span>").join("") + "</div>";
    }

    function renderMain() {
      const list = rows();
      renderKpis(list);
      document.getElementById("tabs").innerHTML = [["cust", "tabCust"], ["special", "tabSpecial"], ["eff", "tabEff"]].map(x => '<button type="button" class="mc-tab" role="tab" aria-selected="' + (tab === x[0]) + '" data-tab="' + x[0] + '">' + t(x[1]) + "</button>").join("");
      document.getElementById("groupBy").innerHTML = tab === "eff" ? "" : [["cust", "byCust"], ["seller", "bySeller"]].map(x => '<button type="button" class="mc-tab' + (group === x[0] ? " is-active" : "") + '" aria-pressed="' + (group === x[0]) + '" data-g="' + x[0] + '">' + t(x[1]) + "</button>").join("");
      document.getElementById("groupBy").hidden = tab === "eff";
      const thead = document.querySelector("#tMain thead"), tbody = document.querySelector("#tMain tbody"), tfoot = document.querySelector("#tMain tfoot");
      const grand = list.reduce((a, c) => a + c.bal, 0) || 1;
      if (tab === "eff") return renderEff(list);
      if (group === "seller") {
        const by = {};
        list.forEach(c => { const s = by[c.seller] || (by[c.seller] = { s: c.seller, n: 0, inv: 0, amount: 0, bal: 0, over: 0, limit: 0, used: 0 }); s.n++; s.inv += c.inv.length; s.amount += c.amount; s.bal += c.bal; s.over += c.over; s.limit += c.limit; s.used += c.totalBal; });
        const arr = Object.values(by).sort((a, b) => b.bal - a.bal);
        thead.innerHTML = "<tr><th>" + t("seller") + '</th><th class="r">' + t("k_custs") + '</th><th class="r">' + t("invoices") + '</th><th class="r">' + t("invAmount") + '</th><th class="r">' + t("balance") + '</th><th class="r">' + t("pctTotal") + '</th><th class="r">' + t("overdue") + '</th><th class="r">' + t("k_overPct") + "</th><th>" + t("usage") + "</th></tr>";
        tbody.innerHTML = arr.map(s => "<tr><td>" + s.s + '</td><td class="r">' + s.n + '</td><td class="r">' + s.inv + '</td><td class="r">' + M(s.amount) + '</td><td class="r">' + M(s.bal) + '</td><td class="r">' + UI.fmtPct(s.bal / grand) + '</td><td class="r neg">' + M(s.over) + '</td><td class="r">' + UI.fmtPct(s.bal ? s.over / s.bal : 0) + "</td><td>" + usageCell(s.used, s.limit) + "</td></tr>").join("");
        tfoot.innerHTML = "<tr><td>" + t("total") + '</td><td class="r">' + list.length + '</td><td class="r">' + list.reduce((a, c) => a + c.inv.length, 0) + '</td><td class="r">' + M(list.reduce((a, c) => a + c.amount, 0)) + '</td><td class="r">' + M(grand) + '</td><td class="r">100.0%</td><td class="r">' + M(list.reduce((a, c) => a + c.over, 0)) + "</td><td></td><td></td></tr>";
        return;
      }
      list.sort((a, b) => b.bal - a.bal);
      thead.innerHTML = "<tr><th>" + t("code") + "</th><th>" + t("custName") + "</th><th>" + t("channel") + "</th><th>" + t("seller") + '</th><th class="r">' + t("invoices") + '</th><th class="r">' + t("invAmount") + '</th><th class="r">' + t("balance") + '</th><th class="r">' + t("pctTotal") + '</th><th class="r">' + t("overdue") + '</th><th class="r">' + t("daysOv") + "</th><th>" + t("usage") + '</th><th style="width:44px"></th></tr>';
      tbody.innerHTML = list.map(c => '<tr class="cust" tabindex="0" data-code="' + c.code + '"><td>' + mi(open === c.code ? "expand_less" : "expand_more") + " " + c.code + "</td><td>" + c.name + "</td><td>" + UI.L(CHANNELS[c.channel]) + "</td><td>" + c.seller + '</td><td class="r">' + c.inv.length + '</td><td class="r">' + M(c.amount) + '</td><td class="r">' + M(c.bal) + '</td><td class="r">' + UI.fmtPct(c.bal / grand) +
        '</td><td class="r' + (c.over > 0 ? " neg" : "") + '">' + M(c.over) + '</td><td class="r' + (c.maxOver > 40 ? " neg" : "") + '">' + Math.max(0, c.maxOver) + "</td><td>" + usageCell(c.totalBal, c.limit) + '</td><td><button type="button" class="btn btn-sm icon-btn" data-st="' + c.code + '" aria-label="' + t("statement") + '" title="' + t("statement") + '">' + mi("receipt_long") + "</button></td></tr>" +
        (open === c.code ? c.inv.map(x => '<tr class="inv"><td>' + x.no + "</td><td>" + t("invDate") + " " + UI.fmtDay(x.date) + "</td><td>" + t("due") + " " + UI.fmtDay(x.due) + '</td><td></td><td></td><td class="r">' + M(x.amount) + '</td><td class="r">' + M(x.bal) + '</td><td class="r">' + UI.fmtPct(1 - x.bal / x.amount) + " " + t("paid") + '</td><td class="r' + (x.over > 0 ? " neg" : "") + '">' + (x.over > 0 ? M(x.bal) : "—") + '</td><td class="r">' + (x.over > 0 ? x.over : "—") + "</td><td>" + (x.over <= 0 ? '<span class="muted">' + t("daysBef") + ": " + (-x.over) + "</span>" : "") + "</td><td></td></tr>").join("") : "")).join("");
      tfoot.innerHTML = '<tr><td colspan="4">' + t("total") + '</td><td class="r">' + list.reduce((a, c) => a + c.inv.length, 0) + '</td><td class="r">' + M(list.reduce((a, c) => a + c.amount, 0)) + '</td><td class="r">' + M(list.reduce((a, c) => a + c.bal, 0)) + '</td><td class="r">100.0%</td><td class="r">' + M(list.reduce((a, c) => a + c.over, 0)) + '</td><td colspan="3"></td></tr>';
    }

    function renderEff(list) {
      const by = {};
      const re = UI.rng(77);
      D.sellers.forEach(s => { by[s] = { s, coll: 0, valid: 0, canceled: 0, overdue: 0, pending: 0, in20: 0, in40: 0, days: 0 }; });
      list.forEach(c => {
        const s = by[c.seller];
        const n = c.inv.length + 3;
        for (let k = 0; k < n; k++) {
          const d = Math.round(UI.between(re, 5, 70)), amt = UI.between(re, 3000, 30000);
          s.coll += amt; s.valid += d <= c.days + 5 ? amt : amt * .4; s.canceled++; s.days += d;
          if (d <= 20) s.in20++; if (d <= 40) s.in40++;
        }
        s.overdue += c.inv.filter(x => x.over > 0).length; s.pending += c.inv.filter(x => x.over <= 0).length;
      });
      const arr = Object.values(by).filter(s => s.canceled);
      const sum = k => arr.reduce((a, s) => a + s[k], 0);
      const k = (l, v) => '<div class="mc-kpi"><div class="k-label">' + t(l) + '</div><div class="k-value num">' + v + "</div></div>";
      document.getElementById("kpis").innerHTML = '<div class="mc-kpi-group" style="grid-column:1/-1"><span class="mc-label">' + t("tabEff") + '</span><div class="mc-kpis">' +
        k("e_coll", M(sum("coll"))) + k("e_valid", M(sum("valid"))) + k("e_validPct", UI.fmtPct(sum("valid") / (sum("coll") || 1))) + k("e_canceled", UI.fmtInt(sum("canceled"))) + k("e_overdue", UI.fmtInt(sum("overdue"))) + k("e_pending", UI.fmtInt(sum("pending"))) + "</div></div>";
      const effCell = p => { const st = p >= .7 ? ["effective", "chip-pos", "check_circle"] : p >= .45 ? ["regular", "chip-warn", "warning"] : ["low", "chip-neg", "error"]; return '<div class="eff"><div class="bar-track"><span style="width:' + p * 100 + "%;background:" + (p >= .7 ? "var(--success-solid)" : p >= .45 ? "var(--warning-solid)" : "var(--danger-solid)") + '"></span></div><span class="num">' + UI.fmtPct(p, 0) + '</span><span class="chip ' + st[1] + '">' + mi(st[2]) + t(st[0]) + "</span></div>"; };
      document.querySelector("#tMain thead").innerHTML = "<tr><th>" + t("seller") + '</th><th class="r">' + t("e_coll") + '</th><th class="r">' + t("e_valid") + '</th><th class="r">' + t("e_canceled") + "</th><th>" + t("in20") + "</th><th>" + t("in40") + '</th><th class="r">' + t("avgDays") + '</th><th class="r">' + t("e_overdue") + "</th></tr>";
      document.querySelector("#tMain tbody").innerHTML = arr.sort((a, b) => b.in20 / b.canceled - a.in20 / a.canceled).map(s => "<tr><td>" + s.s + '</td><td class="r">' + M(s.coll) + '</td><td class="r">' + M(s.valid) + '</td><td class="r">' + s.canceled + "</td><td>" + effCell(s.in20 / s.canceled) + "</td><td>" + effCell(s.in40 / s.canceled) + '</td><td class="r">' + (s.days / s.canceled).toFixed(1) + '</td><td class="r">' + s.overdue + "</td></tr>").join("");
      document.querySelector("#tMain tfoot").innerHTML = "<tr><td>" + t("total") + '</td><td class="r">' + M(sum("coll")) + '</td><td class="r">' + M(sum("valid")) + '</td><td class="r">' + sum("canceled") + "</td><td>" + UI.fmtPct(sum("in20") / (sum("canceled") || 1), 0) + "</td><td>" + UI.fmtPct(sum("in40") / (sum("canceled") || 1), 0) + '</td><td class="r">' + (sum("days") / (sum("canceled") || 1)).toFixed(1) + '</td><td class="r">' + sum("overdue") + "</td></tr>";
    }

    // ----- Account statement -----
    let stCust = null;
    function statementRows(c) {
      const movs = [];
      c.inv.forEach((x, k) => {
        movs.push({ d: x.date, doc: x.no, kind: "inv", debit: x.amount, credit: 0 });
        const paid = x.amount - x.bal;
        if (paid > 0) {
          const nc = k % 3 === 0 ? paid * .2 : 0;
          if (nc) movs.push({ d: new Date(x.date.getTime() + 4 * 86400000), doc: "NC-" + x.no.slice(2), kind: "nc", debit: 0, credit: nc });
          movs.push({ d: new Date(Math.min(TODAY.getTime(), x.date.getTime() + 12 * 86400000)), doc: "R-" + x.no.slice(2), kind: "pay", debit: 0, credit: paid - nc });
        }
      });
      return movs.sort((a, b) => a.d - b.d);
    }
    function renderStatement() {
      const c = stCust;
      document.getElementById("stTitle").textContent = t("statement") + ": " + c.code + " · " + c.name;
      const from = new Date(document.getElementById("sFrom").value + "T00:00:00Z"), to = new Date(document.getElementById("sTo").value + "T00:00:00Z");
      const kind = $("#sMov").val();
      const all = statementRows(c);
      const before = all.filter(m => m.d < from).reduce((a, m) => a + m.debit - m.credit, 0);
      let run = before;
      const list = all.filter(m => m.d >= from && m.d <= to);
      const shown = [];
      list.forEach(m => { run += m.debit - m.credit; if (kind === "all" || kind === m.kind) shown.push(Object.assign({ run }, m)); });
      const name = { inv: t("invMov"), pay: t("payment"), nc: t("cnote") };
      document.querySelector("#tState thead").innerHTML = "<tr><th>" + t("date") + "</th><th>" + t("document") + "</th><th>" + t("movement") + '</th><th class="r">' + t("debit") + '</th><th class="r">' + t("credit") + '</th><th class="r">' + t("runBal") + "</th></tr>";
      document.querySelector("#tState tbody").innerHTML = '<tr><td colspan="5" class="muted">' + t("openBal") + '</td><td class="r">' + M(before) + "</td></tr>" + shown.map(m => "<tr><td>" + UI.fmtDay(m.d) + "</td><td>" + m.doc + "</td><td>" + name[m.kind] + '</td><td class="r">' + (m.debit ? M(m.debit) : "") + '</td><td class="r">' + (m.credit ? M(m.credit) : "") + '</td><td class="r">' + M(m.run) + "</td></tr>").join("");
      const deb = shown.reduce((a, m) => a + m.debit, 0), cre = shown.reduce((a, m) => a + m.credit, 0);
      document.querySelector("#tState tfoot").innerHTML = '<tr><td colspan="3">' + t("total") + '</td><td class="r">' + M(deb) + '</td><td class="r">' + M(cre) + '</td><td class="r">' + M(run) + "</td></tr>";
      const k = (l, v) => '<div class="mc-kpi"><div class="k-label">' + t(l) + '</div><div class="k-value num">' + v + "</div></div>";
      document.getElementById("stKpis").innerHTML = k("openBal", M(before)) + k("debit", M(deb)) + k("credit", M(cre)) + k("runBal", M(run)) + k("limit", M(c.limit));
    }
    function openStatement(code) {
      stCust = CUST.find(c => c.code === code);
      const first = stCust.inv.reduce((a, x) => x.date < a ? x.date : a, TODAY);
      document.getElementById("sFrom").value = UI.fmtDate(new Date(first.getTime() - 86400000));
      document.getElementById("sTo").value = UI.fmtDate(TODAY);
      fillMov();
      renderStatement();
      UI.openModal("mState");
    }
    function fillMov() { const v = $("#sMov").val() || "all"; $("#sMov").empty(); [["all", "movAll"], ["inv", "movInv"], ["pay", "movPay"], ["nc", "movNc"]].forEach(x => $("#sMov").append(new Option(t(x[1]), x[0]))); $("#sMov").val(v).select2({ width: "100%", dropdownParent: $("#mState"), minimumResultsForSearch: Infinity }); }
    $("#sMov").on("change", () => stCust && renderStatement());
    ["sFrom", "sTo"].forEach(id => document.getElementById(id).addEventListener("change", renderStatement));
    document.getElementById("stClose").addEventListener("click", () => UI.closeModal("mState"));
    document.getElementById("stPrint").addEventListener("click", () => window.print());

    // ----- Events -----
    document.getElementById("filters").addEventListener("submit", e => { e.preventDefault(); applied = readFilters(); open = null; renderMain(); });
    document.getElementById("btnClear").addEventListener("click", () => { ["#fChannel", "#fSup", "#fRoute", "#fSeller", "#fType"].forEach(s => $(s).val("all").trigger("change.select2")); document.getElementById("fBefore").value = 0; document.getElementById("fOver").value = 0; document.getElementById("q").value = ""; applied = readFilters(); renderMain(); });
    document.getElementById("q").addEventListener("input", renderMain);
    document.getElementById("tabs").addEventListener("click", e => { const b = e.target.closest("[data-tab]"); if (b) { tab = b.dataset.tab; open = null; renderMain(); } });
    document.getElementById("groupBy").addEventListener("click", e => { const b = e.target.closest("[data-g]"); if (b) { group = b.dataset.g; renderMain(); } });
    document.getElementById("tMain").addEventListener("click", e => {
      const st = e.target.closest("[data-st]");
      if (st) { e.stopPropagation(); openStatement(st.dataset.st); return; }
      const tr = e.target.closest("tr.cust");
      if (tr) { open = open === tr.dataset.code ? null : tr.dataset.code; renderMain(); }
    });
    document.getElementById("tMain").addEventListener("keydown", e => { if ((e.key === "Enter" || e.key === " ") && e.target.matches("tr.cust")) { e.preventDefault(); e.target.click(); } });
    document.addEventListener("langchange", () => { fillSelects(); renderMain(); if (stCust && document.getElementById("mState").classList.contains("open")) { fillMov(); renderStatement(); } document.getElementById("about").innerHTML = UI.aboutBox("aboutText"); });
    document.getElementById("about").innerHTML = UI.aboutBox("aboutText");
    applied = readFilters();
    renderMain();
  });
  </script>
</body>
</html>
