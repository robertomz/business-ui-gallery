<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Manual journal entry · Business UI Gallery</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,300..500,0..1,0&display=block" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/select2/4.0.13/css/select2.min.css">
  <link rel="stylesheet" href="../assets/css/base.css">
  <style>
    .je-head { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px 12px; }
    .je-head .span2 { grid-column: span 2; }
    .je-head .span4 { grid-column: 1 / -1; }
    .lines-wrap { overflow-x: auto; border: 1px solid var(--border-subtle); border-radius: var(--r-md); background: var(--surface); margin-top: 12px; }
    table.lines { width: 100%; min-width: 980px; border-collapse: collapse; font-size: 13px; }
    table.lines th { background: var(--surface-alt); color: var(--text-secondary); font-size: 12px; font-weight: 600; padding: 12px 10px; text-align: left; white-space: nowrap; border-bottom: 1px solid var(--border-subtle); }
    table.lines td { padding: 8px 10px; border-bottom: 1px solid var(--border-subtle); color: var(--text); vertical-align: top; }
    table.lines tbody tr:last-child td { border-bottom: 0; }
    table.lines td input[type=text], table.lines td select { width: 100%; min-height: 36px; padding: 4px 10px; border: 1px solid var(--border); border-radius: 10px; background: var(--bg-input); color: var(--text); font-size: 13px; }
    table.lines td input[type=text]:focus, table.lines td select:focus { outline: none; border-color: var(--focus); box-shadow: 0 0 0 3px color-mix(in srgb, var(--brand) 20%, transparent); background: var(--surface); }
    table.lines td input.num { text-align: right; }
    table.lines td input[aria-invalid="true"], table.lines td select[aria-invalid="true"] { border-color: var(--danger-solid); background: var(--danger-soft); }
    table.lines td.c { text-align: center; }
    table.lines td.c input { width: 18px; height: 18px; accent-color: var(--brand); margin-top: 9px; }
    .line-err { font-size: 12px; color: var(--danger); margin-top: 3px; }
    .col-acc { width: 26%; } .col-syn { width: 22%; } .col-amt { width: 12%; } .col-cc { width: 16%; }
    .totals { display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; margin-top: 10px; }
    .totals .mc-kpi { min-width: 160px; }
    .budget-hint { font-size: 12px; color: var(--text-secondary); margin-top: 6px; }
    .ro td { color: var(--text); }
    #tList td { white-space: nowrap; }
    @media (max-width: 760px) { .je-head { grid-template-columns: minmax(0, 1fr); } .je-head .span2 { grid-column: auto; } }
  </style>
</head>
<body data-page="journal-entry" data-root="../">
  <main id="content">
    <section class="mc-panel">
      <form class="mc-filters" id="filters">
        <div class="mc-field w-sm"><label data-i18n="company"></label><div class="static">DEMO</div></div>
        <div class="mc-field" style="max-width:170px"><label for="fFrom" data-i18n="from"></label><input type="date" id="fFrom"></div>
        <div class="mc-field" style="max-width:170px"><label for="fTo" data-i18n="to"></label><input type="date" id="fTo"></div>
        <div class="mc-field" style="max-width:220px"><label for="fType" data-i18n="entryType"></label><select id="fType"></select></div>
        <button class="btn btn-teal" type="submit"><span class="material-icons" aria-hidden="true">search</span><span data-i18n="load"></span></button>
        <button class="btn btn-violet" type="button" id="btnNew"><span class="material-icons" aria-hidden="true">add</span><span data-i18n="newEntry"></span></button>
      </form>
    </section>

    <section class="mc-kpis" id="kpis" aria-label="Summary"></section>

    <section class="mc-panel">
      <div class="mc-panel-title"><h3><span class="material-icons" aria-hidden="true">edit_note</span><span data-i18n="listTitle"></span></h3><span class="mc-hint" data-i18n="listHint"></span></div>
      <div class="table-wrap" style="max-height:520px"><table class="grid" id="tList"><thead></thead><tbody></tbody><tfoot></tfoot></table></div>
    </section>

    <div id="about"></div>
  </main>

  <!-- New entry (fullscreen, opens empty) -->
  <div class="modal-backdrop" id="mEntry">
    <div class="modal modal-full" role="dialog" aria-modal="true" aria-labelledby="mEntryTitle">
      <div class="modal-head"><h3 id="mEntryTitle"><span class="material-icons" aria-hidden="true">edit_note</span><span data-i18n="newEntry"></span></h3><span class="chip chip-info" id="entryNo"></span></div>
      <div class="modal-body">
        <div class="je-head">
          <div class="mc-field"><label data-i18n="company"></label><div class="static">DEMO</div></div>
          <div class="mc-field"><label for="eBranch" data-i18n="branch"></label><select id="eBranch"></select><div class="mc-field-error" id="errBranch"></div></div>
          <div class="mc-field"><label for="eRef" data-i18n="docRef"></label><input type="text" id="eRef" maxlength="30"><div class="mc-field-error"></div></div>
          <div class="mc-field"><label for="eDate" data-i18n="entryDate"></label><input type="date" id="eDate"><div class="mc-field-error" id="errDate"></div></div>
          <div class="mc-field"><label for="eRate" data-i18n="rate"></label><input type="text" id="eRate" class="num" inputmode="decimal"><div class="mc-field-error" id="errRate"></div></div>
          <div class="mc-field span2"><label for="eType" data-i18n="entryTypeManual"></label><select id="eType"></select><div class="mc-field-error" id="errType"></div></div>
          <div class="mc-field"><label data-i18n="lines"></label><button type="button" class="btn btn-outline-teal" id="btnAddLine"><span class="material-icons" aria-hidden="true">add</span><span data-i18n="addLine"></span></button></div>
          <div class="mc-field span4"><label for="eSyn" data-i18n="synopsis"></label><textarea id="eSyn" maxlength="250"></textarea><div class="mc-field-error" id="errSyn"></div></div>
        </div>
        <div class="lines-wrap">
          <table class="lines" id="tLines">
            <thead><tr>
              <th class="col-acc" data-i18n="colCode"></th><th class="col-syn" data-i18n="colSyn"></th>
              <th class="col-amt" style="text-align:right" data-i18n="debit"></th><th class="col-amt" style="text-align:right" data-i18n="credit"></th>
              <th data-i18n="colExpense"></th><th data-i18n="colNonDed"></th><th class="col-cc" data-i18n="costCenter"></th><th data-i18n="actions"></th>
            </tr></thead>
            <tbody></tbody>
          </table>
        </div>
        <p class="budget-hint" id="budgetHint"></p>
        <div class="totals" id="totals"></div>
        <p class="mc-field-error" id="errLines" style="text-align:right"></p>
      </div>
      <div class="modal-foot">
        <button type="button" class="btn btn-teal" id="btnSave" disabled><span class="material-icons" aria-hidden="true">save</span><span data-i18n="save"></span></button>
        <button type="button" class="btn" id="btnCloseEntry"><span class="material-icons" aria-hidden="true">close</span><span data-i18n="close"></span></button>
      </div>
    </div>
  </div>

  <!-- View entry (read only) -->
  <div class="modal-backdrop" id="mView">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="mViewTitle">
      <div class="modal-head"><h3 id="mViewTitle"><span class="material-icons" aria-hidden="true">visibility</span><span id="viewTitle"></span></h3><span id="viewChip"></span></div>
      <div class="modal-body" id="viewBody"></div>
      <div class="modal-foot"><button type="button" class="btn" id="btnCloseView"><span class="material-icons" aria-hidden="true">close</span><span data-i18n="close"></span></button></div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/select2/4.0.13/js/select2.min.js"></script>
  <script src="../assets/js/common.js"></script>
  <script>
  UI.strings({
    en: {
      company: "Company", entryType: "Entry type", newEntry: "New manual entry", listTitle: "Manual entries", listHint: "An entry is balanced when total debit equals total credit",
      kEntries: "Entries", kDebit: "Total debit", kCredit: "Total credit", kUnbal: "Unbalanced",
      docRef: "Document reference number", entryDate: "Entry date", rate: "Exchange rate", entryTypeManual: "Entry type (manual)", synopsis: "Entry synopsis",
      lines: "Lines", addLine: "Add line", colCode: "Account", colSyn: "Synopsis", debit: "Debit", credit: "Credit", colExpense: "Expense", colNonDed: "Non-deduct.",
      costCenter: "Cost center", actions: "Actions", difference: "Difference", balanced: "Balanced", unbalanced: "Unbalanced",
      colNo: "Entry No.", colDate: "Date", colType: "Type", colBranch: "Branch", colStatus: "Balance", colBy: "Created by", view: "View",
      pickAccount: "Choose an account", pickCenter: "Choose a cost center", noBudget: "no budget for this account", noCenterNeeded: "Not an expense account",
      budgetedFor: "Account {a} has budget in: {c}.", budgetIntro: "Expense accounts (6-) only accept a cost center budgeted for that account.",
      eBranch: "Choose the branch.", eDate: "Enter the entry date.", eRate: "Enter an exchange rate greater than 0.", eType: "Choose the entry type.", eSyn: "Write the synopsis (at least 10 characters).",
      eLineAcc: "Choose the account.", eLineAmt: "Enter a debit or a credit.", eLineCc: "Expense account: choose a budgeted cost center.", eLines: "The entry needs at least 2 lines.",
      eBalance: "Debit and credit do not match: difference {d}.", savedEntry: "Entry {n} saved and balanced.", entryN: "Entry {n}", deleteLine: "Delete line",
      t_adj: "Adjustment", t_prov: "Provision", t_dep: "Depreciation", t_rec: "Reclassification", t_acc: "Accrual", all: "All",
      aboutText: "Manual entries cover adjustments that no document generates on its own. The header asks for <b>company, branch, document reference, date, exchange rate, entry type and synopsis</b>. Each line is <b>debit or credit, never both</b>: typing one clears the other. Expense accounts (<b>6-</b>) mark the line as an expense and only accept a <b>cost center that has budget for that account</b>; the others appear disabled with the reason. Debit, credit and difference update as you type, and <b>Save stays disabled until the entry balances</b>. Errors appear next to each field. All data is generated."
    },
    es: {
      company: "Empresa", entryType: "Tipo de partida", newEntry: "Nueva partida manual", listTitle: "Partidas manuales", listHint: "Una partida está cuadrada cuando el total del Debe es igual al del Haber",
      kEntries: "Partidas", kDebit: "Total Debe", kCredit: "Total Haber", kUnbal: "Descuadradas",
      docRef: "Número de referencia de documento", entryDate: "Fecha partida", rate: "Tasa de cambio", entryTypeManual: "Tipo de partida (manuales)", synopsis: "Sinopsis partida",
      lines: "Líneas", addLine: "Agregar línea", colCode: "Código", colSyn: "Sinopsis", debit: "Debe", credit: "Haber", colExpense: "Gasto", colNonDed: "No deduc.",
      costCenter: "Centro costo", actions: "Acciones", difference: "Diferencia", balanced: "Cuadrada", unbalanced: "Descuadrada",
      colNo: "No. partida", colDate: "Fecha", colType: "Tipo", colBranch: "Sucursal", colStatus: "Balance", colBy: "Creado por", view: "Ver",
      pickAccount: "Seleccione una cuenta", pickCenter: "Seleccione un centro", noBudget: "sin presupuesto para esta cuenta", noCenterNeeded: "No es cuenta de gasto",
      budgetedFor: "La cuenta {a} tiene presupuesto en: {c}.", budgetIntro: "Las cuentas de gasto (6-) solo aceptan un centro de costo presupuestado para esa cuenta.",
      eBranch: "Elija la sucursal.", eDate: "Ingrese la fecha de la partida.", eRate: "Ingrese una tasa de cambio mayor que 0.", eType: "Elija el tipo de partida.", eSyn: "Escriba la sinopsis (mínimo 10 caracteres).",
      eLineAcc: "Elija la cuenta.", eLineAmt: "Ingrese un Debe o un Haber.", eLineCc: "Cuenta de gasto: elija un centro presupuestado.", eLines: "La partida necesita al menos 2 líneas.",
      eBalance: "El Debe y el Haber no cuadran: diferencia {d}.", savedEntry: "Partida {n} guardada y cuadrada.", entryN: "Partida {n}", deleteLine: "Eliminar línea",
      t_adj: "Ajuste", t_prov: "Provisión", t_dep: "Depreciación", t_rec: "Reclasificación", t_acc: "Devengo", all: "Todas",
      aboutText: "Las partidas manuales cubren los ajustes que ningún documento genera solo. El encabezado pide <b>empresa, sucursal, referencia del documento, fecha, tasa de cambio, tipo de partida y sinopsis</b>. Cada línea es <b>Debe o Haber, nunca los dos</b>: al escribir uno se limpia el otro. Las cuentas de gasto (<b>6-</b>) marcan la línea como gasto y solo aceptan un <b>centro de costo con presupuesto para esa cuenta</b>; los demás aparecen deshabilitados con el motivo. Debe, Haber y Diferencia se actualizan al escribir, y <b>Guardar queda deshabilitado hasta que la partida cuadre</b>. Los errores aparecen junto a cada campo. Todos los datos son generados."
    }
  });

  $(function () {
    const t = UI.t, M = UI.fmtMoney, mi = UI.mi, D = UI.DATA;
    const ACC = [
      ["1-01-01-001", "Cash on hand", "Caja general"], ["1-01-02-001", "Bank – First Harbor", "Banco First Harbor"], ["1-01-02-002", "Bank – Metro Savings", "Banco Metro Savings"],
      ["1-01-03-001", "Accounts receivable", "Clientes"], ["1-01-04-001", "Merchandise inventory", "Inventario de mercadería"], ["1-02-01-001", "Accumulated depreciation", "Depreciación acumulada"],
      ["2-01-01-001", "Accounts payable", "Proveedores"], ["2-01-02-001", "Sales tax payable", "Impuesto sobre ventas por pagar"], ["2-01-03-001", "Salaries payable", "Sueldos por pagar"],
      ["2-01-04-001", "Accrued expenses", "Gastos acumulados por pagar"], ["2-01-05-001", "Provisions", "Provisiones"], ["3-01-01-001", "Share capital", "Capital social"],
      ["4-01-01-001", "Sales", "Ventas"], ["5-01-01-001", "Cost of sales", "Costo de ventas"],
      ["6-01-01-001", "Salaries", "Sueldos y salarios"], ["6-01-02-001", "Fuel", "Combustible"], ["6-01-03-001", "Vehicle maintenance", "Mantenimiento de vehículos"],
      ["6-01-04-001", "Office supplies", "Papelería y útiles"], ["6-01-05-001", "Electricity", "Energía eléctrica"], ["6-01-06-001", "Depreciation expense", "Gasto por depreciación"], ["6-01-07-001", "Bank fees", "Comisiones bancarias"]
    ];
    const accName = code => { const a = ACC.find(x => x[0] === code); return a ? (UI.lang === "es" ? a[2] : a[1]) : ""; };
    const CC = D.costCenters;
    // Which cost centers have budget for each expense account
    const BUDGET = { "6-01-01-001": [0, 1, 2, 3, 4, 5, 6], "6-01-02-001": [0, 1, 2, 4], "6-01-03-001": [0, 1, 2, 4], "6-01-04-001": [5, 6], "6-01-05-001": [3, 5], "6-01-06-001": [3, 4, 5], "6-01-07-001": [5] };
    const TYPES = ["t_adj", "t_prov", "t_dep", "t_rec", "t_acc"];
    const BR = D.branches;

    // ---------- Sample list ----------
    const r = UI.rng(4180);
    const entries = [];
    const users = ["mlopez", "jreyes", "acastro"];
    for (let i = 0; i < 14; i++) {
      const tp = TYPES[i % TYPES.length];
      const amt = Math.round(UI.between(r, 1500, 48000) * 100) / 100;
      const pairs = { t_adj: ["6-01-04-001", "2-01-04-001"], t_prov: ["6-01-01-001", "2-01-05-001"], t_dep: ["6-01-06-001", "1-02-01-001"], t_rec: ["6-01-02-001", "6-01-03-001"], t_acc: ["6-01-05-001", "2-01-04-001"] }[tp];
      const cc = BUDGET[pairs[0]][Math.floor(r() * BUDGET[pairs[0]].length)];
      const lines = [{ acc: pairs[0], d: amt, c: 0, cc }, { acc: pairs[1], d: 0, c: amt, cc: pairs[1].startsWith("6") ? BUDGET[pairs[1]][0] : null }];
      if (i === 4 || i === 11) lines[1].c = Math.round(amt * .97 * 100) / 100; // two unbalanced samples
      entries.push({ no: 4180 - i, date: new Date(Date.UTC(2026, 10, 16 - i)), type: tp, branch: BR[i % BR.length], syn: { en: "Month adjustment " + (i + 1), es: "Ajuste del mes " + (i + 1) }, lines, by: users[i % 3] });
    }
    let nextNo = 4181;

    // ---------- Filters ----------
    const fFrom = document.getElementById("fFrom"), fTo = document.getElementById("fTo");
    fFrom.value = "2026-11-01"; fTo.value = "2026-11-16";
    function fillTypes() {
      const v = $("#fType").val();
      $("#fType").empty().append(new Option(t("all"), "")); TYPES.forEach(k => $("#fType").append(new Option(t(k), k)));
      $("#fType").val(v || "").select2({ width: "100%", minimumResultsForSearch: Infinity });
    }
    fillTypes();
    const sum = (ls, k) => ls.reduce((a, l) => a + l[k], 0);
    const isBal = e => Math.abs(sum(e.lines, "d") - sum(e.lines, "c")) < .005;
    const chipBal = ok => ok ? '<span class="chip chip-pos">' + mi("check_circle") + t("balanced") + "</span>" : '<span class="chip chip-neg">' + mi("error") + t("unbalanced") + "</span>";

    function renderList() {
      const from = fFrom.value, to = fTo.value, tp = $("#fType").val();
      const rows = entries.filter(e => (!from || UI.fmtDate(e.date) >= from) && (!to || UI.fmtDate(e.date) <= to) && (!tp || e.type === tp));
      document.querySelector("#tList thead").innerHTML = "<tr><th>" + t("colNo") + "</th><th>" + t("colDate") + "</th><th>" + t("colType") + "</th><th>" + t("synopsis") + "</th><th>" + t("colBranch") + '</th><th class="r">' + t("debit") + '</th><th class="r">' + t("credit") + "</th><th>" + t("colStatus") + "</th><th>" + t("colBy") + "</th><th>" + t("actions") + "</th></tr>";
      document.querySelector("#tList tbody").innerHTML = rows.map(e => "<tr><td>P-" + e.no + "</td><td>" + UI.fmtDay(e.date) + "</td><td>" + t(e.type) + "</td><td>" + UI.L(e.syn) + "</td><td>" + e.branch + '</td><td class="r">' + M(sum(e.lines, "d")) + '</td><td class="r">' + M(sum(e.lines, "c")) +
        "</td><td>" + chipBal(isBal(e)) + "</td><td>" + e.by + '</td><td><button type="button" class="btn btn-sm" data-view="' + e.no + '">' + mi("visibility") + t("view") + "</button></td></tr>").join("");
      const td = rows.reduce((a, e) => a + sum(e.lines, "d"), 0), tc = rows.reduce((a, e) => a + sum(e.lines, "c"), 0);
      document.querySelector("#tList tfoot").innerHTML = '<tr><td colspan="5">' + t("total") + '</td><td class="r">' + M(td) + '</td><td class="r">' + M(tc) + '</td><td colspan="3"></td></tr>';
      const unb = rows.filter(e => !isBal(e)).length;
      document.getElementById("kpis").innerHTML =
        '<div class="mc-kpi"><div class="k-label">' + t("kEntries") + '</div><div class="k-value">' + rows.length + "</div></div>" +
        '<div class="mc-kpi"><div class="k-label">' + t("kDebit") + '</div><div class="k-value num">' + M(td) + "</div></div>" +
        '<div class="mc-kpi"><div class="k-label">' + t("kCredit") + '</div><div class="k-value num">' + M(tc) + "</div></div>" +
        '<div class="mc-kpi is-accent" style="--k-color:' + (unb ? "var(--danger-solid)" : "var(--success-solid)") + '"><div class="k-label">' + t("kUnbal") + '</div><div class="k-value ' + (unb ? "neg" : "pos") + '">' + unb + "</div></div>";
    }
    document.getElementById("filters").addEventListener("submit", e => { e.preventDefault(); renderList(); });

    // ---------- View ----------
    let viewing = null;
    function renderView() {
      const e = entries.find(x => x.no === viewing); if (!e) return;
      document.getElementById("viewTitle").textContent = t("entryN", { n: "P-" + e.no });
      document.getElementById("viewChip").innerHTML = chipBal(isBal(e));
      const dd = sum(e.lines, "d"), cc = sum(e.lines, "c");
      document.getElementById("viewBody").innerHTML =
        '<div class="mc-filters" style="margin-bottom:12px"><div class="mc-field"><label>' + t("colDate") + '</label><div class="static">' + UI.fmtDay(e.date) + '</div></div><div class="mc-field"><label>' + t("colType") + '</label><div class="static">' + t(e.type) + '</div></div><div class="mc-field"><label>' + t("colBranch") + '</label><div class="static">' + e.branch + '</div></div><div class="mc-field w-lg"><label>' + t("synopsis") + '</label><div class="static">' + UI.L(e.syn) + "</div></div></div>" +
        '<div class="table-wrap"><table class="grid ro"><thead><tr><th>' + t("colCode") + "</th><th>" + t("colSyn") + "</th><th>" + t("costCenter") + '</th><th class="r">' + t("debit") + '</th><th class="r">' + t("credit") + "</th></tr></thead><tbody>" +
        e.lines.map(l => "<tr><td>" + l.acc + "</td><td>" + accName(l.acc) + "</td><td>" + (l.cc != null ? UI.L(CC[l.cc]) : "—") + '</td><td class="r">' + (l.d ? M(l.d) : "") + '</td><td class="r">' + (l.c ? M(l.c) : "") + "</td></tr>").join("") +
        '</tbody><tfoot><tr><td colspan="3">' + t("total") + " · " + t("difference") + ": " + M(dd - cc) + '</td><td class="r">' + M(dd) + '</td><td class="r">' + M(cc) + "</td></tr></tfoot></table></div>";
    }
    document.getElementById("tList").addEventListener("click", ev => { const b = ev.target.closest("[data-view]"); if (!b) return; viewing = Number(b.dataset.view); renderView(); UI.openModal("mView"); });
    document.getElementById("btnCloseView").addEventListener("click", () => UI.closeModal("mView"));

    // ---------- New entry ----------
    let lines = [], touched = false, lineSeq = 0;
    const eRate = document.getElementById("eRate");
    UI.maskMoney(eRate);
    function fillHeaderSelects() {
      const b = $("#eBranch").val(), ty = $("#eType").val();
      $("#eBranch").empty().append(new Option(UI.lang === "es" ? "Seleccione…" : "Choose…", "")); BR.forEach(x => $("#eBranch").append(new Option(x, x)));
      $("#eType").empty().append(new Option(UI.lang === "es" ? "Seleccione…" : "Choose…", "")); TYPES.forEach(k => $("#eType").append(new Option(t(k), k)));
      $("#eBranch").val(b || "").select2({ width: "100%", dropdownParent: $("#mEntry") });
      $("#eType").val(ty || "").select2({ width: "100%", dropdownParent: $("#mEntry"), minimumResultsForSearch: Infinity });
    }
    function newLine() { return { id: ++lineSeq, acc: "", syn: "", d: "", c: "", cc: "", nd: false }; }
    function openNew() {
      lines = [newLine(), newLine()]; touched = false;
      document.getElementById("entryNo").textContent = "P-" + nextNo;
      ["eRef", "eSyn"].forEach(id => document.getElementById(id).value = "");
      document.getElementById("eDate").value = "2026-11-17"; eRate.value = "1.00";
      $("#eBranch").val("").trigger("change.select2"); $("#eType").val("").trigger("change.select2");
      document.querySelectorAll("#mEntry .mc-field-error").forEach(x => x.textContent = "");
      renderLines(); UI.openModal("mEntry");
    }
    function centerOptions(l) {
      if (!l.acc.startsWith("6")) return '<option value="">' + t("noCenterNeeded") + "</option>";
      const ok = BUDGET[l.acc] || [];
      return '<option value="">' + t("pickCenter") + "</option>" + CC.map((c, i) => '<option value="' + i + '"' + (ok.includes(i) ? "" : " disabled") + (String(l.cc) === String(i) ? " selected" : "") + ">" + UI.L(c) + (ok.includes(i) ? "" : " (" + t("noBudget") + ")") + "</option>").join("");
    }
    function renderLines() {
      const tb = document.querySelector("#tLines tbody");
      $(tb).find("select.acc").each(function () { if ($(this).data("select2")) $(this).select2("destroy"); });
      tb.innerHTML = lines.map(l => {
        const exp = l.acc.startsWith("6");
        return '<tr data-id="' + l.id + '">' +
          '<td><select class="acc" aria-label="' + t("colCode") + '"><option value="">' + t("pickAccount") + "</option>" + ACC.map(a => '<option value="' + a[0] + '"' + (a[0] === l.acc ? " selected" : "") + ">" + a[0] + " · " + (UI.lang === "es" ? a[2] : a[1]) + "</option>").join("") + '</select><div class="line-err" data-err="acc"></div></td>' +
          '<td><input type="text" class="syn" maxlength="120" aria-label="' + t("colSyn") + '" value="' + l.syn.replace(/"/g, "&quot;") + '"></td>' +
          '<td><input type="text" class="num d" inputmode="decimal" aria-label="' + t("debit") + '" value="' + l.d + '"><div class="line-err" data-err="amt"></div></td>' +
          '<td><input type="text" class="num c" inputmode="decimal" aria-label="' + t("credit") + '" value="' + l.c + '"></td>' +
          '<td class="c"><input type="checkbox" disabled aria-label="' + t("colExpense") + '"' + (exp ? " checked" : "") + "></td>" +
          '<td class="c"><input type="checkbox" class="nd" aria-label="' + t("colNonDed") + '"' + (l.nd ? " checked" : "") + (exp ? "" : " disabled") + "></td>" +
          '<td><select class="cc" aria-label="' + t("costCenter") + '"' + (exp ? "" : " disabled") + ">" + centerOptions(l) + '</select><div class="line-err" data-err="cc"></div></td>' +
          '<td><button type="button" class="btn btn-sm icon-btn del" aria-label="' + t("deleteLine") + '" title="' + t("deleteLine") + '">' + mi("delete") + "</button></td></tr>";
      }).join("");
      $(tb).find("select.acc").select2({ width: "100%", dropdownParent: $("#mEntry") }).on("change", function () {
        const l = lines.find(x => x.id === Number($(this).closest("tr").data("id")));
        l.acc = this.value; if (!l.acc.startsWith("6")) { l.cc = ""; l.nd = false; } else if (!(BUDGET[l.acc] || []).includes(Number(l.cc))) l.cc = "";
        renderLines();
      });
      tb.querySelectorAll("input.d, input.c").forEach(UI.maskMoney);
      validate();
    }
    const tbody = document.querySelector("#tLines tbody");
    tbody.addEventListener("input", ev => {
      const tr = ev.target.closest("tr"); if (!tr) return;
      const l = lines.find(x => x.id === Number(tr.dataset.id));
      if (ev.target.classList.contains("syn")) l.syn = ev.target.value;
      if (ev.target.classList.contains("d")) { l.d = ev.target.value; if (l.d !== "") { l.c = ""; tr.querySelector("input.c").value = ""; } }
      if (ev.target.classList.contains("c")) { l.c = ev.target.value; if (l.c !== "") { l.d = ""; tr.querySelector("input.d").value = ""; } }
      validate();
    });
    tbody.addEventListener("change", ev => {
      const tr = ev.target.closest("tr"); if (!tr) return;
      const l = lines.find(x => x.id === Number(tr.dataset.id));
      if (ev.target.classList.contains("cc")) { l.cc = ev.target.value; validate(); }
      if (ev.target.classList.contains("nd")) l.nd = ev.target.checked;
      if (ev.target.classList.contains("d")) l.d = ev.target.value;
      if (ev.target.classList.contains("c")) l.c = ev.target.value;
    });
    tbody.addEventListener("focusout", () => { touched = true; validate(); });
    tbody.addEventListener("click", ev => { const b = ev.target.closest(".del"); if (!b) return; const id = Number(b.closest("tr").dataset.id); lines = lines.filter(x => x.id !== id); if (!lines.length) lines.push(newLine()); renderLines(); });
    document.getElementById("btnAddLine").addEventListener("click", () => { lines.push(newLine()); renderLines(); });

    function validate() {
      let ok = true;
      const show = touched;
      const setErr = (id, msg) => { const el = document.getElementById(id); if (el) el.textContent = show ? msg : ""; if (msg) ok = false; };
      setErr("errBranch", $("#eBranch").val() ? "" : t("eBranch"));
      setErr("errDate", document.getElementById("eDate").value ? "" : t("eDate"));
      setErr("errRate", UI.parseMoney(eRate.value) > 0 ? "" : t("eRate"));
      setErr("errType", $("#eType").val() ? "" : t("eType"));
      const syn = document.getElementById("eSyn"); setErr("errSyn", syn.value.trim().length >= 10 ? "" : t("eSyn"));
      syn.setAttribute("aria-invalid", show && syn.value.trim().length < 10 ? "true" : "false");
      let td = 0, tc = 0;
      tbody.querySelectorAll("tr").forEach(tr => {
        const l = lines.find(x => x.id === Number(tr.dataset.id));
        const d = UI.parseMoney(l.d), c = UI.parseMoney(l.c);
        td += d; tc += c;
        const eAcc = l.acc ? "" : t("eLineAcc"), eAmt = d > 0 || c > 0 ? "" : t("eLineAmt"), eCc = l.acc.startsWith("6") && l.cc === "" ? t("eLineCc") : "";
        if (eAcc || eAmt || eCc) ok = false;
        tr.querySelector('[data-err="acc"]').textContent = show ? eAcc : "";
        tr.querySelector('[data-err="amt"]').textContent = show ? eAmt : "";
        tr.querySelector('[data-err="cc"]').textContent = show ? eCc : "";
        tr.querySelector("select.cc").setAttribute("aria-invalid", show && eCc ? "true" : "false");
      });
      const diff = Math.round((td - tc) * 100) / 100;
      let le = "";
      if (lines.length < 2) le = t("eLines"); else if (Math.abs(diff) >= .005 || td === 0) le = td === 0 ? "" : t("eBalance", { d: M(diff) });
      if (le || Math.abs(diff) >= .005 || td === 0) ok = false;
      document.getElementById("errLines").textContent = le;
      const bal = Math.abs(diff) < .005 && td > 0;
      document.getElementById("totals").innerHTML =
        '<div class="mc-kpi"><div class="k-label">' + t("debit") + '</div><div class="k-value num">' + M(td) + "</div></div>" +
        '<div class="mc-kpi"><div class="k-label">' + t("credit") + '</div><div class="k-value num">' + M(tc) + "</div></div>" +
        '<div class="mc-kpi is-accent" style="--k-color:' + (bal ? "var(--success-solid)" : "var(--danger-solid)") + '"><div class="k-label">' + t("difference") + '</div><div class="k-value num ' + (bal ? "pos" : "neg") + '">' + M(diff) + '</div><div class="k-sub">' + chipBal(bal) + "</div></div>";
      const expLines = lines.filter(l => l.acc.startsWith("6"));
      document.getElementById("budgetHint").innerHTML = mi("info") + " " + t("budgetIntro") + (expLines.length ? " " + expLines.map(l => t("budgetedFor", { a: l.acc, c: (BUDGET[l.acc] || []).map(i => UI.L(CC[i])).join(", ") })).join(" ") : "");
      document.getElementById("btnSave").disabled = !ok;
      return ok;
    }
    ["eRef", "eSyn", "eDate", "eRate"].forEach(id => document.getElementById(id).addEventListener("input", validate));
    ["eSyn", "eDate", "eRate"].forEach(id => document.getElementById(id).addEventListener("blur", () => { touched = true; validate(); }));
    $("#eBranch, #eType").on("change", validate);

    document.getElementById("btnNew").addEventListener("click", openNew);
    document.getElementById("btnCloseEntry").addEventListener("click", () => UI.closeModal("mEntry"));
    document.getElementById("btnSave").addEventListener("click", () => {
      touched = true; if (!validate()) return;
      const e = { no: nextNo++, date: new Date(document.getElementById("eDate").value + "T00:00:00Z"), type: $("#eType").val(), branch: $("#eBranch").val(),
        syn: { en: document.getElementById("eSyn").value.trim(), es: document.getElementById("eSyn").value.trim() },
        lines: lines.map(l => ({ acc: l.acc, d: UI.parseMoney(l.d), c: UI.parseMoney(l.c), cc: l.cc === "" ? null : Number(l.cc) })), by: "demo" };
      entries.unshift(e);
      if (UI.fmtDate(e.date) > fTo.value) fTo.value = UI.fmtDate(e.date);
      UI.closeModal("mEntry"); renderList(); UI.toast(t("savedEntry", { n: "P-" + e.no }));
    });

    function renderAbout() { document.getElementById("about").innerHTML = UI.aboutBox("aboutText"); }
    document.addEventListener("langchange", () => { fillTypes(); fillHeaderSelects(); renderList(); if (document.getElementById("mEntry").classList.contains("open")) renderLines(); if (viewing) renderView(); renderAbout(); });
    fillHeaderSelects(); renderList(); renderAbout();
  });
  </script>
</body>
</html>
