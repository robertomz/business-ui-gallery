<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Employee file · Business UI Gallery</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,300..500,0..1,0&display=block" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/select2/4.0.13/css/select2.min.css">
  <link rel="stylesheet" href="../assets/css/base.css">
  <style>
    tr.drill { cursor: pointer; } tr.drill.is-sel td { background: var(--bg-selected); }
    .prof-head { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
    .avatar { width: 64px; height: 64px; border-radius: 50%; display: grid; place-items: center; font-family: var(--font-display); font-size: 22px; font-weight: 600; color: var(--brand-text); background: var(--brand-soft); flex: none; }
    .prof-head h3 { font-size: 18px; font-weight: 600; }
    .prof-head .meta { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px; }
    .facts { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 8px; }
    #tEmp td { white-space: nowrap; }
    .fact { background: var(--surface-alt); border-radius: var(--r-sm); padding: 10px 12px; min-width: 0; }
    .fact b { display: block; margin-top: 4px; font-size: 13px; font-weight: 600; color: var(--text-heading); overflow-wrap: anywhere; }
    .timeline { list-style: none; margin: 0; padding: 0 0 0 14px; border-left: 2px solid var(--border); display: flex; flex-direction: column; gap: 10px; }
    .timeline li { position: relative; font-size: 13px; }
    .timeline li::before { content: ""; position: absolute; left: -20px; top: 4px; width: 10px; height: 10px; border-radius: 50%; background: var(--brand); border: 2px solid var(--surface); }
    .timeline li small { color: var(--text-secondary); display: block; font-size: 12px; }
  </style>
</head>
<body data-page="employee-file" data-root="../">
  <main id="content">
    <section class="mc-panel">
      <div class="mc-filters">
        <div class="mc-field w-lg"><label for="fSearch" data-i18n="search"></label><input id="fSearch" data-i18n-ph="searchPh"></div>
        <div class="mc-field"><label for="fDept" data-i18n="department"></label><select id="fDept"></select></div>
        <div class="mc-field"><label for="fPos" data-i18n="position"></label><select id="fPos"></select></div>
      </div>
    </section>

    <div class="split">
      <section class="mc-panel">
        <div class="mc-panel-title"><h3><span class="material-icons" aria-hidden="true">groups</span><span data-i18n="employees"></span></h3><span class="mc-hint" id="count"></span></div>
        <div class="table-wrap" style="max-height:620px"><table class="grid" id="tEmp"><thead></thead><tbody></tbody></table></div>
      </section>
      <section class="mc-panel" id="profile">
        <div class="prof-head">
          <div class="avatar" id="pAv" aria-hidden="true"></div>
          <div style="flex:1;min-width:0"><h3 id="pName"></h3><div class="meta" id="pMeta"></div></div>
          <button class="btn btn-teal" type="button" id="btnEdit"><span class="material-icons" aria-hidden="true">edit</span><span data-i18n="edit"></span></button>
        </div>
        <div class="mc-tabs" role="tablist" id="tabs"></div>
        <div id="panel" style="margin-top:12px"></div>
      </section>
    </div>

    <div id="about"></div>
  </main>

  <div class="modal-backdrop" id="mEdit">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="mEditT">
      <div class="modal-head"><h3 id="mEditT"><span class="material-icons" aria-hidden="true">badge</span><span data-i18n="editTitle"></span></h3></div>
      <div class="modal-body">
        <div class="grid-2">
          <div class="mc-field"><label for="eEmail" data-i18n="email"></label><input id="eEmail" type="email"><span class="mc-field-error" id="eEmailErr"></span></div>
          <div class="mc-field"><label for="ePhone" data-i18n="phone"></label><input id="ePhone" inputmode="numeric" placeholder="0000-0000"><span class="mc-field-error" id="ePhoneErr"></span></div>
          <div class="mc-field"><label for="eDept" data-i18n="department"></label><select id="eDept"></select></div>
          <div class="mc-field"><label for="ePos" data-i18n="position"></label><select id="ePos"></select><span class="mc-field-error" id="ePosErr"></span></div>
          <div class="mc-field" id="newPosWrap" hidden><label for="eNewPos" data-i18n="newPosName"></label><input id="eNewPos"></div>
          <div class="mc-field"><label for="eSalary" data-i18n="salary"></label><input class="num" id="eSalary" inputmode="decimal"><span class="mc-field-error" id="eSalErr"></span></div>
        </div>
      </div>
      <div class="modal-foot"><button class="btn btn-teal" type="button" id="eSave"><span class="material-icons" aria-hidden="true">save</span><span data-i18n="save"></span></button><button class="btn" type="button" id="eClose" data-i18n="close"></button></div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/select2/4.0.13/js/select2.min.js"></script>
  <script src="../assets/js/common.js"></script>
  <script>
  UI.strings({
    en: {
      searchPh: "Name, ID or code…", department: "Department", position: "Position", allDepts: "All departments", allPos: "All positions", employees: "Employees", countTxt: "{n} employees",
      edit: "Edit", editTitle: "Edit employee", colCode: "Code", colName: "Full name", colDept: "Department", colPos: "Position", colStatus: "Status", active: "Active", onLeave: "On vacation",
      tGeneral: "General", tContract: "Contract", tPosition: "Position", tVac: "Vacations", tDocs: "Documents", tHist: "History",
      dni: "ID number", birth: "Birth date", email: "Email", phone: "Phone", address: "Address", emergency: "Emergency contact", hire: "Hire date", center: "Cost center", bank: "Bank and account",
      cType: "Contract type", cPerm: "Permanent", cTemp: "Fixed term", cStart: "Start", cEnd: "End", salary: "Monthly salary", accAccount: "Salary account", extensions: "Extensions", extDays: "{n} days left", colFrom: "From", colTo: "To", colNote: "Note",
      boss: "Reports to", since: "In position since", vacBal: "Vacation balance", vacEarned: "Days earned", vacTaken: "Days taken", days: "{n} days", vacReq: "Requests",
      docName: "Document", docExp: "Expires", docOk: "Valid", docSoon: "Expires in {n} days", docOver: "Expired", dId: "ID card", dLicense: "Driver license", dHealth: "Health certificate", dContract: "Signed contract", dPolice: "Police record",
      hDate: "Date", hUser: "User", hChange: "Change", newPos: "+ Create new position…", newPosName: "New position name",
      errEmail: "Enter a valid email.", errPhone: "Use the format 0000-0000.", errPos: "Write the new position name.", errSal: "Enter a salary greater than zero.", saved: "Employee {n} updated.",
      hHire: "Employee hired", hContract: "Contract extended", hSalary: "Salary changed {a} → {b}", hPosition: "Position changed to {p}", hData: "Contact data updated", vApproved: "Approved", vPending: "Pending",
      aboutText: "Mirrors the employee file of the HR module: one record with <b>general data</b>, <b>contract</b> and its <b>extensions</b> (days left), <b>position</b> with department → position cascading selects (a new position can be created from the same list), <b>vacation</b> balance and requests, <b>documents</b> with expiry warnings and a <b>history</b> of every change. Editing validates next to each field (email, phone 0000-0000, salary mask) and every saved change is added to the history. All data is generated."
    },
    es: {
      searchPh: "Nombre, DNI o código…", department: "Departamento", position: "Puesto", allDepts: "Todos los departamentos", allPos: "Todos los puestos", employees: "Empleados", countTxt: "{n} empleados",
      edit: "Editar", editTitle: "Editar empleado", colCode: "Código", colName: "Nombre completo", colDept: "Departamento", colPos: "Puesto", colStatus: "Estado", active: "Activo", onLeave: "De vacaciones",
      tGeneral: "General", tContract: "Contrato", tPosition: "Puesto", tVac: "Vacaciones", tDocs: "Documentos", tHist: "Historial",
      dni: "DNI", birth: "Fecha de nacimiento", email: "Correo", phone: "Teléfono", address: "Dirección", emergency: "Contacto de emergencia", hire: "Fecha de ingreso", center: "Centro de costo", bank: "Banco y cuenta",
      cType: "Tipo de contrato", cPerm: "Permanente", cTemp: "Por tiempo definido", cStart: "Inicio", cEnd: "Fin", salary: "Salario mensual", accAccount: "Cuenta contable de salario", extensions: "Prórrogas", extDays: "Quedan {n} días", colFrom: "Desde", colTo: "Hasta", colNote: "Nota",
      boss: "Jefe inmediato", since: "En el puesto desde", vacBal: "Saldo de vacaciones", vacEarned: "Días ganados", vacTaken: "Días gozados", days: "{n} días", vacReq: "Solicitudes",
      docName: "Documento", docExp: "Vence", docOk: "Vigente", docSoon: "Vence en {n} días", docOver: "Vencido", dId: "Identidad", dLicense: "Licencia de conducir", dHealth: "Certificado de salud", dContract: "Contrato firmado", dPolice: "Antecedentes penales",
      hDate: "Fecha", hUser: "Usuario", hChange: "Cambio", newPos: "+ Crear nuevo puesto…", newPosName: "Nombre del puesto nuevo",
      errEmail: "Escriba un correo válido.", errPhone: "Use el formato 0000-0000.", errPos: "Escriba el nombre del puesto nuevo.", errSal: "Escriba un salario mayor que cero.", saved: "Empleado {n} actualizado.",
      hHire: "Ingreso del empleado", hContract: "Prórroga de contrato", hSalary: "Cambio de salario {a} → {b}", hPosition: "Cambio de puesto a {p}", hData: "Actualización de datos de contacto", vApproved: "Aprobada", vPending: "Pendiente",
      aboutText: "Replica el expediente del empleado del módulo de Talento Humano: un solo registro con <b>datos generales</b>, <b>contrato</b> y sus <b>prórrogas</b> (días restantes), <b>puesto</b> con selección en cascada departamento → puesto (se puede crear un puesto nuevo desde la misma lista), saldo y solicitudes de <b>vacaciones</b>, <b>documentos</b> con aviso de vencimiento y un <b>historial</b> de cada cambio. Al editar se valida junto a cada campo (correo, teléfono 0000-0000, máscara de salario) y cada cambio guardado queda en el historial. Todos los datos son generados."
    }
  });

  $(function () {
    const D = UI.DATA, t = UI.t, M = UI.fmtMoney, mi = UI.mi;
    const TODAY = new Date(Date.UTC(2026, 10, 16));
    const DEPTS = { sales: { en: "Sales", es: "Ventas", pos: [{ en: "Seller", es: "Vendedor" }, { en: "Sales supervisor", es: "Supervisor de ventas" }, { en: "Merchandiser", es: "Mercaderista" }] },
      ops: { en: "Operations", es: "Operaciones", pos: [{ en: "Driver", es: "Motorista" }, { en: "Warehouse assistant", es: "Auxiliar de bodega" }, { en: "Dispatcher", es: "Despachador" }] },
      fin: { en: "Finance", es: "Finanzas", pos: [{ en: "Accountant", es: "Contador" }, { en: "Cashier", es: "Cajero" }, { en: "Credit analyst", es: "Analista de créditos" }] },
      it: { en: "IT", es: "TI", pos: [{ en: "Developer", es: "Desarrollador" }, { en: "Support technician", es: "Técnico de soporte" }] } };
    const DK = Object.keys(DEPTS);
    const r0 = UI.rng(3131);
    const EMP = Array.from({ length: 60 }, (_, i) => {
      const dk = DK[i % DK.length], p = Math.floor(r0() * DEPTS[dk].pos.length);
      const fn = D.firstNames[i % 20], l1 = D.lastNames[(i * 7) % 15]; let l2 = D.lastNames[(i * 3 + 4) % 15]; if (l2 === l1) l2 = D.lastNames[(i * 3 + 5) % 15];
      const hire = new Date(Date.UTC(2018 + Math.floor(r0() * 8), Math.floor(r0() * 12), 1 + Math.floor(r0() * 27)));
      const temp = r0() < .3;
      return { code: "E-" + String(1001 + i), name: fn + " " + l1 + " " + l2, dk, p, dni: "0801-19" + (80 + i % 20) + "-" + (10000 + i * 41), birth: new Date(Date.UTC(1980 + Math.floor(r0() * 22), Math.floor(r0() * 12), 1 + Math.floor(r0() * 27))),
        email: (fn + "." + l1).toLowerCase() + "@demo.example", phone: (3 + Math.floor(r0() * 6)) + String(Math.floor(r0() * 1000)).padStart(3, "0") + "-" + String(Math.floor(r0() * 10000)).padStart(4, "0"),
        hire, temp, end: temp ? new Date(TODAY.getTime() + (10 + Math.floor(r0() * 120)) * 86400000) : null, salary: Math.round(UI.between(r0, 11000, 38000) / 50) * 50,
        center: i % 7, bank: UI.pick(r0, D.banks), acc: String(Math.floor(UI.between(r0, 1e9, 9.9e9))), leave: r0() < .08,
        vacTaken: Math.floor(r0() * 12), hist: [] };
    });
    EMP.forEach(e => { e.hist.push({ d: e.hire, u: "HR", k: "hHire" }); if (e.temp) e.hist.push({ d: new Date(e.end.getTime() - 180 * 86400000), u: "HR", k: "hContract" }); });
    let sel = 0, tab = "general";
    const posName = e => UI.L(DEPTS[e.dk].pos[e.p]);

    function fillFilters() {
      const d = $("#fDept").val() || "all", p = $("#fPos").val() || "all";
      $("#fDept").empty().append(new Option(t("allDepts"), "all")); DK.forEach(k => $("#fDept").append(new Option(UI.L(DEPTS[k]), k))); $("#fDept").val(d).select2({ width: "100%", minimumResultsForSearch: Infinity });
      fillPos(p);
    }
    function fillPos(p) {
      const d = $("#fDept").val();
      $("#fPos").empty().append(new Option(t("allPos"), "all"));
      (d === "all" ? DK : [d]).forEach(k => DEPTS[k].pos.forEach((x, i) => $("#fPos").append(new Option(UI.L(x), k + ":" + i))));
      $("#fPos").val($("#fPos option[value='" + p + "']").length ? p : "all").select2({ width: "100%" });
    }
    function renderList() {
      const q = document.getElementById("fSearch").value.trim().toLowerCase(), d = $("#fDept").val(), p = $("#fPos").val();
      const list = EMP.filter(e => (d === "all" || e.dk === d) && (p === "all" || p === e.dk + ":" + e.p) && (!q || (e.name + " " + e.dni + " " + e.code).toLowerCase().includes(q)));
      document.getElementById("count").textContent = t("countTxt", { n: list.length });
      document.querySelector("#tEmp thead").innerHTML = "<tr><th>" + t("colCode") + "</th><th>" + t("colName") + "</th><th>" + t("colDept") + "</th><th>" + t("colPos") + "</th><th>" + t("colStatus") + "</th></tr>";
      document.querySelector("#tEmp tbody").innerHTML = list.map(e => '<tr class="drill' + (EMP.indexOf(e) === sel ? " is-sel" : "") + '" tabindex="0" data-i="' + EMP.indexOf(e) + '"><td>' + e.code + "</td><td>" + e.name + "</td><td>" + UI.L(DEPTS[e.dk]) + "</td><td>" + posName(e) + "</td><td>" + (e.leave ? '<span class="chip chip-info">' + mi("beach_access") + t("onLeave") + "</span>" : '<span class="chip chip-pos">' + mi("check_circle") + t("active") + "</span>") + "</td></tr>").join("");
    }
    const fact = (k, v) => '<div class="fact"><span class="mc-label">' + t(k) + "</span><b>" + v + "</b></div>";
    function renderProfile() {
      const e = EMP[sel];
      document.getElementById("pAv").textContent = e.name.split(" ").slice(0, 2).map(s => s[0]).join("");
      document.getElementById("pName").textContent = e.name;
      document.getElementById("pMeta").innerHTML = '<span class="chip chip-info">' + mi("badge") + e.code + '</span><span class="chip">' + mi("work") + posName(e) + "</span>" + (e.leave ? '<span class="chip chip-info">' + mi("beach_access") + t("onLeave") + "</span>" : '<span class="chip chip-pos">' + mi("check_circle") + t("active") + "</span>");
      const tabs = [["general", "tGeneral"], ["contract", "tContract"], ["position", "tPosition"], ["vac", "tVac"], ["docs", "tDocs"], ["hist", "tHist"]];
      document.getElementById("tabs").innerHTML = tabs.map(x => '<button type="button" role="tab" class="mc-tab" aria-selected="' + (tab === x[0]) + '" tabindex="' + (tab === x[0] ? 0 : -1) + '" data-tab="' + x[0] + '">' + t(x[1]) + "</button>").join("");
      const P = document.getElementById("panel");
      if (tab === "general") P.innerHTML = '<div class="facts">' + fact("dni", e.dni) + fact("birth", UI.fmtDay(e.birth)) + fact("email", e.email) + fact("phone", e.phone) + fact("hire", UI.fmtDay(e.hire)) + fact("center", UI.L(D.costCenters[e.center])) + fact("bank", e.bank + " · ****" + e.acc.slice(-4)) + fact("emergency", D.firstNames[(sel + 3) % 20] + " · 9" + String(100 + sel).slice(-3) + "-4410") + fact("address", (12 + sel) + " Riverside Ave.") + "</div>";
      if (tab === "contract") {
        const left = e.end ? Math.round((e.end - TODAY) / 86400000) : null;
        P.innerHTML = '<div class="facts">' + fact("cType", e.temp ? t("cTemp") : t("cPerm")) + fact("cStart", UI.fmtDay(e.hire)) + fact("cEnd", e.end ? UI.fmtDay(e.end) + " " + (left <= 30 ? '<span class="chip chip-warn">' + mi("schedule") + t("extDays", { n: left }) + "</span>" : '<span class="chip">' + t("extDays", { n: left }) + "</span>") : "—") + fact("salary", M(e.salary)) + fact("accAccount", "6-01-01-001") + "</div>" +
          (e.temp ? '<div class="mc-label" style="margin:12px 0 6px">' + t("extensions") + '</div><div class="table-wrap"><table class="grid"><thead><tr><th>#</th><th>' + t("colFrom") + "</th><th>" + t("colTo") + "</th><th>" + t("colNote") + "</th></tr></thead><tbody><tr><td>1</td><td>" + UI.fmtDay(e.hire) + "</td><td>" + UI.fmtDay(new Date(e.end.getTime() - 180 * 86400000)) + "</td><td>" + t("cStart") + "</td></tr><tr><td>2</td><td>" + UI.fmtDay(new Date(e.end.getTime() - 180 * 86400000)) + "</td><td>" + UI.fmtDay(e.end) + "</td><td>" + t("hContract") + "</td></tr></tbody></table></div>" : "");
      }
      if (tab === "position") P.innerHTML = '<div class="facts">' + fact("department", UI.L(DEPTS[e.dk])) + fact("position", posName(e)) + fact("boss", D.firstNames[(sel + 7) % 20] + " " + D.lastNames[(sel + 2) % 15]) + fact("since", UI.fmtDay(e.hire)) + fact("center", UI.L(D.costCenters[e.center])) + fact("salary", M(e.salary)) + "</div>";
      if (tab === "vac") {
        const yrs = Math.max(1, Math.floor((TODAY - e.hire) / (365 * 86400000))), earned = Math.min(20, 10 + yrs * 2), bal = earned - e.vacTaken;
        P.innerHTML = '<div class="facts">' + fact("vacEarned", t("days", { n: earned })) + fact("vacTaken", t("days", { n: e.vacTaken })) + fact("vacBal", '<span class="' + (bal < 3 ? "neg" : "pos") + '">' + t("days", { n: bal }) + "</span>") + '</div><div class="mc-label" style="margin:12px 0 8px">' + t("vacReq") + '</div><ul class="timeline">' +
          [[2026, 9, 2, 3, "vApproved"], [2026, 6, 14, 5, "vApproved"], [2026, 11, 22, 4, "vPending"]].map(v => "<li><b>" + UI.fmtDay(new Date(Date.UTC(v[0], v[1], v[2]))) + "</b> · " + t("days", { n: v[3] }) + " · " + (v[4] === "vApproved" ? '<span class="chip chip-pos">' + mi("check_circle") + t(v[4]) + "</span>" : '<span class="chip chip-warn">' + mi("schedule") + t(v[4]) + "</span>") + "</li>").join("") + "</ul>";
      }
      if (tab === "docs") {
        const r = UI.rng(sel * 17);
        P.innerHTML = '<div class="table-wrap"><table class="grid"><thead><tr><th>' + t("docName") + "</th><th>" + t("docExp") + "</th><th>" + t("colStatus") + "</th></tr></thead><tbody>" +
          ["dId", "dLicense", "dHealth", "dContract", "dPolice"].map(k => { const days = Math.round(UI.between(r, -40, 600)), d = new Date(TODAY.getTime() + days * 86400000);
            const st = days < 0 ? '<span class="chip chip-neg">' + mi("error") + t("docOver") + "</span>" : days <= 30 ? '<span class="chip chip-warn">' + mi("schedule") + t("docSoon", { n: days }) + "</span>" : '<span class="chip chip-pos">' + mi("check_circle") + t("docOk") + "</span>";
            return "<tr><td>" + mi("description") + " " + t(k) + "</td><td>" + UI.fmtDay(d) + "</td><td>" + st + "</td></tr>"; }).join("") + "</tbody></table></div>";
      }
      if (tab === "hist") P.innerHTML = '<div class="table-wrap"><table class="grid"><thead><tr><th>' + t("hDate") + "</th><th>" + t("hUser") + "</th><th>" + t("hChange") + "</th></tr></thead><tbody>" +
        e.hist.slice().sort((a, b) => b.d - a.d).map(h => "<tr><td>" + UI.fmtDay(h.d) + "</td><td>" + h.u + "</td><td>" + t(h.k, h.v) + "</td></tr>").join("") + "</tbody></table></div>";
    }
    // Edit modal with cascading department → position
    function fillEditPos(dk, p) {
      const $p = $("#ePos"); $p.empty(); DEPTS[dk].pos.forEach((x, i) => $p.append(new Option(UI.L(x), String(i)))); $p.append(new Option(t("newPos"), "new")); $p.val(String(p)).select2({ width: "100%", dropdownParent: $("#mEdit") });
      document.getElementById("newPosWrap").hidden = true;
    }
    document.getElementById("btnEdit").addEventListener("click", () => {
      const e = EMP[sel];
      document.getElementById("eEmail").value = e.email; document.getElementById("ePhone").value = e.phone; document.getElementById("eSalary").value = M(e.salary); document.getElementById("eNewPos").value = "";
      ["eEmail", "ePhone", "eSalary", "eNewPos"].forEach(id => document.getElementById(id).removeAttribute("aria-invalid"));
      ["eEmailErr", "ePhoneErr", "eSalErr", "ePosErr"].forEach(id => document.getElementById(id).textContent = "");
      const $d = $("#eDept"); $d.empty(); DK.forEach(k => $d.append(new Option(UI.L(DEPTS[k]), k))); $d.val(e.dk).select2({ width: "100%", minimumResultsForSearch: Infinity, dropdownParent: $("#mEdit") });
      fillEditPos(e.dk, e.p);
      UI.openModal("mEdit");
    });
    $("#eDept").on("change", () => fillEditPos($("#eDept").val(), 0));
    $("#ePos").on("change", () => { document.getElementById("newPosWrap").hidden = $("#ePos").val() !== "new"; });
    UI.maskMoney(document.getElementById("eSalary"));
    document.getElementById("ePhone").addEventListener("input", ev => { let v = ev.target.value.replace(/\D/g, "").slice(0, 8); if (v.length > 4) v = v.slice(0, 4) + "-" + v.slice(4); ev.target.value = v; });
    document.getElementById("eSave").addEventListener("click", () => {
      const e = EMP[sel]; let ok = true;
      const set = (id, eid, msg) => { document.getElementById(eid).textContent = msg; document.getElementById(id).setAttribute("aria-invalid", msg ? "true" : "false"); if (msg && ok) document.getElementById(id).focus(); if (msg) ok = false; };
      const email = document.getElementById("eEmail").value.trim(), phone = document.getElementById("ePhone").value.trim(), sal = UI.parseMoney(document.getElementById("eSalary").value);
      set("eEmail", "eEmailErr", /^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email) ? "" : t("errEmail"));
      set("ePhone", "ePhoneErr", /^\d{4}-\d{4}$/.test(phone) ? "" : t("errPhone"));
      const dk = $("#eDept").val(); let p = $("#ePos").val();
      if (p === "new") { const n = document.getElementById("eNewPos").value.trim(); set("eNewPos", "ePosErr", n ? "" : t("errPos")); if (n && ok) { DEPTS[dk].pos.push({ en: n, es: n }); p = DEPTS[dk].pos.length - 1; } }
      set("eSalary", "eSalErr", sal > 0 ? "" : t("errSal"));
      if (!ok) return;
      if (email !== e.email || phone !== e.phone) e.hist.push({ d: TODAY, u: "R. Demo", k: "hData" });
      if (sal !== e.salary) e.hist.push({ d: TODAY, u: "R. Demo", k: "hSalary", v: { a: M(e.salary), b: M(sal) } });
      if (dk !== e.dk || Number(p) !== e.p) e.hist.push({ d: TODAY, u: "R. Demo", k: "hPosition", v: { p: UI.L(DEPTS[dk].pos[Number(p)]) } });
      Object.assign(e, { email, phone, salary: sal, dk, p: Number(p) });
      UI.closeModal("mEdit"); fillFilters(); renderList(); tab = "hist"; renderProfile(); UI.toast(t("saved", { n: e.name }));
    });
    document.getElementById("eClose").addEventListener("click", () => UI.closeModal("mEdit"));
    document.getElementById("tabs").addEventListener("click", ev => { const b = ev.target.closest("[data-tab]"); if (b) { tab = b.dataset.tab; renderProfile(); } });
    document.getElementById("tabs").addEventListener("keydown", ev => {
      const order = ["general", "contract", "position", "vac", "docs", "hist"]; let i = order.indexOf(tab);
      if (ev.key === "ArrowRight") i = (i + 1) % order.length; else if (ev.key === "ArrowLeft") i = (i + order.length - 1) % order.length; else if (ev.key === "Home") i = 0; else if (ev.key === "End") i = order.length - 1; else return;
      ev.preventDefault(); tab = order[i]; renderProfile(); document.querySelector('#tabs [data-tab="' + tab + '"]').focus();
    });
    const te = document.getElementById("tEmp");
    te.addEventListener("click", ev => { const tr = ev.target.closest("tr.drill"); if (tr) { sel = Number(tr.dataset.i); renderList(); renderProfile(); if (innerWidth < 900) document.getElementById("profile").scrollIntoView({ behavior: "smooth" }); } });
    te.addEventListener("keydown", ev => { const tr = ev.target.closest("tr.drill"); if (tr && (ev.key === "Enter" || ev.key === " ")) { ev.preventDefault(); tr.click(); } });
    document.getElementById("fSearch").addEventListener("input", renderList);
    $("#fDept").on("change", () => { fillPos("all"); renderList(); });
    $("#fPos").on("change", renderList);
    const about = () => document.getElementById("about").innerHTML = UI.aboutBox("aboutText");
    document.addEventListener("langchange", () => { fillFilters(); renderList(); renderProfile(); about(); });
    fillFilters(); renderList(); renderProfile(); about();
  });
  </script>
</body>
</html>
