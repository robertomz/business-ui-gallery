<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Suggested order · Business UI Gallery</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,300..500,0..1,0&display=block" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/select2/4.0.13/css/select2.min.css">
  <link rel="stylesheet" href="../assets/css/base.css">
  <style>
    .scan { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr) minmax(0, 1.4fr) auto; gap: 8px 10px; align-items: end; }
    @media (max-width: 900px) { .scan { grid-template-columns: minmax(0, 1fr); } }
    .scan .mc-field { min-width: 0; }
    .scan-input { position: relative; }
    .scan-input .material-icons { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--icon); pointer-events: none; }
    .scan-input input { padding-left: 40px !important; }
    .results { list-style: none; margin: 6px 0 0; padding: 6px; border: 1px solid var(--border-subtle); border-radius: var(--r-md); background: var(--surface); box-shadow: var(--shadow-card); max-height: 230px; overflow: auto; }
    .results li button { width: 100%; text-align: left; display: flex; justify-content: space-between; gap: 10px; padding: 9px 10px; border: 0; border-radius: 10px; background: transparent; color: var(--text); cursor: pointer; font-size: 13px; }
    .results li button:hover, .results li button:focus-visible { background: var(--bg-hover); }
    .results small { color: var(--text-secondary); }
    .stepper { display: inline-flex; align-items: center; border: 1px solid var(--border); border-radius: 10px; background: var(--bg-input); overflow: hidden; }
    .stepper button { width: 34px; height: 34px; border: 0; background: transparent; color: var(--text-secondary); cursor: pointer; }
    .stepper button:hover { background: var(--bg-hover); color: var(--brand-text); }
    .stepper output { min-width: 44px; text-align: center; font-weight: 600; color: var(--text-heading); font-variant-numeric: tabular-nums; cursor: pointer; }
    .order-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
    .st { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 500; padding: 4px 10px; border-radius: var(--r-pill); border: 0; background: var(--surface-alt); white-space: nowrap; }
    .st .material-icons { font-size: 15px; }
    .st-draft { color: var(--text-secondary); } .st-sent { color: var(--info); background: var(--info-soft); }
    .st-auth { color: var(--success); background: var(--success-soft); } .st-rej { color: var(--danger); background: var(--danger-soft); }
    .st-order { color: var(--brand-text); background: var(--bg-selected); }
    #tList td { white-space: nowrap; }
    .empty { text-align: center; color: var(--text-secondary); padding: 26px 10px; }
  </style>
</head>
<body data-page="suggested-order" data-root="../">
  <main id="content">
    <div class="mc-tabs" role="tablist" id="tabs"></div>

    <!-- Create -->
    <div id="vCreate" style="display:flex;flex-direction:column;gap:12px">
      <section class="mc-panel">
        <div class="mc-filters">
          <div class="mc-field" style="max-width:260px"><label for="fBranch" data-i18n="branch"></label><select id="fBranch"></select></div>
          <div class="mc-field" style="max-width:260px"><label for="fWh" data-i18n="warehouse"></label><select id="fWh"></select></div>
          <span class="mc-hint" id="draftInfo"></span>
        </div>
      </section>
      <section class="mc-panel">
        <div class="mc-panel-title"><h3><span class="material-icons" aria-hidden="true">qr_code_scanner</span><span data-i18n="findItem"></span></h3></div>
        <form class="scan" id="scanForm">
          <div class="mc-field"><label for="sBar" data-i18n="barcode"></label><div class="scan-input"><span class="material-icons" aria-hidden="true">qr_code_scanner</span><input id="sBar" autocomplete="off" data-i18n-ph="barPh"></div></div>
          <div class="mc-field"><label for="sCode" data-i18n="itemCode"></label><input id="sCode" autocomplete="off" data-i18n-ph="codePh"></div>
          <div class="mc-field"><label for="sName" data-i18n="name"></label><input id="sName" autocomplete="off" data-i18n-ph="namePh"></div>
          <button class="btn btn-teal" type="submit"><span class="material-icons" aria-hidden="true">search</span><span data-i18n="searchItem"></span></button>
        </form>
        <div class="mc-field-error" id="scanErr" role="alert" style="margin-top:6px"></div>
        <ul class="results" id="results" hidden></ul>
      </section>
      <section class="mc-panel">
        <div class="order-head mc-panel-title">
          <h3><span class="material-icons" aria-hidden="true">assignment</span><span data-i18n="orderList"></span></h3>
          <div style="display:flex;gap:8px;flex-wrap:wrap">
            <button class="btn" type="button" id="btnEmpty"><span class="material-icons" aria-hidden="true">delete_sweep</span><span data-i18n="emptyList"></span></button>
            <button class="btn btn-cyan" type="button" id="btnDraft"><span class="material-icons" aria-hidden="true">save</span><span data-i18n="saveDraft"></span></button>
            <button class="btn btn-teal" type="button" id="btnSend"><span class="material-icons" aria-hidden="true">send</span><span data-i18n="send"></span></button>
          </div>
        </div>
        <div class="mc-kpis" id="cartKpis" style="margin-bottom:10px"></div>
        <div class="table-wrap"><table class="grid" id="tCart"><thead></thead><tbody></tbody></table></div>
      </section>
    </div>

    <!-- My orders / authorizations -->
    <section class="mc-panel" id="vList" hidden>
      <div class="mc-panel-title"><h3><span class="material-icons" aria-hidden="true">list_alt</span><span id="listTitle"></span></h3>
        <div class="mc-field" style="max-width:220px;flex:0 0 220px"><label for="fState" data-i18n="status"></label><select id="fState"></select></div></div>
      <div class="table-wrap"><table class="grid" id="tList"><thead></thead><tbody></tbody></table></div>
    </section>
    <div id="about"></div>
  </main>

  <div class="modal-backdrop" id="mQty">
    <div class="modal modal-sm" role="dialog" aria-modal="true" aria-labelledby="mQtyT">
      <div class="modal-head"><h3 id="mQtyT"><span class="material-icons" aria-hidden="true">add_shopping_cart</span><span id="qtyTitle"></span></h3></div>
      <div class="modal-body" style="display:flex;flex-direction:column;gap:10px">
        <div class="mc-kpis" id="qtyInfo"></div>
        <div class="mc-field"><label for="qPres" data-i18n="presentation"></label><select id="qPres"></select></div>
        <div class="mc-field"><label for="qQty" data-i18n="qtyIn"></label><input id="qQty" class="num" inputmode="numeric"><span class="mc-field-error" id="qErr"></span></div>
        <p class="mc-hint" id="qUnits"></p>
      </div>
      <div class="modal-foot"><button class="btn btn-teal" type="button" id="qOk"><span class="material-icons" aria-hidden="true">add</span><span data-i18n="add"></span></button><button class="btn" type="button" id="qCancel" data-i18n="cancel"></button></div>
    </div>
  </div>

  <div class="modal-backdrop" id="mDetail">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="mDetailT">
      <div class="modal-head"><h3 id="mDetailT"><span class="material-icons" aria-hidden="true">assignment</span><span id="detTitle"></span></h3><span id="detState"></span></div>
      <div class="modal-body"><div class="mc-kpis" id="detKpis" style="margin-bottom:10px"></div><div class="table-wrap"><table class="grid" id="tDet"><thead></thead><tbody></tbody></table></div>
        <div class="mc-field" id="rejBox" style="margin-top:10px" hidden><label for="rejReason" data-i18n="reason"></label><textarea id="rejReason"></textarea><span class="mc-field-error" id="rejErr"></span></div></div>
      <div class="modal-foot" id="detFoot"></div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/select2/4.0.13/js/select2.min.js"></script>
  <script src="../assets/js/common.js"></script>
  <script>
  UI.strings({
    en: {
      tabCreate: "Create suggested order", tabMine: "My orders", tabAuth: "Authorizations", warehouse: "Warehouse", findItem: "Find item", barcode: "Barcode", itemCode: "Item code", name: "Name",
      barPh: "Scan or type the barcode", codePh: "Type the item code", namePh: "Type the item name", searchItem: "Search item", notFound: "No item matches «{q}».", needBranch: "Branch and warehouse are required.",
      orderList: "Order list", emptyList: "Empty list", saveDraft: "Leave as draft", send: "Send request", presentation: "Presentation", qtyIn: "Quantity (in the presentation)", add: "Add",
      unitsEq: "= {u} units", qtyErr: "Enter a quantity greater than zero.", addedOk: "Added to the list.", removed: "Item removed.", emptied: "List emptied.", draftSaved: "Draft {n} saved.", sentOk: "Request {n} sent to purchasing.",
      code: "Code", product: "Product", stock: "Stock", requested: "Requested", units: "Units", weight: "Weight (lb)", actions: "Actions", inc: "Increase", dec: "Decrease", remove: "Remove",
      k_lines: "Lines", k_units: "Units", k_weight: "Weight (lb)", k_low: "Below stock", emptyCart: "The list is empty. Scan or search an item to start.",
      lowStock: "Over warehouse stock", draftOf: "Draft in progress: {n}",
      listMine: "My suggested orders", listAuth: "Orders waiting for authorization", order: "Order", created: "Created", createdBy: "Created by", authBy: "Authorized/rejected by", authDate: "Authorization date", buyState: "Purchasing status",
      s_draft: "Draft", s_sent: "Sent", s_auth: "Authorized", s_rej: "Rejected", s_order: "Order created", review: "Review", detail: "Order detail", authorize: "Authorize", back: "Back",
      authOk: "Order {n} authorized; purchase order {o} created.", rejOk: "Order {n} rejected.", rejNeed: "Write the reason for the rejection.", allStates: "All states",
      aboutText: "Branches use this screen to ask purchasing for stock. The user picks the <b>branch and warehouse</b>, then scans the <b>barcode</b> or searches by code or name; each item is added in a <b>presentation</b> (unit, box, case) and converted to units. The list warns when a quantity is <b>over the warehouse stock</b>. A list can be left as a <b>draft</b> and resumed later, or <b>sent</b> to purchasing. Purchasing reviews it in <b>Authorizations</b>: authorizing creates the purchase order; rejecting requires a reason. Every order keeps who created it, who authorized or rejected it and when. All data is generated."
    },
    es: {
      tabCreate: "Crear pedido sugerido", tabMine: "Mis pedidos", tabAuth: "Autorizaciones", warehouse: "Bodega", findItem: "Buscar artículo", barcode: "Código de barra", itemCode: "Código artículo", name: "Nombre",
      barPh: "Escanee o escriba el código de barra", codePh: "Escriba el código del artículo", namePh: "Escriba el nombre del artículo", searchItem: "Buscar artículo", notFound: "Ningún artículo coincide con «{q}».", needBranch: "Sucursal y bodega requeridos.",
      orderList: "Lista del pedido", emptyList: "Vaciar lista", saveDraft: "Dejar borrador", send: "Enviar solicitud", presentation: "Presentación", qtyIn: "Cantidad (en la presentación)", add: "Agregar",
      unitsEq: "= {u} unidades", qtyErr: "Debe indicar una cantidad mayor a cero.", addedOk: "Agregado a la lista.", removed: "Producto retirado.", emptied: "Lista vaciada.", draftSaved: "Borrador {n} guardado.", sentOk: "Solicitud {n} enviada correctamente.",
      code: "Código", product: "Producto", stock: "Stock", requested: "Cantidad solicitada", units: "Unidades", weight: "Peso (lb)", actions: "Acciones", inc: "Aumentar", dec: "Disminuir", remove: "Quitar",
      k_lines: "Líneas", k_units: "Unidades", k_weight: "Peso (lb)", k_low: "Sobre el stock", emptyCart: "La lista está vacía. Escanee o busque un artículo para empezar.",
      lowStock: "Mayor al stock de la bodega", draftOf: "Pedido en progreso: {n}",
      listMine: "Mis pedidos sugeridos", listAuth: "Pedidos por autorizar", order: "Pedido", created: "Fecha creación", createdBy: "Creado por", authBy: "Autorizado/Rechazado por", authDate: "Fecha autorización", buyState: "Estado en compras",
      s_draft: "Borrador", s_sent: "Enviado", s_auth: "Autorizado", s_rej: "Rechazado", s_order: "Orden creada", review: "Revisar", detail: "Detalle del pedido", authorize: "Autorizar", back: "Regresar",
      authOk: "Pedido {n} autorizado; se creó la orden de compra {o}.", rejOk: "Pedido {n} rechazado.", rejNeed: "Escriba el motivo del rechazo.", allStates: "Todos los estados",
      aboutText: "Las sucursales usan esta pantalla para pedir mercadería a Compras. El usuario elige la <b>sucursal y la bodega</b>, escanea el <b>código de barra</b> o busca por código o nombre; cada artículo se agrega en una <b>presentación</b> (unidad, caja, fardo) y se convierte a unidades. La lista avisa cuando una cantidad es <b>mayor al stock de la bodega</b>. La lista se puede <b>dejar como borrador</b> y retomar después, o <b>enviar</b> a Compras. Compras la revisa en <b>Autorizaciones</b>: al autorizar se crea la orden de compra; para rechazar hay que escribir el motivo. Cada pedido guarda quién lo creó, quién lo autorizó o rechazó y cuándo. Todos los datos son generados."
    }
  });

  $(function () {
    const D = UI.DATA, t = UI.t, mi = UI.mi;
    const PRES = [{ en: "Unit", es: "Unidad", f: 1 }, { en: "Box of 6", es: "Caja de 6", f: 6 }, { en: "Case of 12", es: "Fardo de 12", f: 12 }, { en: "Case of 24", es: "Fardo de 24", f: 24 }];
    const r = UI.rng(515);
    const ITEMS = D.products.map((p, i) => ({ code: "A-" + (10000 + i * 37), barcode: "750" + String(1000000 + i * 7919).slice(0, 7), name: p[0], cat: p[1], stock: Math.round(UI.between(r, 0, 900)), lb: UI.between(r, .2, 4.5), pres: [0, (i % 3) + 1] }));
    const STATES = { draft: ["s_draft", "st-draft", "edit_note"], sent: ["s_sent", "st-sent", "send"], auth: ["s_auth", "st-auth", "check_circle"], rej: ["s_rej", "st-rej", "cancel"], order: ["s_order", "st-order", "local_shipping"] };
    let cart = [], tab = "create", seq = 412, poSeq = 8810, draftNo = null, pending = null, detail = null;
    const ORDERS = [];
    const rr = UI.rng(99);
    ["order", "auth", "rej", "sent", "sent", "draft", "sent", "order"].forEach((st, i) => {
      const lines = ITEMS.filter(() => rr() < .25).slice(0, 6).map(it => ({ it, pres: it.pres[1], qty: 1 + Math.floor(rr() * 8) }));
      ORDERS.push({ no: "PS-" + (seq - 9 + i), branch: Math.floor(rr() * 6), created: new Date(Date.UTC(2026, 10, 3 + i)), by: i % 3 ? "Demo user" : "J. Molina", state: st, authBy: st === "auth" || st === "rej" || st === "order" ? "N. Cruz" : "", authDate: st === "auth" || st === "rej" || st === "order" ? new Date(Date.UTC(2026, 10, 4 + i)) : null, po: st === "order" ? "OC-" + (poSeq - 5 + i) : "", lines, reason: st === "rej" ? "Stock enough in central warehouse" : "" });
    });

    function fillSelects() {
      const b = $("#fBranch").val() || "0", w = $("#fWh").val() || "0", s = $("#fState").val() || "all";
      $("#fBranch").empty(); D.branches.forEach((x, i) => $("#fBranch").append(new Option(x, String(i)))); $("#fBranch").val(b).select2({ width: "100%" });
      $("#fWh").empty(); [{ en: "Main warehouse", es: "Bodega principal" }, { en: "Cold room", es: "Cuarto frío" }].forEach((x, i) => $("#fWh").append(new Option(UI.L(x), String(i)))); $("#fWh").val(w).select2({ width: "100%", minimumResultsForSearch: Infinity });
      $("#fState").empty().append(new Option(t("allStates"), "all")); Object.keys(STATES).forEach(k => $("#fState").append(new Option(t(STATES[k][0]), k))); $("#fState").val(s).select2({ width: "100%", minimumResultsForSearch: Infinity });
    }
    fillSelects();
    const stChip = st => '<span class="st ' + STATES[st][1] + '">' + mi(STATES[st][2]) + t(STATES[st][0]) + "</span>";

    function renderTabs() {
      document.getElementById("tabs").innerHTML = [["create", "tabCreate", "add_shopping_cart"], ["mine", "tabMine", "list_alt"], ["auth", "tabAuth", "verified"]].map(x => '<button type="button" class="mc-tab" role="tab" aria-selected="' + (tab === x[0]) + '" data-tab="' + x[0] + '">' + mi(x[2]) + " " + t(x[1]) + "</button>").join("");
      document.getElementById("vCreate").hidden = tab !== "create";
      document.getElementById("vList").hidden = tab === "create";
      if (tab === "create") renderCart(); else renderList();
    }

    // ---------- Search ----------
    function search(e) {
      e && e.preventDefault();
      const bar = document.getElementById("sBar").value.trim(), code = document.getElementById("sCode").value.trim().toLowerCase(), name = document.getElementById("sName").value.trim().toLowerCase();
      const err = document.getElementById("scanErr"), list = document.getElementById("results");
      err.textContent = ""; list.hidden = true;
      if (!bar && !code && !name) return;
      const found = ITEMS.filter(x => (bar && x.barcode.includes(bar)) || (code && x.code.toLowerCase().includes(code)) || (name && x.name.toLowerCase().includes(name)));
      if (!found.length) { err.textContent = t("notFound", { q: bar || code || name }); return; }
      if (bar && found.length === 1 && found[0].barcode === bar) { askQty(found[0]); return; }
      list.innerHTML = found.slice(0, 12).map(x => '<li><button type="button" data-code="' + x.code + '"><span>' + x.name + "<br><small>" + x.code + " · " + x.barcode + " · " + UI.L(D.categories[x.cat]) + "</small></span><small>" + t("stock") + " " + UI.fmtInt(x.stock) + "</small></button></li>").join("");
      list.hidden = false;
      list.querySelector("button").focus();
    }
    document.getElementById("scanForm").addEventListener("submit", search);
    document.getElementById("results").addEventListener("click", e => { const b = e.target.closest("[data-code]"); if (b) askQty(ITEMS.find(x => x.code === b.dataset.code)); });

    function askQty(it) {
      pending = it;
      document.getElementById("qtyTitle").textContent = it.name;
      document.getElementById("qtyInfo").innerHTML = '<div class="mc-kpi"><div class="k-label">' + t("code") + '</div><div class="k-value">' + it.code + '</div></div><div class="mc-kpi"><div class="k-label">' + t("stock") + '</div><div class="k-value num">' + UI.fmtInt(it.stock) + "</div></div>";
      $("#qPres").empty(); it.pres.forEach(p => $("#qPres").append(new Option(UI.L(PRES[p]), String(p)))); $("#qPres").val(String(it.pres[1])).select2({ width: "100%", dropdownParent: $("#mQty"), minimumResultsForSearch: Infinity });
      document.getElementById("qQty").value = ""; document.getElementById("qErr").textContent = ""; document.getElementById("qQty").removeAttribute("aria-invalid");
      updUnits();
      UI.openModal("mQty");
      setTimeout(() => document.getElementById("qQty").focus(), 30);
    }
    function updUnits() { const q = Number(document.getElementById("qQty").value) || 0; document.getElementById("qUnits").textContent = t("unitsEq", { u: UI.fmtInt(q * PRES[+$("#qPres").val()].f) }); }
    document.getElementById("qQty").addEventListener("input", e => { e.target.value = e.target.value.replace(/\D/g, ""); updUnits(); });
    $("#qPres").on("change", updUnits);
    document.getElementById("qQty").addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); document.getElementById("qOk").click(); } });
    document.getElementById("qOk").addEventListener("click", () => {
      const q = Number(document.getElementById("qQty").value);
      if (!q) { document.getElementById("qErr").textContent = t("qtyErr"); document.getElementById("qQty").setAttribute("aria-invalid", "true"); return; }
      const pres = +$("#qPres").val();
      const ex = cart.find(c => c.it.code === pending.code && c.pres === pres);
      if (ex) ex.qty += q; else cart.push({ it: pending, pres, qty: q });
      UI.closeModal("mQty");
      ["sBar", "sCode", "sName"].forEach(id => document.getElementById(id).value = "");
      document.getElementById("results").hidden = true;
      renderCart(); UI.toast(t("addedOk"));
      document.getElementById("sBar").focus();
    });
    document.getElementById("qCancel").addEventListener("click", () => UI.closeModal("mQty"));

    // ---------- Cart ----------
    function lineRow(c, i, editable) {
      const units = c.qty * PRES[c.pres].f, over = units > c.it.stock;
      return "<tr><td>" + c.it.code + "<br><small class=\"muted\">" + c.it.barcode + "</small></td><td>" + c.it.name + "</td><td>" + UI.L(PRES[c.pres]) + '</td><td class="r">' +
        (editable ? '<span class="stepper"><button type="button" data-dec="' + i + '" aria-label="' + t("dec") + '">−</button><output>' + c.qty + '</output><button type="button" data-inc="' + i + '" aria-label="' + t("inc") + '">+</button></span>' : c.qty) +
        '</td><td class="r">' + UI.fmtInt(units) + '</td><td class="r">' + UI.fmtInt(c.it.stock) + (over ? '<br><span class="chip chip-warn">' + mi("warning") + t("lowStock") + "</span>" : "") + '</td><td class="r">' + (units * c.it.lb).toFixed(1) + "</td>" +
        (editable ? '<td><button type="button" class="btn btn-sm icon-btn" data-rm="' + i + '" aria-label="' + t("remove") + '">' + mi("delete") + "</button></td>" : "") + "</tr>";
    }
    function kpis(lines, el) {
      const units = lines.reduce((a, c) => a + c.qty * PRES[c.pres].f, 0), lb = lines.reduce((a, c) => a + c.qty * PRES[c.pres].f * c.it.lb, 0), low = lines.filter(c => c.qty * PRES[c.pres].f > c.it.stock).length;
      const k = (l, v) => '<div class="mc-kpi"><div class="k-label">' + t(l) + '</div><div class="k-value num">' + v + "</div></div>";
      document.getElementById(el).innerHTML = k("k_lines", lines.length) + k("k_units", UI.fmtInt(units)) + k("k_weight", lb.toFixed(1)) + k("k_low", low);
    }
    function renderCart() {
      kpis(cart, "cartKpis");
      document.getElementById("draftInfo").textContent = draftNo ? t("draftOf", { n: draftNo }) : "";
      document.querySelector("#tCart thead").innerHTML = "<tr><th>" + t("code") + "</th><th>" + t("product") + "</th><th>" + t("presentation") + '</th><th class="r">' + t("requested") + '</th><th class="r">' + t("units") + '</th><th class="r">' + t("stock") + '</th><th class="r">' + t("weight") + "</th><th>" + t("actions") + "</th></tr>";
      document.querySelector("#tCart tbody").innerHTML = cart.length ? cart.map((c, i) => lineRow(c, i, true)).join("") : '<tr><td colspan="8" class="empty">' + mi("qr_code_scanner") + " " + t("emptyCart") + "</td></tr>";
      ["btnSend", "btnDraft", "btnEmpty"].forEach(id => document.getElementById(id).disabled = !cart.length);
    }
    document.getElementById("tCart").addEventListener("click", e => {
      const inc = e.target.closest("[data-inc]"), dec = e.target.closest("[data-dec]"), rm = e.target.closest("[data-rm]");
      if (inc) cart[+inc.dataset.inc].qty++;
      if (dec) { const c = cart[+dec.dataset.dec]; c.qty = Math.max(1, c.qty - 1); }
      if (rm) { cart.splice(+rm.dataset.rm, 1); UI.toast(t("removed")); }
      if (inc || dec || rm) renderCart();
    });
    document.getElementById("btnEmpty").addEventListener("click", () => { cart = []; renderCart(); UI.toast(t("emptied")); });
    function saveOrder(state) {
      if (!draftNo) draftNo = "PS-" + (++seq);
      let o = ORDERS.find(x => x.no === draftNo);
      if (!o) { o = { no: draftNo, branch: +$("#fBranch").val(), created: new Date(Date.UTC(2026, 10, 17)), by: "Demo user", authBy: "", authDate: null, po: "", reason: "" }; ORDERS.unshift(o); }
      o.state = state; o.lines = cart.map(c => Object.assign({}, c));
      const n = draftNo;
      if (state === "sent") { cart = []; draftNo = null; }
      renderCart();
      UI.toast(t(state === "sent" ? "sentOk" : "draftSaved", { n }));
    }
    document.getElementById("btnDraft").addEventListener("click", () => saveOrder("draft"));
    document.getElementById("btnSend").addEventListener("click", () => saveOrder("sent"));

    // ---------- Lists ----------
    function renderList() {
      document.getElementById("listTitle").textContent = t(tab === "auth" ? "listAuth" : "listMine");
      const st = $("#fState").val();
      let list = tab === "auth" ? ORDERS.filter(o => o.state === "sent") : ORDERS.filter(o => o.by === "Demo user" || o.state !== "draft");
      if (st !== "all") list = list.filter(o => o.state === st);
      document.querySelector("#tList thead").innerHTML = "<tr><th>" + t("order") + "</th><th>" + t("branch") + "</th><th>" + t("created") + "</th><th>" + t("createdBy") + '</th><th class="r">' + t("k_lines") + '</th><th class="r">' + t("k_units") + "</th><th>" + t("status") + "</th><th>" + t("authBy") + "</th><th>" + t("buyState") + "</th><th>" + t("actions") + "</th></tr>";
      document.querySelector("#tList tbody").innerHTML = list.map(o => "<tr><td>" + o.no + "</td><td>" + D.branches[o.branch] + "</td><td>" + UI.fmtDay(o.created) + "</td><td>" + o.by + '</td><td class="r">' + o.lines.length + '</td><td class="r">' + UI.fmtInt(o.lines.reduce((a, c) => a + c.qty * PRES[c.pres].f, 0)) + "</td><td>" + stChip(o.state) +
        "</td><td>" + (o.authBy ? o.authBy + "<br><small class=\"muted\">" + UI.fmtDay(o.authDate) + "</small>" : "—") + "</td><td>" + (o.po || "—") + '</td><td><button type="button" class="btn btn-sm" data-open="' + o.no + '">' + mi(tab === "auth" ? "fact_check" : "visibility") + (tab === "auth" ? t("review") : t("detail")) + "</button></td></tr>").join("") || '<tr><td colspan="10" class="empty">' + t("noData") + "</td></tr>";
    }
    $("#fState").on("change", renderList);
    document.getElementById("tList").addEventListener("click", e => { const b = e.target.closest("[data-open]"); if (b) openDetail(b.dataset.open); });
    function openDetail(no) {
      detail = ORDERS.find(o => o.no === no);
      document.getElementById("detTitle").textContent = t("detail") + " " + detail.no + " · " + D.branches[detail.branch];
      document.getElementById("detState").innerHTML = stChip(detail.state);
      kpis(detail.lines, "detKpis");
      document.querySelector("#tDet thead").innerHTML = "<tr><th>" + t("code") + "</th><th>" + t("product") + "</th><th>" + t("presentation") + '</th><th class="r">' + t("requested") + '</th><th class="r">' + t("units") + '</th><th class="r">' + t("stock") + '</th><th class="r">' + t("weight") + "</th></tr>";
      document.querySelector("#tDet tbody").innerHTML = detail.lines.map((c, i) => lineRow(c, i, false)).join("");
      const canAuth = tab === "auth" && detail.state === "sent";
      document.getElementById("rejBox").hidden = !canAuth;
      document.getElementById("rejReason").value = ""; document.getElementById("rejErr").textContent = "";
      document.getElementById("detFoot").innerHTML = (canAuth ? '<button class="btn btn-teal" type="button" id="dAuth">' + mi("check") + t("authorize") + '</button><button class="btn btn-danger" type="button" id="dRej">' + mi("close") + t("reject") + "</button>" : "") + '<button class="btn" type="button" id="dBack">' + t(canAuth ? "back" : "close") + "</button>";
      UI.openModal("mDetail");
    }
    document.getElementById("detFoot").addEventListener("click", e => {
      const id = e.target.closest("button") && e.target.closest("button").id;
      if (id === "dBack") UI.closeModal("mDetail");
      if (id === "dAuth") { detail.state = "order"; detail.authBy = "Demo user"; detail.authDate = new Date(Date.UTC(2026, 10, 17)); detail.po = "OC-" + (++poSeq); UI.closeModal("mDetail"); renderList(); UI.toast(t("authOk", { n: detail.no, o: detail.po })); }
      if (id === "dRej") {
        const why = document.getElementById("rejReason").value.trim();
        if (!why) { document.getElementById("rejErr").textContent = t("rejNeed"); document.getElementById("rejReason").focus(); return; }
        detail.state = "rej"; detail.authBy = "Demo user"; detail.authDate = new Date(Date.UTC(2026, 10, 17)); detail.reason = why; UI.closeModal("mDetail"); renderList(); UI.toast(t("rejOk", { n: detail.no }));
      }
    });

    document.getElementById("tabs").addEventListener("click", e => { const b = e.target.closest("[data-tab]"); if (b) { tab = b.dataset.tab; renderTabs(); } });
    document.addEventListener("langchange", () => { fillSelects(); renderTabs(); document.getElementById("about").innerHTML = UI.aboutBox("aboutText", "aboutScreen"); });
    document.getElementById("about").innerHTML = UI.aboutBox("aboutText", "aboutScreen");
    cart = [{ it: ITEMS[0], pres: ITEMS[0].pres[1], qty: 4 }, { it: ITEMS[8], pres: ITEMS[8].pres[1], qty: 2 }];
    renderTabs();
  });
  </script>
</body>
</html>
