<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Budget vs actual · Business UI Gallery</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/select2/4.0.13/css/select2.min.css">
  <link rel="stylesheet" href="../assets/css/base.css">
  <style>
    .matrix-wrap { max-height: 520px; }
    .matrix th:first-child, .matrix td:first-child { position: sticky; left: 0; z-index: 2; min-width: 210px; max-width: 260px; white-space: normal; }
    .matrix th:first-child { z-index: 3; }
    .matrix td:first-child { background: var(--mc-panel); }
    .matrix tfoot td:first-child { background: var(--mc-panel-2); }
    .matrix td.cell { cursor: pointer; }
    .matrix td.cell:hover, .matrix td.cell:focus-visible { background: var(--mc-row-hover); outline: none; box-shadow: inset 0 0 0 2px var(--mc-cyan); }
    .var-up { color: var(--mc-good); } .var-down { color: var(--mc-bad); }
    .seg { display: inline-flex; border: 1px solid var(--mc-line); border-radius: 6px; overflow: hidden; }
    .seg button { min-height: 34px; padding: 0 12px; border: 0; background: transparent; color: var(--mc-muted); font-size: 12px; font-weight: 700; cursor: pointer; }
    .seg button[aria-pressed="true"] { background: rgba(20, 184, 166, .18); color: var(--mc-text); }
    .chart-box { position: relative; height: 290px; }
  </style>
</head>
<body data-page="budget-report" data-root="../">
  <main id="content">
    <section class="mc-panel">
      <form class="mc-filters" id="filters">
        <div class="mc-field" style="max-width:130px"><label for="fYear" data-i18n="fYear"></label><select id="fYear"></select></div>
        <div class="mc-field w-lg"><label for="fCenters" data-i18n="fCenters"></label><select id="fCenters" multiple></select></div>
        <div class="mc-field" style="flex:0 0 auto;min-width:0"><span class="mc-label" data-i18n="fView"></span><div class="seg" id="segView" role="group"></div></div>
        <div class="mc-field" style="flex:0 0 auto;min-width:0"><span class="mc-label" data-i18n="fMeasure"></span><div class="seg" id="segMeasure" role="group"></div></div>
        <button class="btn btn-teal" type="submit"><span class="material-icons" aria-hidden="true">search</span><span data-i18n="load"></span></button>
      </form>
    </section>

    <div class="mc-kpis" id="kpis"></div>

    <section class="mc-panel">
      <div class="mc-panel-title"><h3><span class="material-icons" aria-hidden="true">grid_on</span><span id="mTitle"></span></h3><span class="mc-hint" data-i18n="cellHint"></span></div>
      <div class="table-wrap matrix-wrap"><table class="grid matrix" id="matrix"><thead></thead><tbody></tbody><tfoot></tfoot></table></div>
    </section>

    <section class="mc-panel">
      <div class="mc-panel-title"><h3><span class="material-icons" aria-hidden="true">bar_chart</span><span data-i18n="chartTitle"></span></h3></div>
      <div class="chart-box"><canvas id="chart" role="img"></canvas></div>
    </section>

    <div id="about"></div>
  </main>

  <div class="modal-backdrop" id="mDocs">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="mDocsT">
      <div class="modal-head"><h3 id="mDocsT"><span class="material-icons" aria-hidden="true">receipt_long</span><span id="mDocsTxt"></span></h3></div>
      <div class="modal-body"><p class="mc-hint" id="mDocsSub" style="margin-bottom:8px"></p><div class="table-wrap"><table class="grid" id="tDocs"><thead></thead><tbody></tbody><tfoot></tfoot></table></div></div>
      <div class="modal-foot"><button class="btn" type="button" id="mDocsClose" data-i18n="close"></button></div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/select2/4.0.13/js/select2.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="../assets/js/common.js"></script>
  <script>
  UI.strings({
    en: {
      fYear: "Year", fCenters: "Management centers", fView: "Rows", fMeasure: "Show", byCenter: "By center", byAccount: "By account", mBudget: "Budget", mActual: "Actual", mVar: "Variance",
      allCenters: "All centers", cellHint: "Select an amount to see the documents behind it",
      mTitleC: "{m} by center and month", mTitleA: "{m} by account and month", colRow: "Center", colRowA: "Account", colTotal: "Total year",
      kBudget: "Budget for the year", kActual: "Actual to date", kVar: "Variance to date", kExec: "Execution to date", kOver: "Accounts over budget",
      chartTitle: "Budget vs actual by month and cumulative variance", cBudget: "Budget", cActual: "Actual", cCum: "Cumulative variance",
      docsTitle: "{r} · {m}", docsSub: "Actual {a} against a budget of {b}.", colDoc: "Document", colDate: "Date", colSupplier: "Supplier", colDesc: "Description", colAmount: "Amount",
      d1: "Purchase invoice", d2: "Payment request", d3: "Petty cash", d4: "Journal entry",
      aboutText: "Mirrors the budget reports of the management control module (budget balance by center and by account, annual reports and projections). The matrix shows <b>budget</b>, <b>actual</b> or <b>variance</b> (budget − actual) per month with the first column fixed while scrolling. A positive variance means money left; a negative one means the budget was exceeded, shown with ▲/▼ and the sign, not only color. <b>Actual</b> only counts closed months (up to October) plus November to date. Every amount opens the documents that add up to it. All data is generated."
    },
    es: {
      fYear: "Año", fCenters: "Centros de gestión", fView: "Filas", fMeasure: "Mostrar", byCenter: "Por centro", byAccount: "Por cuenta", mBudget: "Presupuesto", mActual: "Real", mVar: "Variación",
      allCenters: "Todos los centros", cellHint: "Elija un monto para ver los documentos que lo forman",
      mTitleC: "{m} por centro y mes", mTitleA: "{m} por cuenta y mes", colRow: "Centro", colRowA: "Cuenta", colTotal: "Total año",
      kBudget: "Presupuesto del año", kActual: "Real a la fecha", kVar: "Variación a la fecha", kExec: "Ejecución a la fecha", kOver: "Cuentas sobregiradas",
      chartTitle: "Presupuesto vs real por mes y variación acumulada", cBudget: "Presupuesto", cActual: "Real", cCum: "Variación acumulada",
      docsTitle: "{r} · {m}", docsSub: "Real {a} contra un presupuesto de {b}.", colDoc: "Documento", colDate: "Fecha", colSupplier: "Proveedor", colDesc: "Descripción", colAmount: "Monto",
      d1: "Factura de compra", d2: "Solicitud de pago", d3: "Caja chica", d4: "Partida manual",
      aboutText: "Replica los reportes de presupuesto del módulo de control de gestión (balance de presupuesto por centro y por cuenta, reportes anuales y proyecciones). La matriz muestra <b>presupuesto</b>, <b>real</b> o <b>variación</b> (presupuesto − real) por mes, con la primera columna fija al desplazarse. Una variación positiva es lo que sobró; una negativa es lo que se pasó del presupuesto, con ▲/▼ y signo, no solo color. El <b>real</b> solo cuenta los meses cerrados (hasta octubre) más lo que va de noviembre. Cada monto abre los documentos que lo suman. Todos los datos son generados."
    }
  });

  $(function () {
    const D = UI.DATA, t = UI.t, M = UI.fmtMoney, mi = UI.mi;
    const ACC = [["6-01-01-001", { en: "Salaries", es: "Sueldos y salarios" }], ["6-02-03-001", { en: "Fuel", es: "Combustible" }], ["6-02-03-005", { en: "Vehicle maintenance", es: "Mantenimiento de vehículos" }],
      ["6-03-01-002", { en: "Rent", es: "Alquileres" }], ["6-03-02-001", { en: "Electricity", es: "Energía eléctrica" }], ["6-03-02-003", { en: "Telephone and internet", es: "Teléfono e internet" }],
      ["6-04-01-001", { en: "Office supplies", es: "Papelería y útiles" }], ["6-05-01-002", { en: "IT services", es: "Servicios de TI" }]];
    const LAST = 10; // November is the current month (index 10)
    function data(year) {
      return D.costCenters.map((c, ci) => ACC.map((a, ai) => {
        const r = UI.rng(year * 7 + ci * 31 + ai * 3);
        const base = UI.between(r, 4000, 22000) * (ai === 0 ? 3 : 1);
        const bud = Array.from({ length: 12 }, (_, m) => Math.round(base * (1 + (m === 11 ? .25 : 0)) * UI.between(r, .92, 1.08)));
        const act = bud.map((b, m) => year < 2026 || m < LAST ? Math.round(b * UI.between(r, .72, 1.2)) : m === LAST ? Math.round(b * UI.between(r, .4, .65)) : null);
        return { ci, ai, bud, act };
      })).flat();
    }
    let view = "center", measure = "var", chart, rows = [];
    function fill() {
      const y = $("#fYear").val() || "2026", cs = $("#fCenters").val() || [];
      $("#fYear").empty(); ["2025", "2026"].forEach(v => $("#fYear").append(new Option(v, v))); $("#fYear").val(y).select2({ width: "100%", minimumResultsForSearch: Infinity });
      $("#fCenters").empty(); D.costCenters.forEach((c, i) => $("#fCenters").append(new Option(UI.L(c), String(i)))); $("#fCenters").val(cs).select2({ width: "100%", placeholder: t("allCenters"), closeOnSelect: false });
      document.getElementById("segView").innerHTML = [["center", "byCenter"], ["account", "byAccount"]].map(x => '<button type="button" data-v="' + x[0] + '" aria-pressed="' + (view === x[0]) + '">' + t(x[1]) + "</button>").join("");
      document.getElementById("segMeasure").innerHTML = [["bud", "mBudget"], ["act", "mActual"], ["var", "mVar"]].map(x => '<button type="button" data-m="' + x[0] + '" aria-pressed="' + (measure === x[0]) + '">' + t(x[1]) + "</button>").join("");
    }
    const sum = a => a.reduce((s, v) => s + (v || 0), 0);
    function render() {
      const year = Number($("#fYear").val()), cs = ($("#fCenters").val() || []).map(Number);
      const all = data(year).filter(x => !cs.length || cs.includes(x.ci));
      const keyOf = x => view === "center" ? x.ci : x.ai;
      const groups = {};
      all.forEach(x => { const k = keyOf(x); if (!groups[k]) groups[k] = { k, items: [], bud: Array(12).fill(0), act: Array(12).fill(null) }; const g = groups[k]; g.items.push(x); x.bud.forEach((v, m) => g.bud[m] += v); x.act.forEach((v, m) => { if (v != null) g.act[m] = (g.act[m] || 0) + v; }); });
      rows = Object.values(groups);
      const lim = year < 2026 ? 11 : LAST;
      const val = (g, m) => measure === "bud" ? g.bud[m] : measure === "act" ? g.act[m] : (g.act[m] == null ? null : g.bud[m] - g.act[m]);
      const fmtCell = v => v == null ? '<span class="muted">—</span>' : measure !== "var" ? M(v) : '<span class="' + (v >= 0 ? "var-up" : "var-down") + '">' + (v >= 0 ? "▲ " : "▼ ") + M(v) + "</span>";
      document.getElementById("mTitle").textContent = t(view === "center" ? "mTitleC" : "mTitleA", { m: t({ bud: "mBudget", act: "mActual", var: "mVar" }[measure]) });
      document.querySelector("#matrix thead").innerHTML = "<tr><th>" + t(view === "center" ? "colRow" : "colRowA") + "</th>" + Array.from({ length: 12 }, (_, m) => '<th class="r">' + UI.monthName(m, true) + "</th>").join("") + '<th class="r">' + t("colTotal") + "</th></tr>";
      const name = g => view === "center" ? UI.L(D.costCenters[g.k]) : ACC[g.k][0] + " · " + UI.L(ACC[g.k][1]);
      document.querySelector("#matrix tbody").innerHTML = rows.map((g, ri) => "<tr><td><b>" + name(g) + "</b></td>" + Array.from({ length: 12 }, (_, m) => { const v = val(g, m); return '<td class="r cell" tabindex="0" data-r="' + ri + '" data-m="' + m + '">' + fmtCell(v) + "</td>"; }).join("") +
        '<td class="r"><b>' + fmtCell(measure === "bud" ? sum(g.bud) : measure === "act" ? sum(g.act) : sum(g.bud.slice(0, lim + 1)) - sum(g.act)) + "</b></td></tr>").join("");
      const colTot = m => { const vs = rows.map(g => val(g, m)); return vs.every(v => v == null) ? null : sum(vs); };
      const grand = measure === "bud" ? sum(rows.map(g => sum(g.bud))) : measure === "act" ? sum(rows.map(g => sum(g.act))) : sum(rows.map(g => sum(g.bud.slice(0, lim + 1)) - sum(g.act)));
      document.querySelector("#matrix tfoot").innerHTML = "<tr><td>" + t("total") + "</td>" + Array.from({ length: 12 }, (_, m) => '<td class="r">' + fmtCell(colTot(m)) + "</td>").join("") + '<td class="r">' + fmtCell(grand) + "</td></tr>";
      // KPIs
      const B = sum(rows.map(g => sum(g.bud))), Bto = sum(rows.map(g => sum(g.bud.slice(0, lim + 1)))), A = sum(rows.map(g => sum(g.act)));
      const over = all.filter(x => sum(x.act) > sum(x.bud.slice(0, lim + 1))).length;
      document.getElementById("kpis").innerHTML = [["kBudget", M(B)], ["kActual", M(A)], ["kVar", '<span class="' + (Bto - A >= 0 ? "pos" : "neg") + '">' + M(Bto - A) + "</span>"], ["kExec", UI.fmtPct(A / Bto)], ["kOver", UI.fmtInt(over)]]
        .map(k => '<div class="mc-kpi"><div class="k-label">' + t(k[0]) + '</div><div class="k-value">' + k[1] + "</div></div>").join("");
      // Chart
      const bud = Array.from({ length: 12 }, (_, m) => sum(rows.map(g => g.bud[m]))), act = Array.from({ length: 12 }, (_, m) => colTotRaw(m));
      function colTotRaw(m) { const vs = rows.map(g => g.act[m]); return vs.every(v => v == null) ? null : sum(vs); }
      let cum = 0; const cumv = bud.map((b, m) => act[m] == null ? null : (cum += b - act[m]));
      const tx = UI.cssVar("--mc-muted"), grid = UI.cssVar("--mc-line");
      if (chart) chart.destroy();
      chart = new Chart(document.getElementById("chart"), {
        data: { labels: Array.from({ length: 12 }, (_, m) => UI.monthName(m, true)), datasets: [
          { type: "bar", label: t("cBudget"), data: bud, backgroundColor: "rgba(56,189,248,.45)", borderColor: "#38bdf8", borderWidth: 1, yAxisID: "y" },
          { type: "bar", label: t("cActual"), data: act, backgroundColor: "rgba(20,184,166,.75)", yAxisID: "y" },
          { type: "line", label: t("cCum"), data: cumv, borderColor: "#f59e0b", backgroundColor: "#f59e0b", pointRadius: 3, tension: .25, yAxisID: "y2" }
        ] },
        options: { maintainAspectRatio: false, interaction: { mode: "index", intersect: false },
          plugins: { legend: { labels: { color: tx, boxWidth: 12 } }, tooltip: { callbacks: { label: c => c.dataset.label + ": " + (c.parsed.y == null ? "—" : M(c.parsed.y)) } } },
          scales: { x: { ticks: { color: tx }, grid: { display: false } }, y: { ticks: { color: tx, callback: v => (v / 1000) + "k" }, grid: { color: grid } }, y2: { position: "right", ticks: { color: tx, callback: v => (v / 1000) + "k" }, grid: { display: false } } } }
      });
      document.getElementById("chart").setAttribute("aria-label", t("chartTitle"));
    }
    function openDocs(ri, m) {
      const g = rows[ri], a = g.act[m];
      if (a == null) return;
      const r = UI.rng(ri * 97 + m * 13 + Number($("#fYear").val()));
      const n = 3 + Math.floor(r() * 5);
      const parts = Array.from({ length: n }, () => r() + .2), tot = sum(parts);
      let acc = 0;
      const docs = parts.map((p, i) => { const v = i === n - 1 ? Math.round((a - acc) * 100) / 100 : Math.round(a * p / tot * 100) / 100; acc += v; const k = UI.pick(r, ["d1", "d2", "d3", "d4"]); return { doc: { d1: "FC-", d2: "SP-", d3: "CC-", d4: "PM-" }[k] + (10200 + Math.floor(r() * 800)), k, day: 1 + Math.floor(r() * 27), sup: UI.pick(r, D.suppliers), v }; });
      const nm = view === "center" ? UI.L(D.costCenters[g.k]) : UI.L(ACC[g.k][1]);
      document.getElementById("mDocsTxt").textContent = t("docsTitle", { r: nm, m: UI.monthName(m) + " " + $("#fYear").val() });
      document.getElementById("mDocsSub").textContent = t("docsSub", { a: M(a), b: M(g.bud[m]) });
      document.querySelector("#tDocs thead").innerHTML = "<tr><th>" + t("colDoc") + "</th><th>" + t("colDate") + "</th><th>" + t("colDesc") + "</th><th>" + t("colSupplier") + '</th><th class="r">' + t("colAmount") + "</th></tr>";
      document.querySelector("#tDocs tbody").innerHTML = docs.sort((x, y) => x.day - y.day).map(d => "<tr><td>" + d.doc + "</td><td>" + UI.fmtDay(new Date(Date.UTC(Number($("#fYear").val()), m, d.day))) + "</td><td>" + t(d.k) + "</td><td>" + d.sup + '</td><td class="r">' + M(d.v) + "</td></tr>").join("");
      document.querySelector("#tDocs tfoot").innerHTML = '<tr><td colspan="4">' + t("total") + '</td><td class="r">' + M(a) + "</td></tr>";
      UI.openModal("mDocs");
    }
    document.getElementById("matrix").addEventListener("click", e => { const c = e.target.closest("td.cell"); if (c) openDocs(Number(c.dataset.r), Number(c.dataset.m)); });
    document.getElementById("matrix").addEventListener("keydown", e => { const c = e.target.closest("td.cell"); if (c && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); openDocs(Number(c.dataset.r), Number(c.dataset.m)); } });
    document.getElementById("mDocsClose").addEventListener("click", () => UI.closeModal("mDocs"));
    document.getElementById("segView").addEventListener("click", e => { const b = e.target.closest("[data-v]"); if (b) { view = b.dataset.v; fill(); render(); } });
    document.getElementById("segMeasure").addEventListener("click", e => { const b = e.target.closest("[data-m]"); if (b) { measure = b.dataset.m; fill(); render(); } });
    document.getElementById("filters").addEventListener("submit", e => { e.preventDefault(); render(); });
    const about = () => document.getElementById("about").innerHTML = UI.aboutBox("aboutText");
    document.addEventListener("langchange", () => { fill(); render(); about(); });
    document.addEventListener("themechange", render);
    fill(); about(); render();
  });
  </script>
</body>
</html>
