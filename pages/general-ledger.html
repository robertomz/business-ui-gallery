<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Journal book · Business UI Gallery</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/select2/4.0.13/css/select2.min.css">
  <link rel="stylesheet" href="../assets/css/base.css">
  <style>
    tr.lines-row td { background: var(--mc-panel-2); padding: 8px 12px 12px 34px; }
    tr.lines-row table { width: 100%; border-collapse: collapse; font-size: 11.5px; }
    tr.lines-row th { text-align: left; color: var(--mc-muted); font-size: 10px; text-transform: uppercase; padding: 4px 6px; border-bottom: 1px solid var(--mc-line); }
    tr.lines-row td td { padding: 4px 6px; border-bottom: 1px dashed var(--mc-line); background: transparent; }
    .exp-btn { border: 0; background: transparent; color: var(--mc-muted); cursor: pointer; padding: 2px; border-radius: 4px; }
    .acts { display: flex; gap: 4px; }
    .doc-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 8px 14px; margin-bottom: 12px; }
    .doc-grid .mc-field { min-width: 0; }
    .code-box { font-size: 26px; font-weight: 900; letter-spacing: 6px; text-align: center; padding: 10px; border: 1px dashed var(--mc-teal); border-radius: 8px; color: var(--mc-good); }
    .countdown { font-variant-numeric: tabular-nums; }
  </style>
</head>
<body data-page="general-ledger" data-root="../">
  <main id="content">
    <section class="mc-panel">
      <form class="mc-filters" id="filters">
        <div class="mc-field w-sm"><label data-i18n="company"></label><div class="static">DEMO</div></div>
        <div class="mc-field" style="max-width:165px"><label for="fFrom" data-i18n="from"></label><input type="date" id="fFrom"></div>
        <div class="mc-field" style="max-width:165px"><label for="fTo" data-i18n="to"></label><input type="date" id="fTo"></div>
        <div class="mc-field" style="max-width:220px"><label for="fType" data-i18n="entryType"></label><select id="fType"></select></div>
        <div class="mc-field" style="max-width:160px"><label for="fNo" data-i18n="entryNo"></label><input type="text" id="fNo" data-i18n-ph="entryNoPh"></div>
        <label class="mc-check"><input type="checkbox" id="fUnbal"><span data-i18n="onlyUnbal"></span></label>
        <button class="btn btn-teal" type="submit"><span class="material-icons" aria-hidden="true">search</span><span data-i18n="load"></span></button>
      </form>
    </section>
    <section class="mc-kpis" id="kpis"></section>
    <section class="mc-panel">
      <div class="mc-panel-title"><h3><span class="material-icons" aria-hidden="true">menu_book</span><span data-i18n="listTitle"></span></h3><span class="mc-hint" data-i18n="listHint"></span></div>
      <div class="table-wrap" style="max-height:560px"><table class="grid" id="tBook"><thead></thead><tbody></tbody><tfoot></tfoot></table></div>
    </section>
    <div id="about"></div>
  </main>

  <div class="modal-backdrop" id="mDoc">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="docTitle">
      <div class="modal-head"><h3 id="docTitle"><span class="material-icons" aria-hidden="true">description</span><span id="docTitleTxt"></span></h3><span id="docChip"></span></div>
      <div class="modal-body" id="docBody"></div>
      <div class="modal-foot"><button type="button" class="btn btn-danger" id="btnCloseDoc"><span class="material-icons" aria-hidden="true">close</span><span data-i18n="close"></span></button></div>
    </div>
  </div>

  <div class="modal-backdrop" id="mEdit">
    <div class="modal modal-sm" role="dialog" aria-modal="true" aria-labelledby="editTitle">
      <div class="modal-head"><h3 id="editTitle"><span class="material-icons" aria-hidden="true">lock</span><span id="editTitleTxt"></span></h3><span id="editChip"></span></div>
      <div class="modal-body">
        <div class="mc-steps" id="editSteps" style="margin-bottom:12px"></div>
        <div id="step1">
          <div class="mc-field"><label for="tokReason" data-i18n="tokReason"></label><textarea id="tokReason" maxlength="200"></textarea><div class="mc-field-error" id="errReason"></div></div>
        </div>
        <div id="step2" hidden>
          <p class="mc-hint" data-i18n="tokSent"></p>
          <div class="code-box" id="tokShown" style="margin:10px 0"></div>
          <div class="mc-field"><label for="tokCode" data-i18n="tokCode"></label><input type="text" id="tokCode" inputmode="numeric" maxlength="6" autocomplete="off"><div class="mc-field-error" id="errCode"></div></div>
        </div>
        <div id="step3" hidden>
          <p class="ig-nota" id="tokTimer"></p>
          <div class="mc-field"><label for="newSyn" data-i18n="synopsis"></label><textarea id="newSyn" maxlength="250"></textarea><div class="mc-field-error" id="errSyn"></div></div>
          <p class="mc-hint" data-i18n="onlySyn"></p>
        </div>
      </div>
      <div class="modal-foot">
        <button type="button" class="btn btn-teal" id="btnEditMain"></button>
        <button type="button" class="btn btn-danger" id="btnCloseEdit"><span class="material-icons" aria-hidden="true">close</span><span data-i18n="close"></span></button>
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/select2/4.0.13/js/select2.min.js"></script>
  <script src="../assets/js/common.js"></script>
  <script>
  UI.strings({
    en: {
      company: "Company", entryType: "Entry type", entryNo: "Entry No.", entryNoPh: "e.g. 2-1045", onlyUnbal: "Only unbalanced", all: "All",
      listTitle: "Journal book", listHint: "Select ▸ to see the lines of an entry",
      kEntries: "Entries", kDebit: "Debit", kCredit: "Credit", kUnbal: "Unbalanced", kVoid: "Voided",
      colNo: "Entry No.", colDate: "Entry date", colType: "Entry type", synopsis: "Synopsis", colBranch: "Branch", colBal: "Balance", colBy: "Created by", colCreated: "Created on", colStatus: "Status",
      debit: "Debit", credit: "Credit", actions: "Actions", balanced: "Balanced", unbalanced: "Unbalanced", active: "Active", voided: "Voided",
      account: "Account", accountName: "Account name", costCenter: "Cost center", sourceDoc: "Source document", edit: "Edit", expand: "Show lines",
      s_manual: "Manual", s_sales: "Sales", s_cost: "Cost of sales", s_purch: "Purchases", s_ret: "Returns", s_bank: "Bank movement", s_payroll: "Payroll",
      docOf: "Source document · {n}", invoiceNo: "Invoice No.", customer: "Customer", seller: "Seller", subtotal: "Subtotal", tax: "Tax (sample 15%)", total: "Total",
      payType: "Payment", product: "Product", qty: "Qty", price: "Price", unitCost: "Unit cost", movNo: "Movement No.", bankAcc: "Bank account", payee: "Payee", reference: "Reference", method: "Method",
      period: "Period", employees: "Employees", gross: "Gross pay", deductions: "Deductions", employer: "Employer contributions", net: "Net pay", createdBy: "Created by", reason: "Reason",
      purchaseNo: "Purchase invoice", returnNo: "Credit note", manualNote: "Manual entry: no source document. The lines are the document.",
      editEntry: "Edit entry {n}", tokReason: "Why do you need to edit it?", tokRequest: "Request approval code", tokSent: "An approver received the request. In this demo the code is shown here:",
      tokCode: "Approval code", tokValidate: "Validate code", tokOk: "Approved", tokPending: "Waiting for approval", tokTimer: "Unlocked. The code expires in {t}.", tokExpired: "The code expired. Request a new one.",
      onlySyn: "Only the synopsis can be edited; amounts change through a new entry.", saveSyn: "Save", eReason: "Explain the reason (at least 10 characters).", eCode: "The code does not match.", eSyn: "Write the synopsis (at least 10 characters).",
      st1: "Reason", st2: "Code", st3: "Edit", savedSyn: "Entry {n} updated.",
      aboutText: "The journal book lists <b>every entry of the period</b>, manual and automatic, with its balance check: an entry is <b>balanced</b> when debit equals credit (icon and text, not only color). Each row opens its <b>lines</b>, and <b>Source document</b> opens the invoice, purchase, credit note, bank movement or payroll that created it, each with its own layout. <b>Editing an entry needs an approval code</b>: you explain the reason, an approver sends a code, and the entry stays unlocked for 5 minutes. Totals follow the filters. All data is generated."
    },
    es: {
      company: "Empresa", entryType: "Tipo de partida", entryNo: "No. partida", entryNoPh: "ej. 2-1045", onlyUnbal: "Solo descuadradas", all: "Todas",
      listTitle: "Libro diario", listHint: "Pulse ▸ para ver las líneas de una partida",
      kEntries: "Partidas", kDebit: "Debe", kCredit: "Haber", kUnbal: "Descuadradas", kVoid: "Anuladas",
      colNo: "Npartida", colDate: "Fecha partida", colType: "Tipo partida", synopsis: "Sinopsis", colBranch: "Sucursal", colBal: "Balance estado", colBy: "Creado por", colCreated: "Fecha creado", colStatus: "Estado",
      debit: "Debe", credit: "Haber", actions: "Acciones", balanced: "Cuadrada", unbalanced: "Descuadrada", active: "Activa", voided: "Anulada",
      account: "Cuenta", accountName: "Nombre de la cuenta", costCenter: "Centro de costo", sourceDoc: "Documento origen", edit: "Editar", expand: "Ver líneas",
      s_manual: "Manual", s_sales: "Ventas", s_cost: "Costo de ventas", s_purch: "Compras", s_ret: "Devoluciones", s_bank: "Movimiento bancario", s_payroll: "Planilla",
      docOf: "Documento origen · {n}", invoiceNo: "No. factura", customer: "Cliente", seller: "Vendedor", subtotal: "Subtotal", tax: "Impuesto (ejemplo 15%)", total: "Total",
      payType: "Pago", product: "Producto", qty: "Cant.", price: "Precio", unitCost: "Costo unitario", movNo: "No. movimiento", bankAcc: "Cuenta bancaria", payee: "Beneficiario", reference: "Referencia", method: "Forma",
      period: "Período", employees: "Empleados", gross: "Devengado", deductions: "Deducciones", employer: "Aportes patronales", net: "Neto a pagar", createdBy: "Creado por", reason: "Motivo",
      purchaseNo: "Factura de compra", returnNo: "Nota de crédito", manualNote: "Partida manual: no tiene documento origen. Las líneas son el documento.",
      editEntry: "Editar partida {n}", tokReason: "¿Por qué necesita editarla?", tokRequest: "Solicitar código de aprobación", tokSent: "Un aprobador recibió la solicitud. En esta demo el código se muestra aquí:",
      tokCode: "Código de aprobación", tokValidate: "Validar código", tokOk: "Aprobado", tokPending: "Esperando aprobación", tokTimer: "Desbloqueada. El código vence en {t}.", tokExpired: "El código venció. Solicite uno nuevo.",
      onlySyn: "Solo se puede editar la sinopsis; los montos se cambian con una partida nueva.", saveSyn: "Guardar", eReason: "Explique el motivo (mínimo 10 caracteres).", eCode: "El código no coincide.", eSyn: "Escriba la sinopsis (mínimo 10 caracteres).",
      st1: "Motivo", st2: "Código", st3: "Editar", savedSyn: "Partida {n} actualizada.",
      aboutText: "El libro diario muestra <b>todas las partidas del período</b>, manuales y automáticas, con su verificación de balance: una partida está <b>cuadrada</b> cuando el Debe es igual al Haber (con ícono y texto, no solo color). Cada fila abre sus <b>líneas</b>, y <b>Documento origen</b> abre la factura, compra, nota de crédito, movimiento bancario o planilla que la generó, cada uno con su propio formato. <b>Editar una partida requiere un código de aprobación</b>: se explica el motivo, un aprobador envía un código y la partida queda desbloqueada 5 minutos. Los totales siguen los filtros. Todos los datos son generados."
    }
  });

  $(function () {
    const t = UI.t, M = UI.fmtMoney, mi = UI.mi, D = UI.DATA;
    const SRC = ["s_sales", "s_cost", "s_purch", "s_ret", "s_bank", "s_payroll", "s_manual"];
    const NAMES = {
      "1-01-01-001": ["Cash on hand", "Caja general"], "1-01-02-001": ["Bank – First Harbor", "Banco First Harbor"], "1-01-03-001": ["Accounts receivable", "Clientes"],
      "1-01-04-001": ["Merchandise inventory", "Inventario de mercadería"], "1-01-05-001": ["Sales tax credit", "Impuesto por acreditar"], "2-01-01-001": ["Accounts payable", "Proveedores"],
      "2-01-02-001": ["Sales tax payable", "Impuesto sobre ventas por pagar"], "2-01-03-001": ["Salaries payable", "Sueldos por pagar"], "2-01-03-002": ["Withholdings payable", "Retenciones por pagar"],
      "2-01-04-001": ["Accrued expenses", "Gastos acumulados por pagar"], "4-01-01-001": ["Sales", "Ventas"], "4-01-02-001": ["Sales returns", "Devoluciones sobre ventas"], "5-01-01-001": ["Cost of sales", "Costo de ventas"],
      "6-01-01-001": ["Salaries", "Sueldos y salarios"], "6-01-01-002": ["Employer contributions", "Aportes patronales"], "6-01-04-001": ["Office supplies", "Papelería y útiles"], "6-01-07-001": ["Bank fees", "Comisiones bancarias"]
    };
    const nm = c => NAMES[c] ? NAMES[c][UI.lang === "es" ? 1 : 0] : c;
    const users = ["mlopez", "jreyes", "acastro", "system"];

    // ---------- Sample book (deterministic) ----------
    const r = UI.rng(2026);
    const book = [];
    let no = 1001;
    for (let day = 1; day <= 16; day++) {
      const date = new Date(Date.UTC(2026, 10, day));
      if (date.getUTCDay() === 0) continue;
      SRC.forEach((s, si) => {
        if (s === "s_payroll" && day !== 15) return;
        if (s === "s_manual" && r() > .45) return;
        if ((s === "s_ret" || s === "s_bank") && r() > .7) return;
        const branch = D.branches[Math.floor(r() * D.branches.length)];
        const base = UI.between(r, 8000, 160000);
        let lines;
        if (s === "s_sales") { const net = base, tax = net * .15; lines = [["1-01-01-001", net * .4 + tax * .4, 0], ["1-01-03-001", net * .6 + tax * .6, 0], ["4-01-01-001", 0, net], ["2-01-02-001", 0, tax]]; }
        else if (s === "s_cost") lines = [["5-01-01-001", base * .7, 0], ["1-01-04-001", 0, base * .7]];
        else if (s === "s_purch") lines = [["1-01-04-001", base, 0], ["1-01-05-001", base * .15, 0], ["2-01-01-001", 0, base * 1.15]];
        else if (s === "s_ret") lines = [["4-01-02-001", base * .05, 0], ["1-01-03-001", 0, base * .05]];
        else if (s === "s_bank") lines = [["2-01-01-001", base * .6, 0], ["6-01-07-001", 45, 0], ["1-01-02-001", 0, base * .6 + 45]];
        else if (s === "s_payroll") { const g = 240000, ded = g * .12, emp = g * .09; lines = [["6-01-01-001", g, 0], ["6-01-01-002", emp, 0], ["2-01-03-002", 0, ded + emp], ["2-01-03-001", 0, g - ded]]; }
        else lines = [["6-01-04-001", base * .05, 0], ["2-01-04-001", 0, base * .05]];
        lines = lines.map(l => ({ acc: l[0], d: Math.round(l[1] * 100) / 100, c: Math.round(l[2] * 100) / 100, cc: l[0].startsWith("6") ? Math.floor(r() * D.costCenters.length) : null }));
        // Rounding cents: the last credit line absorbs the difference so the entry balances exactly
        const dif = Math.round((lines.reduce((a, l) => a + l.d, 0) - lines.reduce((a, l) => a + l.c, 0)) * 100) / 100;
        lines[lines.length - 1].c = Math.round((lines[lines.length - 1].c + dif) * 100) / 100;
        if (no === 1023 || no === 1061) lines[lines.length - 1].c = Math.round(lines[lines.length - 1].c * .985 * 100) / 100;
        const synEn = { s_sales: "Sales of the day", s_cost: "Cost of sales of the day", s_purch: "Purchases of the day", s_ret: "Returns of the day", s_bank: "Supplier payment", s_payroll: "Payroll 1st half of November", s_manual: "Month adjustment" }[s];
        const synEs = { s_sales: "Ventas del día", s_cost: "Costo de ventas del día", s_purch: "Compras del día", s_ret: "Devoluciones del día", s_bank: "Pago a proveedor", s_payroll: "Planilla 1ra quincena de noviembre", s_manual: "Ajuste del mes" }[s];
        book.push({ no: "2-" + (no++), date, src: s, branch, syn: { en: synEn + " · " + branch, es: synEs + " · " + branch }, lines, by: s === "s_manual" ? users[si % 3] : "system", created: new Date(date.getTime() + 86400000 * (s === "s_manual" ? 0 : 1)), voided: r() < .03, seed: no * 13 });
      });
    }
    book.sort((a, b) => b.date - a.date || (a.no < b.no ? 1 : -1));

    // ---------- Filters ----------
    document.getElementById("fFrom").value = "2026-11-01"; document.getElementById("fTo").value = "2026-11-16";
    function fillType() { const v = $("#fType").val(); $("#fType").empty().append(new Option(t("all"), "")); SRC.forEach(s => $("#fType").append(new Option(t(s), s))); $("#fType").val(v || "").select2({ width: "100%", minimumResultsForSearch: Infinity }); }
    fillType();
    const sum = (ls, k) => ls.reduce((a, l) => a + l[k], 0);
    const bal = e => Math.abs(sum(e.lines, "d") - sum(e.lines, "c")) < .005;
    const chipBal = ok => ok ? '<span class="chip chip-pos">' + mi("check_circle") + t("balanced") + "</span>" : '<span class="chip chip-neg">' + mi("error") + t("unbalanced") + " " + M(Math.abs(0)) + "</span>";
    const chipBalE = e => bal(e) ? '<span class="chip chip-pos">' + mi("check_circle") + t("balanced") + "</span>" : '<span class="chip chip-neg">' + mi("error") + t("unbalanced") + " · " + M(sum(e.lines, "d") - sum(e.lines, "c")) + "</span>";
    let open = new Set();

    function filtered() {
      const f = document.getElementById("fFrom").value, to = document.getElementById("fTo").value, ty = $("#fType").val(), q = document.getElementById("fNo").value.trim().toLowerCase(), un = document.getElementById("fUnbal").checked;
      return book.filter(e => UI.fmtDate(e.date) >= f && UI.fmtDate(e.date) <= to && (!ty || e.src === ty) && (!q || e.no.toLowerCase().includes(q)) && (!un || !bal(e)));
    }
    function render() {
      const rows = filtered();
      document.querySelector("#tBook thead").innerHTML = '<tr><th style="width:30px"></th><th>' + t("colNo") + "</th><th>" + t("colDate") + "</th><th>" + t("colType") + "</th><th>" + t("synopsis") + "</th><th>" + t("colBranch") + '</th><th class="r">' + t("debit") + '</th><th class="r">' + t("credit") + "</th><th>" + t("colBal") + "</th><th>" + t("colBy") + "</th><th>" + t("colCreated") + "</th><th>" + t("colStatus") + "</th><th>" + t("actions") + "</th></tr>";
      document.querySelector("#tBook tbody").innerHTML = rows.map(e => {
        const o = open.has(e.no);
        return "<tr><td><button type=\"button\" class=\"exp-btn\" data-exp=\"" + e.no + '" aria-expanded="' + o + '" aria-label="' + t("expand") + '">' + mi(o ? "expand_more" : "chevron_right") + "</button></td><td>" + e.no + "</td><td>" + UI.fmtDay(e.date) + "</td><td>" + t(e.src) + "</td><td>" + UI.L(e.syn) + "</td><td>" + e.branch +
          '</td><td class="r">' + M(sum(e.lines, "d")) + '</td><td class="r">' + M(sum(e.lines, "c")) + "</td><td>" + chipBalE(e) + "</td><td>" + e.by + "</td><td>" + UI.fmtDay(e.created) + "</td><td>" +
          (e.voided ? '<span class="chip chip-warn">' + mi("block") + t("voided") + "</span>" : '<span class="chip chip-info">' + mi("task_alt") + t("active") + "</span>") +
          '</td><td><div class="acts"><button type="button" class="btn btn-sm" data-doc="' + e.no + '" title="' + t("sourceDoc") + '">' + mi("description") + '</button><button type="button" class="btn btn-sm" data-edit="' + e.no + '" title="' + t("edit") + '"' + (e.voided ? " disabled" : "") + ">" + mi("edit") + "</button></div></td></tr>" +
          (o ? '<tr class="lines-row"><td colspan="13"><table><thead><tr><th>' + t("account") + "</th><th>" + t("accountName") + "</th><th>" + t("costCenter") + '</th><th style="text-align:right">' + t("debit") + '</th><th style="text-align:right">' + t("credit") + "</th></tr></thead><tbody>" +
            e.lines.map(l => "<tr><td>" + l.acc + "</td><td>" + nm(l.acc) + "</td><td>" + (l.cc != null ? UI.L(D.costCenters[l.cc]) : "—") + '</td><td class="r num">' + (l.d ? M(l.d) : "") + '</td><td class="r num">' + (l.c ? M(l.c) : "") + "</td></tr>").join("") + "</tbody></table></td></tr>" : "");
      }).join("");
      const td = rows.reduce((a, e) => a + sum(e.lines, "d"), 0), tc = rows.reduce((a, e) => a + sum(e.lines, "c"), 0);
      document.querySelector("#tBook tfoot").innerHTML = '<tr><td colspan="6">' + t("total") + " · " + rows.length + '</td><td class="r">' + M(td) + '</td><td class="r">' + M(tc) + '</td><td colspan="5"></td></tr>';
      const un = rows.filter(e => !bal(e)).length, vo = rows.filter(e => e.voided).length;
      document.getElementById("kpis").innerHTML =
        '<div class="mc-kpi"><div class="k-label">' + t("kEntries") + '</div><div class="k-value">' + UI.fmtInt(rows.length) + "</div></div>" +
        '<div class="mc-kpi"><div class="k-label">' + t("kDebit") + '</div><div class="k-value num">' + M(td) + "</div></div>" +
        '<div class="mc-kpi"><div class="k-label">' + t("kCredit") + '</div><div class="k-value num">' + M(tc) + "</div></div>" +
        '<div class="mc-kpi is-accent" style="--k-color:' + (un ? "var(--mc-bad)" : "var(--mc-good)") + '"><div class="k-label">' + t("kUnbal") + '</div><div class="k-value ' + (un ? "neg" : "pos") + '">' + un + "</div></div>" +
        '<div class="mc-kpi"><div class="k-label">' + t("kVoid") + '</div><div class="k-value">' + vo + "</div></div>";
    }
    document.getElementById("filters").addEventListener("submit", e => { e.preventDefault(); render(); });
    document.getElementById("fUnbal").addEventListener("change", render);

    // ---------- Source document ----------
    let docNo = null;
    function field(l, v) { return '<div class="mc-field"><label>' + l + '</label><div class="static" style="color:var(--mc-text)">' + v + "</div></div>"; }
    function renderDoc() {
      const e = book.find(x => x.no === docNo); if (!e) return;
      const rr = UI.rng(e.seed);
      document.getElementById("docTitleTxt").textContent = t("docOf", { n: e.no });
      document.getElementById("docChip").innerHTML = '<span class="chip chip-violet">' + mi("category") + t(e.src) + "</span>";
      let h = "";
      const items = n => { const out = []; for (let i = 0; i < n; i++) { const p = D.products[Math.floor(rr() * D.products.length)]; out.push({ p: p[0], q: Math.ceil(UI.between(rr, 2, 40)), pr: UI.between(rr, 1.2, 18) }); } return out; };
      if (e.src === "s_sales" || e.src === "s_ret" || e.src === "s_purch" || e.src === "s_cost") {
        const its = items(6), sub = its.reduce((a, x) => a + x.q * x.pr, 0);
        const head = e.src === "s_purch" ? t("purchaseNo") : e.src === "s_ret" ? t("returnNo") : t("invoiceNo");
        const who = e.src === "s_purch" ? field(t("supplier"), UI.pick(rr, D.suppliers)) : field(t("customer"), UI.pick(rr, D.customers)) + field(t("seller"), UI.pick(rr, D.sellers));
        h = '<div class="doc-grid">' + field(head, (e.src === "s_purch" ? "FC-" : e.src === "s_ret" ? "NC-" : "FA-") + (40000 + Math.floor(rr() * 9000))) + field(t("date"), UI.fmtDay(e.date)) + field(t("branch"), e.branch) + who + (e.src === "s_sales" ? field(t("payType"), UI.L(UI.pick(rr, D.payment))) : "") + "</div>" +
          '<div class="table-wrap"><table class="grid"><thead><tr><th>' + t("product") + '</th><th class="r">' + t("qty") + '</th><th class="r">' + (e.src === "s_cost" ? t("unitCost") : t("price")) + '</th><th class="r">' + t("total") + "</th></tr></thead><tbody>" +
          its.map(x => "<tr><td>" + x.p + '</td><td class="r">' + x.q + '</td><td class="r">' + M(x.pr) + '</td><td class="r">' + M(x.q * x.pr) + "</td></tr>").join("") +
          '</tbody><tfoot><tr><td colspan="3">' + t("subtotal") + '</td><td class="r">' + M(sub) + "</td></tr>" + (e.src === "s_cost" ? "" : '<tr><td colspan="3">' + t("tax") + '</td><td class="r">' + M(sub * .15) + '</td></tr><tr><td colspan="3">' + t("total") + '</td><td class="r">' + M(sub * 1.15) + "</td></tr>") + "</tfoot></table></div>";
      } else if (e.src === "s_bank") {
        h = '<div class="doc-grid">' + field(t("movNo"), "DB-" + (7000 + Math.floor(rr() * 900))) + field(t("date"), UI.fmtDay(e.date)) + field(t("bankAcc"), D.banks[0] + " ···4417") + field(t("method"), UI.lang === "es" ? "Transferencia" : "Transfer") +
          field(t("payee"), UI.pick(rr, D.suppliers)) + field(t("reference"), "TR-" + Math.floor(rr() * 1e6)) + field(t("amount"), M(sum(e.lines, "c"))) + "</div>";
      } else if (e.src === "s_payroll") {
        const g = e.lines[0].d, emp = e.lines[1].d, ded = e.lines[2].c - emp;
        h = '<div class="doc-grid">' + field(t("period"), UI.lang === "es" ? "01/11/2026 – 15/11/2026" : "11/01/2026 – 11/15/2026") + field(t("employees"), "120") + field(t("gross"), M(g)) + field(t("deductions"), M(ded)) + field(t("employer"), M(emp)) + field(t("net"), M(g - ded)) + "</div>";
      } else {
        h = '<p class="ig-nota">' + t("manualNote") + '</p><div class="doc-grid">' + field(t("createdBy"), e.by) + field(t("date"), UI.fmtDay(e.date)) + field(t("synopsis"), UI.L(e.syn)) + "</div>";
      }
      document.getElementById("docBody").innerHTML = h;
    }
    document.getElementById("btnCloseDoc").addEventListener("click", () => UI.closeModal("mDoc"));

    // ---------- Edit with approval code ----------
    let editNo = null, step = 1, code = "", timer = null, left = 0;
    function paintEdit() {
      document.getElementById("editTitleTxt").textContent = t("editEntry", { n: editNo });
      document.getElementById("editSteps").innerHTML = [1, 2, 3].map(s => '<span class="mc-step' + (s < step ? " done" : s === step ? " current" : "") + '"><i>' + (s < step ? "✓" : s) + "</i>" + t("st" + s) + "</span>").join("");
      document.getElementById("editChip").innerHTML = step === 3 ? '<span class="chip chip-pos">' + mi("lock_open") + t("tokOk") + "</span>" : step === 2 ? '<span class="chip chip-warn">' + mi("hourglass_top") + t("tokPending") + "</span>" : "";
      ["step1", "step2", "step3"].forEach((id, i) => document.getElementById(id).hidden = i + 1 !== step);
      const btn = document.getElementById("btnEditMain");
      btn.innerHTML = mi(step === 1 ? "send" : step === 2 ? "verified" : "save") + "<span>" + t(step === 1 ? "tokRequest" : step === 2 ? "tokValidate" : "saveSyn") + "</span>";
      document.getElementById("tokShown").textContent = code;
      paintTimer();
    }
    function paintTimer() {
      if (step !== 3) return;
      const mm = Math.floor(left / 60), ss = String(left % 60).padStart(2, "0");
      document.getElementById("tokTimer").innerHTML = mi(left > 0 ? "timer" : "timer_off") + " " + (left > 0 ? t("tokTimer", { t: mm + ":" + ss }) : t("tokExpired"));
      document.getElementById("btnEditMain").disabled = left <= 0;
    }
    function openEdit(n) {
      editNo = n; step = 1; code = ""; clearInterval(timer);
      ["tokReason", "tokCode"].forEach(id => document.getElementById(id).value = "");
      ["errReason", "errCode", "errSyn"].forEach(id => document.getElementById(id).textContent = "");
      document.getElementById("btnEditMain").disabled = false;
      paintEdit(); UI.openModal("mEdit");
    }
    document.getElementById("btnEditMain").addEventListener("click", () => {
      if (step === 1) {
        const v = document.getElementById("tokReason").value.trim();
        if (v.length < 10) { document.getElementById("errReason").textContent = t("eReason"); document.getElementById("tokReason").focus(); return; }
        document.getElementById("errReason").textContent = "";
        code = String(100000 + Math.floor(Math.random() * 900000)); step = 2; paintEdit(); document.getElementById("tokCode").focus();
      } else if (step === 2) {
        if (document.getElementById("tokCode").value.trim() !== code) { document.getElementById("errCode").textContent = t("eCode"); document.getElementById("tokCode").setAttribute("aria-invalid", "true"); return; }
        document.getElementById("tokCode").setAttribute("aria-invalid", "false");
        step = 3; left = 300; document.getElementById("newSyn").value = UI.L(book.find(x => x.no === editNo).syn); paintEdit();
        timer = setInterval(() => { left--; paintTimer(); if (left <= 0) clearInterval(timer); }, 1000);
        document.getElementById("newSyn").focus();
      } else {
        const v = document.getElementById("newSyn").value.trim();
        if (v.length < 10) { document.getElementById("errSyn").textContent = t("eSyn"); return; }
        const e = book.find(x => x.no === editNo); e.syn = { en: v, es: v };
        clearInterval(timer); UI.closeModal("mEdit"); render(); UI.toast(t("savedSyn", { n: editNo }));
      }
    });
    document.getElementById("btnCloseEdit").addEventListener("click", () => { clearInterval(timer); UI.closeModal("mEdit"); });

    document.getElementById("tBook").addEventListener("click", ev => {
      const x = ev.target.closest("[data-exp]"); if (x) { const n = x.dataset.exp; open.has(n) ? open.delete(n) : open.add(n); render(); const nb = document.querySelector('[data-exp="' + n + '"]'); if (nb) nb.focus(); return; }
      const d = ev.target.closest("[data-doc]"); if (d) { docNo = d.dataset.doc; renderDoc(); UI.openModal("mDoc"); return; }
      const ed = ev.target.closest("[data-edit]"); if (ed) openEdit(ed.dataset.edit);
    });
    function about() { document.getElementById("about").innerHTML = UI.aboutBox("aboutText"); }
    document.addEventListener("langchange", () => { fillType(); render(); if (docNo && document.getElementById("mDoc").classList.contains("open")) renderDoc(); if (document.getElementById("mEdit").classList.contains("open")) paintEdit(); about(); });
    render(); about();
  });
  </script>
</body>
</html>
