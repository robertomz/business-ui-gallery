<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Commissions · Business UI Gallery</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/select2/4.0.13/css/select2.min.css">
  <link rel="stylesheet" href="../assets/css/base.css">
  <style>
    table.grid thead tr.grp th { text-align: center; background: #115e59; border-left: 1px solid rgba(255,255,255,.12); }
    table.grid thead tr.sub th { top: 33px; font-size: 10.5px; }
    table.grid td.g, table.grid th.g { border-left: 1px solid var(--mc-line); }
    .tier-table td { padding: 4px 6px; }
    .tier-table input { width: 100%; min-height: 30px; padding: 4px 7px; border: 1px solid var(--mc-line); border-radius: 5px; background: var(--mc-panel-2); color: var(--mc-text); font-size: 12px; text-align: right; }
    .tier-table input[aria-invalid="true"] { border-color: var(--mc-bad); }
    .tier-err { font-size: 11px; color: var(--mc-bad); }
    .comp-tabs { margin-bottom: 10px; }
    .closed-banner { display: flex; gap: 8px; align-items: center; padding: 8px 12px; border-radius: 8px; border-left: 3px solid var(--mc-good); background: rgba(45,212,191,.08); font-size: 12px; }
    .next { color: var(--mc-muted); }
  </style>
</head>
<body data-page="commissions" data-root="../">
  <main id="content">
    <section class="mc-panel">
      <form class="mc-filters" id="filters">
        <div class="mc-field" style="max-width:160px"><label for="fMonth" data-i18n="fMonth"></label><select id="fMonth"></select></div>
        <div class="mc-field w-sm"><label for="fYear" data-i18n="fYear"></label><select id="fYear"><option>2026</option><option>2025</option></select></div>
        <div class="mc-field" style="max-width:240px"><label for="fSeller" data-i18n="seller"></label><select id="fSeller"></select></div>
        <button class="btn btn-teal" type="submit"><span class="material-icons" aria-hidden="true">search</span><span data-i18n="load"></span></button>
        <button class="btn" type="button" id="btnTiers"><span class="material-icons" aria-hidden="true">tune</span><span data-i18n="tiers"></span></button>
        <button class="btn btn-amber" type="button" id="btnClose"><span class="material-icons" aria-hidden="true">lock</span><span data-i18n="closeMonth"></span></button>
      </form>
    </section>
    <div id="closedBox"></div>

    <section class="mc-kpis" id="kpis" aria-label="Summary"></section>

    <section class="mc-panel">
      <div class="mc-panel-title"><h3><span class="material-icons" aria-hidden="true">percent</span><span data-i18n="calcTitle"></span></h3><span class="mc-hint" data-i18n="calcHint"></span></div>
      <div class="table-wrap"><table class="grid" id="tCalc"><thead></thead><tbody></tbody><tfoot></tfoot></table></div>
    </section>

    <section class="mc-panel">
      <div class="mc-panel-title"><h3><span class="material-icons" aria-hidden="true">history</span><span data-i18n="history"></span></h3></div>
      <div class="table-wrap"><table class="grid" id="tHist"><thead></thead><tbody></tbody></table></div>
    </section>
    <div id="about"></div>
  </main>

  <div class="modal-backdrop" id="mTiers">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="mTiersT">
      <div class="modal-head"><h3 id="mTiersT"><span class="material-icons" aria-hidden="true">tune</span><span data-i18n="tiersTitle"></span></h3></div>
      <div class="modal-body">
        <p class="mc-hint" style="margin-bottom:10px" data-i18n="tiersHint"></p>
        <div class="mc-tabs comp-tabs" role="tablist" id="compTabs"></div>
        <div class="table-wrap"><table class="grid tier-table" id="tTiers"><thead></thead><tbody></tbody></table></div>
        <div style="display:flex;gap:8px;margin-top:8px;flex-wrap:wrap"><button class="btn btn-sm" type="button" id="addTier"><span class="material-icons" aria-hidden="true">add</span><span data-i18n="addTier"></span></button></div>
        <div class="tier-err" id="tierErr" role="alert" style="margin-top:8px"></div>
      </div>
      <div class="modal-foot"><button class="btn btn-teal" type="button" id="saveTiers"><span class="material-icons" aria-hidden="true">save</span><span data-i18n="save"></span></button><button class="btn" type="button" id="cancelTiers" data-i18n="close"></button></div>
    </div>
  </div>

  <div class="modal-backdrop" id="mClose">
    <div class="modal modal-sm" role="dialog" aria-modal="true" aria-labelledby="mCloseT">
      <div class="modal-head"><h3 id="mCloseT"><span class="material-icons" aria-hidden="true">lock</span><span data-i18n="closeMonth"></span></h3></div>
      <div class="modal-body"><p id="closeText" style="font-size:13px;line-height:1.55"></p></div>
      <div class="modal-foot"><button class="btn btn-amber" type="button" id="doClose"><span class="material-icons" aria-hidden="true">lock</span><span data-i18n="confirmClose"></span></button><button class="btn" type="button" id="cancelClose" data-i18n="close"></button></div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/select2/4.0.13/js/select2.min.js"></script>
  <script src="../assets/js/common.js"></script>
  <script>
  UI.strings({
    en: {
      fMonth: "Month", fYear: "Year", tiers: "Commission tiers", closeMonth: "Close month", confirmClose: "Close the month",
      calcTitle: "Commission by seller", calcHint: "Achievement = achieved ÷ goal. Each component pays by the tier it reaches.",
      history: "Closed months", g_vol: "Volume (sales)", g_prof: "Profit", g_cov: "Coverage (customers)", g_col: "Collection", g_tot: "Total commission", g_cost: "Cost and margin",
      goal: "Goal", achieved: "Achieved", commission: "Commission", nextPct: "Next %", nextCom: "Next commission", minBuy: "Minimum purchase", customers: "Customers", comply: "Comply",
      collected: "Collected", ofMonth: "Of the month", next: "Next", costGoal: "Cost goal", cost: "Cost", marginGoal: "Margin goal %", margin: "Margin %",
      k_sellers: "Sellers", k_sales: "Sales of the month", k_ach: "Volume achievement", k_col: "Collected", k_com: "Commission of the month", k_next: "Next possible",
      tiersTitle: "Commission tiers", tiersHint: "Each tier pays a fixed amount per achievement point between its initial and final %. Tiers must start at 0%, follow each other with no gaps or overlaps.",
      c_vol: "Volume", c_prof: "Profit", c_cov: "Coverage", c_col: "Collection", tInitial: "Initial %", tFinal: "Final %", tPerPoint: "Commission per point", addTier: "Add tier", remove: "Remove",
      errStart: "The first tier must start at 0%.", errGap: "Tier {n}: it must start where tier {p} ends ({v}%).", errRange: "Tier {n}: the final % must be greater than the initial %.", errPoint: "Tier {n}: commission per point cannot be negative.",
      tiersSaved: "Tiers saved; commissions recalculated.", closeText: "Closing {m} recalculates every commission with the current tiers and freezes the result. After closing, tiers and goals of that month can no longer be edited.",
      closed: "{m} is closed: commissions are frozen.", closedOk: "{m} closed. Total commission {v}.", h_month: "Month", h_sellers: "Sellers", h_total: "Total commission", h_closedBy: "Closed by", h_on: "Closed on", stClosed: "Closed", stOpen: "Open",
      aboutText: "Each seller has four components: <b>volume</b> (sales against the goal), <b>profit</b>, <b>coverage</b> (customers that bought at least the minimum) and <b>collection</b> (collected against the goal). Every component pays by <b>tiers</b>: a fixed amount per achievement point between the tier's initial and final %. <b>Next %</b> and <b>next commission</b> show what the seller earns by reaching the next tier. <b>Closing the month</b> recalculates on the server side with the current tiers and freezes the result, so later edits do not change what was paid. All data is generated."
    },
    es: {
      fMonth: "Mes", fYear: "Año", tiers: "Rangos de comisión", closeMonth: "Cerrar mes", confirmClose: "Cerrar el mes",
      calcTitle: "Comisión por vendedor", calcHint: "Logro = lograda ÷ meta. Cada componente paga según el rango que alcanza.",
      history: "Meses cerrados", g_vol: "Volumen (venta)", g_prof: "Utilidad", g_cov: "Cobertura (clientes)", g_col: "Recaudación", g_tot: "Comisión total", g_cost: "Costo y margen",
      goal: "Meta", achieved: "Lograda", commission: "Comisión", nextPct: "Próx. %", nextCom: "Próx. comisión", minBuy: "Mínimo compra", customers: "Clientes", comply: "Cumplen",
      collected: "Recaudado", ofMonth: "Del mes", next: "Próxima", costGoal: "Meta costo", cost: "Costo", marginGoal: "Meta margen %", margin: "Margen %",
      k_sellers: "Vendedores", k_sales: "Venta del mes", k_ach: "Logro de volumen", k_col: "Recaudado", k_com: "Comisión del mes", k_next: "Próxima posible",
      tiersTitle: "Rangos de comisión", tiersHint: "Cada rango paga un monto fijo por punto de logro entre su % inicial y su % final. Los rangos deben empezar en 0% y seguirse sin huecos ni traslapes.",
      c_vol: "Volumen", c_prof: "Utilidad", c_cov: "Cobertura", c_col: "Recaudación", tInitial: "% inicial", tFinal: "% final", tPerPoint: "Comisión por punto", addTier: "Agregar rango", remove: "Quitar",
      errStart: "El primer rango debe empezar en 0%.", errGap: "Rango {n}: debe empezar donde termina el rango {p} ({v}%).", errRange: "Rango {n}: el % final debe ser mayor que el inicial.", errPoint: "Rango {n}: la comisión por punto no puede ser negativa.",
      tiersSaved: "Rangos guardados; comisiones recalculadas.", closeText: "Al cerrar {m} se recalculan todas las comisiones con los rangos actuales y el resultado queda congelado. Después del cierre ya no se pueden editar los rangos ni las metas de ese mes.",
      closed: "{m} está cerrado: las comisiones quedaron congeladas.", closedOk: "{m} cerrado. Comisión total {v}.", h_month: "Mes", h_sellers: "Vendedores", h_total: "Comisión total", h_closedBy: "Cerrado por", h_on: "Cerrado el", stClosed: "Cerrado", stOpen: "Abierto",
      aboutText: "Cada vendedor tiene cuatro componentes: <b>volumen</b> (venta contra la meta), <b>utilidad</b>, <b>cobertura</b> (clientes que compraron al menos el mínimo) y <b>recaudación</b> (recaudado contra la meta). Cada componente paga por <b>rangos</b>: un monto fijo por punto de logro entre el % inicial y el % final del rango. <b>Próx. %</b> y <b>próx. comisión</b> muestran lo que gana el vendedor si alcanza el siguiente rango. <b>Cerrar el mes</b> recalcula del lado del servidor con los rangos actuales y congela el resultado, así los cambios posteriores no alteran lo pagado. Todos los datos son generados."
    }
  });

  $(function () {
    const D = UI.DATA, t = UI.t, M = UI.fmtMoney;
    const COMPS = ["vol", "prof", "cov", "col"];
    let tiers = {
      vol: [{ a: 0, b: 80, p: 0 }, { a: 80, b: 100, p: 120 }, { a: 100, b: 130, p: 180 }],
      prof: [{ a: 0, b: 85, p: 0 }, { a: 85, b: 100, p: 90 }, { a: 100, b: 125, p: 140 }],
      cov: [{ a: 0, b: 70, p: 0 }, { a: 70, b: 90, p: 60 }, { a: 90, b: 110, p: 95 }],
      col: [{ a: 0, b: 85, p: 0 }, { a: 85, b: 100, p: 100 }, { a: 100, b: 120, p: 150 }]
    };
    const closedMonths = { "2026-8": { by: "A. Torres", on: "2026-09-02" }, "2026-9": { by: "A. Torres", on: "2026-10-02" } };
    let editTiers = null, compTab = "vol", state = null;

    // Selects
    function fillSelects() {
      const m = $("#fMonth").val() || "10", s = $("#fSeller").val() || "all";
      $("#fMonth").empty(); for (let i = 0; i < 12; i++) $("#fMonth").append(new Option(UI.monthName(i), String(i)));
      $("#fSeller").empty().append(new Option(t("all"), "all")); D.sellers.forEach(x => $("#fSeller").append(new Option(x, x)));
      $("#fMonth").val(m); $("#fSeller").val(s).select2({ width: "100%" });
    }
    fillSelects();

    // Commission for an achievement % using the tiers of a component
    function pay(comp, pct) {
      let total = 0;
      tiers[comp].forEach(tr => { if (pct > tr.a) total += (Math.min(pct, tr.b) - tr.a) * tr.p; });
      return total;
    }
    function nextOf(comp, pct) {
      const nx = tiers[comp].find(tr => tr.a > pct && tr.p > 0);
      return nx ? { pct: nx.a, com: pay(comp, nx.a) } : null;
    }

    function data(year, month) {
      const r = UI.rng(year * 100 + month * 7 + 11);
      return D.sellers.map((s, i) => {
        const goal = UI.between(r, 380000, 620000), sold = goal * UI.between(r, .7, 1.18);
        const pGoal = goal * .19, prof = pGoal * UI.between(r, .72, 1.15);
        const custs = Math.round(UI.between(r, 70, 120)), comply = Math.round(custs * UI.between(r, .55, .97));
        const cGoal = sold * .82, coll = cGoal * UI.between(r, .74, 1.12);
        const cost = sold * UI.between(r, .76, .84);
        return { s, goal, sold, pGoal, prof, minBuy: 2500, custs, comply, cGoal, coll, costGoal: goal * .8, cost, marginGoal: .2, margin: (sold - cost) / sold };
      });
    }

    function calc(rows) {
      return rows.map(x => {
        const ach = { vol: x.sold / x.goal * 100, prof: x.prof / x.pGoal * 100, cov: x.comply / x.custs * 100, col: x.coll / x.cGoal * 100 };
        const com = {}, nx = {};
        COMPS.forEach(c => { com[c] = pay(c, ach[c]); nx[c] = nextOf(c, ach[c]); });
        const total = COMPS.reduce((a, c) => a + com[c], 0);
        const nextTotal = COMPS.reduce((a, c) => a + (nx[c] ? nx[c].com : com[c]), 0);
        return Object.assign({}, x, { ach, com, nx, total, nextTotal });
      });
    }

    function key() { return state.y + "-" + state.m; }
    function monthLabel() { return UI.monthName(state.m) + " " + state.y; }

    function render() {
      if (!state) return;
      let rows = calc(data(state.y, state.m));
      if (state.seller !== "all") rows = rows.filter(x => x.s === state.seller);
      const closed = closedMonths[key()];
      document.getElementById("closedBox").innerHTML = closed ? '<div class="closed-banner"><span class="material-icons" aria-hidden="true">lock</span>' + t("closed", { m: monthLabel() }) + "</div>" : "";
      document.getElementById("btnClose").disabled = !!closed;
      document.getElementById("btnTiers").disabled = !!closed;

      const sum = k => rows.reduce((a, x) => a + (typeof k === "function" ? k(x) : x[k]), 0);
      const kpi = (l, v, sub, color) => '<div class="mc-kpi is-accent" style="--k-color:' + color + '"><div class="k-label">' + t(l) + '</div><div class="k-value num">' + v + "</div>" + (sub ? '<div class="k-sub">' + sub + "</div>" : "") + "</div>";
      document.getElementById("kpis").innerHTML =
        kpi("k_sellers", rows.length, "", "#38bdf8") + kpi("k_sales", M(sum("sold")), t("goal") + " " + M(sum("goal")), "#14b8a6") +
        kpi("k_ach", UI.fmtPct(sum("sold") / sum("goal")), "", "#14b8a6") + kpi("k_col", M(sum("coll")), UI.fmtPct(sum("coll") / sum("cGoal")), "#a78bfa") +
        kpi("k_com", M(sum("total")), "", "#f59e0b") + kpi("k_next", M(sum("nextTotal")), "", "#fb923c");

      const groups = [["g_vol", 5], ["g_prof", 5], ["g_cov", 6], ["g_col", 5], ["g_tot", 2], ["g_cost", 4]];
      const subs = ["goal", "achieved", "commission", "nextPct", "nextCom", "goal", "achieved", "commission", "nextPct", "nextCom",
        "minBuy", "customers", "comply", "commission", "nextPct", "nextCom", "goal", "collected", "commission", "nextPct", "nextCom", "ofMonth", "next", "costGoal", "cost", "marginGoal", "margin"];
      document.querySelector("#tCalc thead").innerHTML = '<tr class="grp"><th rowspan="2" style="vertical-align:bottom">' + t("seller") + "</th>" + groups.map(g => '<th colspan="' + g[1] + '">' + t(g[0]) + "</th>").join("") + "</tr>" +
        '<tr class="sub">' + subs.map((s, i) => '<th class="r' + ([0, 5, 10, 16, 21, 23].includes(i) ? " g" : "") + '">' + t(s) + "</th>").join("") + "</tr>";
      const nx = (x, c) => x.nx[c] ? '<td class="r next">' + x.nx[c].pct + '%</td><td class="r next">' + M(x.nx[c].com) + "</td>" : '<td class="r next">—</td><td class="r next">—</td>';
      const achCell = (v, a) => '<td class="r"><span class="' + (a >= 100 ? "pos" : a < 80 ? "neg" : "") + '">' + v + "</span><br><small class=\"muted\">" + a.toFixed(1) + "%</small></td>";
      document.querySelector("#tCalc tbody").innerHTML = rows.map(x =>
        "<tr><td>" + x.s + "</td>" +
        '<td class="r g">' + M(x.goal) + "</td>" + achCell(M(x.sold), x.ach.vol) + '<td class="r">' + M(x.com.vol) + "</td>" + nx(x, "vol") +
        '<td class="r g">' + M(x.pGoal) + "</td>" + achCell(M(x.prof), x.ach.prof) + '<td class="r">' + M(x.com.prof) + "</td>" + nx(x, "prof") +
        '<td class="r g">' + M(x.minBuy) + '</td><td class="r">' + x.custs + "</td>" + achCell(String(x.comply), x.ach.cov) + '<td class="r">' + M(x.com.cov) + "</td>" + nx(x, "cov") +
        '<td class="r g">' + M(x.cGoal) + "</td>" + achCell(M(x.coll), x.ach.col) + '<td class="r">' + M(x.com.col) + "</td>" + nx(x, "col") +
        '<td class="r g"><b>' + M(x.total) + '</b></td><td class="r next">' + M(x.nextTotal) + "</td>" +
        '<td class="r g">' + M(x.costGoal) + '</td><td class="r">' + M(x.cost) + '</td><td class="r">' + UI.fmtPct(x.marginGoal) + '</td><td class="r ' + (x.margin < x.marginGoal ? "neg" : "pos") + '">' + UI.fmtPct(x.margin) + "</td></tr>").join("");
      document.querySelector("#tCalc tfoot").innerHTML = "<tr><td>" + t("total") + '</td><td class="r g">' + M(sum("goal")) + '</td><td class="r">' + M(sum("sold")) + '</td><td class="r">' + M(sum(x => x.com.vol)) + "</td><td></td><td></td>" +
        '<td class="r g">' + M(sum("pGoal")) + '</td><td class="r">' + M(sum("prof")) + '</td><td class="r">' + M(sum(x => x.com.prof)) + "</td><td></td><td></td>" +
        '<td class="r g"></td><td class="r">' + sum("custs") + '</td><td class="r">' + sum("comply") + '</td><td class="r">' + M(sum(x => x.com.cov)) + "</td><td></td><td></td>" +
        '<td class="r g">' + M(sum("cGoal")) + '</td><td class="r">' + M(sum("coll")) + '</td><td class="r">' + M(sum(x => x.com.col)) + "</td><td></td><td></td>" +
        '<td class="r g">' + M(sum("total")) + '</td><td class="r">' + M(sum("nextTotal")) + '</td><td class="r g">' + M(sum("costGoal")) + '</td><td class="r">' + M(sum("cost")) + "</td><td></td><td></td></tr>";
      renderHistory();
    }

    function renderHistory() {
      document.querySelector("#tHist thead").innerHTML = "<tr><th>" + t("h_month") + '</th><th class="r">' + t("h_sellers") + '</th><th class="r">' + t("h_total") + "</th><th>" + t("h_closedBy") + "</th><th>" + t("h_on") + "</th><th>" + t("status") + "</th></tr>";
      document.querySelector("#tHist tbody").innerHTML = Object.keys(closedMonths).sort().reverse().map(k => {
        const [y, m] = k.split("-").map(Number);
        const tot = calc(data(y, m)).reduce((a, x) => a + x.total, 0);
        const c = closedMonths[k];
        return "<tr><td>" + UI.monthName(m) + " " + y + '</td><td class="r">' + D.sellers.length + '</td><td class="r">' + M(c.total != null ? c.total : tot) + "</td><td>" + c.by + "</td><td>" + UI.fmtDay(new Date(c.on + "T00:00:00Z")) + '</td><td><span class="chip chip-pos">' + UI.mi("lock") + t("stClosed") + "</span></td></tr>";
      }).join("");
    }

    // ----- Tiers editor -----
    function renderTiers() {
      document.getElementById("compTabs").innerHTML = COMPS.map(c => '<button type="button" class="mc-tab" role="tab" aria-selected="' + (compTab === c) + '" data-c="' + c + '">' + t("c_" + c) + "</button>").join("");
      document.querySelector("#tTiers thead").innerHTML = '<tr><th style="width:40px">#</th><th class="r">' + t("tInitial") + '</th><th class="r">' + t("tFinal") + '</th><th class="r">' + t("tPerPoint") + '</th><th style="width:60px"></th></tr>';
      document.querySelector("#tTiers tbody").innerHTML = editTiers[compTab].map((tr, i) =>
        "<tr><td>" + (i + 1) + '</td><td><input data-i="' + i + '" data-k="a" inputmode="decimal" value="' + tr.a + '" aria-label="' + t("tInitial") + " " + (i + 1) + '"></td><td><input data-i="' + i + '" data-k="b" inputmode="decimal" value="' + tr.b + '" aria-label="' + t("tFinal") + " " + (i + 1) + '"></td>' +
        '<td><input data-i="' + i + '" data-k="p" inputmode="decimal" value="' + UI.fmtMoney(tr.p) + '" aria-label="' + t("tPerPoint") + " " + (i + 1) + '"></td><td><button type="button" class="btn btn-sm icon-btn" data-rm="' + i + '" aria-label="' + t("remove") + '">' + UI.mi("delete") + "</button></td></tr>").join("");
      validate();
    }
    function validate() {
      const errs = [];
      document.querySelectorAll("#tTiers input").forEach(i => i.removeAttribute("aria-invalid"));
      COMPS.forEach(c => {
        const list = editTiers[c];
        list.forEach((tr, i) => {
          const mark = k => { if (c === compTab) { const el = document.querySelector('#tTiers input[data-i="' + i + '"][data-k="' + k + '"]'); if (el) el.setAttribute("aria-invalid", "true"); } };
          if (i === 0 && tr.a !== 0) { errs.push(t("c_" + c) + " — " + t("errStart")); mark("a"); }
          if (i > 0 && tr.a !== list[i - 1].b) { errs.push(t("c_" + c) + " — " + t("errGap", { n: i + 1, p: i, v: list[i - 1].b })); mark("a"); }
          if (!(tr.b > tr.a)) { errs.push(t("c_" + c) + " — " + t("errRange", { n: i + 1 })); mark("b"); }
          if (tr.p < 0) { errs.push(t("c_" + c) + " — " + t("errPoint", { n: i + 1 })); mark("p"); }
        });
      });
      document.getElementById("tierErr").innerHTML = errs.join("<br>");
      document.getElementById("saveTiers").disabled = errs.length > 0;
    }
    document.getElementById("tTiers").addEventListener("input", e => {
      const i = e.target.dataset.i; if (i == null) return;
      editTiers[compTab][i][e.target.dataset.k] = UI.parseMoney(e.target.value);
      validate();
    });
    document.getElementById("tTiers").addEventListener("click", e => {
      const b = e.target.closest("[data-rm]"); if (!b) return;
      editTiers[compTab].splice(Number(b.dataset.rm), 1); renderTiers();
    });
    document.getElementById("compTabs").addEventListener("click", e => { const b = e.target.closest("[data-c]"); if (b) { compTab = b.dataset.c; renderTiers(); } });
    document.getElementById("addTier").addEventListener("click", () => { const l = editTiers[compTab]; const last = l[l.length - 1]; l.push({ a: last ? last.b : 0, b: (last ? last.b : 0) + 20, p: last ? last.p : 0 }); renderTiers(); });
    document.getElementById("btnTiers").addEventListener("click", () => { editTiers = JSON.parse(JSON.stringify(tiers)); compTab = "vol"; renderTiers(); UI.openModal("mTiers"); });
    document.getElementById("saveTiers").addEventListener("click", () => { tiers = editTiers; UI.closeModal("mTiers"); render(); UI.toast(t("tiersSaved")); });
    document.getElementById("cancelTiers").addEventListener("click", () => UI.closeModal("mTiers"));

    // ----- Month close -----
    document.getElementById("btnClose").addEventListener("click", () => { document.getElementById("closeText").textContent = t("closeText", { m: monthLabel() }); UI.openModal("mClose"); });
    document.getElementById("cancelClose").addEventListener("click", () => UI.closeModal("mClose"));
    document.getElementById("doClose").addEventListener("click", () => {
      const tot = calc(data(state.y, state.m)).reduce((a, x) => a + x.total, 0);
      closedMonths[key()] = { by: "Demo user", on: "2026-11-17", total: tot };
      UI.closeModal("mClose"); render(); UI.toast(t("closedOk", { m: monthLabel(), v: M(tot) }));
    });

    document.getElementById("filters").addEventListener("submit", e => { e.preventDefault(); state = { y: Number($("#fYear").val()), m: Number($("#fMonth").val()), seller: $("#fSeller").val() }; render(); });
    document.addEventListener("langchange", () => { fillSelects(); render(); if (document.getElementById("mTiers").classList.contains("open")) renderTiers(); document.getElementById("about").innerHTML = UI.aboutBox("aboutText"); });
    document.getElementById("about").innerHTML = UI.aboutBox("aboutText");
    state = { y: 2026, m: 10, seller: "all" };
    render();
  });
  </script>
</body>
</html>
