  <link rel="preconnect" href="https://fonts.googleapis.com">

  <style>
    .ig-card[data-area="caja"] { --ig-color: #38bdf8; }
    .ig-card[data-area="ventas"] { --ig-color: #14b8a6; }
    .ig-card[data-area="cxc"] { --ig-color: #f59e0b; }
    .ig-card[data-area="especial"] { --ig-color: #fb923c; }
    .ig-card[data-area="cxp"] { --ig-color: #a78bfa; }
    .ig-card[data-area="tarjetas"] { --ig-color: #38bdf8; }
    .ig-card[data-area="cxp_tipos"] { --ig-color: #a78bfa; }
    .ig-card[data-area="inventario"] { --ig-color: #f87171; }
    .ig-card[data-area="resultado"] { --ig-color: #34d399; }
    .tipo-bar header { display: flex; justify-content: space-between; gap: 8px; font-size: 12px; margin: 10px 0 5px; }
    .tipo-bar header span { font-weight: 750; }
    .tipo-bar .ig-barra { height: 10px; }
    .tipo-bar .ig-barra span { background: #a78bfa; }
    .tipo-bar.is-sin .ig-barra span { background: repeating-linear-gradient(45deg, #94a3b8 0 6px, #64748b 6px 12px); }
    .tipo-bar p { font-size: 10px; color: var(--mc-muted); margin-top: 4px; }
    .card-list li b small { text-align: right; }
    tr.drill { cursor: pointer; }
    tr.drill:focus-visible { outline: 2px solid var(--mc-cyan); outline-offset: -2px; }
    tr.detail td { background: var(--mc-panel-2); }
    .pct-bad { color: var(--mc-bad); font-weight: 800; }
  </style>
</head>
<body data-page="operations-dashboard" data-root="../">
  <main id="content">
    <section class="mc-panel no-print">
      <form class="mc-filters" id="filters">
        <div class="mc-field w-sm"><label data-i18n="fCompany"></label><div class="static">DEMO</div></div>
        <div class="mc-field" style="max-width:170px"><label for="fDate" data-i18n="fDate"></label><input type="date" id="fDate"></div>
        <div class="mc-field" style="max-width:240px"><label for="fBranch" data-i18n="branch"></label><select id="fBranch"></select></div>
        <button class="btn btn-teal" type="submit"><span class="material-icons" aria-hidden="true">search</span><span data-i18n="load"></span></button>
      </form>
    </section>
    <p class="mc-hint" id="hint" role="status"></p>

    <div id="dash" hidden>
      <div class="mc-head">
        <div><h2 id="dTitle"></h2><p id="dSub"></p></div>
        <span class="mc-chip-time" id="dTime"></span>
      </div>
      <div class="ig-areas" id="areas" style="margin-top:12px"></div>

      <section class="mc-panel" style="margin-top:12px">
        <div class="mc-panel-title"><h3><span class="material-icons" aria-hidden="true">store</span><span data-i18n="byBranch"></span></h3><span class="mc-hint" data-i18n="byBranchHint"></span></div>
        <div class="table-wrap"><table class="grid" id="tBranches"><thead></thead><tbody></tbody><tfoot></tfoot></table></div>
      </section>

      <section class="mc-panel" style="margin-top:12px">
        <div class="mc-panel-title">
          <h3><span class="material-icons" aria-hidden="true">groups</span><span data-i18n="customers"></span></h3>
          <div class="mc-tabs" role="tablist" id="custTabs"></div>
        </div>
        <div class="table-wrap"><table class="grid" id="tCust"><thead></thead><tbody></tbody></table></div>
      </section>
    </div>
    <div id="about"></div>
  </main>

    },

      h_res: "Capital de trabajo = activo circulante − pasivo circulante. Razón corriente = activo circulante ÷ pasivo circulante.",
      aboutText: "La versión real guarda un <b>cierre diario</b> cada noche a las 11:50 p. m., así los días pasados abren al instante y solo el día de hoy se calcula en vivo. Cada indicador se compara con el <b>día hábil anterior</b> (se saltan los días no hábiles) y con el <b>mismo día del mes anterior</b>. La flecha indica hacia dónde va el cambio y el color si es bueno o malo: si las cuentas por pagar suben sale en rojo aunque la flecha apunte arriba. Cada <b>?</b> explica cómo se calcula la cifra, y cada tarjeta termina con su tendencia <b>por día</b>. El comparativo se puede ordenar y cada sucursal abre su detalle. Todos los datos de esta página son generados."
    }
  });

  $(function () {
    const D = UI.DATA, t = UI.t, mi = UI.mi, M = UI.fmtMoney;
    const TODAY = new Date(Date.UTC(2026, 10, 16));
    const day = ms => new Date(ms);
    const isWorking = d => d.getUTCDay() !== 0;   // Sundays have no close in the sample
    function prevWorking(d) { let x = new Date(d.getTime() - 86400000); while (!isWorking(x)) x = new Date(x.getTime() - 86400000); return x; }
    function sameDayLastMonth(d) { const x = new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth() - 1, d.getUTCDate())); return isWorking(x) ? x : prevWorking(x); }

    // One deterministic close per day and branch.
    function close(d, branchIdx) {
      const seed = Math.floor(d.getTime() / 86400000);
      const idxs = branchIdx == null ? D.branches.map((_, i) => i) : [branchIdx];
      const z = {};
      const add = (k, v) => { z[k] = (z[k] || 0) + v; };
      idxs.forEach(i => {
        const r = UI.rng(seed * 131 + i * 7 + 3);
        const scale = [1.35, 0.95, 1.6, 0.75, 0.85, 0.6][i];
        const wd = [0.7, 1, 1, 1.05, 1.1, 1.3, 1.2][d.getUTCDay()];
        const goalDay = 82000 * scale * wd;
        const billed = goalDay * UI.between(r, 0.82, 1.08);
        const cash = billed * UI.between(r, .1, .14), credit = billed * UI.between(r, .42, .5), cod = billed - cash - credit;
        add("goalDay", goalDay); add("billed", billed); add("cash", cash); add("credit", credit); add("cod", cod);
        add("monthSold", billed * (d.getUTCDate() - 1) * UI.between(r, .9, 1.02) + billed); add("monthGoal", goalDay * 26);
        const creditPay = billed * UI.between(r, .55, .7), codPay = cod * UI.between(r, .85, 1), topups = UI.between(r, 0, 900), cashRet = UI.between(r, 0, 1500);
        const cashRecv = cash + creditPay + codPay + topups - cashRet;
        add("cashSales", cash); add("creditPay", creditPay); add("codPay", codPay); add("topups", topups); add("cashRet", cashRet); add("cashRecv", cashRecv);
        const pos = billed * UI.between(r, .14, .22), refund = pos * .15 / 1.15 * .08;
        add("pos", pos); add("posRefund", refund);
        add("entered", cashRecv + pos - refund);
        add("settled", (cashRecv + pos - refund) * UI.between(r, .74, .95));
        add("bankCredits", UI.between(r, 0, 1200));
        const portfolio = 2600000 * scale * UI.between(r, .97, 1.03);
        const d1 = portfolio * UI.between(r, .1, .14), d2 = portfolio * UI.between(r, .07, .1), e = portfolio * UI.between(r, .015, .03);
        add("portfolio", portfolio); add("d1_30", d1); add("d31_40", d2); add("current", portfolio - d1 - d2 - e); add("especial", e);
        add("e41_60", e * .55); add("e61_90", e * .3); add("e90", e * .15); add("eNew", e * UI.between(r, 0, .06));
        add("custOverdue", Math.round(UI.between(r, 25, 60) * scale)); add("invOverdue", Math.round(UI.between(r, 60, 140) * scale)); add("custTotal", Math.round(130 * scale));
        const pay = 3300000 * scale * UI.between(r, .97, 1.04), ov = pay * UI.between(r, .08, .13), wk = pay * UI.between(r, .12, .17);
        add("payable", pay); add("pOverdue", ov); add("pWeek", wk); add("pOnTime", pay - ov); add("p90", ov * .04);
        add("supOver", Math.round(UI.between(r, 4, 9))); add("supBal", Math.round(UI.between(r, 12, 18)));
        const inv = 2400000 * scale * UI.between(r, .98, 1.02), over = inv * UI.between(r, .17, .23);
        add("inv", inv); add("overstock", over); add("overItems", Math.round(UI.between(r, 90, 140))); add("shortItems", Math.round(UI.between(r, 10, 20)));
        add("suggested", UI.between(r, 90000, 160000) * scale); add("outStock", Math.round(UI.between(r, 8, 18))); add("noSale", UI.between(r, 20000, 40000) * scale);
      });
      const rc = UI.rng(seed * 17 + 99);
      z.cards = [["4417", D.banks[0], "VISA"], ["2111", D.banks[1], "MASTERCARD"], ["7036", D.banks[0], "MASTERCARD"], ["0172", D.banks[2], "VISA"], ["9253", D.banks[3], "VISA"], ["4048", D.banks[1], "VISA"]]
        .map((c, i) => ({ last4: c[0], bank: c[1], brand: c[2], bal: i < 4 ? UI.between(rc, 300000, 2400000) : 0, today: rc() > .45 }));
      z.cardsBal = z.cards.reduce((a, c) => a + c.bal, 0);
      z.cardsUsed = z.cards.filter(c => c.today).length / z.cards.length;
      z.types = [
        { en: "Transfer", es: "Transferencia", v: z.payable * .52, n: 11 }, { en: "Check", es: "Cheque", v: z.payable * .27, n: 6 },
        { en: "Credit card", es: "Tarjeta de crédito", v: z.payable * .13, n: 4 }, { en: "Undefined", es: "Sin definir", v: z.payable * .08, n: 3, sin: true }
      ];
      z.cashBank = z.entered * 1.6;
      z.assets = z.cashBank + z.portfolio + z.inv;
      z.liab = z.payable + z.cardsBal;
      return z;
    }

    // Filters
    const $branch = $("#fBranch");
    function fillBranches() {
      const v = $branch.val();
      $branch.empty().append(new Option(t("wholeCompany"), "all"));
      D.branches.forEach((b, i) => $branch.append(new Option(b, String(i))));
      $branch.val(v || "all").select2({ width: "100%", minimumResultsForSearch: 0 });
    }
    fillBranches();
    const dateIn = document.getElementById("fDate");
    dateIn.value = UI.fmtDate(TODAY); dateIn.max = UI.fmtDate(TODAY);

    let state = null, custTab = "balance", sort = { k: "sales", dir: -1 }, openBranch = null;

    function trend(d, b, f) {
      const vals = [], labels = [];
      let x = d;
      for (let i = 0; i < 12; i++) { vals.unshift(f(close(x, b))); labels.unshift(UI.fmtDayShort(x)); x = prevWorking(x); }
      return [vals, labels];
    }
    const row = (label, value, opt) => '<li class="' + ((opt && opt.cls) || "") + '"><span>' + label + (opt && opt.help ? UI.helpBtn(opt.help) : "") + (opt && opt.sub ? "<small>" + opt.sub + "</small>" : "") + "</span><b>" + value + (opt && opt.bsub ? "<small>" + opt.bsub + "</small>" : "") + "</b></li>";
    const sec = label => '<li class="ig-seccion">' + label + "</li>";

    function card(area, icon, dateTxt, main, pct, rows, spark, extra) {
      return '<article class="ig-card" data-area="' + area + '">' +
        '<div class="ig-card-head"><h3>' + mi(icon) + t(area) + '</h3><span class="ig-card-fecha">' + dateTxt + "</span></div>" + (extra || "") +
        '<div class="ig-principal-label">' + main.label + UI.helpBtn(main.help) + "</div>" +
        '<div class="ig-principal num' + (main.value < 0 ? " is-negativo" : "") + '">' + (main.fmt || M)(main.value) + "</div>" +
        '<div class="ig-deltas">' + main.deltas + "</div>" +
        (pct ? '<div class="ig-medidor"><div class="ig-medidor-texto"><span>' + pct.label + "</span><b>" + (pct.fmt || UI.fmtPct)(pct.value) + '</b></div><div class="ig-barra"><span style="width:' + Math.max(0, Math.min(100, pct.value * 100)) + '%"></span></div>' +
          '<div class="ig-deltas">' + pct.deltas + "</div></div>" : "") +
        '<ul class="ig-filas card-list">' + rows + "</ul>" + spark + "</article>";
    }

    function render() {
      if (!state) return;
      const { d, b } = state;
      const p = prevWorking(d), m = sameDayLastMonth(d);
      const z = close(d, b), zp = close(p, b), zm = close(m, b);
      const dt = UI.fmtDay(d), dp = UI.fmtDayShort(p), dm = UI.fmtDayShort(m);
      const vp = t("vsPrev") + " " + dp, vm = t("vsPrev") + " " + dm;
      const both = (k, opts) => UI.delta(z[k], zp[k], Object.assign({ label: vp }, opts)) + UI.delta(z[k], zm[k], Object.assign({ label: vm }, opts));
      const bothF = (f, opts) => UI.delta(f(z), f(zp), Object.assign({ label: vp }, opts)) + UI.delta(f(z), f(zm), Object.assign({ label: vm }, opts));
      const pctD = (f, goodUp) => UI.delta(f(z), f(zp), { label: vp, points: true, goodWhenUp: goodUp }) + UI.delta(f(z), f(zm), { label: vm, points: true, goodWhenUp: goodUp });
      const spark = (titleKey, f) => { const tr = trend(d, b, f); return UI.sparkline(tr[0], tr[1], t("perDayOf", { x: t(titleKey) })); };

      document.getElementById("dTitle").textContent = t("title", { d: dt });
      document.getElementById("dSub").textContent = t("sub", { p: UI.fmtDay(p), m: UI.fmtDay(m) });
      document.getElementById("dTime").textContent = t("consulted", { d: UI.fmtDay(TODAY) + " 16:34" });

      const settled = x => x.settled / x.entered, goalPct = x => x.billed / x.goalDay, cxcPct = x => (x.d1_30 + x.d31_40) / x.portfolio,
        espPct = x => x.especial / x.portfolio, cxpPct = x => x.pOverdue / x.payable, invPct = x => x.overstock / x.inv, ratio = x => x.assets / x.liab;

      const cards = [];
      cards.push(card("caja", "point_of_sale", UI.fmtDayShort(d),
        { label: t("cajaMain"), help: "h_caja", value: z.entered, deltas: both("entered") },
        { label: t("cajaPct"), value: settled(z), deltas: pctD(settled, true) },
        sec(t("sCash")) + row(t("cashReceived"), M(z.cashRecv), { cls: "is-total" }) + row(t("cashSales"), M(z.cashSales), { cls: "is-sub" }) + row(t("creditPayments"), M(z.creditPay), { cls: "is-sub" }) +
        row(t("codPayments"), M(z.codPay), { cls: "is-sub" }) + row(t("topups"), M(z.topups), { cls: "is-sub" }) + row("− " + t("cashReturns"), M(z.cashRet), { cls: "is-sub" }) +
        sec(t("sPos")) + row(t("posTotal"), M(z.pos)) + row("− " + t("posRefund"), M(z.posRefund), { cls: "is-sub" }) +
        sec(t("sBank")) + row(t("bankCredits"), M(z.bankCredits)) + row(t("bankSettled"), M(z.settled)),
        spark("cajaPct", settled)));
      cards.push(card("ventas", "trending_up", UI.fmtDayShort(d),
        { label: t("ventasMain"), help: "h_ventas", value: z.billed, deltas: both("billed") },
        { label: t("ventasPct"), value: goalPct(z), deltas: pctD(goalPct, true) },
        sec(t("sDay")) + row(t("goalDay"), M(z.goalDay)) + row(t("billedDay"), M(z.billed), { cls: "is-total" }) +
        row(t("diffGoal"), '<span class="' + (z.billed - z.goalDay < 0 ? "neg" : "pos") + '">' + M(z.billed - z.goalDay) + "</span>", { bsub: UI.fmtPct(goalPct(z)) }) +
        row(t("soldCash"), M(z.cash), { cls: "is-sub", bsub: UI.fmtPct(z.cash / z.billed) }) + row(t("soldCredit"), M(z.credit), { cls: "is-sub", bsub: UI.fmtPct(z.credit / z.billed) }) +
        row(t("soldCod"), M(z.cod), { cls: "is-sub", bsub: UI.fmtPct(z.cod / z.billed) }) +
        sec(t("sMonth")) + row(t("monthGoal"), M(z.monthGoal)) + row(t("monthSold"), M(z.monthSold)) + row(t("monthPct"), UI.fmtPct(z.monthSold / z.monthGoal)),
        spark("ventasPct", goalPct)));
      cards.push(card("cxc", "request_page", UI.fmtDayShort(d),
        { label: t("cxcMain"), help: "h_cxc", value: z.d1_30 + z.d31_40, deltas: bothF(x => x.d1_30 + x.d31_40, { goodWhenUp: false }) },
        { label: t("cxcPct"), value: cxcPct(z), deltas: pctD(cxcPct, false) },
        row(t("portfolio"), M(z.portfolio), { bsub: UI.fmtInt(z.custTotal) + " " + t("customer").toLowerCase() + "s" }) + row(t("current"), M(z.current)) +
        row(t("d1_30"), M(z.d1_30)) + row(t("d31_40"), M(z.d31_40)) + row(t("custOverdue"), UI.fmtInt(z.custOverdue)) + row(t("invOverdue"), UI.fmtInt(z.invOverdue)),
        spark("cxcPct", cxcPct)));
      cards.push(card("especial", "warning", UI.fmtDayShort(d),
        { label: t("espMain"), help: "h_esp", value: z.especial, deltas: both("especial", { goodWhenUp: false }) },
        { label: t("espPct"), value: espPct(z), deltas: pctD(espPct, false) },
        row(t("e41_60"), M(z.e41_60), { sub: t("eNew") + ": " + M(z.eNew) }) + row(t("e61_90"), M(z.e61_90)) + row(t("e90"), M(z.e90)),
        spark("espPct", espPct)));
      cards.push(card("cxp", "receipt_long", UI.fmtDayShort(d),
        { label: t("cxpMain"), help: "h_cxp", value: z.payable, deltas: both("payable", { goodWhenUp: false }) },
        { label: t("cxpPct"), value: cxpPct(z), deltas: pctD(cxpPct, false) },
        row(t("overdue"), M(z.pOverdue)) + row(t("suppliersOverdue"), UI.fmtInt(z.supOver)) + row(t("dueWeek"), M(z.pWeek)) + row(t("onTime"), M(z.pOnTime)) +
        row(t("over90"), M(z.p90)) + row(t("suppliersBalance"), UI.fmtInt(z.supBal)) + sec(t("payByCard")) + row(t("cardsDebt"), M(z.types[2].v)),
        spark("cxpPct", cxpPct)));
      const noToday = z.cards.filter(c => !c.today).length;
      cards.push(card("tarjetas", "credit_card", UI.fmtDayShort(d),
        { label: t("tarMain"), help: "h_tar", value: z.cardsBal, deltas: both("cardsBal", { goodWhenUp: false }) },
        { label: t("tarPct"), value: z.cardsUsed, deltas: pctD(x => x.cardsUsed, true) },
        row(t("activeCards"), z.cards.length) + z.cards.map(c => row("**** " + c.last4 + " · " + c.bank, c.bal ? M(c.bal) : "—", { sub: c.brand, bsub: c.today ? UI.fmtDayShort(d) : "—" })).join(""),
        spark("tarMain", x => x.cardsBal),
        noToday ? '<p class="ig-nota">' + t("noBalanceToday", { n: noToday, d: UI.fmtDayShort(d) }) + "</p>" : ""));
      cards.push('<article class="ig-card" data-area="cxp_tipos"><div class="ig-card-head"><h3>' + mi("payments") + t("cxp_tipos") + '</h3><span class="ig-card-fecha">' + UI.fmtDayShort(d) + "</span></div>" +
        '<div class="ig-principal-label">' + t("cxpMain") + '</div><div class="ig-principal num">' + M(z.payable) + "</div>" +
        z.types.map(ty => '<div class="tipo-bar' + (ty.sin ? " is-sin" : "") + '"><header><span>' + UI.L(ty) + "</span><b class=\"num\">" + M(ty.v) + " · " + UI.fmtPct(ty.v / z.payable) + '</b></header><div class="ig-barra"><span style="width:' + (ty.v / z.payable * 100) + '%"></span></div><p>' + t("suppliersN", { n: ty.n }) + "</p></div>").join("") +
        "</article>");
      cards.push(card("inventario", "inventory_2", UI.fmtDayShort(d),
        { label: t("invMain"), help: "h_inv", value: z.overstock, deltas: both("overstock", { goodWhenUp: false }) },
        { label: t("invPct"), value: invPct(z), deltas: pctD(invPct, false) },
        row(t("invValue"), M(z.inv)) + row(t("overstockItems"), UI.fmtInt(z.overItems), { sub: t("overstockSub") }) + row(t("shortItems"), UI.fmtInt(z.shortItems), { sub: t("shortSub") }) +
        row(t("suggested"), M(z.suggested)) + row(t("outOfStock"), UI.fmtInt(z.outStock)) + row(t("noSale30"), M(z.noSale)),
        spark("invPct", invPct)));
      cards.push(card("resultado", "functions", UI.fmtDayShort(d),
        { label: t("resMain"), help: "h_res", value: z.assets - z.liab, deltas: bothF(x => x.assets - x.liab) },
        { label: t("resPct"), value: ratio(z) / 2, fmt: () => ratio(z).toFixed(2), deltas: UI.delta(ratio(z), ratio(zp), { label: vp, points: true }) + UI.delta(ratio(z), ratio(zm), { label: vm, points: true }) },
        sec(t("assets")) + row(t("totAssets"), M(z.assets), { cls: "is-total" }) + row(t("cashBank"), M(z.cashBank), { cls: "is-sub" }) + row(t("receivable"), M(z.portfolio), { cls: "is-sub" }) + row(t("inventory"), M(z.inv), { cls: "is-sub" }) +
        sec(t("liabilities")) + row(t("totLiab"), M(z.liab), { cls: "is-total" }) + row(t("payable"), M(z.payable), { cls: "is-sub" }) + row(t("cardsDebt"), M(z.cardsBal), { cls: "is-sub" }),
        spark("resMain", x => x.assets - x.liab)));
      document.getElementById("areas").innerHTML = cards.join("");
      renderBranches();
      renderCustomers();
    }

    function renderBranches() {
      const { d } = state;
      const cols = [["branch", "colBranch", 0], ["sales", "colSales", 1], ["goal", "colGoal", 2], ["cash", "colCash", 1], ["settled", "colSettled", 2], ["cxc", "colCxc", 1], ["over", "colOver", 2], ["stock", "colStock", 1], ["overstock", "colOverstock", 2]];
      const rows = D.branches.map((name, i) => { const z = close(d, i), zp = close(prevWorking(d), i); return { i, name, z, zp, branch: name, sales: z.billed, goal: z.billed / z.goalDay, cash: z.entered, settled: z.settled / z.entered, cxc: z.portfolio, over: (z.d1_30 + z.d31_40) / z.portfolio, stock: z.inv, overstock: z.overstock / z.inv }; });
      rows.sort((a, b) => (a[sort.k] > b[sort.k] ? 1 : -1) * sort.dir);
      const th = document.querySelector("#tBranches thead");
      th.innerHTML = "<tr>" + cols.map(c => '<th class="sortable' + (c[2] ? " r" : "") + '" data-k="' + c[0] + '" tabindex="0" aria-sort="' + (sort.k === c[0] ? (sort.dir > 0 ? "ascending" : "descending") : "none") + '">' + t(c[1]) + "</th>").join("") + "</tr>";
      const fmt = (c, r) => c[2] === 1 ? M(r[c[0]]) : c[2] === 2 ? '<span class="' + ((c[0] === "goal" && r[c[0]] < .85) || (c[0] === "settled" && r[c[0]] < .8) || (c[0] === "over" && r[c[0]] > .22) || (c[0] === "overstock" && r[c[0]] > .22) ? "pct-bad" : "") + '">' + UI.fmtPct(r[c[0]]) + "</span>" : r[c[0]];
      document.querySelector("#tBranches tbody").innerHTML = rows.map(r =>
        '<tr class="drill" tabindex="0" data-i="' + r.i + '">' + cols.map(c => "<td" + (c[2] ? ' class="r"' : "") + ">" + (c[0] === "branch" ? mi(openBranch === r.i ? "expand_less" : "expand_more") + " " : "") + fmt(c, r) + "</td>").join("") + "</tr>" +
        (openBranch === r.i ? '<tr class="detail"><td colspan="' + cols.length + '"><div class="ig-deltas">' +
          UI.delta(r.z.billed, r.zp.billed, { label: t("colSales") + " " + t("vsPrev") + " " + UI.fmtDayShort(prevWorking(d)) }) +
          UI.delta(r.z.entered, r.zp.entered, { label: t("colCash") }) +
          UI.delta(r.z.d1_30 + r.z.d31_40, r.zp.d1_30 + r.zp.d31_40, { label: t("cxcMain"), goodWhenUp: false }) +
          UI.delta(r.z.overstock, r.zp.overstock, { label: t("invMain"), goodWhenUp: false }) + "</div></td></tr>" : "")).join("");
      const tot = k => rows.reduce((a, r) => a + r.z[k], 0);
      document.querySelector("#tBranches tfoot").innerHTML = "<tr><td>" + t("total") + '</td><td class="r">' + M(tot("billed")) + '</td><td class="r">' + UI.fmtPct(tot("billed") / tot("goalDay")) + '</td><td class="r">' + M(tot("entered")) +
        '</td><td class="r">' + UI.fmtPct(tot("settled") / tot("entered")) + '</td><td class="r">' + M(tot("portfolio")) + '</td><td class="r">' + UI.fmtPct((tot("d1_30") + tot("d31_40")) / tot("portfolio")) +
        '</td><td class="r">' + M(tot("inv")) + '</td><td class="r">' + UI.fmtPct(tot("overstock") / tot("inv")) + "</td></tr>";
    }

    function renderCustomers() {
      const tabs = [["balance", "tabBalance"], ["overdue", "tabOverdue"], ["special", "tabSpecial"]];
      document.getElementById("custTabs").innerHTML = tabs.map(x => '<button type="button" class="mc-tab" role="tab" aria-selected="' + (custTab === x[0]) + '" data-tab="' + x[0] + '">' + t(x[1]) + "</button>").join("");
      const r = UI.rng(Math.floor(state.d.getTime() / 86400000) + 5);
      const list = D.customers.map((c, i) => { const bal = UI.between(r, 40000, 420000); const ov = bal * UI.between(r, 0, .5); return { c, seller: D.sellers[i % D.sellers.length], bal, ov, sp: ov * UI.between(r, 0, .6), days: Math.round(UI.between(r, 3, 120)), lim: bal * UI.between(r, .9, 1.6) }; });
      const key = custTab === "balance" ? "bal" : custTab === "overdue" ? "ov" : "sp";
      const top = list.filter(x => x[key] > 0).sort((a, b) => b[key] - a[key]).slice(0, 15);
      document.querySelector("#tCust thead").innerHTML = '<tr><th style="width:36px">#</th><th>' + t("colCustomer") + "</th><th>" + t("colSeller") + '</th><th class="r">' + t("colBal") + '</th><th class="r">' + t("colOverdue") + '</th><th class="r">' + t("colDays") + '</th><th class="r">' + t("colLimit") + "</th></tr>";
      document.querySelector("#tCust tbody").innerHTML = top.map((x, i) => "<tr><td>" + (i + 1) + "</td><td>" + x.c + "</td><td>" + x.seller + '</td><td class="r">' + M(x.bal) + '</td><td class="r">' + M(custTab === "special" ? x.sp : x.ov) + '</td><td class="r' + (x.days > 40 ? " pct-bad" : "") + '">' + x.days + '</td><td class="r">' + M(x.lim) + "</td></tr>").join("");
    }

    function load() {
      const d = new Date(dateIn.value + "T00:00:00Z");
      const bv = $branch.val();
      state = { d: isWorking(d) ? d : prevWorking(d), b: bv === "all" ? null : Number(bv) };
      openBranch = null;
      document.getElementById("dash").hidden = false;
      document.getElementById("hint").textContent = t("loaded", { d: UI.fmtDay(state.d) });
      render();
    }

    document.getElementById("filters").addEventListener("submit", e => { e.preventDefault(); load(); });
    document.getElementById("tBranches").addEventListener("click", e => {
      const th = e.target.closest("th.sortable");
      if (th) { if (sort.k === th.dataset.k) sort.dir *= -1; else { sort.k = th.dataset.k; sort.dir = -1; } renderBranches(); return; }
      const tr = e.target.closest("tr.drill");
      if (tr) { const i = Number(tr.dataset.i); openBranch = openBranch === i ? null : i; renderBranches(); }
    });
    document.getElementById("tBranches").addEventListener("keydown", e => {
      if (e.key !== "Enter" && e.key !== " ") return;
      const el = e.target.closest("th.sortable, tr.drill");
      if (el) { e.preventDefault(); el.click(); }
    });
    document.getElementById("custTabs").addEventListener("click", e => { const b = e.target.closest("[data-tab]"); if (b) { custTab = b.dataset.tab; renderCustomers(); } });
    document.addEventListener("langchange", () => { fillBranches(); if (state) render(); else document.getElementById("hint").textContent = t("loadHint"); document.getElementById("about").innerHTML = UI.aboutBox("aboutText"); });
    document.getElementById("about").innerHTML = UI.aboutBox("aboutText");
    document.getElementById("hint").textContent = t("loadHint");
    load(); // the gallery opens with the latest close already loaded
  });
  </script>
</body>
</html>
